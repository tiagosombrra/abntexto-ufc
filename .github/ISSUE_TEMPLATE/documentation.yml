name: Documentation issue
description: Report unclear, inconsistent or incorrect current documentation.
title: "[Docs] "
labels:
  - documentation
body:
  - type: markdown
    attributes:
      value: |
        Active documentation describes the current supported project.
        Historical implementation phases are not treated as user guidance.
  - type: input
    id: location
    attributes:
      label: Document / section
      description: Identify the file and section that should be corrected.
      placeholder: "docs/USER-GUIDE.md — PDF/A e validação"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior or source that should be reflected
      description: When applicable, point to the current runtime/API/normative behavior.
    validations:
      required: false
  - type: textarea
    id: proposal
    attributes:
      label: Suggested correction
    validations:
      required: false
