name: Temporary R2-B2 migration

on:
  push:
    branches:
      - refactor/v3-r2-b2-frontmatter-api

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Execute bounded migration
        run: python3 tools/_tmp-r2-b2-migrate.py

      - name: Commit and validate final migration checkpoint
        run: |
          set -euo pipefail
          rm tools/_tmp-r2-b2-migrate.py .github/workflows/_tmp-r2-b2-migrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: own academic frontmatter API directly"
          make static-check
          git diff --check HEAD^ HEAD
          git push origin HEAD:${GITHUB_REF_NAME}
