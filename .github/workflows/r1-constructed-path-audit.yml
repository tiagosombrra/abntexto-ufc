name: R1 semantic active-tree audit

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-constructed-path-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Audit semantic identities and validation gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import ast
          import json
          import re
          import subprocess
          from pathlib import Path

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          exclusions = {
              'tests/checks/canonical_identity.py',
              'tests/checks/repository_contract.py',
              'tests/checks/release_package.py',
              'tests/checks/overleaf_bundle.py',
              'tests/checks/ctan_archive.py',
          }
          patterns = {
              'N-phase': re.compile(r'(?<![A-Za-z0-9])N(?:[0-9]{1,2})(?:-[A-Z0-9]+)*(?![A-Za-z0-9])'),
              'B2R': re.compile(r'(?<![A-Za-z0-9])B2R(?![A-Za-z0-9])', re.I),
              'v2-version': re.compile(r'(?<![A-Za-z0-9])v2(?:\.\d+(?:\.\d+)?)?(?![A-Za-z0-9])', re.I),
              'oracle': re.compile(r'oracle', re.I),
          }
          identity = []
          policy_contract = []

          for item in sorted(tracked):
              if item in exclusions:
                  continue
              if not item.startswith(('standards/', 'tests/checks/', 'tests/integration/', 'tools/', 'validator/')):
                  continue
              path = Path(item)
              if not path.is_file() or path.suffix not in {'.json', '.py', '.sh', '.tex', '.js', '.html', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for label, pattern in patterns.items():
                  values = sorted(set(match.group(0) for match in pattern.finditer(text)))
                  if values:
                      identity.append(f'{item}: {label}={values[:8]}')
              if 'validation-reference-policy.json' in text:
                  if 'get("phase")' in text or "get('phase')" in text:
                      policy_contract.append(f'{item}: validation policy still requires phase')
                  if re.search(r'(?:validation|policy)\.get\(["\x27]schema_version["\x27]\)\s*!=\s*1', text):
                      policy_contract.append(f'{item}: validation policy still requires schema 1')

          runner = Path('tests/run.py').read_text(encoding='utf-8')
          module = ast.parse(runner)
          runner_ids = set()
          for node in ast.walk(module):
              if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Name) or node.func.id != 'Check':
                  continue
              if node.args and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str):
                  runner_ids.add(node.args[0].value)

          declared = {}
          for item in sorted(tracked):
              if not item.startswith('standards/') or not item.endswith('.json'):
                  continue
              try:
                  data = json.loads(Path(item).read_text(encoding='utf-8'))
              except Exception:
                  continue
              def walk(value):
                  if isinstance(value, dict):
                      validation = value.get('validation')
                      if isinstance(validation, dict) and isinstance(validation.get('checks'), list):
                          for check in validation['checks']:
                              if isinstance(check, str):
                                  declared.setdefault(check, set()).add(item)
                      for child in value.values():
                          walk(child)
                  elif isinstance(value, list):
                      for child in value:
                          walk(child)
              walk(data)

          unknown = [
              f'{check}: {sorted(paths)}'
              for check, paths in sorted(declared.items())
              if check not in runner_ids
          ]

          print('IDENTITY FINDINGS')
          for value in identity:
              print('  ' + value)
          print('VALIDATION POLICY CONTRACT FINDINGS')
          for value in policy_contract:
              print('  ' + value)
          print('UNKNOWN VALIDATION IDS')
          for value in unknown:
              print('  ' + value)
          print(
              f'SUMMARY identity={len(identity)} '
              f'policy_contract={len(policy_contract)} unknown_validation_ids={len(unknown)}'
          )
          if identity or policy_contract or unknown:
              raise SystemExit('R1 semantic active-tree audit found residual debt.')
          PY
