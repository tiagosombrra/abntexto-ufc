name: Temporary R2/R3 closeout executor

on:
  push:
    branches:
      - docs/v3-r2-closeout-r3-entry

permissions:
  contents: write

concurrency:
  group: temporary-r2-r3-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reconcile R2 closure and R3 entry
        run: |
          git fetch origin main
          python3 .github/scripts/r2-r3-closeout.py
      - name: Validate reconciled control plane
        run: |
          set -euo pipefail
          make static-check
          git diff --check
      - name: Remove temporary executor and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/r2-r3-closeout.py
          rm -f .github/workflows/r2-r3-closeout.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close R2 and activate R3-A"
          git push origin "HEAD:${GITHUB_REF_NAME}"
