name: Normative source contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'normativa/**'
      - 'tools/normative_*.py'
      - 'tools/validate-ufc-pdf.py'
      - 'tests/checks/normative_*.py'
      - 'tests/checks/validator_source.py'
      - 'tests/run.py'
      - 'validator/**'
      - '.github/workflows/normative-source.yml'
  push:
    branches:
      - main
    paths:
      - 'normativa/**'
      - 'tools/normative_*.py'
      - 'tools/validate-ufc-pdf.py'
      - 'tests/checks/normative_*.py'
      - 'tests/checks/validator_source.py'
      - 'tests/run.py'
      - 'validator/**'
      - '.github/workflows/normative-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate normative sources and contracts
        run: python3 tests/checks/validator_source.py
      - name: Build normative proof-state snapshot
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts/normative-proof-state
          python3 tests/checks/normative_proof_state.py \
            --json artifacts/normative-proof-state/proof-state.json \
            --markdown artifacts/normative-proof-state/proof-state.md \
            --commit-sha "${SOURCE_COMMIT_SHA}"
      - name: Upload normative proof-state snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: normative-proof-state-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/normative-proof-state
          if-no-files-found: error
          retention-days: 30
