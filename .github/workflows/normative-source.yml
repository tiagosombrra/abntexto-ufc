name: Normative source contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'normativa/**'
      - 'tools/normative_*.py'
      - 'tools/validate-ufc-pdf.py'
      - 'tests/checks/normative_*.py'
      - 'tests/checks/validator_source.py'
      - 'tests/run.py'
      - 'validator/**'
      - '.github/workflows/normative-source.yml'
  push:
    branches:
      - main
    paths:
      - 'normativa/**'
      - 'tools/normative_*.py'
      - 'tools/validate-ufc-pdf.py'
      - 'tests/checks/normative_*.py'
      - 'tests/checks/validator_source.py'
      - 'tests/run.py'
      - 'validator/**'
      - '.github/workflows/normative-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate normative sources and contracts
        run: python3 tests/checks/validator_source.py
