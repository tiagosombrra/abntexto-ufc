name: Temporary A1 article normative contract

on:
  push:
    branches:
      - a1-scientific-article-normative-contract

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact A1 activation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "e40a56deeca8c22797398b0c95835964aefd2b15"
          test "$(git rev-parse origin/main)" = "e40a56deeca8c22797398b0c95835964aefd2b15"

      - name: Materialize historical discovery contract
        shell: bash
        run: |
          set -euo pipefail
          git show 14e55ef3d4700ea729173fe85c8e2a6f8ef71927:standards/coverage-rules-article.json > /tmp/coverage-rules-article-historical.json

      - name: Build current A1 contract
        run: python .github/scripts/a1-article-contract.py

      - name: Build A1 locator audit supplement
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          TODAY = "2026-09-04"
          GUIDE = "ufc-guia-artigos-2022"
          GUIDE_URL = "https://biblioteca.ufc.br/wp-content/uploads/2023/04/guia-de-normalizacao-de-artigo-corrigido-27.04.2023.pdf"
          GUIDE_LOCATORS = {
              "article.structure.required": "2.1, p. 7",
              "article.title.presentation": "2.2.1.1, p. 8",
              "article.authorship.presentation": "2.2.1.3, pp. 9-10",
              "article.abstract.presentation": "2.2.1.4, pp. 10-11",
              "article.abstract.length.recommended": "2.2.1.4, p. 10",
              "article.dates.required": "2.2.1.6, pp. 12-13",
              "article.textual.required-sections": "2.2.2-2.2.2.3, pp. 16-17",
              "article.textual.typography": "2.2.2, p. 16",
              "article.references.required-placement": "2.2.3.1, p. 17",
              "article.page.margins": "2.3.1-2.3.2, pp. 22-23",
              "article.font.family.recommended": "2.3.1(c), p. 22",
              "article.pagination": "2.3.4, p. 26",
              "article.sections.continuous": "2.3.5.1, pp. 26-28",
          }
          STANDARD_REASON = {
              "abnt-nbr-6022-2018": "The current edition is confirmed, but the exact licensed NBR 6022:2018 clause is not available in the public/repository evidence corpus; the current UFC guide provides the directly verified article locator.",
              "abnt-nbr-6028-2021": "The current edition is confirmed, but the exact licensed NBR 6028:2021 clause is not available in the public/repository evidence corpus; the current UFC guide provides the directly verified abstract locator.",
              "abnt-nbr-6024-2012": "The current edition is confirmed, but the exact licensed NBR 6024:2012 clause is not available in the public/repository evidence corpus; the current UFC guide provides the directly verified section-numbering locator.",
              "abnt-nbr-6023-2025": "The current edition supersedes the NBR 6023:2018 citation embedded in the UFC article guide, but its exact licensed clause is not available in the public/repository evidence corpus.",
          }

          manifest = json.loads(Path("standards/coverage-rules-article.json").read_text(encoding="utf-8"))
          rulesets = []
          for rule in manifest["rules"]:
              rule_id = rule["id"]
              if rule_id not in GUIDE_LOCATORS:
                  raise SystemExit(f"missing explicit UFC locator for {rule_id}")
              checks = []
              has_unavailable = False
              for source_id in rule["sources"]:
                  if source_id == GUIDE:
                      checks.append({
                          "source_id": source_id,
                          "locator": GUIDE_LOCATORS[rule_id],
                          "status": "VERIFIED",
                          "checked_at": TODAY,
                          "basis_url": GUIDE_URL,
                      })
                  else:
                      reason = STANDARD_REASON.get(source_id)
                      if reason is None:
                          raise SystemExit(f"unclassified article locator source: {source_id}")
                      has_unavailable = True
                      checks.append({
                          "source_id": source_id,
                          "locator": None,
                          "status": "UNAVAILABLE_WITH_REASON",
                          "checked_at": TODAY,
                          "reason": reason,
                      })
              rulesets.append({
                  "id": f"a1.{rule_id}",
                  "rule_ids": [rule_id],
                  "current_locator": rule["locator"],
                  "status": "PARTIAL_WITH_REASON" if has_unavailable else "VERIFIED",
                  "source_checks": checks,
              })

          out = {
              "schema_version": 1,
              "reviewed_at": TODAY,
              "purpose": "V3-A1 locator-quality supplement for the source-only scientific-article contract. Public UFC guide locators are verified; licensed ABNT clauses are never invented when unavailable.",
              "rulesets": rulesets,
          }
          Path("standards/locator-audit-article.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify no runtime implementation entered A1
        shell: bash
        run: |
          set -euo pipefail
          git add -N \
            docs/A1-ARTICLE-NORMATIVE-CONTRACT.md \
            standards/coverage-rules-article.json \
            standards/locator-audit-article.json
          mapfile -t changed < <(git diff --name-only e40a56deeca8c22797398b0c95835964aefd2b15)
          allowed=(
            .github/scripts/a1-article-contract.py
            .github/workflows/a1-article-contract.yml
            docs/A1-ARTICLE-NORMATIVE-CONTRACT.md
            docs/NORMATIVE-BASE.md
            docs/NORMATIVE-CURRENCY.md
            release/v3-roadmap.json
            standards/coverage-rules-article.json
            standards/locator-audit-article.json
            tests/checks/normative_full_contract.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${allowed[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Run targeted normative source contract
        shell: bash
        run: |
          set -euo pipefail
          python tests/checks/normative_sources.py
          python tests/checks/normative_full_contract.py
          python tests/checks/normative_currency.py
          python tests/checks/normative_precedence.py
          python tests/checks/normative_locators.py
          python tests/checks/normative_traceability.py --strict-evidence
          python tests/checks/normative_proof_state.py
          python tests/checks/normative_coverage.py

      - name: Run repository static contract
        run: make static-check

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/a1-article-contract.py
          rm -f .github/workflows/a1-article-contract.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check e40a56deeca8c22797398b0c95835964aefd2b15
          mapfile -t changed < <(git diff --name-only e40a56deeca8c22797398b0c95835964aefd2b15)
          expected=(
            docs/A1-ARTICLE-NORMATIVE-CONTRACT.md
            docs/NORMATIVE-BASE.md
            docs/NORMATIVE-CURRENCY.md
            release/v3-roadmap.json
            standards/coverage-rules-article.json
            standards/locator-audit-article.json
            tests/checks/normative_full_contract.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent A1 source contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: establish A1 scientific-article normative contract'
          git push origin HEAD:a1-scientific-article-normative-contract
