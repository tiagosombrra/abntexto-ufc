name: Temporary V3-A1 article source contract

on:
  push:
    branches:
      - docs/v3-a1-article-normative-contract

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact A1 implementation base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "e40a56deeca8c22797398b0c95835964aefd2b15"
          test "$(git rev-parse origin/main)" = "e40a56deeca8c22797398b0c95835964aefd2b15"

      - name: Reconcile A1 article contract
        run: python .github/scripts/a1-article-contract.py

      - name: Validate normative source contract
        shell: bash
        run: |
          set -euo pipefail
          python tools/normative_full.py
          python tests/checks/normative_sources.py
          python tests/checks/normative_precedence.py
          python tests/checks/normative_locators.py
          python tests/checks/normative_traceability.py --strict-evidence
          python tests/checks/normative_proof_state.py
          python tests/checks/normative_evidence_contribution.py --static

      - name: Run repository static contract
        run: make static-check

      - name: Verify A1 remains source-only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code e40a56deeca8c22797398b0c95835964aefd2b15 -- \
            abntexto-ufc.cls \
            abntexto-ufc/ \
            template/ \
            validator/ \
            tools/validate-ufc-pdf.py \
            docs/MIGRATING-TO-V3.md

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/a1-article-contract.py
          rm -f .github/workflows/a1-article-contract.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check e40a56deeca8c22797398b0c95835964aefd2b15
          mapfile -t changed < <(git diff --name-only e40a56deeca8c22797398b0c95835964aefd2b15)
          expected=(
            AGENTS.md
            README.md
            docs/ARCHITECTURE.md
            docs/ARTICLE-NORMATIVE-CONTRACT.md
            docs/CTAN-RELEASE.md
            docs/ENGINEERING-LANGUAGE.md
            docs/HANDOFF-V3.0.0.md
            docs/NORMATIVE-BASE.md
            docs/NORMATIVE-CURRENCY.md
            docs/ROADMAP-V3.0.0.md
            release/v3-roadmap.json
            standards/catalog.json
            standards/coverage-rules-article.json
            standards/evidence-contribution-policy.json
            standards/evidence-registry.json
            standards/locator-audit-article.json
            standards/precedence.json
            standards/source-audit.json
            standards/source-status-policy.json
            tests/checks/normative_full_contract.py
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent A1 source contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconstruct V3-A1 article normative contract'
          git push origin HEAD:docs/v3-a1-article-normative-contract
