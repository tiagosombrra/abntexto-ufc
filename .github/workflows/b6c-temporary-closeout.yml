name: B6-C temporary closeout audit

on:
  push:
    branches:
      - audit/v3-r1-b6c-closeout

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit permanent static gate ownership and cost
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import ast
          import subprocess
          import time
          from pathlib import Path

          root = Path('.')
          static_path = root / 'tests/static.py'
          source = static_path.read_text(encoding='utf-8')
          tree = ast.parse(source)

          expected_checks = [
              'tests/checks/canonical_identity.py',
              'tests/checks/repository_contract.py',
              'tests/checks/validator_source.py',
              'tests/checks/normative_objects_scope.py',
              'tests/checks/reference_guide_contract.py',
          ]
          observed_checks = None
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id == 'SOURCE_CHECKS':
                          observed_checks = [ast.literal_eval(item) for item in node.value.elts]
          if observed_checks != expected_checks:
              raise SystemExit(f'B6-C: SOURCE_CHECKS drift: {observed_checks!r}')

          excluded = [
              'frontmatter_definition_list_alignment.py',
              'normative_configuration.py',
          ]
          for item in excluded:
              if item in source:
                  raise SystemExit(f'B6-C: excluded checker leaked into static gate: {item}')

          forbidden_commands = [
              'pdflatex', 'lualatex', 'xelatex', 'latexmk', 'biber',
              'curl ', 'wget ', 'pkgcheck', 'verapdf',
              'build-public-bundles.py', 'build-distribution-bundles.py',
              'prepare-windows-fonts.ps1', 'convert-encoding-to-unicode.ps1',
          ]
          lower = source.lower()
          for marker in forbidden_commands:
              if marker.lower() in lower:
                  raise SystemExit(f'B6-C: forbidden heavy/runtime command marker in static gate: {marker}')

          makefile = Path('Makefile').read_text(encoding='utf-8')
          expected_target = 'static-check:\n\t@python3 tests/static.py'
          if expected_target not in makefile:
              raise SystemExit('B6-C: Makefile static-check target drift')

          readme = Path('README.md').read_text(encoding='utf-8')
          architecture = Path('docs/ARCHITECTURE.md').read_text(encoding='utf-8')
          for label, text in [('README', readme), ('ARCHITECTURE', architecture)]:
              if 'make static-check' not in text:
                  raise SystemExit(f'B6-C: {label} does not document make static-check')

          permanent = subprocess.run(
              ['git', 'ls-tree', '-r', '--name-only', 'origin/main', '.github/workflows'],
              text=True, capture_output=True, check=True,
          ).stdout.strip().splitlines()
          if permanent:
              raise SystemExit(f'B6-C: permanent workflow found on main: {permanent}')

          before = subprocess.run(
              ['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'],
              stdout=subprocess.PIPE, check=True,
          ).stdout
          started = time.perf_counter()
          completed = subprocess.run(
              ['make', 'static-check'], text=True,
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=False,
          )
          elapsed = time.perf_counter() - started
          print(completed.stdout, end='')
          print(f'B6-C-STATIC-GATE-COST seconds={elapsed:.3f}')
          if completed.returncode != 0:
              raise SystemExit(f'B6-C: make static-check failed with {completed.returncode}')
          after = subprocess.run(
              ['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all'],
              stdout=subprocess.PIPE, check=True,
          ).stdout
          if after != before:
              raise SystemExit('B6-C: static gate changed repository status')

          subprocess.run(['git', 'diff', '--check'], check=True)
          print(
              'B6-C-CLOSEOUT status=PASS '
              'source_checks=5 excluded_pdf_input=1 excluded_evidence_writer=1 '
              'tex_pdf=0 network=0 distribution=0 windows_font_pdfa=0 '
              'permanent_workflows=0 side_effects=0'
          )
          PY

      - name: Self-remove temporary closeout workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b6c-temporary-closeout.yml
          git commit -m 'chore: remove temporary B6-C closeout audit'
          git push origin HEAD:audit/v3-r1-b6c-closeout
