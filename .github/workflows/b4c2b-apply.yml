name: B4-C2b diagnostics and Web UI

on:
  push:
    branches:
      - refactor/v3-r1-b4c2b-diagnostics-ui

permissions:
  contents: write

jobs:
  migrate:
    if: "github.event.head_commit.message == 'chore: rerun compact B4-C2b executor'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/_b4c2b_migrate_temp.py
          python3 tools/_b4c2b_consumer_patch_temp.py

      - name: Validate B4-C2b
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate-ufc-pdf.py tests/checks/normative_validator_contract.py tests/checks/validator_source.py
          node --check validator/app.js
          python3 tests/checks/normative_cross_surface.py
          python3 tests/checks/normative_validator_contract.py
          python3 tests/checks/validator_source.py
          python3 tests/checks/canonical_identity.py
          python3 tests/checks/repository_contract.py
          for term in 'Capa' 'Folha de aprovação' 'Resumo' 'Sumário' 'Referências'; do
            grep -F "$term" tools/validate-ufc-pdf.py >/dev/null
            grep -F "$term" validator/app.js >/dev/null
          done
          grep -F '<html lang="en">' validator/index.html >/dev/null
          grep -F 'is not sent to a server' validator/index.html >/dev/null
          grep -F 'UFC/ABNT PDF Validator' validator/index.html >/dev/null
          grep -F 'ufc-validation-report.json' validator/app.js >/dev/null
          grep -F 'ufc-validation-report.csv' validator/app.js >/dev/null
          grep -F "description='Validate an academic UFC/ABNT PDF.'" tools/validate-ufc-pdf.py >/dev/null
          if git grep -n -E 'Ferramenta obrigatória não encontrada|Páginas fora de A4|Todas as páginas em A4|Nenhum texto ultrapassa|Todas as fontes incorporadas|Não incorporadas/indeterminadas|Elemento localizado|Elemento não localizado|Campo localizado|Campo ausente|veraPDF não instalado|Arquivo não encontrado|PDF legível|Pré-requisito técnico|Selecione um PDF|Validando\.\.\.|Falha na validação|Validador de PDF|Privacidade:|Veredito|Imprimir relatório|Como corrigir|relatorio-validacao-ufc' -- tools/validate-ufc-pdf.py validator/app.js validator/index.html; then
            echo 'B4-C2b project-owned Portuguese diagnostic/UI residue remains.' >&2
            exit 1
          fi
          git diff --check
          echo 'B4-C2B-DIAGNOSTICS-UI status=PASS'

      - name: Commit and remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git add tools/validate-ufc-pdf.py validator/app.js validator/index.html tests/checks/normative_validator_contract.py tests/checks/validator_source.py
          git commit -m 'refactor: normalize validator diagnostics and Web UI'
          git rm tools/_b4c2b_migrate_temp.py tools/_b4c2b_consumer_patch_temp.py .github/workflows/b4c2b-apply.yml
          git commit -m 'chore: remove temporary B4-C2b executor'
          git push origin HEAD:refactor/v3-r1-b4c2b-diagnostics-ui
