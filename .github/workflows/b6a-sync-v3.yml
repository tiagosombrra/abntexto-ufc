name: B6-A control plane sync

on:
  push:
    branches:
      - docs/v3-r1-b6a-close-b6b-open

permissions:
  contents: write

jobs:
  sync:
    if: "github.event.head_commit.message == 'chore: add B6-A sync v3'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate B6-A transition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/.b6a-sync.py
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          grep -Fq 'B6-A DONE' docs/HANDOFF-V3.0.0.md
          grep -Fq 'B6-B ACTIVE / NEXT' docs/HANDOFF-V3.0.0.md
          grep -Fq 'B6-A done; B6-B active' docs/ROADMAP-V3.0.0.md
          grep -Fq 'Issue #209' docs/ROADMAP-V3.0.0.md
          python3 tests/checks/canonical_identity.py
          python3 tests/checks/repository_contract.py
          git diff --check

      - name: Commit transition and self-remove executors
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git add docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md release/v3-roadmap.json
          git commit -m 'docs: close B6-A and activate B6-B'
          git rm .github/workflows/b6a-close-b6b-open.yml .github/workflows/b6a-sync-v2.yml .github/workflows/b6a-sync-v3.yml tools/.b6a-sync.py
          git commit -m 'chore: remove temporary B6-A sync executors'
          git push origin HEAD:docs/v3-r1-b6a-close-b6b-open
