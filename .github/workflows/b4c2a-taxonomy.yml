name: B4-C2a cleanup

on:
  push:
    branches:
      - refactor/v3-r1-b4c2-taxonomy

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b4c2a-taxonomy.yml
          git commit -m 'chore: remove temporary B4-C2a taxonomy executor'
          git push origin HEAD:refactor/v3-r1-b4c2-taxonomy
