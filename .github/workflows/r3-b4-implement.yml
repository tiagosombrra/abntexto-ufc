name: R3-B4 implementation

on:
  push:
    branches:
      - r3-b4-engineering-language

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Apply R3-B4 implementation
        run: python3 .github/scripts/r3-b4-implement.py
      - name: Validate language boundary self-tests
        run: python3 tests/checks/engineering_language.py --self-test
      - name: Validate permanent static contract
        run: make static-check
      - name: Validate diff integrity
        run: git diff --check
      - name: Commit permanent implementation and remove executor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/r3-b4-implement.py .github/workflows/r3-b4-implement.yml
          git add -A
          git commit -m 'test: enforce engineering-language contract'
          git push origin HEAD:r3-b4-engineering-language
