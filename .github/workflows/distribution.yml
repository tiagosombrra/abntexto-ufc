name: Distribution preflight

on:
  push:
    branches:
      - main
      - 'release/v2.*'
    tags:
      - 'v2.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-t:
    name: Gate T prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      actions: write
      contents: read
      statuses: read
    steps:
      - name: Reuse or dispatch required Gate T
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timedelta, timezone

          repo = os.environ['REPO']
          sha = os.environ['SHA']
          ref_name = os.environ['REF_NAME']
          token = os.environ['GH_TOKEN']
          required = {
              'ufctex/overleaf-proxy',
              'ufctex/windows-font-build',
              'ufctex/windows-font-poc',
              'ufctex/latex-preflight',
          }
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
              'User-Agent': 'ufctex-distribution-gate',
          }

          def request_json(url, data=None, method=None):
              payload = json.dumps(data).encode() if data is not None else None
              request = urllib.request.Request(
                  url,
                  data=payload,
                  method=method,
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status == 204:
                      return None
                  return json.load(response)

          def current_statuses():
              payload = request_json(
                  f'https://api.github.com/repos/{repo}/commits/{sha}/status?per_page=100'
              )
              latest = {}
              for item in payload.get('statuses', []):
                  latest.setdefault(item.get('context'), item)
              return latest

          statuses = current_statuses()
          if all(statuses.get(context, {}).get('state') == 'success' for context in required):
              print('Gate T already certified for this commit; dispatch not required.')
              raise SystemExit(0)

          started = datetime.now(timezone.utc) - timedelta(seconds=5)
          request_json(
              f'https://api.github.com/repos/{repo}/actions/workflows/latex-preflight.yml/dispatches',
              {'ref': ref_name},
              method='POST',
          )
          print(f'Dispatched LaTeX preflight for {ref_name}.')

          run = None
          for _ in range(90):
              payload = request_json(
                  f'https://api.github.com/repos/{repo}/actions/workflows/latex-preflight.yml/runs'
                  '?event=workflow_dispatch&per_page=20'
              )
              candidates = []
              for item in payload.get('workflow_runs', []):
                  if item.get('head_sha') != sha or item.get('event') != 'workflow_dispatch':
                      continue
                  created = datetime.fromisoformat(item['created_at'].replace('Z', '+00:00'))
                  if created >= started:
                      candidates.append(item)
              if candidates:
                  run = max(candidates, key=lambda item: item['created_at'])
                  break
              time.sleep(10)

          if run is None:
              raise SystemExit('Dispatched Gate T run was not found.')

          run_id = run['id']
          print(f'Gate T run: {run_id}')
          for _ in range(180):
              run = request_json(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}'
              )
              if run.get('status') == 'completed':
                  conclusion = run.get('conclusion')
                  if conclusion != 'success':
                      raise SystemExit(f'Gate T workflow concluded with {conclusion}.')
                  break
              time.sleep(15)
          else:
              raise SystemExit('Gate T workflow did not complete within the allowed window.')

          statuses = current_statuses()
          missing = sorted(
              context for context in required
              if statuses.get(context, {}).get('state') != 'success'
          )
          if missing:
              raise SystemExit(f'Gate T required statuses are not green: {", ".join(missing)}')

          print('Gate T prerequisite satisfied.')
          PY

  build-distribution:
    name: Build distribution candidates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload-release.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build release preflight
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make nodejs poppler-utils
            make reference-assets
            UFC_REQUIRE_REFERENCE_IMAGES=1 make preflight

      - name: Validate release PDF/A-2b
        shell: bash
        run: |
          command -v docker >/dev/null 2>&1
          sh tests/v2-pdfa-check.sh documento.pdf
          sh tests/v2-profile-pdfa-check.sh

      - name: Build deterministic release bundles
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python3 tools/fetch-abntexto.py --output .ufctex-abntexto.cls
          python3 tools/build-release-bundles.py --abntexto .ufctex-abntexto.cls
          python3 tests/v2-release-package-check.py
          rm -f .ufctex-abntexto.cls

      - name: Validate Overleaf import bundle proxy
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            python3 tests/v2-overleaf-bundle-check.py

      - name: Upload release candidates
        id: upload-release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ufctex-release-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  distribution-preflight:
    name: distribution-preflight
    if: ${{ always() }}
    needs:
      - gate-t
      - build-distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Aggregate distribution preflight
        env:
          GATE_T: ${{ needs.gate-t.result }}
          PACKAGES: ${{ needs.build-distribution.result }}
        run: |
          test "$GATE_T" = success
          test "$PACKAGES" = success

      - name: Publish distribution preflight status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/distribution-preflight',
              'description': 'Gate T, release bundles and Overleaf bundle proxy',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-distribution-status',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY

  publish-release:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v2.') &&
      needs.distribution-preflight.result == 'success' &&
      needs.build-distribution.result == 'success'
    needs:
      - distribution-preflight
      - build-distribution
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release tag metadata
        run: python3 tests/v2-release-metadata-check.py --release-tag "$GITHUB_REF_NAME"

      - name: Download verified release candidates
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build-distribution.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID"
          python3 tools/download-actions-artifact.py \
            --repository "$GITHUB_REPOSITORY" \
            --artifact-id "$ARTIFACT_ID" \
            --output dist

      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "ufctex $GITHUB_REF_NAME"
