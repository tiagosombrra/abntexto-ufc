name: PDF metadata XMP outline and anonymous privacy
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/frontmatter/pdf-metadata-outline.py
      - .github/workflows/pdf-metadata-outline.yml
  push:
    branches: [main]
    paths:
      - abntexto-ufc.cls
      - tests/integration/frontmatter/pdf-metadata-outline.py
      - .github/workflows/pdf-metadata-outline.yml
permissions:
  contents: read
concurrency:
  group: pdf-info-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  fail-closed-mutants:
    name: Reject absent metadata, outlines and anonymous leaks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prove nine negative controls reject false-positive evidence
        run: python3 tests/integration/frontmatter/pdf-metadata-outline.py --selftest
  real-pdfs:
    name: PDF metadata and outline / ${{ matrix.locale }} (3 PDFs)
    runs-on: ubuntu-24.04
    needs: fail-closed-mutants
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile 3 public and anonymous profiles with TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils mupdf-tools
            git config --global --add safe.directory "$PWD"
            python3 tests/integration/frontmatter/pdf-metadata-outline.py --locale ${{ matrix.locale }}
      - name: Preserve real PDFs, TeX/XMP, bookmarks and audit receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-info-${{ matrix.locale }}-${{ github.run_id }}
          path: artifacts/pdf-metadata-outline/${{ matrix.locale }}/**
          retention-days: 21
          if-no-files-found: warn
