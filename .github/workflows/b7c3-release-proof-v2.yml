name: B7-C3 release proof v2

on:
  push:
    branches:
      - ci/v3-r1-b7c3-linux-release-check

permissions:
  contents: write

jobs:
  release-proof:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/v3-r1-b7c3-linux-release-check
          fetch-depth: 0

      - name: Run repository release contract
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli
            node --version
            docker --version
            make release-check

      - name: Verify coordinated release evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/validation/validation-report.json').read_text(encoding='utf-8'))
          checks = report.get('checks', [])
          by_name = {item.get('name'): item for item in checks}
          observed = {
              'mode': report.get('mode'),
              'complete': report.get('complete'),
              'result': report.get('result'),
              'count': len(checks),
              'pdfa': by_name.get('pdfa', {}).get('status'),
              'profile-pdfa': by_name.get('profile-pdfa', {}).get('status'),
              'non_pass': [item.get('name') for item in checks if item.get('status') != 'PASS'],
          }
          expected = {
              'mode': 'release',
              'complete': True,
              'result': 'PASS',
              'count': 32,
              'pdfa': 'PASS',
              'profile-pdfa': 'PASS',
              'non_pass': [],
          }
          if observed != expected:
              raise SystemExit(f'release evidence mismatch: expected={expected} observed={observed}')
          print('B7-C3 release evidence verified: PASS=32 FAIL=0 SKIP=0 including pdfa and profile-pdfa.')
          PY

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## B7-C3 temporary Linux release proof v2'
            echo
            echo '> Linux release validation is engineering evidence only; B8 retains final Windows/literal-font/PDF-A certification ownership.'
            echo
            if [[ -f artifacts/validation/validation-report.md ]]; then
              cat artifacts/validation/validation-report.md
            else
              echo 'No repository validation report was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always() && hashFiles('artifacts/validation/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b7c3-release-proof-${{ github.run_id }}
          path: artifacts/validation/**
          retention-days: 14
          if-no-files-found: error

      - name: Promote proven runner environment and remove proof executors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/linux-release-check.yml')
          text = path.read_text(encoding='utf-8')
          old = 'apt-get install -y --no-install-recommends make poppler-utils nodejs docker.io'
          new = 'apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli'
          if text.count(old) != 1:
              raise SystemExit(f'permanent workflow Docker package target count is {text.count(old)}, expected 1')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          make static-check
          git diff --check
          rm .github/workflows/b7c3-release-proof.yml .github/workflows/b7c3-release-proof-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/linux-release-check.yml .github/workflows/b7c3-release-proof.yml .github/workflows/b7c3-release-proof-v2.yml
          git commit -m 'ci: promote proven B7-C3 release runner'
          git push origin HEAD:ci/v3-r1-b7c3-linux-release-check
