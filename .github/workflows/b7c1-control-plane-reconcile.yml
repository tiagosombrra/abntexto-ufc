name: B7-C1 control-plane reconcile

on:
  push:
    branches:
      - 'docs/v3-r1-b7c1-close-b7c2-open'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b7c1-close-b7c2-open
          fetch-depth: 0
      - name: Reconcile B7-C1 closure and activate B7-C2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          closure = "ced68313ed2c362a6617d7df6ef9adfd2df6c0b5"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Canonical handoff.
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "- Active B7 sub-item: **B7-C1 — repair the clean-runner integration contract before adding permanent heavy workflow orchestration**.",
              "- Active B7 sub-item: **B7-C2 — permanent Linux PR integration orchestration consuming the certified repository-owned `make check` contract**."
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "- Active B7 focus: **make the repository-owned `make check` contract pass on a clean TeX Live 2026 runner, then restore Linux orchestration as a thin workflow layer**.",
              "- Active B7 focus: **introduce a bounded permanent Linux PR integration workflow that delegates to `make check`, keeps gate logic repository-owned, and avoids heavy execution on every intermediate commit**."
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "- Latest certified clean implementation checkpoint: **`643397ee2fa49e6bd496889cb287f43167d49b0f`**.",
              f"- Latest certified clean implementation checkpoint: **`{closure}`**."
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "**ACTIVE.** Operational issue #213. Entry certified implementation checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: **`643397ee2fa49e6bd496889cb287f43167d49b0f`**.",
              f"**ACTIVE.** Operational issue #213. Entry certified implementation checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: **`{closure}`**."
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "- **B7-C1 ACTIVE — clean-runner integration contract repair:** reconcile paths, generated artifact/job names, current Makefile invocation semantics, shell argument wiring and stale evidence metadata exposed by run `33530309579`; then prove `make check` on a clean TeX Live 2026 runner. Preserve normative IDs, values, tolerances, locators, proof state and runtime/API behavior.",
              f"- **B7-C1 DONE — clean-runner integration contract repair:** PR #220 merged at `{closure}` after final TeX Live 2026 run `33545418119` proved `make check` with `PASS=30 FAIL=0 SKIP=0`; final `Static contract` run `33547122520` passed after temporary workflow removal. The repair changed execution/artifact wiring and synthetic fixture markers only; normative IDs, values, tolerances, proof state and runtime/API behavior were preserved."
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "- **B7-C2 PENDING — permanent Linux PR integration orchestration:** only after B7-C1 passes, add a bounded workflow that delegates to `make check` and avoids heavy execution on every intermediate commit when a cheaper status is sufficient.",
              "- **B7-C2 ACTIVE — permanent Linux PR integration orchestration:** add a bounded workflow that delegates to the now-certified `make check` entry point and avoids heavy execution on every intermediate commit when the permanent `Static contract` status is sufficient."
          )

          # Human-readable roadmap.
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "**V3-R1 ACTIVE — R1-BLOCK-6 done; R1-BLOCK-7 active; B7-A/B done; B7-C active.**",
              "**V3-R1 ACTIVE — R1-BLOCK-6 done; R1-BLOCK-7 active; B7-A/B/C1 done; B7-C2 active.**"
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "**B7-A DONE → B7-B DONE → B7-C ACTIVE [C1 ACTIVE → C2 PENDING → C3 PENDING] → B7-D PENDING**",
              "**B7-A DONE → B7-B DONE → B7-C ACTIVE [C1 DONE → C2 ACTIVE → C3 PENDING] → B7-D PENDING**"
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "- Latest certified implementation checkpoint: **`643397ee2fa49e6bd496889cb287f43167d49b0f`**.",
              f"- Latest certified implementation checkpoint: **`{closure}`**."
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "**ACTIVE.** Operational issue #213. Entry checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: **`643397ee2fa49e6bd496889cb287f43167d49b0f`**.",
              f"**ACTIVE.** Operational issue #213. Entry checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: **`{closure}`**."
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "**ACTIVE.** Repair only the execution/fixture/evidence wiring exposed by run `33530309579`, then validate `make check` on a clean TeX Live 2026 runner. Do not change normative rule IDs, values, tolerances, locators, proof state, runtime/API or B8-owned certification semantics.",
              f"**DONE.** PR #220 squash-merged at **`{closure}`**. Final clean TeX Live 2026 run **`33545418119` PASS** proved the repository-owned PR integration contract with **`PASS=30 FAIL=0 SKIP=0`**. Final `Static contract` run **`33547122520` PASS** executed after the temporary certification workflow was removed. No normative rule ID, expected value, tolerance, proof state, runtime/API or B8-owned certification semantic changed."
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "Expected bounded repair set:",
              "Completed bounded repair set:"
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "**PENDING.** After B7-C1 passes, add a bounded permanent job that consumes `make check`, uses the proven Linux/TeX runner contract and avoids forcing heavy validation on every intermediate commit where the fast contract is sufficient.",
              "**ACTIVE.** Add a bounded permanent PR integration job that consumes the certified `make check` contract, uses the proven Linux/TeX runner environment, keeps validation logic out of workflow YAML, and avoids forcing heavy validation on every intermediate commit where the fast `Static contract` status is sufficient."
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "- **R1-B7 ACTIVE** — optimized remote workflow restoration; B7-C1 active after B7-A/B completion.",
              "- **R1-B7 ACTIVE** — optimized remote workflow restoration; B7-C2 active after B7-C1 clean-runner certification."
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              "Execute **B7-C1** from canonical remote `main` after control-plane reconciliation. Repair the seven clean-runner execution/artifact-contract defects exposed by run `33530309579`, validate `make static-check`, then prove `make check` under the TeX Live 2026 Linux runner before adding permanent heavy workflow YAML. Keep B8 Windows/font/final PDF-A certification and V3-R2 runtime/API migration out of scope.",
              "Execute **B7-C2** from canonical remote `main` after this control-plane reconciliation. Add permanent Linux PR integration orchestration as a thin consumer of the certified `make check` contract, choose bounded triggers/concurrency so heavy TeX validation is not forced on every intermediate commit, and keep B7-C3 release orchestration, B8 Windows/font/final PDF-A certification, and V3-R2 runtime/API migration out of scope."
          )

          # Public/bootstrap/architecture documentation.
          replace_once(
              "README.md",
              "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. During R1-BLOCK-7, permanent heavy Linux orchestration is restored only after these repository-owned entry points are proven on a clean runner. B7-C1 currently owns clean-runner `make check` contract repair; B7-C2/C3 own later permanent integration/release orchestration. Final Windows/font/PDF-A certification remains B8-owned.",
              "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. B7-C1 certified `make check` on a clean TeX Live 2026 Linux runner (`PASS=30 FAIL=0 SKIP=0`); B7-C2 now owns bounded permanent PR integration orchestration, while B7-C3 owns later release orchestration. Final Windows/font/PDF-A certification remains B8-owned."
          )
          replace_once(
              "AGENTS.md",
              "- Permanent heavy Linux integration/release orchestration remains B7-C-owned and must not precede a clean-runner PASS of the repository-owned `make check` contract. Final Windows/font/PDF-A certification remains B8-owned.",
              "- B7-C1 certified the repository-owned `make check` contract on a clean TeX Live 2026 runner. B7-C2 may now add bounded permanent Linux PR integration orchestration as a thin consumer of that entry point; B7-C3 owns release orchestration. Final Windows/font/PDF-A certification remains B8-owned."
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "R1-BLOCK-7 restores permanent orchestration incrementally. B7-B established the `Static contract` workflow. B7-C1 owns clean-runner repair of the repository integration contract before any permanent heavy Linux workflow is introduced. B7-C2/C3 own the later PR integration and release orchestration. B8 remains the owner of final Windows/font/PDF-A certification.",
              "R1-BLOCK-7 restores permanent orchestration incrementally. B7-B established the `Static contract` workflow. B7-C1 certified the repository-owned `make check` integration contract on a clean TeX Live 2026 runner. B7-C2 now owns bounded permanent PR integration orchestration over that entry point; B7-C3 owns later release orchestration. B8 remains the owner of final Windows/font/PDF-A certification."
          )

          # Machine authority.
          machine_path = Path("release/v3-roadmap.json")
          machine = json.loads(machine_path.read_text(encoding="utf-8"))
          machine["last_certified_clean_checkpoint_sha"] = closure
          b7 = machine["blocks"]["R1-BLOCK-7"]
          b7["active_work_item"] = "B7-C"
          b7["active_sub_item"] = "B7-C2"
          b7["planned_lots"]["B7-C"] = "ACTIVE - C1 clean-runner contract certified; C2 permanent Linux PR integration orchestration active; C3 release orchestration pending"
          b7["b7_c_status"] = "ACTIVE"
          b7["b7_c1_status"] = "DONE"
          b7["b7_c1_issue"] = 219
          b7["b7_c1_pr"] = 220
          b7["b7_c1_closure_sha"] = closure
          b7["b7_c1_validation_run_id"] = 33545418119
          b7["b7_c1_results"] = {
              "clean_runner_make_check_passed": True,
              "clean_runner_pass": 30,
              "clean_runner_fail": 0,
              "clean_runner_skip": 0,
              "clean_runner_validation_run_id": 33545418119,
              "final_static_contract_run_id": 33547122520,
              "temporary_workflow_removed_before_merge": True,
              "runtime_api_changed": False,
              "normative_rule_ids_changed": False,
              "normative_expected_values_changed": False,
              "normative_tolerances_changed": False,
              "proof_state_changed": False,
              "synthetic_fixture_markers_rebased": True
          }
          b7["b7_c2_status"] = "ACTIVE"
          b7["b7_c3_status"] = "PENDING"
          machine["next_action"] = (
              "Execute R1-BLOCK-7 B7-C2. Add bounded permanent Linux PR integration orchestration "
              "that delegates to the certified make check entry point without duplicating repository gate logic; "
              "use optimized triggers/concurrency so heavy TeX validation is not forced on every intermediate commit. "
              "Keep B7-C3 release orchestration, B8 Windows/font/final PDF-A certification, and V3-R2 runtime/API work out of scope."
          )
          machine_path.write_text(json.dumps(machine, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Fail closed on the reconciled state.
          assert "B7-C2" in Path("docs/HANDOFF-V3.0.0.md").read_text(encoding="utf-8")
          assert "B7-C1 ACTIVE" not in Path("docs/HANDOFF-V3.0.0.md").read_text(encoding="utf-8")
          assert "C1 ACTIVE" not in Path("docs/ROADMAP-V3.0.0.md").read_text(encoding="utf-8")
          assert machine["last_certified_clean_checkpoint_sha"] == closure
          assert b7["active_sub_item"] == "B7-C2"
          assert b7["b7_c1_status"] == "DONE"
          assert b7["b7_c2_status"] == "ACTIVE"
          assert b7["b7_c1_results"]["clean_runner_pass"] == 30
          assert b7["b7_c1_results"]["clean_runner_fail"] == 0
          assert b7["b7_c1_results"]["clean_runner_skip"] == 0
          PY

          python3 -m json.tool release/v3-roadmap.json >/dev/null
          git diff --check
          make static-check

          rm .github/workflows/b7c1-control-plane-reconcile.yml
          git add docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md release/v3-roadmap.json README.md AGENTS.md docs/ARCHITECTURE.md .github/workflows/b7c1-control-plane-reconcile.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: close B7-C1 and activate B7-C2'
          git push origin HEAD:docs/v3-r1-b7c1-close-b7c2-open
