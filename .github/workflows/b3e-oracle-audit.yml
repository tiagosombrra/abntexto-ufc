name: B3-E oracle audit

on:
  push:
    branches:
      - refactor/v3-r1-b3e-oracle-terminology

permissions:
  contents: write

jobs:
  apply-and-audit:
    if: ${{ !contains(github.event.head_commit.message, '[b3e-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded B3-E terminology cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s) of {old!r}, found {found}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          runner_jobs = {
              'tests/integration/apud-evidence.sh': ('textual-oracle-apud-presentation', 'validation-apud-presentation'),
              'tests/integration/body-paragraph-evidence.sh': ('textual-oracle-body-paragraph', 'validation-body-paragraph'),
              'tests/integration/direct-citation-source-evidence.sh': ('textual-oracle-direct-citation-source', 'validation-direct-citation-source'),
              'tests/integration/footnote-separator-evidence.sh': ('textual-oracle-footnote-separator', 'validation-footnote-separator'),
              'tests/integration/footnote-text-evidence.sh': ('textual-oracle-footnote', 'validation-footnote'),
              'tests/integration/indirect-citation-source-evidence.sh': ('textual-oracle-indirect-citation-source', 'validation-indirect-citation-source'),
              'tests/integration/page-margins-evidence.sh': ('textual-oracle-page-margins', 'validation-page-margins'),
              'tests/integration/pagination-geometry-evidence.sh': ('textual-oracle-pagination-geometry', 'validation-pagination-geometry'),
              'tests/integration/reference-layout-evidence.sh': ('reference-layout-oracle', 'reference-layout-validation'),
              'tests/integration/section-hierarchy-evidence.sh': ('textual-oracle-section-hierarchy', 'validation-section-hierarchy'),
              'tests/integration/section-indicator-evidence.sh': ('textual-oracle-section-indicator', 'validation-section-indicator'),
              'tests/integration/section-multiline-hanging-evidence.sh': ('textual-oracle-section-multiline-hanging', 'validation-section-multiline-hanging'),
              'tests/integration/section-primary-after-spacing-evidence.sh': ('textual-oracle-section-primary-after-spacing', 'validation-section-primary-after-spacing'),
              'tests/integration/section-primary-recto-duplex-evidence.sh': ('textual-oracle-section-primary-recto-duplex', 'validation-section-primary-recto-duplex'),
              'tests/integration/section-unnumbered-centered-evidence.sh': ('textual-oracle-section-unnumbered-centered', 'validation-section-unnumbered-centered'),
              'tests/integration/short-direct-citation-evidence.sh': ('textual-oracle-short-direct-citation', 'validation-short-direct-citation'),
              'tests/integration/subsection-spacing-evidence.sh': ('textual-oracle-subsection-spacing', 'validation-subsection-spacing'),
              'tests/integration/typography-evidence.sh': ('textual-oracle-typography', 'validation-typography'),
              'tests/integration/ufc-citation-system-evidence.sh': ('textual-oracle-ufc-citation-system', 'validation-ufc-citation-system'),
              'tests/integration/vector-rule-validation.sh': ('vector-rule-oracle-calibration', 'vector-rule-validation-calibration'),
          }
          for path, (old, new) in runner_jobs.items():
              replace_exact(path, old, new)

          diagnostics = {
              'tests/checks/normative_apud_presentation.py': ('Apud presentation oracle failed:', 'Apud presentation validation failed:'),
              'tests/checks/normative_direct_citation_source.py': ('Direct citation source oracle failed:', 'Direct citation source validation failed:'),
              'tests/checks/normative_indirect_citation_source.py': ('Indirect citation source oracle failed:', 'Indirect citation source validation failed:'),
              'tests/checks/normative_reference_semantics.py': ('reference semantics oracle failed:', 'reference semantics validation failed:'),
              'tests/checks/normative_research_project_structure.py': ('project structure oracle failed:', 'project structure validation failed:'),
              'tests/checks/normative_section_primary_recto_duplex.py': ('Primary recto duplex oracle failed:', 'Primary recto duplex validation failed:'),
              'tests/checks/normative_ufc_citation_system.py': ('UFC citation system oracle failed:', 'UFC citation system validation failed:'),
          }
          for path, (old, new) in diagnostics.items():
              replace_exact(path, old, new)

          replace_exact(
              'standards/table-ibge-vector-final-pdf-scenario.json',
              '"oracle_extension": "standards/vector-rule-validation-extension.json"',
              '"validation_extension": "standards/vector-rule-validation-extension.json"',
          )
          replace_exact(
              'tests/checks/normative_table_ibge_vector.py',
              'scenario.get("oracle_extension")',
              'scenario.get("validation_extension")',
          )
          replace_exact(
              'standards/table-typography-final-pdf-scenario.json',
              'using the frozen typography oracle.',
              'using the frozen typography validation reference.',
          )
          replace_exact(
              'standards/vector-rule-validation-extension.json',
              'Calibrate an additive final-PDF oracle capability',
              'Calibrate an additive final-PDF validation capability',
          )
          PY

      - name: Validate bounded changes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/checks/normative_apud_presentation.py \
            tests/checks/normative_direct_citation_source.py \
            tests/checks/normative_indirect_citation_source.py \
            tests/checks/normative_reference_semantics.py \
            tests/checks/normative_research_project_structure.py \
            tests/checks/normative_section_primary_recto_duplex.py \
            tests/checks/normative_table_ibge_vector.py \
            tests/checks/normative_ufc_citation_system.py

          for f in \
            tests/integration/apud-evidence.sh \
            tests/integration/body-paragraph-evidence.sh \
            tests/integration/direct-citation-source-evidence.sh \
            tests/integration/footnote-separator-evidence.sh \
            tests/integration/footnote-text-evidence.sh \
            tests/integration/indirect-citation-source-evidence.sh \
            tests/integration/page-margins-evidence.sh \
            tests/integration/pagination-geometry-evidence.sh \
            tests/integration/reference-layout-evidence.sh \
            tests/integration/section-hierarchy-evidence.sh \
            tests/integration/section-indicator-evidence.sh \
            tests/integration/section-multiline-hanging-evidence.sh \
            tests/integration/section-primary-after-spacing-evidence.sh \
            tests/integration/section-primary-recto-duplex-evidence.sh \
            tests/integration/section-unnumbered-centered-evidence.sh \
            tests/integration/short-direct-citation-evidence.sh \
            tests/integration/subsection-spacing-evidence.sh \
            tests/integration/typography-evidence.sh \
            tests/integration/ufc-citation-system-evidence.sh \
            tests/integration/vector-rule-validation.sh; do
            sh -n "$f"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in (
              'standards/table-ibge-vector-final-pdf-scenario.json',
              'standards/table-typography-final-pdf-scenario.json',
              'standards/vector-rule-validation-extension.json',
          ):
              json.loads(Path(name).read_text(encoding='utf-8'))
          PY

          git diff --check

          allowed='^(\.github/workflows/b3e-oracle-audit\.yml|docs/HANDOFF-V3\.0\.0\.md|docs/ROADMAP-V3\.0\.0\.md|release/v3-path-migration\.json|release/v3-roadmap\.json|release/v3-test-migration\.json|tests/checks/repository_contract\.py):'
          residual="$(git grep -n -i -E 'oracle' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.pdf' || true)"
          echo '=== POST-CHANGE ORACLE OCCURRENCES ==='
          printf '%s\n' "$residual"
          unexpected="$(printf '%s\n' "$residual" | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected active oracle terminology remains:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standards tests
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 1
          fi
          git commit -m 'refactor: replace obsolete oracle engineering identity [b3e-apply]'
          git push origin HEAD:refactor/v3-r1-b3e-oracle-terminology
