name: B4-C2a review repair

on:
  push:
    branches:
      - refactor/v3-r1-b4c2-taxonomy

permissions:
  contents: write

jobs:
  repair:
    if: "github.event.head_commit.message == 'chore: add temporary B4-C2a review repair'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair review finding and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/validate-ufc-pdf.py')
          text = path.read_text(encoding='utf-8')
          old = 'Conforme nos checks automatics.'
          new = 'Conforme nos checks automáticos.'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one review artifact, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python3 -m py_compile tools/validate-ufc-pdf.py
          node --check validator/app.js
          python3 -m json.tool validator/validation-vectors.json >/dev/null
          python3 tests/checks/normative_cross_surface.py
          python3 tests/checks/normative_validator_contract.py
          python3 tests/checks/validator_source.py
          python3 tests/checks/canonical_identity.py
          python3 tests/checks/repository_contract.py
          ! grep -F 'checks automatics' tools/validate-ufc-pdf.py
          grep -F 'checks automáticos' tools/validate-ufc-pdf.py >/dev/null
          grep -F "'Capa'" tools/validate-ufc-pdf.py >/dev/null
          grep -F "'Folha de aprovação'" tools/validate-ufc-pdf.py >/dev/null
          grep -F "'Resumo'" tools/validate-ufc-pdf.py >/dev/null
          grep -F "'Sumário'" tools/validate-ufc-pdf.py >/dev/null
          grep -F "'Referências'" tools/validate-ufc-pdf.py >/dev/null
          git diff --check

      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git add tools/validate-ufc-pdf.py
          git commit -m 'fix: repair B4-C2a review artifact'
          git rm .github/workflows/b4c2a-review-repair.yml
          git commit -m 'chore: remove temporary B4-C2a review repair'
          git push origin HEAD:refactor/v3-r1-b4c2-taxonomy
