name: B6 to B7 temporary control-plane sync

on:
  push:
    branches:
      - docs/v3-r1-b6-close-b7-open

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize canonical B6 closeout and B7 activation
        run: |
          set -euo pipefail
          python3 .github/scripts/b6_b7_doc_sync.py
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          make static-check
          grep -Fq 'R1-BLOCK-7 — Optimized Remote Workflow Restoration' docs/HANDOFF-V3.0.0.md
          grep -Fq 'B7-A — Workflow/runner dependency inventory and orchestration design' docs/ROADMAP-V3.0.0.md
          grep -Fq '4c25c27b758e4b99db11187b34b9043776566871' docs/HANDOFF-V3.0.0.md
          git diff --check
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git add docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md release/v3-roadmap.json
          git commit -m 'docs: close B6 and activate B7'
          git push origin HEAD:docs/v3-r1-b6-close-b7-open

      - name: Self-remove temporary sync helpers
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b6-b7-temporary-doc-sync.yml .github/scripts/b6_b7_doc_sync.py
          git commit -m 'chore: remove temporary B6-B7 sync helpers'
          git push origin HEAD:docs/v3-r1-b6-close-b7-open
