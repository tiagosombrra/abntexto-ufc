name: Temporary R3-B3 residual closeout

on:
  push:
    branches:
      - r3-b3-semantic-test-residual

permissions:
  contents: write

concurrency:
  group: r3-b3-residual-closeout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Apply exact residual fixes and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              source = Path(path)
              text = source.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement target, found {count}")
              source.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "tests/checks/v3_api_residual.py",
              '''        + re.escape(key)\n        + r"\\s*="\n''',
              '''        + r"(?<![A-Za-z0-9_-])"\n        + re.escape(key)\n        + r"\\s*="\n''',
          )
          replace_once(
              "tests/checks/v3_api_residual.py",
              '''    for path in engineering_sources:\n        violations.extend(\n            scan_source(\n                path,\n                path.read_text(encoding="utf-8"),\n''',
              '''    for path in engineering_sources:\n        source_text = path.read_text(encoding="utf-8")\n        scan_text = "\\n".join(\n            line\n            for line in source_text.splitlines()\n            if "v3-api-residual: negative-test-literal" not in line\n        )\n        violations.extend(\n            scan_source(\n                path,\n                scan_text,\n''',
          )
          replace_once(
              "tests/checks/public_bundles.py",
              '''    legacy_tokens = ("  brasao = sim,", "  brasao = nao,")\n''',
              '''    legacy_tokens = ("  brasao = sim,", "  brasao = nao,")  # v3-api-residual: negative-test-literal\n''',
          )
          replace_once(
              "tests/integration/research-project.sh",
              "raise SystemExit('NBR 15287:2025: capa opcional foi impressa apesar de capa=nao.')",
              "raise SystemExit('NBR 15287:2025: capa opcional foi impressa apesar de cover = false.')",
          )
          replace_once(
              "tools/validate-ufc-pdf.py",
              "Use fonte-estrita=sim with literal {allowed_label}.",
              "Use strict-font = true with literal {allowed_label}.",
          )
          replace_once(
              "validator/app.js",
              "Use fonte-estrita=sim with ${fontLabel} and confirm in Deep/CLI mode.",
              "Use strict-font = true with ${fontLabel} and confirm in Deep/CLI mode.",
          )
          PY

          rm .github/workflows/r3-b3-static.yml
          make static-check
          python3 tests/checks/profile_matrix_contract.py
          python3 tests/checks/test_surface_integrity.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: close R3-B3 residual integrity gaps"
          git push origin HEAD:r3-b3-semantic-test-residual
