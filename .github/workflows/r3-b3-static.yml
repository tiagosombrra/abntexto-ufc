name: Temporary R3-B3 static validation

on:
  push:
    branches:
      - r3-b3-semantic-test-residual
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r3-b3-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Run R3-B3 source gates
        run: |
          set -euo pipefail
          make static-check
          python3 tests/checks/profile_matrix_contract.py
          python3 tests/checks/test_surface_integrity.py
