name: B5-A canonical docs sync

on:
  push:
    branches:
      - docs/v3-r1-b5a-checkpoint

permissions:
  contents: write

jobs:
  sync:
    if: "github.event.head_commit.message == 'chore: add temporary B5-A docs sync'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Record B5-A and activate B5-B
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          run_id=33512036280
          checkpoint='1a126c37653728941ce1ada762376c5fec69cb02'

          p=Path('docs/HANDOFF-V3.0.0.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('- Active B5 work item: **B5-A — distribution/public-bundle inventory and contract definition**.\n- Active B5 focus: **canonical bundle source set, producer/consumer map, flatten/copy rules, manifests, and reproducibility boundaries**.', '- Active B5 work item: **B5-B — deterministic v3 staging and public/Overleaf bundles**.\n- Active B5 focus: **canonical source set, flattened template staging, pinned upstream `abntexto.cls`, deterministic archives, and structure/reproducibility validation**.', 1)
          old=('### B5-A — Inventory and distribution contract\n\n'
               '**ACTIVE / NEXT.** Build a fresh remote producer/consumer matrix for public-bundle targets, Makefile/build-path integration, manifests/policies/evidence, current runtime/support source files, upstream inputs, and any tracked distribution-era residue. Classify before editing and split later work into bounded lots only after this inventory.')
          new=('### B5-A — Inventory and distribution contract\n\n'
               '**DONE — zero-diff certification.** Remote run `33512036280` PASS established the current distribution contract and self-removed its temporary workflow; the audit branch has zero changed files versus `main`. There is no current bundle producer or tracked `dist/` tree. `Makefile` exposes build/check entry points only. `tools/fetch-abntexto.py` is a valid pinned upstream fetcher but has no functional consumer. `build-path.sh` validates the repository build; `overleaf-stable.sh` assumes an already-flattened staging root, is not wired into `tests/run.py`, and still contains a removed font-check path plus stale engineering diagnostics.\n\n'
               'The current architecture requires `template/` to be flattened for public/Overleaf bundles, excludes the UFC institutional mark from public redistribution, and keeps distribution/Overleaf/TeX Live/CTAN as project policy rather than UFC/ABNT normativity. Historical distribution code is advisory only; reusable principles are deterministic archives, explicit source sets, SHA256 manifests, safe paths, pinned upstream `abntexto.cls`, and exclusion of institutional/proprietary assets. Retired v2 identities, `ufctex`, old artifact names, and permanent workflows are not reusable.\n\n'
               '### B5-B — Deterministic v3 staging and public/Overleaf bundles\n\n'
               '**ACTIVE / NEXT.** Implement one current v3 staging/archive producer for the class/runtime plus flattened template and Overleaf import bundle. Wire `fetch-abntexto.py` only for the Overleaf upstream pin; add structure/reproducibility checks; repair the Overleaf staging consumer path/engineering language as required by this contract. Deep Windows font/PDF-A certification remains B8-owned.\n\n'
               '### B5-C — Class/CTAN candidate and distribution metadata\n\n'
               '**PENDING.** Define the current class/CTAN-candidate archive and remaining distribution metadata/checksum validation using only current files and current `abntexto-ufc` identity; do not resurrect deleted CTAN documentation blindly.\n\n'
               '### B5-D — Final B5 residual/reproducibility audit\n\n'
               '**PENDING.** Reconcile remaining distribution consumers/policy/evidence, prove deterministic outputs and excluded assets, remove temporary executors, close B5, and activate B6.')
          if old not in t: raise SystemExit('HANDOFF B5-A block drift')
          t=t.replace(old,new,1)
          t=t.replace('Start B5-A from canonical remote `main` using `'+checkpoint+'` as the latest certified implementation checkpoint and issue #199 as the operational log. Inventory all current distribution/public-bundle producers, consumers, Makefile/build-path targets, manifests/policies/evidence, required runtime/support files, upstream inputs, and tracked distribution residue. Classify before editing; do not implement B6/B7/B8 or V3-R2 work inside B5.', 'Start B5-B from canonical remote `main` using `'+checkpoint+'` as the latest certified implementation checkpoint and issue #199 as the operational log. Implement the bounded deterministic v3 staging/archive producer for class/runtime, flattened template, and Overleaf import bundle; wire the pinned upstream fetcher only where required; add current structure/reproducibility checks and repair the current Overleaf staging consumer. Keep CTAN/class-package completion in B5-C and B6/B7/B8/V3-R2 out of scope.', 1)
          p.write_text(t,encoding='utf-8')

          p=Path('docs/ROADMAP-V3.0.0.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('**V3-R1 ACTIVE — R1-BLOCK-4 done; R1-BLOCK-5 active; B5-A active.**', '**V3-R1 ACTIVE — R1-BLOCK-4 done; R1-BLOCK-5 active; B5-A done; B5-B active.**',1)
          old=('### B5-A — Inventory and distribution contract\n\n'
               '**ACTIVE.** Fresh remote inventory first; historical distribution assumptions are advisory only. Map Makefile targets, build-path consumers, public bundle manifests/policies/evidence, runtime/support files, upstream inputs, and tracked distribution residue. Classify before editing.')
          new=('### B5-A — Inventory and distribution contract\n\n'
               '**DONE — zero-diff.** Run `33512036280` PASS found no current bundle producer or tracked distribution artifacts. The repository contract says public/Overleaf bundles flatten `template/`; public archives exclude the UFC institutional mark. `fetch-abntexto.py` remains a verified pinned fetcher without a functional consumer. `build-path.sh` is live; `overleaf-stable.sh` expects staging that does not currently exist and contains a removed font-check path. Distribution policy remains project policy with `build-path` as current evidence. The audit workflow self-removed and the branch is zero-diff.\n\n'
               '### B5-B — Deterministic v3 staging and public/Overleaf bundles\n\n'
               '**ACTIVE.** Add the current deterministic staging/archive producer for class/runtime, flattened template, and Overleaf bundle; wire the pinned upstream class for Overleaf; add structure/reproducibility validation; repair only distribution-owned Overleaf consumer drift. B8 retains deep font/PDF-A certification.\n\n'
               '### B5-C — Class/CTAN candidate and distribution metadata\n\n'
               '**PENDING.** Reconstruct current class/CTAN candidate packaging and metadata/checksum validation without restoring retired identities or deleted CTAN documentation by assumption.\n\n'
               '### B5-D — Residual/reproducibility closeout\n\n'
               '**PENDING.** Final distribution consumer/policy/evidence audit and B5 closure.')
          if old not in t: raise SystemExit('ROADMAP B5-A block drift')
          t=t.replace(old,new,1)
          t=t.replace('Start **B5-A** from canonical `main` with implementation checkpoint `'+checkpoint+'` and issue #199. Produce a fresh remote distribution/public-bundle producer/consumer inventory and classify each current or residual surface before implementation. Keep B6 permanent gates, B7 permanent workflow restoration, B8 final certification and V3-R2 runtime/API work out of scope.', 'Start **B5-B** from canonical `main` with implementation checkpoint `'+checkpoint+'` and issue #199. Implement the bounded deterministic v3 staging/archive producer for class/runtime, flattened template, and Overleaf import; wire the pinned upstream fetcher only for the bundle contract; add structure/reproducibility checks and repair the current Overleaf staging consumer. Keep B5-C, B6, B7, B8 and V3-R2 boundaries explicit.',1)
          p.write_text(t,encoding='utf-8')

          p=Path('release/v3-roadmap.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          b5=data['blocks']['R1-BLOCK-5']
          b5['active_work_item']='B5-B'
          b5['active_sub_item']='B5-B'
          b5['b5_a_status']='DONE'
          b5['b5_a_validation_run_id']=run_id
          b5['b5_a_results']={
              'zero_diff_certification': True,
              'bundle_producer_present': False,
              'tracked_distribution_output_present': False,
              'template_flattening_required': True,
              'institutional_mark_redistribution_allowed': False,
              'fetch_abntexto_verified_pinned_helper': True,
              'fetch_abntexto_functional_consumer_present': False,
              'build_path_gate_live': True,
              'overleaf_staging_gate_present': True,
              'overleaf_staging_producer_present': False,
              'overleaf_gate_removed_font_check_path_present': True,
              'overleaf_gate_registered_in_tests_run': False,
              'distribution_policy_normative_claim': False,
              'historical_distribution_implementation_authoritative': False,
              'temporary_workflow_removed': True
          }
          b5['planned_lots']={
              'B5-A':'DONE - inventory and distribution contract definition',
              'B5-B':'ACTIVE - deterministic v3 staging and public/Overleaf bundles',
              'B5-C':'PENDING - class/CTAN candidate and distribution metadata',
              'B5-D':'PENDING - final residual/reproducibility audit and closeout'
          }
          b5['b5_b_status']='ACTIVE'
          b5['b5_b_scope']=[
              'canonical deterministic distribution staging producer',
              'current class and runtime module source set',
              'flattened template bundle layout',
              'Overleaf bundle with pinned upstream abntexto class',
              'public asset and proprietary-font exclusions',
              'structure reproducibility and safe-archive validation',
              'bounded repair of current Overleaf distribution consumer'
          ]
          b5['b5_c_status']='PENDING'
          b5['b5_d_status']='PENDING'
          data['next_action']='Start R1-BLOCK-5 B5-B from canonical remote main using '+checkpoint+' as the latest certified implementation checkpoint and issue #199 as the operational log. Implement one deterministic current-v3 staging/archive producer for class/runtime, flattened template and Overleaf bundle; use tools/fetch-abntexto.py only for the pinned Overleaf upstream dependency; add structure/reproducibility validation and repair the distribution-owned Overleaf staging consumer. Keep CTAN/class-package completion in B5-C and B6/B7/B8/V3-R2 out of scope.'
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          grep -F 'B5-B — Deterministic v3 staging and public/Overleaf bundles' docs/HANDOFF-V3.0.0.md >/dev/null
          grep -F 'B5-B — Deterministic v3 staging and public/Overleaf bundles' docs/ROADMAP-V3.0.0.md >/dev/null
          python3 tests/checks/canonical_identity.py
          python3 tests/checks/repository_contract.py
          git diff --check
          echo 'B5-A-DOCS status=PASS'
      - name: Commit sync and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git add docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md release/v3-roadmap.json
          git commit -m 'docs: record B5-A and activate B5-B'
          git rm .github/workflows/b5a-docs-sync.yml
          git commit -m 'chore: remove temporary B5-A docs sync'
          git push origin HEAD:docs/v3-r1-b5a-checkpoint
