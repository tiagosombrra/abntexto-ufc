name: Temporary R4 B8 history reconciliation

on:
  push:
    branches:
      - docs/v3-r4-r1-b8-evidence-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact R4 control-plane main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "77c4419a74d421d722331fa042ab2af750431a90"
          test "$(git rev-parse origin/main)" = "77c4419a74d421d722331fa042ab2af750431a90"

      - name: Reconcile historical B8 wording
        run: python .github/scripts/r4-b8-history-reconcile.py

      - name: Run static contract
        run: make static-check

      - name: Remove temporary executor and validate diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/r4-b8-history-reconcile.py
          rm -f .github/workflows/r4-b8-history-reconcile.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check 77c4419a74d421d722331fa042ab2af750431a90
          mapfile -t changed < <(git diff --name-only 77c4419a74d421d722331fa042ab2af750431a90)
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' AGENTS.md README.md | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: clarify historical B8 certification evidence'
          git push origin HEAD:docs/v3-r4-r1-b8-evidence-reconcile
