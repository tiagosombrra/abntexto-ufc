name: R2-B1 dynamic consumer repair temporary

on:
  push:
    branches:
      - refactor/v3-r2-b1-canonical-setup-state
    paths:
      - .github/workflows/r2-b1-dynamic-consumer-fix-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout B1 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refactor/v3-r2-b1-canonical-setup-state
          fetch-depth: 0

      - name: Repair bounded dynamic consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "tests/integration/font-config.sh": [
                  ('render_fixture "$family" nao "$slot"', 'render_fixture "$family" false "$slot"'),
                  ('render_fixture "$family" sim rm', 'render_fixture "$family" true rm'),
              ],
              "tests/integration/pdf-geometry.sh": [
                  ('# Portuguese values below are the current runtime contract and are migrated in R2.\nbuild_mode single-sided anverso\nbuild_mode double-sided frente-verso',
                   '# Canonical print-mode values are validated directly.\nbuild_mode single-sided single-sided\nbuild_mode double-sided double-sided'),
              ],
              "tests/integration/table-ibge.sh": [
                  ("'tabelas = tabularray'", "'tables = tabularray'"),
              ],
              "tests/integration/duplex-backmatter.sh": [
                  ("sed 's/impressao = anverso/impressao = frente-verso/'", "sed 's/print-mode = single-sided/print-mode = double-sided/'"),
              ],
              "tests/integration/multivolume.sh": [
                  ("sed 's/pagina-inicial = 101/pagina-inicial = 0/'", "sed 's/initial-page = 101/initial-page = 0/'"),
                  ("Invalidpagina-inicial'0'.", "Invalidinitial-page'0'."),
                  ("pagina-inicial não foi preservada", "initial-page was not preserved"),
                  ("pagina-inicial=0 foi aceita", "initial-page=0 was accepted"),
                  ("pagina-inicial inválida não produziu o erro esperado", "invalid initial-page did not produce the expected error"),
              ],
              "tests/integration/catalog-card.sh": [
                  ('for mode in anverso frente-verso; do', 'for mode in single-sided double-sided; do'),
                  ('for card_mode in sim nao; do', 'for card_mode in true false; do'),
                  ('if [ "$mode" = "frente-verso" ] && [ "$card_mode" = "nao" ]; then', 'if [ "$mode" = "double-sided" ] && [ "$card_mode" = "false" ]; then'),
                  ("if card_mode == 'sim':", "if card_mode == 'true':"),
                  ("expected_physical_index = 1 if mode == 'anverso' else 2", "expected_physical_index = 1 if mode == 'single-sided' else 2"),
                  ("if mode == 'frente-verso' and (len(norm) != 3 or norm[1]):", "if mode == 'double-sided' and (len(norm) != 3 or norm[1]):"),
                  ("apesar de ficha-catalografica=nao", "although catalog-card=false"),
                  ("frente-verso sem ficha", "double-sided mode without a catalog card"),
              ],
          }

          for path_text, edits in replacements.items():
              path = Path(path_text)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f"Expected source fragment not found in {path}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          forbidden = {
              "tests/integration/font-config.sh": (" nao ", " sim "),
              "tests/integration/pdf-geometry.sh": ("anverso", "frente-verso"),
              "tests/integration/table-ibge.sh": ("tabelas = tabularray",),
              "tests/integration/duplex-backmatter.sh": ("impressao = anverso", "impressao = frente-verso"),
              "tests/integration/multivolume.sh": ("pagina-inicial",),
              "tests/integration/catalog-card.sh": ("for mode in anverso", "for card_mode in sim", "card_mode == 'sim'", "mode == 'frente-verso'"),
          }
          for path_text, tokens in forbidden.items():
              text = Path(path_text).read_text(encoding="utf-8")
              hits = [token for token in tokens if token in text]
              if hits:
                  raise SystemExit(f"Legacy dynamic consumer residue in {path_text}: {hits}")
          PY

          git diff --check
          make static-check

      - name: Commit repair and remove temporary executor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r2-b1-dynamic-consumer-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test: migrate remaining R2-B1 dynamic consumers'
          git push origin HEAD:refactor/v3-r2-b1-canonical-setup-state
