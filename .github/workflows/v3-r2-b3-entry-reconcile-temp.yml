name: V3 R2 B3 entry reconcile temp

on:
  push:
    branches:
      - docs/v3-r2-b3-entry-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reconcile canonical B3 entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          OLD = "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949"
          NEW = "0650845b922271fc134d20ef2a8c36ebb999ef91"

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "release/v3-api-migration.json",
              f'  "current_main_sha": "{OLD}",',
              f'  "current_main_sha": "{NEW}",'
          )
          replace_once(
              "release/v3-api-migration.json",
              '  "active_implementation_lot": {"stage": "R2-B3", "issue": 238},',
              f'  "active_implementation_lot": {{"stage": "R2-B3", "issue": 238, "entry_main_sha": "{NEW}"}},'
          )
          replace_once(
              "release/v3-api-migration.json",
              '  "r2_b2_closeout": {"status": "DONE", "issue": 237, "pr": 242, "entry_main_sha": "e418893ee5c89f12cc4ac8d845111c894ec946e4", "implementation_head_sha": "4341a2adb4633b634d1e2ad905b1731e8126354b", "merge_main_sha": "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949", "static_run_id": 33680378948, "linux_integration_run_id": 33680378846, "linux_integration_job_id": 100415223907, "linux_integration_result": "PASS=30 FAIL=0 SKIP=0", "strengthened_residual_audit_run_id": 33680252116, "runtime_alias_layer_added": false, "normative_semantics_changed": false, "proof_state_changed": false},',
              f'  "r2_b2_closeout": {{"status": "DONE", "issue": 237, "pr": 242, "control_plane_pr": 243, "entry_main_sha": "e418893ee5c89f12cc4ac8d845111c894ec946e4", "implementation_head_sha": "4341a2adb4633b634d1e2ad905b1731e8126354b", "merge_main_sha": "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949", "control_plane_main_sha": "{NEW}", "static_run_id": 33680378948, "linux_integration_run_id": 33680378846, "linux_integration_job_id": 100415223907, "linux_integration_result": "PASS=30 FAIL=0 SKIP=0", "strengthened_residual_audit_run_id": 33680252116, "closeout_static_run_id": 33696690560, "closeout_linux_integration_run_id": 33696690567, "closeout_linux_integration_job_id": 100467032281, "closeout_linux_integration_result": "PASS=30 FAIL=0 SKIP=0", "release_source_audit_run_id": 33696155771, "release_source_audit_job_id": 100465339990, "runtime_alias_layer_added": false, "normative_semantics_changed": false, "proof_state_changed": false}},'
          )

          replace_once(
              "release/v3-roadmap.json",
              f'        "entry_main_sha": "{OLD}"',
              f'        "entry_main_sha": "{NEW}"'
          )
          replace_once(
              "release/v3-roadmap.json",
              '        "strengthened_residual_audit_job_id": 100414804865,',
              f'        "strengthened_residual_audit_job_id": 100414804865,\n        "control_plane_closeout_pr": 243,\n        "control_plane_closeout_main_sha": "{NEW}",\n        "closeout_static_contract_run_id": 33696690560,\n        "closeout_linux_integration_run_id": 33696690567,\n        "closeout_linux_integration_job_id": 100467032281,\n        "closeout_linux_integration_result": "PASS=30 FAIL=0 SKIP=0",\n        "release_source_audit_run_id": 33696155771,\n        "release_source_audit_job_id": 100465339990,'
          )

          replace_once(
              "release/v3-test-migration.json",
              '  "r2_b2_closeout": {"status": "DONE", "merge_main_sha": "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949", "linux_integration_run_id": 33680378846, "result": "PASS=30 FAIL=0 SKIP=0", "consumer_migration": "academic/front-matter owners, hooks, template/tests/reference/CTAN/scenario consumers migrated atomically"},',
              f'  "r2_b2_closeout": {{"status": "DONE", "merge_main_sha": "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949", "control_plane_pr": 243, "control_plane_main_sha": "{NEW}", "linux_integration_run_id": 33680378846, "result": "PASS=30 FAIL=0 SKIP=0", "closeout_linux_integration_run_id": 33696690567, "closeout_result": "PASS=30 FAIL=0 SKIP=0", "release_source_audit_run_id": 33696155771, "consumer_migration": "academic/front-matter owners, hooks, template/tests/reference/CTAN/scenario/release-source consumers migrated atomically"}},'
          )

          replace_once(
              "release/v3-path-migration.json",
              '  "r2_b2_closeout": {"status": "DONE", "merge_main_sha": "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949", "next_lot": "R2-B3", "next_issue": 238, "public_api_absorption": "B1 setup plus B2 academic/front-matter forwarding removed; B3/B4 debt remains"},',
              f'  "r2_b2_closeout": {{"status": "DONE", "merge_main_sha": "8e3e0f2a165e488a00f08a0031ba6fb4a01f9949", "control_plane_pr": 243, "control_plane_main_sha": "{NEW}", "next_lot": "R2-B3", "next_issue": 238, "next_lot_entry_main_sha": "{NEW}", "public_api_absorption": "B1 setup plus B2 academic/front-matter forwarding removed; B3/B4 debt remains"}},'
          )

          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              f'- R2-B2 merged checkpoint on `main`: `{OLD}`.',
              f'- Canonical R2-B3 entry checkpoint on `main`: `{NEW}`.'
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              '- R2-B2 issue #237: **DONE through PR #242**.',
              '- R2-B2 issue #237: **DONE through PR #242 and closeout PR #243; issue closed completed**.'
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              f'- merged `main`: `{OLD}`;\n- `Static contract`: run `33680378948`, PASS;',
              f'- merged B2 implementation `main`: `{OLD}`;\n- B2→B3 closeout PR: #243; canonical B3 entry `main`: `{NEW}`;\n- final closeout `Static contract`: run `33696690560`, PASS;\n- final closeout `Linux integration`: run `33696690567`, job `100467032281`, `PASS=30 FAIL=0 SKIP=0`;\n- `Static contract`: run `33680378948`, PASS;'
          )
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              'Execute R2-B3 through issue #238 from canonical `main` after the B2→B3 control-plane closeout is merged.',
              f'Execute R2-B3 through issue #238 from canonical `main` `{NEW}`.'
          )

          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              f'Canonical R2-B2 merged checkpoint on `main`: `{OLD}`. Certified R1 product candidate:',
              f'Canonical R2-B3 entry checkpoint on `main`: `{NEW}`. Certified R1 product candidate:'
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              f'| R2-B2 | DONE | issue #237; PR #242 → `{OLD}` | Academic/front-matter rendering API directly owned; integration `30/0/0`, merged-main release gate `32/0/0`, late CTAN/bundle source audit PASS | None |',
              f'| R2-B2 | DONE | issue #237; PR #242 → `{OLD}`; closeout PR #243 → `{NEW}` | Academic/front-matter rendering API directly owned; integration `30/0/0`, closeout integration `30/0/0`, merged-main release gate `32/0/0`, late CTAN/bundle source audit PASS | None |'
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              '| R2-B3 | ACTIVE | issue #238 | Structural/object environments, optional object API, extension hooks and project-owned object IDs | Direct ownership, atomic consumer migration and validation |',
              f'| R2-B3 | ACTIVE | issue #238; entry `{NEW}` | Structural/object environments, optional object API, extension hooks and project-owned object IDs | Direct ownership, atomic consumer migration and validation |'
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              'No runtime alias layer, normative semantic/proof-state change, proprietary font redistribution or CTAN submission occurred.\n\nSee `docs/R2-API-OWNERSHIP.md`',
              f'No runtime alias layer, normative semantic/proof-state change, proprietary font redistribution or CTAN submission occurred. Closeout PR #243 then passed final `Static contract` run `33696690560` and `Linux integration` run `33696690567` / job `100467032281` at `PASS=30 FAIL=0 SKIP=0`, and squash-merged to canonical B3 entry `main` `{NEW}`. Issue #237 was closed completed.\n\nSee `docs/R2-API-OWNERSHIP.md`'
          )
          replace_once(
              "docs/ROADMAP-V3.0.0.md",
              'Merge the B2→B3 closeout only after the final human-authored PR head passes both permanent PR gates. Then execute **R2-B3 issue #238** from that canonical `main`.',
              f'Execute **R2-B3 issue #238** from canonical entry `main` `{NEW}`.'
          )

          replace_once(
              "docs/R2-API-OWNERSHIP.md",
              f'R2-B2 merged checkpoint: `{OLD}`.\nAuthoritative migration contract:',
              f'R2-B2 merged checkpoint: `{OLD}`.\nR2-B3 canonical entry checkpoint after closeout PR #243: `{NEW}`.\nAuthoritative migration contract:'
          )
          replace_once(
              "docs/R2-API-OWNERSHIP.md",
              f'Operational issue: #237. Implementation PR: #242. Entry `main`: `e418893ee5c89f12cc4ac8d845111c894ec946e4`. Merged `main`: `{OLD}`.',
              f'Operational issue: #237, closed completed. Implementation PR: #242. Entry `main`: `e418893ee5c89f12cc4ac8d845111c894ec946e4`. Merged B2 implementation `main`: `{OLD}`. Control-plane closeout PR: #243; canonical B3 entry `main`: `{NEW}`.'
          )
          replace_once(
              "docs/R2-API-OWNERSHIP.md",
              'Operational issue: #238. Entry `main`: the canonical B2→B3 closeout merge, after PR #243 passes final permanent gates and lands on `main`.',
              f'Operational issue: #238. Entry `main`: `{NEW}` from the green squash merge of closeout PR #243.'
          )
          replace_once(
              "docs/R2-API-OWNERSHIP.md",
              'B1 and B2 are complete; B3/#238 becomes the sole active implementation lot only after the B2→B3 closeout PR #243 is merged green.',
              f'B1 and B2 are complete; B3/#238 is the sole active implementation lot from canonical entry `main` `{NEW}` after closeout PR #243 merged green.'
          )

          replace_once(
              "AGENTS.md",
              f'- R2-B2 merged through PR #242 at `{OLD}`; final `Linux integration` run `33680378846` passed `PASS=30 FAIL=0 SKIP=0`, with strengthened residual audit `33680252116` green.',
              f'- R2-B2 merged through PR #242 at `{OLD}`; final `Linux integration` run `33680378846` passed `PASS=30 FAIL=0 SKIP=0`, with strengthened residual audit `33680252116` green. Closeout PR #243 passed `Static contract` `33696690560` and `Linux integration` `33696690567` at `PASS=30 FAIL=0 SKIP=0`, then squash-merged as canonical B3 entry `{NEW}`; issue #237 is closed completed.'
          )

          replace_once(
              "README.md",
              'The certified R1 candidate is `9b1752565ac217c04ffa22a9ef272cdf078af380`. Windows run',
              f'The canonical R2-B3 entry checkpoint is `{NEW}` after green closeout PR #243. The certified R1 candidate is `9b1752565ac217c04ffa22a9ef272cdf078af380`. Windows run'
          )
          replace_once(
              "README.md",
              f'B2 merged through PR #242 at `{OLD}` after final `Linux integration` run `33680378846` closed `PASS=30 FAIL=0 SKIP=0`.',
              f'B2 merged through PR #242 at `{OLD}` after final `Linux integration` run `33680378846` closed `PASS=30 FAIL=0 SKIP=0`; closeout PR #243 then passed final `30/0/0` integration and produced canonical B3 entry `{NEW}`.'
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              'R2-B3 is active and migrates structural/object environments, object APIs, extension hooks and project-owned object IDs; later lots migrate bibliography/back-matter APIs and finally remove `public-api.def`.',
              f'R2-B3 is active from canonical entry `main` `{NEW}` and migrates structural/object environments, object APIs, extension hooks and project-owned object IDs; later lots migrate bibliography/back-matter APIs and finally remove `public-api.def`.'
          )

          replace_once(
              "docs/CTAN-RELEASE.md",
              f'R2-B2 academic/front-matter migration is complete at `{OLD}`; the B2→B3 closeout also reconciled the live CTAN example/manual and public-bundle tooling to canonical v3 setup.',
              f'R2-B2 academic/front-matter migration is complete at `{OLD}`; green closeout PR #243 produced canonical R2-B3 entry `{NEW}` and also reconciled the live CTAN example/manual and public-bundle tooling to canonical v3 setup.'
          )
          PY

          git rm .github/workflows/v3-r2-b3-entry-reconcile-temp.yml
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          python3 -m json.tool release/v3-test-migration.json >/dev/null
          python3 -m json.tool release/v3-path-migration.json >/dev/null
          git diff --check
          make static-check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md README.md docs/ARCHITECTURE.md docs/CTAN-RELEASE.md docs/HANDOFF-V3.0.0.md docs/R2-API-OWNERSHIP.md docs/ROADMAP-V3.0.0.md release/v3-api-migration.json release/v3-path-migration.json release/v3-roadmap.json release/v3-test-migration.json
          git diff --cached --check
          git commit -m "docs: reconcile canonical R2-B3 entry"
          git push origin HEAD:docs/v3-r2-b3-entry-reconcile
