name: V3 R2 B4 migration temp

on:
  push:
    branches:
      - refactor/v3-r2-b4-bibliography-backmatter-api

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Apply bounded B4 migration
        run: python3 tools/tmp-r2-b4-migrate.py

      - name: Validate source contract
        run: |
          git diff --check
          make static-check

      - name: Publish clean product checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/tmp-r2-b4-migrate.py .github/workflows/v3-r2-b4-migration-temp.yml
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 3
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: own bibliography and back-matter APIs directly'
          git push origin HEAD:refactor/v3-r2-b4-bibliography-backmatter-api
