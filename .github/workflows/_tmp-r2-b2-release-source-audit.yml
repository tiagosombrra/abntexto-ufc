name: Temporary R2-B2 release-source audit

on:
  push:
    branches:
      - docs/v3-r2-b2-closeout-b3-entry

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate canonical CTAN example, manual and bundle sources
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils

            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT INT TERM
            python3 tools/fetch-abntexto.py --output "$work/abntexto.cls"

            mkdir -p "$work/example"
            cd "$work/example"
            TEXINPUTS="$GITHUB_WORKSPACE//:$work//:" pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$GITHUB_WORKSPACE/docs/ctan-example.tex"
            TEXINPUTS="$GITHUB_WORKSPACE//:$work//:" pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$GITHUB_WORKSPACE/docs/ctan-example.tex"
            test -s ctan-example.pdf

            mkdir -p "$work/manual"
            cp "$GITHUB_WORKSPACE/release/ctan/abntexto-ufc.tex" "$work/manual/"
            cd "$work/manual"
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error abntexto-ufc.tex
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error abntexto-ufc.tex
            test -s abntexto-ufc.pdf

            cd "$GITHUB_WORKSPACE"
            python3 tests/checks/distribution_bundles.py --abntexto "$work/abntexto.cls"

            python3 - <<'PY'
            from pathlib import Path

            active_sources = [
                Path('docs/ctan-example.tex'),
                Path('release/ctan/abntexto-ufc.tex'),
            ]
            forbidden = [
                'tipo =', 'impressao =', 'capa =', 'ficha-catalografica', 'brasao =',
                'fonte =', 'fonte-estrita', 'programa-doutorado', 'titulo-doutor',
                'autor =', 'titulo =', 'local =', 'ano =', 'orientador =',
                'tabelas =', 'codigo =', 'algoritmos =', 'glossario =', 'indice =',
                'Portuguese public API during the R1 reconstruction',
                '\\chapter{',
            ]
            failures = []
            for path in active_sources:
                text = path.read_text(encoding='utf-8')
                for token in forbidden:
                    if token in text:
                        failures.append(f'{path}: stale release-source token {token!r}')
            if failures:
                raise SystemExit('\n'.join(failures))
            print('R2-B2 release-source residual audit: PASS')
            PY

      - name: Record reconciliation evidence and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_id = int(os.environ['GITHUB_RUN_ID'])
          merge_sha = '8e3e0f2a165e488a00f08a0031ba6fb4a01f9949'

          def replace_once(name, old, new):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: expected exactly one occurrence of {old!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          roadmap_marker = (
              'R2-B2 moved the complete academic/front-matter rendering surface into direct canonical ownership, '
              'rebound layout hooks, migrated template/tests/CTAN source/scenario consumers, and removed all B2 forwards '
              'from `public-api.def`. The bounded executor first failed closed in run `33679535751` on its own cleanup order; '
              'after executor repair, run `33679827267` passed. Human review then found hook identifiers and the illustration-list '
              'specialization that the initial scan did not cover; strengthened audit `33680252116` closed those gaps. Final head '
              '`4341a2adb4633b634d1e2ad905b1731e8126354b` passed `Static contract` run `33680378948` and `Linux integration` '
              'run `33680378846`, job `100415223907`, at `PASS=30 FAIL=0 SKIP=0`; PR #242 squash-merged to `main` at '
              f'`{merge_sha}`. No runtime alias layer, normative semantic/proof-state change, proprietary font redistribution or CTAN submission occurred.'
          )
          roadmap_extra = (
              roadmap_marker + '\n\n'
              'The B2 closeout audit also found a late B1 release-source consumer residual: `docs/ctan-example.tex` still used removed '
              'v2 setup keys and `release/ctan/abntexto-ufc.tex` still documented the R1 Portuguese API and a chapter-based example. '
              f'Both active CTAN sources were reconciled to the canonical v3 API before B3 activation and validated by targeted release-source run `{run_id}` '
              '(example compilation, manual compilation, deterministic distribution-bundle validation and stale-token audit). This repair changed no runtime behavior or normative proof state.'
          )
          replace_once('docs/ROADMAP-V3.0.0.md', roadmap_marker, roadmap_extra)

          handoff_marker = (
              '- no runtime alias layer, normative semantic/proof-state change, proprietary font redistribution or CTAN submission.\n\n'
              '## Current runtime/API state'
          )
          handoff_extra = (
              '- no runtime alias layer, normative semantic/proof-state change, proprietary font redistribution or CTAN submission.\n\n'
              '### Late release-source reconciliation\n\n'
              'The B2 closeout audit found two active release-source residues from the earlier setup migration: `docs/ctan-example.tex` '
              'still used removed v2 setup keys, and `release/ctan/abntexto-ufc.tex` still described the temporary R1 Portuguese API and used '
              f'a chapter-based snippet. Both were corrected before B3 activation. Targeted run `{run_id}` compiled the CTAN example and manual, '
              'validated deterministic distribution bundles, and passed a stale-token audit. Runtime behavior, normative semantics and proof state were unchanged.\n\n'
              '## Current runtime/API state'
          )
          replace_once('docs/HANDOFF-V3.0.0.md', handoff_marker, handoff_extra)

          ownership_marker = (
              'B2 moved cover/title/approval/catalog-card, dedication/acknowledgments/epigraph/errata, summary/abstract, front-matter lists, '
              'list-entry and table-of-contents commands into direct owners; rebound layout hooks; migrated template/test/reference/CTAN/scenario '
              'consumers; and removed B2 forwards from `public-api.def`. The first executor run `33679535751` failed closed on its own cleanup order. '
              'Corrected run `33679827267` passed, then strengthened residual audit `33680252116` caught and closed hook/specialization gaps. '
              'Final head `4341a2adb4633b634d1e2ad905b1731e8126354b` passed `Static contract` `33680378948` and `Linux integration` '
              '`33680378846` / job `100415223907` with `PASS=30 FAIL=0 SKIP=0`. No normative semantics/proof state changed and no compatibility alias layer was introduced.'
          )
          ownership_extra = (
              ownership_marker + '\n\n'
              f'During closeout, a late setup/documentation residual was found in the two active CTAN release sources and repaired before B3 activation. '
              f'Targeted release-source validation run `{run_id}` compiled both sources and validated the deterministic CTAN/distribution candidate. '
              'The authoritative old-to-new API mapping remains in `release/v3-api-migration.json`; runtime aliases remain forbidden.'
          )
          replace_once('docs/R2-API-OWNERSHIP.md', ownership_marker, ownership_extra)

          replace_once(
              'docs/CTAN-RELEASE.md',
              f'- Development gate: V3-R2 runtime/API migration is active in R2-B3. R2-B2 academic/front-matter migration is complete at `{merge_sha}`. A v3.0.0 CTAN upload must not be performed from an intermediate R2 lot; release publication remains a later explicit action after the roadmap reaches its release-ready stage and the intended release candidate is revalidated proportionally.',
              f'- Development gate: V3-R2 runtime/API migration is active in R2-B3. R2-B2 academic/front-matter migration is complete at `{merge_sha}`. The B2 closeout also reconciled the active CTAN example/manual with the canonical v3 API and validated them in targeted run `{run_id}`. A v3.0.0 CTAN upload must not be performed from an intermediate R2 lot; release publication remains a later explicit action after the roadmap reaches its release-ready stage and the intended release candidate is revalidated proportionally.'
          )

          replace_once(
              'AGENTS.md',
              '- R2-B2 merged through PR #242 at `8e3e0f2a165e488a00f08a0031ba6fb4a01f9949`; final `Linux integration` run `33680378846` passed `PASS=30 FAIL=0 SKIP=0`, with strengthened residual audit `33680252116` green.',
              f'- R2-B2 merged through PR #242 at `{merge_sha}`; final `Linux integration` run `33680378846` passed `PASS=30 FAIL=0 SKIP=0`, with strengthened residual audit `33680252116` green. The closeout additionally repaired stale canonical-setup/R1 wording in the active CTAN example/manual and targeted release-source run `{run_id}` validated those sources before B3 activation.'
          )

          roadmap = json.loads(Path('release/v3-roadmap.json').read_text(encoding='utf-8'))
          b2 = roadmap['r2']['lots']['R2-B2']
          b2['late_release_source_reconciliation'] = {
              'status': 'DONE',
              'reason': 'late B1 active release-source consumer/documentation residual discovered during B2 closeout',
              'paths': ['docs/ctan-example.tex', 'release/ctan/abntexto-ufc.tex'],
              'targeted_validation_run_id': run_id,
              'ctan_example_compiled': True,
              'ctan_manual_compiled': True,
              'distribution_bundle_validation_passed': True,
              'stale_release_source_tokens_remaining': 0,
              'runtime_behavior_changed': False,
              'normative_semantics_changed': False,
              'proof_state_changed': False,
          }
          Path('release/v3-roadmap.json').write_text(json.dumps(roadmap, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          api = json.loads(Path('release/v3-api-migration.json').read_text(encoding='utf-8'))
          api['r2_b2_closeout']['late_release_source_reconciliation'] = {
              'status': 'DONE',
              'paths': ['docs/ctan-example.tex', 'release/ctan/abntexto-ufc.tex'],
              'targeted_validation_run_id': run_id,
              'legacy_setup_or_r1_api_documentation_remaining': False,
          }
          Path('release/v3-api-migration.json').write_text(json.dumps(api, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = json.loads(Path('release/v3-test-migration.json').read_text(encoding='utf-8'))
          test['r2_b2_closeout']['late_release_source_reconciliation'] = {
              'status': 'DONE',
              'targeted_validation_run_id': run_id,
              'ctan_example_compile': 'PASS',
              'ctan_manual_compile': 'PASS',
              'distribution_bundle_validation': 'PASS',
          }
          Path('release/v3-test-migration.json').write_text(json.dumps(test, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          rm .github/workflows/_tmp-r2-b2-release-source-audit.yml

          python3 -m json.tool release/v3-roadmap.json >/dev/null
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          python3 -m json.tool release/v3-test-migration.json >/dev/null
          git diff --check
          make static-check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record late CTAN source reconciliation"
          test -z "$(git status --porcelain)"
          git push origin HEAD:docs/v3-r2-b2-closeout-b3-entry
