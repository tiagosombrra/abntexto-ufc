name: B6-B temporary static gate revalidation

on:
  push:
    branches:
      - feat/v3-r1-b6b-static-gate

permissions:
  contents: write

jobs:
  validate:
    if: "github.event.head_commit.message == 'chore: add temporary B6-B revalidation'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revalidate static gate
        shell: bash
        run: |
          set -euo pipefail
          t0=$(date +%s%N)
          make static-check | tee /tmp/b6b-static.log
          t1=$(date +%s%N)
          python3 - "$t0" "$t1" <<'PY'
          import sys
          seconds = (int(sys.argv[2]) - int(sys.argv[1])) / 1e9
          print(f'B6-B-RUNTIME seconds={seconds:.3f}')
          if seconds > 15:
              raise SystemExit('static gate exceeded certification ceiling')
          PY
          touch .b6b-preexisting-dirty
          before=$(git status --porcelain=v1 --untracked-files=all)
          make static-check >/tmp/b6b-dirty.log
          after=$(git status --porcelain=v1 --untracked-files=all)
          test "$before" = "$after"
          rm .b6b-preexisting-dirty
          cp validator/validation-vectors.json /tmp/b6b-validation-vectors.json
          printf '\n{' >> validator/validation-vectors.json
          if make static-check >/tmp/b6b-negative.log 2>&1; then exit 1; fi
          cp /tmp/b6b-validation-vectors.json validator/validation-vectors.json
          grep -Fq 'Static gate failed: JSON parse error' /tmp/b6b-negative.log
          git diff --exit-code -- validator/validation-vectors.json
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          grep -Fq 'STATIC-GATE-EVIDENCE status=PASS' /tmp/b6b-static.log
          echo 'B6-B-REVALIDATION status=PASS normal=PASS dirty_preservation=PASS failure_path_status_check=PASS malformed_json_rejection=PASS'

      - name: Self-remove temporary revalidation
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b6b-temporary-revalidation.yml
          git commit -m 'chore: remove temporary B6-B revalidation'
          git push origin HEAD:feat/v3-r1-b6b-static-gate
