name: Temporary R5 to A1 exact-entry activation

on:
  push:
    branches:
      - docs/v3-r5-closeout-a1-entry

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact R5 closeout predecessor
        shell: bash
        run: |
          set -euo pipefail
          base='908ee2eb2ec04c030d74a9a4b146fba38fb745a9'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"
          test "$(git merge-base HEAD origin/main)" = "$base"

      - name: Reconcile exact A1 entry state
        run: python .github/scripts/r5-a1-entry-activate.py

      - name: Verify authority documents unchanged
        shell: bash
        run: |
          set -euo pipefail
          base='908ee2eb2ec04c030d74a9a4b146fba38fb745a9'
          git diff --exit-code "$base" -- \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md

      - name: Run repository static contract
        run: make static-check

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          base='908ee2eb2ec04c030d74a9a4b146fba38fb745a9'
          rm -f .github/scripts/r5-a1-entry-activate.py
          rm -f .github/workflows/r5-a1-entry-activate.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check "$base"
          mapfile -t changed < <(git diff --name-only "$base")
          expected=(
            AGENTS.md
            README.md
            docs/ARCHITECTURE.md
            docs/CTAN-RELEASE.md
            docs/ENGINEERING-LANGUAGE.md
            docs/HANDOFF-V3.0.0.md
            docs/R3-HARDENING-INVENTORY.md
            docs/ROADMAP-V3.0.0.md
            release/v3-r3-inventory.json
            release/v3-roadmap.json
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent A1 activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close R5 and activate A1 entry'
          git push origin HEAD:docs/v3-r5-closeout-a1-entry
