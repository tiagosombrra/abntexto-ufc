name: B7-D control-plane closure

on:
  push:
    branches:
      - docs/v3-r1-b7-close-b8-open

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b7-close-b8-open

      - name: Close B7 and activate B8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          TECHNICAL_CHECKPOINT = "d7327db7efd5cc1e0ff9255195bcb9767d853d3e"
          AUDIT_MAIN = "5f0ec947bb123567b5fe4548f04e9a15b2bb915d"

          def replace_line(path, needle, replacement):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected exactly one line containing {needle!r}, found {len(matches)}")
              lines[matches[0]] = replacement
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one exact match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Machine authority.
          p = Path("release/v3-roadmap.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          if data["stage"] != "R1-BLOCK-7":
              raise SystemExit(f"unexpected current stage: {data['stage']}")
          if data["last_certified_clean_checkpoint_sha"] != TECHNICAL_CHECKPOINT:
              raise SystemExit("technical checkpoint drift")

          data["stage"] = "R1-BLOCK-8"
          data["stage_name"] = "final R1 certification"

          b7 = data["blocks"]["R1-BLOCK-7"]
          b7["status"] = "DONE"
          b7.pop("active_work_item", None)
          b7.pop("active_sub_item", None)
          b7["planned_lots"]["B7-D"] = "DONE - residual workflow audit, branch-protection recommendation, and B8 handoff"
          b7["b7_d_status"] = "DONE"
          b7["b7_d_results"] = {
              "audit_main_sha": AUDIT_MAIN,
              "permanent_workflow_count": 3,
              "permanent_workflows": [
                  ".github/workflows/static-contract.yml",
                  ".github/workflows/linux-integration.yml",
                  ".github/workflows/linux-release-check.yml"
              ],
              "stable_status_names": [
                  "Static contract",
                  "Linux integration",
                  "Linux release check"
              ],
              "temporary_workflows_present": False,
              "repository_owned_entry_points": [
                  "make static-check",
                  "make check",
                  "make release-check"
              ],
              "contents_permissions_read_only": True,
              "actions_pinned_to_immutable_shas": True,
              "bounded_concurrency_cancel_in_progress": True,
              "main_ruleset_id": 20984822,
              "main_ruleset_name": "Stable branches",
              "required_status_checks_present": False,
              "recommended_required_pr_checks": [
                  "Static contract",
                  "Linux integration"
              ],
              "linux_release_check_required_on_pr": False,
              "branch_protection_mutation_applied": False,
              "branch_protection_recommendation_recorded": True,
              "b8_operational_issue": 227,
              "heavy_product_gates_rerun": False,
              "runtime_api_changed": False,
              "normative_semantics_changed": False,
              "proof_state_changed": False
          }

          b8 = data["blocks"]["R1-BLOCK-8"]
          b8["status"] = "ACTIVE"
          b8["name"] = "final R1 certification"
          b8["operational_issue"] = 227
          b8["entry_implementation_checkpoint_sha"] = TECHNICAL_CHECKPOINT
          b8["entry_control_plane_sha"] = AUDIT_MAIN
          b8["scope"] = [
              "hosted Windows certification for the current v3 candidate",
              "literal Times New Roman and Arial identity certification without redistributing proprietary fonts",
              "supported pdfLaTeX and LuaLaTeX certification matrix",
              "Unicode text extraction and font embedding verification",
              "final PDF/A-2b certification with machine-readable evidence receipts",
              "reconcile B8-owned version-labelled diagnostics or certification metadata only when current-state evidence requires it"
          ]
          b8["constraints"] = [
              "do not perform V3-R2 Portuguese runtime API migration",
              "do not change normative rule IDs expected values tolerances locators or proof state without explicit new normative evidence",
              "do not redistribute proprietary Microsoft font files",
              "do not treat Linux B7 release evidence as final Windows literal-font certification",
              "do not perform actual CTAN submission or claim CTAN acceptance",
              "temporary workflow executor lifecycle must remain atomic"
          ]
          b8["b8_status"] = "ACTIVE"
          b8["entry_evidence"] = {
              "b7_clean_runner_make_check": "PASS=30 FAIL=0 SKIP=0",
              "b7_linux_release_run_id": 33566835570,
              "b7_linux_release_result": "PASS=32 FAIL=0 SKIP=0",
              "release_only_pdfa_passed": True,
              "release_only_profile_pdfa_passed": True,
              "b7_permanent_workflow_inventory_clean": True
          }

          data["next_action"] = (
              "Execute R1-BLOCK-8 via issue #227 from canonical main. Audit and use the repository-owned Windows/font/PDF-A "
              "preparation and validation tooling, certify the current v3 candidate on hosted Windows with literal Times New Roman "
              "and Arial where required, prove the supported pdfLaTeX/LuaLaTeX matrix, Unicode extraction, embedding and final PDF/A-2b "
              "evidence. Do not rerun completed Linux product gates without current-state need, perform V3-R2 runtime/API migration, "
              "redistribute proprietary fonts, or perform an actual CTAN submission."
          )
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Bootstrap/current-state documentation.
          replace_line(
              "AGENTS.md",
              "B7-C1 certified the repository-owned `make check` contract",
              "- R1-BLOCK-7 is DONE. `Static contract`, `Linux integration`, and `Linux release check` are the only permanent workflows; B7-D confirmed stable repository-owned entry points, read-only permissions, pinned actions, bounded concurrency, and zero temporary workflow residue. The `Stable branches` ruleset currently has no required-status rule; the recorded recommendation is to require `Static contract` and `Linux integration`, while `Linux release check` remains post-merge/manual. R1-BLOCK-8 is ACTIVE via issue #227 for final Windows/literal-font/PDF-A certification."
          )

          replace_line(
              "README.md",
              "`check` runs the PR-oriented integration suite",
              "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. R1-BLOCK-7 is DONE: B7-C1 certified `make check` on clean TeX Live 2026 (`PASS=30 FAIL=0 SKIP=0`); B7-C2 permanently established `Linux integration`; and B7-C3 permanently established `Linux release check`, whose first merged-main run `33566835570` closed `PASS=32 FAIL=0 SKIP=0`, including release-only `pdfa` and `profile-pdfa`, with 14-day evidence retention. B7-D then audited the final orchestration state: exactly three permanent workflows, read-only permissions, pinned actions, bounded concurrency, and no temporary executors. The current `Stable branches` ruleset does not yet require statuses; the recorded recommendation is `Static contract` plus `Linux integration`, while `Linux release check` remains post-merge/manual. R1-BLOCK-8 is ACTIVE through issue #227 for final Windows/literal Times New Roman and Arial/PDF-A certification."
          )

          replace_line(
              "docs/ARCHITECTURE.md",
              "R1-BLOCK-7 restores permanent orchestration incrementally.",
              "R1-BLOCK-7 is DONE. The permanent orchestration surface is exactly `Static contract`, `Linux integration`, and `Linux release check`, each delegating to its repository-owned entry point (`make static-check`, `make check`, and `make release-check`). B7-D confirmed read-only permissions, immutable action pins, bounded concurrency, stable status semantics, and zero temporary workflow residue. The current `Stable branches` ruleset has no required-status rule; the recorded recommendation is to require `Static contract` and `Linux integration`, while `Linux release check` remains a post-merge/manual release gate. R1-BLOCK-8 is ACTIVE via issue #227 and owns final Windows/literal-font/PDF-A certification."
          )

          replace_line(
              "docs/CTAN-RELEASE.md",
              "This Linux result is an engineering gate, not final release certification.",
              "R1-BLOCK-7 is complete. Its Linux result is an engineering gate, not final release certification. B7-D confirmed the permanent workflow inventory and recorded `Static contract` plus `Linux integration` as the recommended required PR checks; `Linux release check` remains post-merge/manual. R1-BLOCK-8 is now ACTIVE via issue #227 for literal Times New Roman/Arial identity and final Windows/font/PDF-A certification. CTAN packaging and current `pkgcheck` validation remain separate release procedures below. Validation evidence under `artifacts/validation/` is not a distribution artifact and must not be inserted into public bundles."
          )

          # Canonical handoff.
          replace_line("docs/HANDOFF-V3.0.0.md", "- Active implementation stage:", "- Active implementation stage: **R1-BLOCK-8 — Final R1 Certification**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- Active B7 work item:", "- R1-BLOCK-7 status: **DONE**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- Active B7 sub-item:", "- Active B8 issue: **#227 — final R1 certification**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- Active B7 focus:", "- Active B8 focus: **hosted Windows certification, literal Times New Roman/Arial identity, supported engine matrix, Unicode extraction/font embedding, and final PDF/A-2b evidence for the current v3 candidate**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- B7 operational issue:", "- B7 operational issue: **#213 — complete; close after this control-plane transition merges**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "**ACTIVE.** Audit workflow ownership/status semantics", "**DONE.** B7-D audited canonical `main` at `5f0ec947bb123567b5fe4548f04e9a15b2bb915d`: exactly three permanent workflows remain; no temporary executor survives; workflow permissions are read-only; actions are pinned; concurrency is bounded/cancelable; and stable status ownership remains `Static contract`, `Linux integration`, and `Linux release check`. Ruleset `Stable branches` (20984822) currently has no required-status rule. The recorded recommendation is to require `Static contract` and `Linux integration`; `Linux release check` remains post-merge/manual and is not a PR-required status. No branch-protection mutation, heavy product rerun, runtime/API change, normative semantic change, or proof-state change was part of B7-D.")
          replace_once(
              "docs/HANDOFF-V3.0.0.md",
              "B8 retains final Windows/font/PDF-A certification. V3-R2 retains runtime/API migration. Actual CTAN submission remains an explicit release action outside B7.",
              "## R1-BLOCK-8 — Final R1 certification\n\n**ACTIVE** via issue #227. Entry implementation checkpoint remains `d7327db7efd5cc1e0ff9255195bcb9767d853d3e`; the B7-D control-plane audit was performed against `main` at `5f0ec947bb123567b5fe4548f04e9a15b2bb915d`. B8 owns hosted Windows execution, literal Times New Roman/Arial identity, supported pdfLaTeX/LuaLaTeX certification, Unicode extraction/font embedding, and final PDF/A-2b evidence. It must use repository-owned tooling, must not redistribute proprietary Microsoft fonts, and must not absorb V3-R2 runtime/API migration or actual CTAN submission."
          )

          # Engineering roadmap.
          replace_line("docs/ROADMAP-V3.0.0.md", "**V3-R1 ACTIVE — R1-BLOCK-6 done;", "**V3-R1 ACTIVE — R1-BLOCK-7 done; R1-BLOCK-8 active.**")
          replace_line("docs/ROADMAP-V3.0.0.md", "**R1-S0 DONE →", "**R1-S0 DONE → R1-S1 DONE → R1-S2 DONE → R1-B1 DONE → R1-B2 DONE → R1-B3 DONE → R1-B4 DONE → R1-B5 DONE → R1-B6 DONE → R1-B7 DONE → R1-B8 ACTIVE → R2+ BLOCKED**")
          replace_line("docs/ROADMAP-V3.0.0.md", "**B7-A DONE →", "**B7-A DONE → B7-B DONE → B7-C DONE [C1 DONE → C2 DONE → C3 DONE] → B7-D DONE**")
          replace_line("docs/ROADMAP-V3.0.0.md", "**ACTIVE.** Operational issue #213.", "**DONE.** Operational issue #213. Entry checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; certified implementation checkpoint: **`d7327db7efd5cc1e0ff9255195bcb9767d853d3e`**. B7-D completed the residual workflow/status/ruleset audit and handed certification ownership to B8.")
          replace_line("docs/ROADMAP-V3.0.0.md", "**ACTIVE.** Audit the three permanent workflow owners", "**DONE.** Canonical `main` contains exactly three permanent workflows (`Static contract`, `Linux integration`, `Linux release check`) and no temporary executor. All three use read-only repository permissions, pinned actions and bounded concurrency. Ruleset `Stable branches` (20984822) currently has no required-status rule; the recorded recommendation is to require `Static contract` and `Linux integration`, while `Linux release check` remains post-merge/manual. No branch-protection mutation or heavy product rerun was required for B7-D.")
          replace_line("docs/ROADMAP-V3.0.0.md", "- **R1-B7 ACTIVE**", "- **R1-B7 DONE** — optimized remote workflow restoration is complete through B7-D.")
          replace_line("docs/ROADMAP-V3.0.0.md", "- **R1-B8 BLOCKED**", "- **R1-B8 ACTIVE** — final R1 certification via issue #227: hosted Windows, literal fonts, supported engine matrix, Unicode extraction/font embedding, and final PDF/A-2b evidence.")
          replace_line("docs/ROADMAP-V3.0.0.md", "Execute **B7-D** from canonical remote", "Execute **R1-BLOCK-8** via issue #227 from canonical remote `main`. Audit the existing Windows/font/PDF-A preparation and validation tooling first, then certify the current v3 candidate on hosted Windows with literal Times New Roman and Arial where required, the supported pdfLaTeX/LuaLaTeX matrix, Unicode extraction/font embedding, and final PDF/A-2b evidence. Do not rerun completed Linux product gates without current-state need, perform V3-R2 runtime/API migration, redistribute proprietary fonts, or perform an actual CTAN submission.")
          PY

          # The executor must disappear from both working tree and Git index before validation.
          git rm -f .github/workflows/b7d-control-plane-close.yml
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          git diff --check
          make static-check

          python3 - <<'PY'
          from pathlib import Path
          expected = {"static-contract.yml", "linux-integration.yml", "linux-release-check.yml"}
          actual = {p.name for p in Path('.github/workflows').glob('*.yml')}
          if actual != expected:
              raise SystemExit(f"workflow inventory mismatch: expected={sorted(expected)} actual={sorted(actual)}")
          print("Permanent workflow inventory PASS")
          PY

          git config user.name "Tiago Sombra"
          git config user.email "tiagosombrra@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close B7 and activate B8"
          git push origin HEAD:docs/v3-r1-b7-close-b8-open
