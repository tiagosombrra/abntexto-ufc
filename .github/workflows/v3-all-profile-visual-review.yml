name: V3 all-profile visual review

on:
  push:
    branches:
      - validation/v3.0.0-all-profile-review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-all-profile-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-review-bundle:
    name: Build seven source/PDF review pairs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout validation infrastructure
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: validation/v3.0.0-all-profile-review
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact final candidate implementation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 395899e1b2336ed268335d68e59e03452880c15e
          path: released
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          expected='395899e1b2336ed268335d68e59e03452880c15e'
          actual="$(git -C released rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "FINAL-CANDIDATE-EVIDENCE source_sha=$actual"

      - name: Generate, compile and preflight all canonical profiles
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils python3 docker-cli

            candidate_sha='395899e1b2336ed268335d68e59e03452880c15e'
            old_sha='05399473827da7cf6b6c8bac36edc7115481773f'
            python3 tools/generate-v3-profile-review.py --output artifacts/v3-profile-review

            # Normalize validation-only provenance and keep academic fixtures
            # on the normative section hierarchy. The upstream abntexto manual
            # explicitly marks chapter mode as non-conforming to NBR 14724:2024.
            python3 - <<'PY'
            import json
            from pathlib import Path

            root = Path('artifacts/v3-profile-review')
            old_sha = '05399473827da7cf6b6c8bac36edc7115481773f'
            candidate_sha = '395899e1b2336ed268335d68e59e03452880c15e'
            for path in list(root.rglob('*.tex')) + [root / 'README.txt']:
                text = path.read_text(encoding='utf-8')
                text = text.replace(f'v3.0.0 / {old_sha}', f'candidate / {candidate_sha}')
                text = text.replace(old_sha, candidate_sha)
                text = text.replace('v3.0.0 congelada', 'candidato v3.0.0')
                text = text.replace('Released source:', 'Candidate source:')
                if path.suffix == '.tex' and path.name != 'scientific-article.tex':
                    text = text.replace(r'\chapter{Introdução}', r'\section{Introdução}')
                    text = text.replace(r'\section{Objetivo da inspeção}', r'\subsection{Objetivo da inspeção}')
                    text = text.replace(r'\chapter{Superfícies de apresentação}', r'\section{Superfícies de apresentação}')
                    text = text.replace(r'\section{Figura controlada}', r'\subsection{Figura controlada}')
                    text = text.replace(r'\section{Tabela controlada}', r'\subsection{Tabela controlada}')
                    text = text.replace(r'\section{Equação controlada}', r'\subsection{Equação controlada}')
                    text = text.replace(r'\chapter{Considerações finais}', r'\section{Considerações finais}')
                    text = text.replace(
                        r'\caption{Área gráfica controlada para inspeção de legenda e numeração}',
                        r'\caption[Esquema controlado]{Área gráfica controlada para inspeção de legenda e numeração}',
                    )
                path.write_text(text, encoding='utf-8', newline='\n')

            index_path = root / 'profiles.json'
            index = json.loads(index_path.read_text(encoding='utf-8'))
            index.pop('release_tag', None)
            index.pop('released_source_sha', None)
            index['candidate_source_sha'] = candidate_sha
            index['tag_state'] = 'pending-explicit-maintainer-approval'
            index_path.write_text(
                json.dumps(index, ensure_ascii=False, indent=2) + '\n',
                encoding='utf-8',
                newline='\n',
            )
            PY

            python3 released/tools/fetch-abntexto.py --output released/abntexto.cls

            root="$PWD"
            review="$root/artifacts/v3-profile-review"
            released="$root/released"
            export TEXINPUTS="$released:$released//:"

            class_path="$(kpsewhich abntexto-ufc.cls)"
            fonts_path="$(kpsewhich abntexto-ufc/fonts.def)"
            upstream_path="$(kpsewhich abntexto.cls)"
            echo "Resolved abntexto-ufc.cls: $class_path"
            echo "Resolved abntexto-ufc/fonts.def: $fonts_path"
            echo "Resolved abntexto.cls: $upstream_path"
            test "$(readlink -f "$class_path")" = "$(readlink -f "$released/abntexto-ufc.cls")"
            test "$(readlink -f "$fonts_path")" = "$(readlink -f "$released/abntexto-ufc/fonts.def")"
            test "$(readlink -f "$upstream_path")" = "$(readlink -f "$released/abntexto.cls")"
            grep -Fq '\ProvidesClass{abntexto-ufc}[2026/09/09 v3.0.0' "$class_path"
            grep -Fq 'font / times .code:n' "$fonts_path"

            cat > /tmp/abntexto-ufc-v3-api-probe.tex <<'TEX'
            \DocumentMetadata{lang=pt-BR,pdfstandard=A-2b,pdfversion=1.7}
            \documentclass{abntexto-ufc}
            \ufcsetup{
              type = undergraduate-capstone,
              print-mode = single-sided,
              cover = auto,
              catalog-card = false,
              coat-of-arms = false,
              font = times,
              strict-font = false,
              glossary = none,
              index = none,
              author = {API Probe},
              title = {Final candidate v3.0.0 API Probe},
              location = {Fortaleza},
              year = {2026}
            }
            \begin{document}
            Final candidate v3.0.0 API probe.
            \end{document}
            TEX
            pdflatex -output-directory=/tmp -interaction=nonstopmode -halt-on-error -file-line-error /tmp/abntexto-ufc-v3-api-probe.tex
            test -s /tmp/abntexto-ufc-v3-api-probe.pdf

            profiles=(
              undergraduate-capstone
              specialization-capstone
              masters-thesis
              doctoral-thesis
              research-project
              anonymized-research-project
              scientific-article
            )

            for profile in "${profiles[@]}"; do
              dir="$review/$profile"
              tex="$profile.tex"
              echo "Building $profile from exact candidate $candidate_sha..."
              cd "$dir"
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$tex"
              if [[ -s "$profile.bcf" ]] && grep -q '<bcf:datasource' "$profile.bcf"; then
                biber "$profile"
              fi
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$tex"
              pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$tex"
              test -s "$profile.pdf"
              pdfinfo "$profile.pdf" > "$profile.pdfinfo.txt"
              pdffonts "$profile.pdf" > "$profile.pdffonts.txt"
              pdftotext -layout "$profile.pdf" "$profile.txt"
              pdftoppm -png -f 1 -singlefile -r 110 "$profile.pdf" "$profile-preview"

              if grep -Eq 'Overfull \\[hv]box|There were undefined references|Rerun to get cross-references right|Please \(re\)run Biber' "$profile.log"; then
                echo "Recognized warning/overflow gate failed for $profile"
                grep -En 'Overfull \\[hv]box|There were undefined references|Rerun to get cross-references right|Please \(re\)run Biber' "$profile.log" || true
                exit 1
              fi
              cd "$root"

              pdf_path="artifacts/v3-profile-review/$profile/$profile.pdf"
              sh released/tests/integration/font-embedding.sh "$pdf_path"
              UFC_PDFA_NEGATIVE_VALIDATION=0 sh released/tests/integration/pdfa.sh "$pdf_path"

              pages_dir="$(mktemp -d)"
              pdfseparate "$pdf_path" "$pages_dir/page-%d.pdf"
              for page in "$pages_dir"/page-*.pdf; do
                size_line="$(pdfinfo "$page" | grep '^Page size:')"
                python3 - "$size_line" "$profile" <<'PY'
            import re
            import sys

            line, profile = sys.argv[1], sys.argv[2]
            match = re.search(r'([0-9.]+) x ([0-9.]+) pts', line)
            if not match:
                raise SystemExit(f'A4 gate could not parse page size for {profile}: {line}')
            width, height = map(float, match.groups())
            expected = (595.276, 841.89)
            tolerance = 1.8
            if abs(width - expected[0]) > tolerance or abs(height - expected[1]) > tolerance:
                raise SystemExit(f'A4 gate failed for {profile}: {width} x {height} pts')
            PY
              done
              rm -rf "$pages_dir"
              printf '%s\n' \
                "FINAL-PROFILE-PREFLIGHT profile=$profile source_sha=$candidate_sha a4=PASS pdfa_2b=PASS font_embedding=PASS recognized_warning_overflow=PASS"
            done

            python3 - <<'PY'
            import hashlib
            import json
            import re
            from pathlib import Path

            root = Path('artifacts/v3-profile-review')
            candidate_sha = '395899e1b2336ed268335d68e59e03452880c15e'
            profiles = [
                'undergraduate-capstone',
                'specialization-capstone',
                'masters-thesis',
                'doctoral-thesis',
                'research-project',
                'anonymized-research-project',
                'scientific-article',
            ]

            def sha256(path: Path) -> str:
                h = hashlib.sha256()
                with path.open('rb') as fh:
                    for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                        h.update(chunk)
                return h.hexdigest()

            manifest = {
                'candidate_source_sha': candidate_sha,
                'tag_state': 'pending-explicit-maintainer-approval',
                'engine': 'pdfLaTeX / TeX Live 2026',
                'profile_count': 7,
                'preflight': {
                    'a4': 'PASS',
                    'pdfa_2b': 'PASS',
                    'font_embedding': 'PASS',
                    'recognized_warning_overflow': 'PASS',
                },
                'profiles': [],
            }
            checksum_lines = []

            for profile in profiles:
                directory = root / profile
                source = directory / f'{profile}.tex'
                pdf = directory / f'{profile}.pdf'
                info = (directory / f'{profile}.pdfinfo.txt').read_text(encoding='utf-8', errors='replace')
                match = re.search(r'^Pages:\s+(\d+)\s*$', info, flags=re.MULTILINE)
                if not match:
                    raise SystemExit(f'Could not determine page count for {profile}')
                entry = {
                    'profile': profile,
                    'source': source.relative_to(root).as_posix(),
                    'source_sha256': sha256(source),
                    'pdf': pdf.relative_to(root).as_posix(),
                    'pdf_sha256': sha256(pdf),
                    'pages': int(match.group(1)),
                    'preview': (directory / f'{profile}-preview.png').relative_to(root).as_posix(),
                    'build_log': (directory / f'{profile}.log').relative_to(root).as_posix(),
                    'preflight': {
                        'a4': 'PASS',
                        'pdfa_2b': 'PASS',
                        'font_embedding': 'PASS',
                        'recognized_warning_overflow': 'PASS',
                    },
                }
                manifest['profiles'].append(entry)

                for path in sorted(directory.iterdir()):
                    if path.is_file() and path.suffix in {'.tex', '.bib', '.pdf', '.png', '.txt'}:
                        checksum_lines.append(f'{sha256(path)}  {path.relative_to(root).as_posix()}')

            if len(manifest['profiles']) != 7:
                raise SystemExit('Expected exactly seven profile entries')

            (root / 'MANIFEST.json').write_text(
                json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
                encoding='utf-8',
                newline='\n',
            )
            (root / 'SHA256SUMS').write_text(
                '\n'.join(checksum_lines) + '\n',
                encoding='utf-8',
                newline='\n',
            )
            PY

            test "$(find artifacts/v3-profile-review -mindepth 2 -maxdepth 2 -name '*.pdf' | wc -l)" -eq 7
            test "$(find artifacts/v3-profile-review -mindepth 2 -maxdepth 2 -name '*.tex' | grep -E '/(undergraduate-capstone|specialization-capstone|masters-thesis|doctoral-thesis|research-project|anonymized-research-project|scientific-article)\.tex$' | wc -l)" -eq 7

      - name: Publish review summary
        shell: bash
        run: |
          {
            echo '## v3.0.0 exact-candidate all-profile visual review bundle'
            echo
            echo '- Candidate source: `395899e1b2336ed268335d68e59e03452880c15e`'
            echo '- Tag state: **pending explicit maintainer approval**'
            echo '- Canonical profiles built: **7/7**'
            echo '- Automated preflight: A4 + PDF/A-2b + embedded fonts + recognized warning/overflow checks.'
            echo '- Bundle contains each exact `.tex`, final PDF, build log, extracted text, first-page PNG preview and SHA-256 manifest.'
            echo '- This is review evidence only; it does not authorize tag replacement or CTAN submission without explicit maintainer acceptance.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all-profile review bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v3.0.0-all-profile-visual-review-${{ github.run_id }}
          path: artifacts/v3-profile-review/**
          retention-days: 30
          if-no-files-found: error
