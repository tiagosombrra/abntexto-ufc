name: B7-C1 last residual patch

on:
  push:
    branches:
      - 'fix/v3-r1-b7c1-clean-runner-contract'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[b7c1-last-residuals]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/v3-r1-b7c1-clean-runner-contract
      - name: Repair final residual consumers
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/checks/normative_reference_semantics.py')
          source = path.read_text(encoding='utf-8')
          old = 'BIB_FIXTURE = ROOT / "tests" / "fixtures" / "referencias-6023-2025.bib"'
          new = 'BIB_FIXTURE = ROOT / "tests" / "fixtures" / "references-6023-2025.bib"'
          if source.count(old) != 1:
              raise SystemExit(f'{path}: expected one stale fixture path, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')

          markers = {
              'UFCFRONTMATTEREPIGRAPHSHORTONE': 'FMEPISHORTONE',
              'UFCFRONTMATTEREPIGRAPHSHORTTWO': 'FMEPISHORTTWO',
              'UFCFRONTMATTEREPIGRAPHSHORTTHREE': 'FMEPISHORTTHREE',
          }
          for relative in (
              'standards/frontmatter-scenarios.json',
              'tests/fixtures/frontmatter/epigraph-short-validation-fixture.tex',
          ):
              target = Path(relative)
              text = target.read_text(encoding='utf-8')
              for old_marker, new_marker in markers.items():
                  if text.count(old_marker) != 1:
                      raise SystemExit(f'{target}: expected one {old_marker}, found {text.count(old_marker)}')
                  text = text.replace(old_marker, new_marker)
              target.write_text(text, encoding='utf-8')
      - name: Validate patch
        run: |
          python3 -m py_compile tests/checks/normative_reference_semantics.py tests/checks/frontmatter_evidence.py
          python3 -m json.tool standards/frontmatter-scenarios.json >/dev/null
          test -f tests/fixtures/references-6023-2025.bib
          grep -F 'references-6023-2025.bib' tests/checks/normative_reference_semantics.py
          grep -F 'FMEPISHORTONE' standards/frontmatter-scenarios.json
          grep -F 'FMEPISHORTONE' tests/fixtures/frontmatter/epigraph-short-validation-fixture.tex
          ! grep -R -F 'UFCFRONTMATTEREPIGRAPHSHORT' standards/frontmatter-scenarios.json tests/fixtures/frontmatter/epigraph-short-validation-fixture.tex
          git diff --check
      - name: Commit patch and remove executor
        run: |
          git rm .github/workflows/b7c1-last-residuals.yml
          git add tests/checks/normative_reference_semantics.py standards/frontmatter-scenarios.json tests/fixtures/frontmatter/epigraph-short-validation-fixture.tex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[b7c1-last-residuals] test: repair final clean-runner consumers'
          git push origin HEAD:fix/v3-r1-b7c1-clean-runner-contract
