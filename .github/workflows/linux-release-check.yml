name: Linux release check

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - AGENTS.md
      - LICENSE
      - .gitignore
      - 'docs/**'
      - 'release/history/v3/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - release/v3-release-candidate.json
      - .github/workflows/linux-release-check.yml
      - tools/ci/validate-release-reference.py
      - tools/ci/validate-release-assets.py
      - tools/ci/validate-pkgcheck-download.py
      - tools/ci/certify-ctan-package.sh
      - tools/ci/render-release-summary.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-check:
    name: Linux release check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read release version
        id: release-version
        shell: bash
        run: echo "version=$(make --no-print-directory version)" >> "$GITHUB_OUTPUT"

      - name: Fetch current CTAN pkgcheck archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-downloads artifacts/validation
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            --proto '=https' --tlsv1.2 \
            https://mirrors.ctan.org/support/pkgcheck.zip \
            --output .ci-downloads/pkgcheck.zip
          python3 tools/ci/validate-pkgcheck-download.py
          sha256sum .ci-downloads/pkgcheck.zip | tee artifacts/validation/pkgcheck-download.sha256

      - name: Run repository release contract, build assets and execute CTAN pkgcheck
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli curl ca-certificates unzip
            node --version
            docker --version
            # The TeX Live action executes inside a container over the runner checkout.
            # Trust only this mounted canonical checkout for Git provenance/tracked-file reads.
            git config --global --add safe.directory "$PWD"
            export SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT_SHA")"
            export RELEASE_VERSION="${{ steps.release-version.outputs.version }}"
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
            test "$(make --no-print-directory version)" = "$RELEASE_VERSION"
            make release-check

            # Validate the exact canonical-reference provenance produced by
            # the repository release gate for this source SHA.
            echo 'Validate canonical release reference provenance'
            python3 tools/ci/validate-release-reference.py

            make distribution-bundles
            (
              cd dist
              sha256sum -c SHA256SUMS
            )
            python3 tools/ci/validate-release-assets.py

            # Consume the host-fetched pkgcheck bytes and certify the exact
            # generated CTAN package plus release-review pairs.
            sh tools/ci/certify-ctan-package.sh

      - name: Publish validation summary
        if: always()
        shell: bash
        run: sh tools/ci/render-release-summary.sh >> "$GITHUB_STEP_SUMMARY"
      - name: Upload validation evidence
        if: always() && hashFiles('artifacts/validation/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-validation-${{ github.run_id }}
          path: artifacts/validation/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload canonical reference PDF
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v${{ steps.release-version.outputs.version }}-canonical-reference-${{ github.run_id }}
          path: |
            artifacts/validation/release-reference-pdf.pdf
            artifacts/validation/release-reference-reproducibility.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload seven-profile review pairs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v${{ steps.release-version.outputs.version }}-review-pairs-${{ github.run_id }}
          path: artifacts/release-review-pairs/**
          retention-days: 30
          if-no-files-found: error

      - name: Upload certified distribution assets
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v${{ steps.release-version.outputs.version }}-distribution-${{ github.run_id }}
          path: |
            dist/abntexto-ufc-${{ steps.release-version.outputs.version }}.zip
            dist/abntexto-ufc-template-${{ steps.release-version.outputs.version }}.zip
            dist/abntexto-ufc-overleaf-${{ steps.release-version.outputs.version }}.zip
            dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
