name: Linux release check

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - AGENTS.md
      - LICENSE
      - .gitignore
      - 'docs/**'
      - release/v3-roadmap.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-check:
    name: Linux release check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run repository release contract
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker.io
            node --version
            docker --version
            make release-check

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Linux release validation'
            echo
            echo '> This Linux gate is engineering evidence only. Final Windows/literal-font/PDF-A certification remains B8-owned.'
            echo
            if [[ -f artifacts/validation/validation-report.md ]]; then
              cat artifacts/validation/validation-report.md
            else
              echo 'No repository validation report was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always() && hashFiles('artifacts/validation/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-validation-${{ github.run_id }}
          path: artifacts/validation/**
          retention-days: 14
          if-no-files-found: error
