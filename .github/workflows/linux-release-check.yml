name: Linux release check

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - AGENTS.md
      - LICENSE
      - .gitignore
      - 'docs/**'
      - release/v3-roadmap.json
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - release/final-certification-candidate.json
      - release/v3-release-candidate.json
      - .github/workflows/linux-release-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-check:
    name: Linux release check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read release version
        id: release-version
        shell: bash
        run: echo "version=$(make --no-print-directory version)" >> "$GITHUB_OUTPUT"

      - name: Run repository release contract, build assets and execute CTAN pkgcheck
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli curl ca-certificates unzip
            node --version
            docker --version
            # The TeX Live action executes inside a container over the runner checkout.
            # Trust only this mounted canonical checkout for Git provenance/tracked-file reads.
            git config --global --add safe.directory "$PWD"
            export SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT_SHA")"
            export RELEASE_VERSION="${{ steps.release-version.outputs.version }}"
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
            test "$(make --no-print-directory version)" = "$RELEASE_VERSION"
            make release-check

            # R2 canonical-reference contract: the dedicated PDF must be the exact
            # reproducible output certified by release-reference-reproducibility.sh
            # for this candidate SHA, not an unrelated or manually copied PDF.
            echo 'Validate canonical release reference provenance'
            python3 - <<'PY'
            import hashlib
            import json
            import os
            from pathlib import Path

            pdf_path = Path("artifacts/validation/release-reference-pdf.pdf")
            evidence_path = Path("artifacts/validation/release-reference-reproducibility.json")
            if not pdf_path.is_file() or pdf_path.stat().st_size == 0:
                raise SystemExit("Canonical release reference PDF is missing or empty.")
            if not evidence_path.is_file():
                raise SystemExit("Canonical release reference reproducibility evidence is missing.")

            evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
            source_sha = os.environ["SOURCE_COMMIT_SHA"]
            if evidence.get("status") != "PASS":
                raise SystemExit("Canonical release reference evidence is not PASS.")
            if evidence.get("source_sha") != source_sha:
                raise SystemExit(
                    "Canonical release reference source SHA mismatch: "
                    f"expected {source_sha}, got {evidence.get('source_sha')}"
                )
            if evidence.get("canonical_source") != "template/main.tex":
                raise SystemExit("Canonical release reference source identity is not template/main.tex.")
            if evidence.get("canonical_output") != pdf_path.as_posix():
                raise SystemExit("Canonical release reference output identity is inconsistent.")
            if evidence.get("independent_clean_builds") != 2 or evidence.get("identical_sha256") is not True:
                raise SystemExit("Canonical release reference is not backed by two byte-identical clean builds.")

            digest = hashlib.sha256(pdf_path.read_bytes()).hexdigest()
            builds = evidence.get("builds") or []
            if len(builds) != 2 or any(build.get("sha256") != digest for build in builds):
                raise SystemExit("Canonical release reference PDF SHA-256 does not match both clean-build records.")

            expected_validation = {
                "font_embedding": "PASS",
                "portable_pdf_validator": "PASS",
                "pdfa_2b": "PASS",
                "unicode_extraction": "PASS",
            }
            measured_validation = evidence.get("validation") or {}
            for key, expected in expected_validation.items():
                if measured_validation.get(key) != expected:
                    raise SystemExit(f"Canonical release reference validation {key} is not {expected}.")

            print(
                "CANONICAL-REFERENCE-EVIDENCE status=PASS "
                f"source_sha={source_sha} sha256={digest} builds=2 "
                "font_embedding=PASS pdf_validator=PASS pdfa_2b=PASS unicode=PASS"
            )
            PY

            make distribution-bundles
            (
              cd dist
              sha256sum -c SHA256SUMS
            )
            python3 - <<'PY'
            import os
            from pathlib import Path

            root = Path("dist")
            version = os.environ["RELEASE_VERSION"]
            expected = {
                f"abntexto-ufc-{version}.zip",
                f"abntexto-ufc-template-{version}.zip",
                f"abntexto-ufc-overleaf-{version}.zip",
                "SHA256SUMS",
            }
            actual = {path.name for path in root.iterdir() if path.is_file()}
            if actual != expected:
                raise SystemExit(
                    "Release asset build failed: unexpected dist file set: "
                    + ", ".join(sorted(actual ^ expected))
                )
            PY

            # Fetch pkgcheck at execution time so this gate follows the version
            # currently published by CTAN instead of permanently pinning one release.
            mkdir -p artifacts/validation /tmp/ctan-pkgcheck /tmp/ctan-candidate
            curl --fail --location --retry 3 --retry-delay 2 \
              https://mirrors.ctan.org/support/pkgcheck.zip \
              --output /tmp/pkgcheck.zip
            unzip -q /tmp/pkgcheck.zip -d /tmp/ctan-pkgcheck

            # CTAN publishes target-named standalone binaries rather than a stable
            # bin/pkgcheck path. Prefer the documented Linux target name and retain
            # a conservative fallback for older archive layouts.
            PKGCHECK="$(find /tmp/ctan-pkgcheck -type f \
              \( -name 'pkgcheck-x86_64-unknown-linux-musl' -o -name 'pkgcheck' \) \
              -print -quit)"
            if [ -z "$PKGCHECK" ]; then
              for candidate in $(find /tmp/ctan-pkgcheck -type f -name 'pkgcheck-x86_64-unknown-linux-musl*' -print | sort); do
                case "$(basename "$candidate")" in
                  *.asc|*.sha*|*.sig|*.txt)
                    continue
                    ;;
                esac
                PKGCHECK="$candidate"
                break
              done
            fi
            if [ -z "$PKGCHECK" ]; then
              echo 'Current CTAN pkgcheck archive did not contain a supported Linux binary.'
              find /tmp/ctan-pkgcheck -maxdepth 4 -type f -printf '%P\n' | sort
              exit 1
            fi

            chmod +x "$PKGCHECK"
            "$PKGCHECK" --version > artifacts/validation/pkgcheck-version.txt 2>&1
            cat artifacts/validation/pkgcheck-version.txt
            sha256sum "dist/abntexto-ufc-$RELEASE_VERSION.zip" > artifacts/validation/pkgcheck-archive.sha256
            unzip -q "dist/abntexto-ufc-$RELEASE_VERSION.zip" -d /tmp/ctan-candidate
            if ! "$PKGCHECK" --no-colors -d /tmp/ctan-candidate/abntexto-ufc \
              > artifacts/validation/pkgcheck.log 2>&1; then
              cat artifacts/validation/pkgcheck.log
              echo 'CTAN pkgcheck failed.'
              exit 1
            fi
            cat artifacts/validation/pkgcheck.log
            printf '%s\n' \
              "FINAL-CERTIFICATION-EVIDENCE surface=ctan-pkgcheck status=PASS source_sha=$SOURCE_COMMIT_SHA archive=abntexto-ufc-$RELEASE_VERSION.zip" \
              | tee artifacts/validation/pkgcheck-evidence.txt

            # Produce the exact-SHA material for the mandatory human gate only
            # after the technical release and current CTAN pkgcheck gates pass.
            sh tests/integration/release-review-pairs.sh

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Linux release validation'
            echo
            echo '> This Linux gate is engineering evidence. The retained Windows/literal-font proof remains separately scope-controlled.'
            echo
            if [[ -f artifacts/validation/validation-report.md ]]; then
              cat artifacts/validation/validation-report.md
            else
              echo 'No repository validation report was produced.'
            fi
            echo
            echo '### Canonical reference PDF'
            if [[ -f artifacts/validation/release-reference-reproducibility.json ]]; then
              echo 'The full template/main.tex reference was built twice from this exact candidate, validated and retained as a dedicated artifact with source/hash provenance.'
            else
              echo 'Canonical reference PDF provenance was not produced.'
            fi
            echo
            echo '### CTAN pkgcheck'
            if [[ -f artifacts/validation/pkgcheck-version.txt ]]; then
              echo '```text'
              cat artifacts/validation/pkgcheck-version.txt
              echo '```'
            else
              echo 'pkgcheck version evidence was not produced.'
            fi
            if [[ -f artifacts/validation/pkgcheck.log ]]; then
              echo '```text'
              cat artifacts/validation/pkgcheck.log
              echo '```'
            else
              echo 'pkgcheck output was not produced.'
            fi
            echo
            echo '### Maintainer visual review'
            if [[ -f artifacts/release-review-pairs/manifest.json ]]; then
              echo 'Seven PDF/TeX profile pairs were generated from this exact candidate and passed automated preflight. Explicit maintainer visual approval remains pending.'
            else
              echo 'The seven-profile review-pair artifact was not produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always() && hashFiles('artifacts/validation/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-validation-${{ github.run_id }}
          path: artifacts/validation/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload canonical reference PDF
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v${{ steps.release-version.outputs.version }}-canonical-reference-${{ github.run_id }}
          path: |
            artifacts/validation/release-reference-pdf.pdf
            artifacts/validation/release-reference-reproducibility.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload seven-profile review pairs
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v${{ steps.release-version.outputs.version }}-review-pairs-${{ github.run_id }}
          path: artifacts/release-review-pairs/**
          retention-days: 30
          if-no-files-found: error

      - name: Upload certified distribution assets
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v${{ steps.release-version.outputs.version }}-distribution-${{ github.run_id }}
          path: |
            dist/abntexto-ufc-${{ steps.release-version.outputs.version }}.zip
            dist/abntexto-ufc-template-${{ steps.release-version.outputs.version }}.zip
            dist/abntexto-ufc-overleaf-${{ steps.release-version.outputs.version }}.zip
            dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
