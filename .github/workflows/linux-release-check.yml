name: Linux release check

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - AGENTS.md
      - LICENSE
      - .gitignore
      - 'docs/**'
      - release/v3-roadmap.json
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - release/final-certification-candidate.json
      - release/v3-release-candidate.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-release-check:
    name: Linux release check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository release contract and build certified assets
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli
            node --version
            docker --version
            # The TeX Live action executes inside a container over the runner checkout.
            # Trust only this mounted canonical checkout for Git provenance/tracked-file reads.
            git config --global --add safe.directory "$PWD"
            export SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT_SHA")"
            test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
            make release-check
            make distribution-bundles
            (
              cd dist
              sha256sum -c SHA256SUMS
            )
            python3 - <<'PY'
            from pathlib import Path

            root = Path("dist")
            expected = {
                "abntexto-ufc-3.0.0.zip",
                "abntexto-ufc-template-3.0.0.zip",
                "abntexto-ufc-overleaf-3.0.0.zip",
                "SHA256SUMS",
            }
            actual = {path.name for path in root.iterdir() if path.is_file()}
            if actual != expected:
                raise SystemExit(
                    "Release asset build failed: unexpected dist file set: "
                    + ", ".join(sorted(actual ^ expected))
                )
            PY

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Linux release validation'
            echo
            echo '> This Linux gate is engineering evidence only. Final Windows/literal-font/PDF-A certification remains Final Certification-owned.'
            echo
            if [[ -f artifacts/validation/validation-report.md ]]; then
              cat artifacts/validation/validation-report.md
            else
              echo 'No repository validation report was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload validation evidence
        if: always() && hashFiles('artifacts/validation/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-validation-${{ github.run_id }}
          path: artifacts/validation/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload certified distribution assets
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-v3.0.0-distribution-${{ github.run_id }}
          path: |
            dist/abntexto-ufc-3.0.0.zip
            dist/abntexto-ufc-template-3.0.0.zip
            dist/abntexto-ufc-overleaf-3.0.0.zip
            dist/SHA256SUMS
          retention-days: 30
          if-no-files-found: error
