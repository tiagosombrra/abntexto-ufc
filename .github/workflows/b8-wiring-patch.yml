name: B8 certification wiring patcher

on:
  push:
    branches:
      - fix/v3-r1-b8-windows-certification-wiring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/v3-r1-b8-windows-certification-wiring

      - name: Repair current Windows certification wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/integration/windows-font-pdfa.sh')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'Fontes Windows PDF/A: diretório ausente:': 'Windows font/PDF-A gate: directory not found:',
              'Fontes Windows PDF/A: comando ausente:': 'Windows font/PDF-A gate: required command not found:',
              'Fontes Windows PDF/A: $pdf não contém $pattern': 'Windows font/PDF-A gate: $pdf does not contain $pattern',
              'Fontes Windows PDF/A: $pdf contém fallback textual inesperado.': 'Windows font/PDF-A gate: $pdf contains an unexpected text-font fallback.',
              'Fontes Windows PDF/A: extração ausente/incorreta em $pdf: $marker': 'Windows font/PDF-A gate: text extraction missing/incorrect in $pdf: $marker',
              'Fontes Windows PDF/A: arquivo ausente:': 'Windows font/PDF-A gate: file not found:',
              'Fontes Windows PDF/A: certificando $family/$engine...': 'Windows font/PDF-A gate: certifying $family/$engine...',
              'sh tests/v2-font-embedding-check.sh "$pdf"': 'sh tests/integration/font-embedding.sh "$pdf"',
              'sh tests/v2-pdfa-check.sh "$pdf"': 'sh tests/integration/pdfa.sh "$pdf"',
              "echo 'Gate Windows: identidade literal, Unicode, embedding e PDF/A-2b concluídos.'": "echo 'Windows gate: literal font identity, Unicode extraction, embedding, and PDF/A-2b completed.'",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'windows-font-pdfa.sh: expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/integration/font-embedding.sh')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'pdf="${1:?uso: v2-font-embedding-check.sh arquivo.pdf}"': 'pdf="${1:?usage: font-embedding.sh file.pdf}"',
              'Fontes V2: PDF não encontrado:': 'Font embedding: PDF not found:',
              "echo 'Fontes V2: pdffonts não disponível.'": "echo 'Font embedding: pdffonts is not available.'",
              'Fontes V2: há fonte não incorporada, nenhuma fonte detectada ou linha não reconhecida em $pdf.': 'Font embedding: an unembedded font, no detected fonts, or an unrecognized pdffonts row was found in $pdf.',
              'Fontes V2 autocontidas (emb=yes): $pdf': 'Font embedding complete (emb=yes): $pdf',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'font-embedding.sh: expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          git rm -f .github/workflows/b8-wiring-patch.yml
          sh -n tests/integration/windows-font-pdfa.sh
          sh -n tests/integration/font-embedding.sh
          git diff --check
          make static-check

          git config user.name "Tiago Sombra"
          git config user.email "tiagosombrra@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: repair B8 Windows certification wiring"
          git push origin HEAD:fix/v3-r1-b8-windows-certification-wiring
