name: R1 closeout R2 entry temporary

on:
  push:
    branches:
      - docs/v3-r1-b8-closeout-r2-entry

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b8-closeout-r2-entry
          fetch-depth: 0

      - name: Reconcile machine and human control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          CANDIDATE = '9b1752565ac217c04ffa22a9ef272cdf078af380'
          B8_TOOLING = 'd2c24fc85351a410ea1f0101887b2a5228077741'
          WINDOWS_RUN = 33649620219
          WINDOWS_JOB = 100313006509
          WINDOWS_ARTIFACT = 9854415113
          WINDOWS_DIGEST = '138b9a4e3c2969db33c512bec91b323cba339bb6ae18afc76786b59d2e0f7a21'
          INSPECTION_RUN = 33655108349
          INSPECTION_JOB = 100331601354
          EVIDENCE_ARTIFACT = 9856387211
          EVIDENCE_DIGEST = '256c96e1c32d839b5b3a3e55f7a355913b7b217609c2f6e2d27104e7e12ffeeb'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one literal match, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, got {count}')
              p.write_text(text2, encoding='utf-8')

          # Machine authority: preserve all accumulated R1 evidence and mutate only current state.
          road_path = Path('release/v3-roadmap.json')
          road = json.loads(road_path.read_text(encoding='utf-8'))
          road['updated_at'] = '2026-09-02'
          road['status'] = 'ACTIVE'
          road['phase'] = 'V3-R2'
          road['stage'] = 'R2-A'
          road['stage_name'] = 'runtime/API ownership inventory and migration plan'
          road['last_certified_clean_checkpoint_sha'] = CANDIDATE
          road['r1_status'] = 'DONE'

          b8 = road['blocks']['R1-BLOCK-8']
          b8.update({
              'status': 'DONE',
              'b8_status': 'DONE',
              'certified_candidate_sha': CANDIDATE,
              'tooling_checkpoint_sha': B8_TOOLING,
              'b8_a_status': 'DONE',
              'b8_a_pr': 230,
              'b8_b_status': 'DONE',
              'b8_b_strict_poc_run_id': 33609817951,
              'b8_c_status': 'DONE',
              'b8_d_status': 'DONE',
              'closure_date': '2026-09-02',
              'final_certification': {
                  'candidate_sha': CANDIDATE,
                  'windows_source_run_id': WINDOWS_RUN,
                  'windows_job_id': WINDOWS_JOB,
                  'windows_matrix_result': 'PASS',
                  'windows_artifact_id': WINDOWS_ARTIFACT,
                  'windows_artifact_digest': WINDOWS_DIGEST,
                  'linux_final_inspection_run_id': INSPECTION_RUN,
                  'linux_final_inspection_job_id': INSPECTION_JOB,
                  'linux_final_inspection_result': 'PASS',
                  'evidence_artifact_id': EVIDENCE_ARTIFACT,
                  'evidence_artifact_digest': EVIDENCE_DIGEST,
                  'matrix': [
                      'times/pdflatex', 'arial/pdflatex',
                      'times/lualatex', 'arial/lualatex'
                  ],
                  'literal_text_family_passed': True,
                  'math_font_policy_separated_from_text_family': True,
                  'pdftex_math_policy': 'NEW-TX-MATH',
                  'unicode_extraction_passed': True,
                  'font_embedding_passed': True,
                  'pdfa_2b_passed': True,
                  'false_positive_reconciled': 'TeXGyreTermesX-Regular is a legitimate newtxmath component in pdfLaTeX, not institutional text fallback',
                  'runtime_api_changed': False,
                  'normative_semantics_changed': False,
                  'proof_state_changed': False,
                  'proprietary_fonts_redistributed': False,
                  'temporary_workflows_present': False
              },
              'operational_issue_close_after_control_plane_merge': 227
          })
          road['r2'] = {
              'status': 'ACTIVE',
              'stage': 'R2-A',
              'stage_name': 'runtime/API ownership inventory and migration plan',
              'operational_issue': 232,
              'entry_candidate_sha': CANDIDATE,
              'entry_scope': [
                  'inventory remaining project-owned Portuguese runtime/API surface',
                  'classify upstream non-English identifiers separately',
                  'map public-api.def forwarding aliases to direct responsibility owners',
                  'define bounded migration lots and atomic producer/consumer/test/template changes'
              ],
              'constraints': [
                  'inventory and classification before behavioral migration',
                  'preserve rendered document behavior during ownership mapping',
                  'preserve normative rule IDs values tolerances locators and proof state without new evidence',
                  'do not add another runtime compatibility layer',
                  'do not perform actual CTAN submission',
                  'do not redistribute proprietary Microsoft fonts'
              ]
          }
          road['next_action'] = (
              'Execute V3-R2 / R2-A through issue #232. Inventory and classify every remaining '
              'project-owned Portuguese runtime/API surface and every forwarding mapping in '
              'abntexto-ufc/public-api.def, assign direct behavior owners, and define bounded '
              'migration lots before changing runtime behavior. Preserve rendered semantics and '
              'normative proof state; do not perform actual CTAN submission or redistribute proprietary fonts.'
          )
          road_path.write_text(json.dumps(road, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Activate the already-tracked API migration contract for the inventory stage.
          api_path = Path('release/v3-api-migration.json')
          api = json.loads(api_path.read_text(encoding='utf-8'))
          api['phase'] = 'V3-R2'
          api['status'] = 'ACTIVE_R2_A_INVENTORY'
          api['activated_at'] = '2026-09-02'
          api['operational_issue'] = 232
          api['entry_certified_r1_candidate_sha'] = CANDIDATE
          api['current_stage'] = 'R2-A'
          api['current_stage_goal'] = 'inventory runtime/API ownership and define bounded migration lots before behavioral changes'
          api_path.write_text(json.dumps(api, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # README current-status sections.
          regex_once(
              'README.md',
              r'## Current v3 status\n\n.*?\n\nSee `docs/ROADMAP-V3\.0\.0\.md`',
              '''## Current v3 status

**V3-R1 is DONE. V3-R2 is ACTIVE in R2-A — runtime/API ownership inventory and migration plan, tracked by issue #232.**

The certified R1 candidate is `9b1752565ac217c04ffa22a9ef272cdf078af380`. Hosted Windows run `33649620219` built the complete `template/main.tex` matrix for Times New Roman/Arial × pdfLaTeX/LuaLaTeX. Final Linux inspection run `33655108349` passed literal institutional text-family identity, the expected independent math-font policy, Unicode extraction, full font embedding and PDF/A-2b for all four artifacts. No runtime/API, normative semantics or proof-state change was required, and no proprietary Microsoft font was redistributed.

R2-A starts with inventory/classification only. The transitional `abntexto-ufc/public-api.def` forwarding layer and the remaining Portuguese project-owned behavior owners must be mapped to direct module ownership before any runtime migration is implemented.

See `docs/ROADMAP-V3.0.0.md`'''
          )
          replace_once(
              'README.md',
              'Project-owned technical surfaces use English. Brazilian academic content may remain in Portuguese where appropriate. During R1 the current runtime API remains unchanged while engineering surfaces are rebaselined; direct runtime/API internationalization belongs to R2.',
              'Project-owned technical surfaces use English. Brazilian academic content may remain in Portuguese where appropriate. R1 preserved the current runtime API while rebuilding and certifying the foundation. R2 is now active and owns the direct runtime/API internationalization; R2-A performs ownership inventory and migration planning before behavioral changes.'
          )
          regex_once(
              'README.md',
              r'R1-BLOCK-8 is ACTIVE through issue #227\..*?complete `template/main\.tex` candidate from the canonical merged B8 tooling checkpoint\.',
              '''R1-BLOCK-8 is DONE. The complete candidate was built on hosted Windows in run `33649620219`; all four Times New Roman/Arial × pdfLaTeX/LuaLaTeX builds passed. Final Linux inspection run `33655108349` then passed literal text-family identity, the engine-appropriate independent math-font policy, Unicode extraction, embedding and PDF/A-2b. The earlier `TeXGyreTermesX-Regular` finding was classified correctly as part of the pdfLaTeX `newtxmath` stack rather than text-family fallback. Final evidence artifact `9856387211` has digest `sha256:256c96e1c32d839b5b3a3e55f7a355913b7b217609c2f6e2d27104e7e12ffeeb`. V3-R2/R2-A is now the active work through issue #232.'''
          )

          # Bootstrap rules.
          regex_once(
              'AGENTS.md',
              r'- R1-BLOCK-8 is ACTIVE via issue #227\..*?- Do not perform actual CTAN submission or V3-R2 runtime/API migration while R1-BLOCK-8 remains active\.',
              '''- R1-BLOCK-8 is DONE. The certified R1 candidate is `9b1752565ac217c04ffa22a9ef272cdf078af380`.
- Full candidate Windows run `33649620219` passed all four Times New Roman/Arial × pdfLaTeX/LuaLaTeX builds. Final Linux inspection run `33655108349` passed literal text-family identity, expected independent math-font policy, Unicode extraction, embedding and PDF/A-2b; final evidence artifact ID `9856387211` has digest `sha256:256c96e1c32d839b5b3a3e55f7a355913b7b217609c2f6e2d27104e7e12ffeeb`.
- V3-R2 is ACTIVE in R2-A via issue #232. R2-A is inventory/classification and migration planning: map remaining Portuguese project-owned runtime/API surfaces and `public-api.def` forwarding aliases to direct owners before behavioral migration.
- `public-api.def` is transitional R2 debt. The final v3 runtime must implement canonical public commands directly in responsibility-owning modules and must not retain removed Portuguese v2 project API through runtime aliases.
- Preserve rendered behavior and normative rule IDs, values, tolerances, locators and proof state during R2 ownership inventory unless explicit new evidence authorizes a normative change.
- Heavy Windows/font, Overleaf, PDF/A, distribution/CTAN, and full multi-engine jobs are candidate/certification work, not default cheap checks.
- Do not rerun completed checks unless current-state validation requires it.
- Do not redistribute proprietary Microsoft fonts.
- Do not perform actual CTAN submission during R2-A.'''
          )

          # Roadmap headline/table and closeout sections.
          replace_once(
              'docs/ROADMAP-V3.0.0.md',
              '**V3-R1 ACTIVE — R1-BLOCK-8 final certification in progress.**',
              '**V3-R1 DONE. V3-R2 ACTIVE — R2-A runtime/API ownership inventory and migration planning.**'
          )
          replace_once(
              'docs/ROADMAP-V3.0.0.md',
              '**R1-S0 DONE → R1-S1 DONE → R1-S2 DONE → R1-B1 DONE → R1-B2 DONE → R1-B3 DONE → R1-B4 DONE → R1-B5 DONE → R1-B6 DONE → R1-B7 DONE → R1-B8 ACTIVE → R2+ BLOCKED**',
              '**R1-S0 DONE → R1-S1 DONE → R1-S2 DONE → R1-B1 DONE → R1-B2 DONE → R1-B3 DONE → R1-B4 DONE → R1-B5 DONE → R1-B6 DONE → R1-B7 DONE → R1-B8 DONE → R2-A ACTIVE → R2-B+ PENDING**'
          )
          replace_once('docs/ROADMAP-V3.0.0.md', 'B8 operational issue: #227.', 'R1-B8 closure issue: #227.\n\nActive R2-A issue: #232.')
          replace_once(
              'docs/ROADMAP-V3.0.0.md',
              'The machine state remains correctly at `R1-BLOCK-8 / ACTIVE`; this document records additional B8 progress without prematurely closing the block.',
              'The machine state now records `V3-R2 / R2-A / ACTIVE`. R1-BLOCK-8 is fully certified and closed at product candidate `9b1752565ac217c04ffa22a9ef272cdf078af380`.'
          )
          replace_once(
              'docs/ROADMAP-V3.0.0.md',
              '| R1-B8 | ACTIVE | PR #230 merged at `d2c24fc85351a410ea1f0101887b2a5228077741` | Strict Windows literal-font POC certified | Certify complete `template/main.tex` candidate from canonical merge SHA; reconcile final control plane; close #227 |\n| V3-R2 | BLOCKED | — | Runtime/API internationalization and Portuguese project API migration | Starts only after R1-B8 closes |',
              '| R1-B8 | DONE | candidate `9b1752565ac217c04ffa22a9ef272cdf078af380` | Complete Windows matrix + final Linux literal-font/math-policy/Unicode/embedding/PDF-A-2b certification passed | None |\n| V3-R2 / R2-A | ACTIVE | issue #232 | Runtime/API ownership inventory and bounded migration planning | Complete inventory/classification before first behavioral migration lot |'
          )
          regex_once(
              'docs/ROADMAP-V3.0.0.md',
              r'### B8-C — Full candidate certification\n\n.*?\n\n### B8-D — Final closeout and R2 handoff\n\n.*?\n\n## Immediate action\n\n.*\Z',
              '''### B8-C — Full candidate certification

**DONE.** Canonical candidate `9b1752565ac217c04ffa22a9ef272cdf078af380` was certified without runtime changes.

Windows source run **`33649620219`** passed the complete strict `template/main.tex` matrix for Times New Roman/Arial × pdfLaTeX/LuaLaTeX and published artifact `9854415113` (`sha256:138b9a4e3c2969db33c512bec91b323cba339bb6ae18afc76786b59d2e0f7a21`).

The first Linux inspection correctly exposed an over-broad assertion: `TeXGyreTermesX-Regular` appears in pdfLaTeX mathematical content as part of `newtxmath`, including the Arial candidate, so it is not institutional text-family fallback. The corrected inspection therefore certifies text-family identity independently from the math-font policy.

Final inspection run **`33655108349` SUCCESS** passed all four artifacts for literal institutional text-family identity, expected engine-specific math-font policy, Unicode extraction, `emb=yes`, and PDF/A-2b. Evidence artifact `9856387211` has digest `sha256:256c96e1c32d839b5b3a3e55f7a355913b7b217609c2f6e2d27104e7e12ffeeb`.

No runtime/API, normative semantics, locator/tolerance, proof-state, or proprietary-font distribution change occurred.

### B8-D — Final closeout and R2 handoff

**DONE.** Temporary B8 executors were removed, the machine/human control plane was reconciled, issue #227 is the completed R1 closure record, and R2-A issue #232 was opened as the explicit next work item.

## V3-R2 — Runtime/API internationalization

**ACTIVE — R2-A.** The first R2 lot is intentionally inventory/classification only. It must map every remaining project-owned Portuguese public key, command, environment and internal behavior owner, distinguish upstream non-English integration boundaries, and map each `public-api.def` forwarding alias to its direct responsibility-owning module.

`release/v3-api-migration.json` is now the active migration contract. `public-api.def` is transitional R2 debt and must disappear after direct ownership is absorbed; removed Portuguese v2 project API is not retained through runtime aliases.

R2-A exit condition: no API/ownership ambiguity remains before the first behavioral migration lot.

## Immediate action

Execute **V3-R2 / R2-A through issue #232**. Inventory and classify runtime/API ownership first; then define bounded producer/consumer/test/template migration lots. Do not perform blind global replacement, normative semantic changes without new evidence, proprietary font redistribution, or actual CTAN submission.'''
          )

          # Handoff: convert from B8 continuation to R2 entry.
          replace_once('docs/HANDOFF-V3.0.0.md', '- Phase: **V3-R1 ACTIVE**.', '- Phase: **V3-R2 ACTIVE**.')
          replace_once('docs/HANDOFF-V3.0.0.md', '- Active implementation stage: **R1-BLOCK-8 — Final R1 Certification**.', '- Active implementation stage: **R2-A — Runtime/API ownership inventory and migration plan**.')
          replace_once('docs/HANDOFF-V3.0.0.md', '- Active B8 issue: **#227 — final R1 certification**.', '- R1 closure issue: **#227 — final R1 certification (completed)**.\n- Active R2-A issue: **#232 — runtime/API ownership inventory and migration plan**.')
          replace_once('docs/HANDOFF-V3.0.0.md', 'The machine state remains correctly at **V3-R1 / R1-BLOCK-8 / ACTIVE**. The additional evidence below advances B8 but does not close it.', 'The machine state is **V3-R2 / R2-A / ACTIVE**. R1-BLOCK-8 is fully certified at candidate `9b1752565ac217c04ffa22a9ef272cdf078af380`.')
          replace_once('docs/HANDOFF-V3.0.0.md', '| R1-B8 | ACTIVE | strict POC/tooling path merged through `d2c24fc85351a410ea1f0101887b2a5228077741`; full candidate certification pending |', '| R1-B8 | DONE | full candidate `9b1752565ac217c04ffa22a9ef272cdf078af380`; Windows run `33649620219`; final inspection `33655108349` |')
          regex_once(
              'docs/HANDOFF-V3.0.0.md',
              r'### Remaining B8 work\n\n.*?\n\n## Hard boundaries for the next session\n\n.*?\n\n## Immediate action\n\n.*\Z',
              '''### Final B8 certification

R1-BLOCK-8 is **DONE**. Windows run `33649620219` built the complete Times New Roman/Arial × pdfLaTeX/LuaLaTeX `template/main.tex` matrix. Final Linux inspection run `33655108349` passed literal institutional text-family identity, the correct independent math-font policy, Unicode extraction, embedding, and PDF/A-2b for all four PDFs.

Final evidence artifact: `b8-final-certification-evidence`, ID `9856387211`, digest `sha256:256c96e1c32d839b5b3a3e55f7a355913b7b217609c2f6e2d27104e7e12ffeeb`.

The earlier `TeXGyreTermesX-Regular` flag was a checker false positive: it is part of the pdfLaTeX `newtxmath` stack, not a substitution for Times New Roman/Arial text. The corrected inspection separates institutional text identity from math-font policy.

No runtime/API, normative semantics or proof-state change was required. No proprietary Microsoft font was redistributed. Temporary certification/inspection workflows were removed.

## V3-R2 / R2-A current state

Issue #232 is the active work item. R2-A must inventory and classify the remaining Portuguese project-owned runtime/API surface and every `public-api.def` forwarding alias, assign direct module owners and define bounded migration lots before behavior is changed.

The existing `release/v3-api-migration.json` contract is active for this work. The architectural target remains one canonical English project API with direct responsibility ownership; removed Portuguese v2 project API is not retained by aliases.

## Hard boundaries for the next session

- Inventory/classify before changing runtime behavior.
- Do not use blind global replacement; producers, consumers, tests, template and documentation move atomically by bounded lot.
- Preserve rendered behavior during ownership mapping.
- Preserve normative rule IDs, expected values, tolerances, locators and proof state unless explicit new evidence authorizes a change.
- Keep genuine upstream non-English identifiers only at explicit integration boundaries.
- Do not redistribute proprietary Microsoft fonts.
- Do not perform or claim actual CTAN submission/acceptance during R2-A.
- Do not rerun completed heavy certification gates without current-state need.

## Immediate action

Execute **R2-A issue #232**: produce the complete runtime/API ownership inventory and migration-lot plan, starting with `abntexto-ufc/public-api.def` and its current Portuguese behavior owners.'''
          )

          # Architecture and CTAN release guidance.
          replace_once('docs/ARCHITECTURE.md', 'Updated: 2026-09-01', 'Updated: 2026-09-02')
          replace_once(
              'docs/ARCHITECTURE.md',
              'R1-BLOCK-7 is DONE. The permanent orchestration surface is exactly `Static contract`, `Linux integration`, and `Linux release check`, each delegating to its repository-owned entry point (`make static-check`, `make check`, and `make release-check`). B7-D confirmed read-only permissions, immutable action pins, bounded concurrency, stable status semantics, and zero temporary workflow residue. The current `Stable branches` ruleset has no required-status rule; the recorded recommendation is to require `Static contract` and `Linux integration`, while `Linux release check` remains a post-merge/manual release gate. R1-BLOCK-8 is ACTIVE via issue #227 and owns final Windows/literal-font/PDF-A certification.',
              'R1-BLOCK-7 and R1-BLOCK-8 are DONE. The permanent orchestration surface is exactly `Static contract`, `Linux integration`, and `Linux release check`, each delegating to its repository-owned entry point (`make static-check`, `make check`, and `make release-check`). B7-D confirmed read-only permissions, immutable action pins, bounded concurrency, stable status semantics, and zero temporary workflow residue. The current `Stable branches` ruleset has no required-status rule; the recorded recommendation is to require `Static contract` and `Linux integration`, while `Linux release check` remains a post-merge/manual release gate. B8 certified the complete candidate `9b1752565ac217c04ffa22a9ef272cdf078af380` with the Times New Roman/Arial × pdfLaTeX/LuaLaTeX Windows matrix and final Linux text-family/math-policy/Unicode/embedding/PDF-A-2b inspection. V3-R2 is now active: `public-api.def` is transitional debt to be removed after canonical public behavior is absorbed directly by responsibility-owning modules.'
          )
          replace_once(
              'docs/CTAN-RELEASE.md',
              'R1-BLOCK-7 is complete. Its Linux result is an engineering gate, not final release certification. B7-D confirmed the permanent workflow inventory and recorded `Static contract` plus `Linux integration` as the recommended required PR checks; `Linux release check` remains post-merge/manual. R1-BLOCK-8 is now ACTIVE via issue #227 for literal Times New Roman/Arial identity and final Windows/font/PDF-A certification. CTAN packaging and current `pkgcheck` validation remain separate release procedures below. Validation evidence under `artifacts/validation/` is not a distribution artifact and must not be inserted into public bundles.',
              'R1-BLOCK-7 and R1-BLOCK-8 are complete. B7-D confirmed the permanent workflow inventory and recorded `Static contract` plus `Linux integration` as the recommended required PR checks; `Linux release check` remains post-merge/manual. B8 certified complete candidate `9b1752565ac217c04ffa22a9ef272cdf078af380`: Windows run `33649620219` passed Times New Roman/Arial × pdfLaTeX/LuaLaTeX, and final Linux inspection run `33655108349` passed literal text-family identity, expected math-font policy, Unicode extraction, embedding and PDF/A-2b. This engineering certification is not CTAN acceptance. CTAN packaging and current `pkgcheck` validation remain separate release procedures below. Validation evidence under `artifacts/validation/` or B8 evidence artifacts is not a distribution artifact and must not be inserted into public bundles.'
          )
          replace_once(
              'docs/CTAN-RELEASE.md',
              '3. Complete the separate B8 Windows/literal-font/PDF-A certification required for the release candidate.',
              '3. Confirm that the intended release commit is still covered by, or has proportionally re-established, the completed Windows/literal-font/PDF-A certification baseline from R1-BLOCK-8.'
          )

          for path in ('release/v3-roadmap.json', 'release/v3-api-migration.json'):
              json.loads(Path(path).read_text(encoding='utf-8'))
          PY

          python3 -m json.tool release/v3-roadmap.json >/dev/null
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          git diff --check

      - name: Remove temporary executor and commit closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r1-closeout-r2-entry-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close R1 certification and activate R2-A'
          git push origin HEAD:docs/v3-r1-b8-closeout-r2-entry
