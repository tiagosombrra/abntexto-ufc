name: R1 closeout R2 entry temporary

on:
  push:
    branches:
      - docs/v3-r1-b8-closeout-r2-entry

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b8-closeout-r2-entry
          fetch-depth: 0

      - name: Reconcile control plane
        run: python3 tools/r1_closeout_r2_entry_temp.py

      - name: Validate closeout documents
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          git diff --check

      - name: Remove temporary executor and commit closeout
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r1-closeout-r2-entry-temp.yml
          rm -f tools/r1_closeout_r2_entry_temp.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: close R1 certification and activate R2-A'
          git push origin HEAD:docs/v3-r1-b8-closeout-r2-entry
