name: R1 front matter rewrite retry

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-frontmatter-rewrite-retry.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Apply missing duplex mappings and reuse audited executor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/duplex-frontmatter.sh')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'tests/normativa/pretextuais-frente-verso.tex',
              'tests/documents/frontmatter-double-sided.tex',
          )
          text = text.replace(
              'tests/v2-section-primary-recto-duplex-evidence-check.sh',
              'tests/integration/section-primary-recto-duplex-evidence.sh',
          )
          path.write_text(text, encoding='utf-8')

          source = Path('.github/workflows/r1-frontmatter-rewrite.yml').read_text(encoding='utf-8').splitlines()
          marker = '        run: |'
          start = source.index(marker) + 1
          body = []
          for line in source[start:]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/r1-frontmatter-rewrite.sh').write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          bash /tmp/r1-frontmatter-rewrite.sh
