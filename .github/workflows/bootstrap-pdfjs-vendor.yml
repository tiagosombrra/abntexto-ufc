name: Bootstrap pinned PDF.js vendor

on:
  push:
    branches:
      - feat/web-lite-vendored-pdfjs

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/web-lite-vendored-pdfjs
          fetch-depth: 0

      - name: Import verified PDF.js 6.2.108 generic runtime
        shell: bash
        env:
          PDFJS_VERSION: "6.2.108"
          PDFJS_TAG_COMMIT: "0365cbde028bd92e58f2dab1bb70cd30ac7acfd7"
          PDFJS_RELEASE_ID: "361333612"
          PDFJS_ASSET_ID: "493114690"
          PDFJS_ASSET_SHA256: "7bf642d59582b475e8c48447da9b02b0108fad9742d7c2a35cb4ed6dd45e95ba"
          PDFJS_ASSET_SIZE: "6296688"
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          asset="$tmp/pdfjs-${PDFJS_VERSION}-dist.zip"
          url="https://github.com/mozilla/pdf.js/releases/download/v${PDFJS_VERSION}/pdfjs-${PDFJS_VERSION}-dist.zip"

          curl --fail --location --retry 3 --output "$asset" "$url"
          echo "$PDFJS_ASSET_SHA256  $asset" | sha256sum --check -
          test "$(stat -c %s "$asset")" = "$PDFJS_ASSET_SIZE"

          mkdir "$tmp/extract"
          unzip -q "$asset" -d "$tmp/extract"

          mapfile -t pdf_matches < <(find "$tmp/extract" -type f -path '*/build/pdf.mjs' -print)
          mapfile -t worker_matches < <(find "$tmp/extract" -type f -path '*/build/pdf.worker.mjs' -print)
          mapfile -t license_matches < <(find "$tmp/extract" -maxdepth 3 -type f -name LICENSE -print)

          test "${#pdf_matches[@]}" -eq 1
          test "${#worker_matches[@]}" -eq 1
          test "${#license_matches[@]}" -eq 1

          dest="validator/vendor/pdfjs"
          mkdir -p "$dest"
          cp "${pdf_matches[0]}" "$dest/pdf.mjs"
          cp "${worker_matches[0]}" "$dest/pdf.worker.mjs"
          cp "${license_matches[0]}" "$dest/LICENSE"

          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("validator/vendor/pdfjs")
          files = {}
          for name in ("pdf.mjs", "pdf.worker.mjs", "LICENSE"):
              data = (root / name).read_bytes()
              files[name] = {
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "bytes": len(data),
              }
          provenance = {
              "schema_version": 1,
              "component": "PDF.js",
              "package": "pdfjs-dist",
              "version": os.environ["PDFJS_VERSION"],
              "upstream_repository": "https://github.com/mozilla/pdf.js",
              "tag": f"v{os.environ['PDFJS_VERSION']}",
              "tag_commit": os.environ["PDFJS_TAG_COMMIT"],
              "release_id": int(os.environ["PDFJS_RELEASE_ID"]),
              "asset": {
                  "id": int(os.environ["PDFJS_ASSET_ID"]),
                  "name": f"pdfjs-{os.environ['PDFJS_VERSION']}-dist.zip",
                  "url": f"https://github.com/mozilla/pdf.js/releases/download/v{os.environ['PDFJS_VERSION']}/pdfjs-{os.environ['PDFJS_VERSION']}-dist.zip",
                  "sha256": os.environ["PDFJS_ASSET_SHA256"],
                  "bytes": int(os.environ["PDFJS_ASSET_SIZE"]),
              },
              "license": "Apache-2.0",
              "files": files,
          }
          (root / "PROVENANCE.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git add validator/vendor/pdfjs
          if git diff --cached --quiet; then
            echo "Vendor files already match the pinned release."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "vendor: import PDF.js 6.2.108 runtime"
          git push origin HEAD:feat/web-lite-vendored-pdfjs
