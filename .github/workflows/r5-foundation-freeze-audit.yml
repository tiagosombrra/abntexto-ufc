name: Temporary R5 foundation-freeze audit

on:
  push:
    branches:
      - r5-foundation-freeze

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require exact canonical R5 state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ff833d814133d33887df8971f6a0af702d6c2143"
          test "$(git merge-base HEAD origin/main)" = "ff833d814133d33887df8971f6a0af702d6c2143"
          python3 - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('release/v3-roadmap.json').read_text(encoding='utf-8'))
          assert state['phase'] == 'V3-R5'
          assert state['stage'] == 'V3-R5'
          prep = state['r5_preparation']
          assert prep['status'] == 'ACTIVE'
          assert prep['entry_main_sha'] == '0b0f5d989163dc6b1429feeb2d8a7c66988647bb'
          assert prep['certified_product_candidate_main_sha'] == 'c79f3c73f1d51a30175e8259269504d029442a1c'
          PY

      - name: Prove certified product invariance and authority-document truthfulness
        shell: bash
        run: |
          set -euo pipefail
          product=c79f3c73f1d51a30175e8259269504d029442a1c
          allowed='^(AGENTS.md|README.md|docs/ARCHITECTURE.md|docs/CTAN-RELEASE.md|docs/ENGINEERING-LANGUAGE.md|docs/HANDOFF-V3.0.0.md|docs/R3-HARDENING-INVENTORY.md|docs/ROADMAP-V3.0.0.md|release/v3-r3-inventory.json|release/v3-roadmap.json|\.github/workflows/r5-foundation-freeze-audit.yml)$'
          unexpected="$(git diff --name-only "$product" HEAD | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected product-affecting paths since certified candidate:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --exit-code "$product" HEAD -- \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md
          echo 'R5-FREEZE-EVIDENCE product_invariant=PASS normative_base=unchanged normative_currency=unchanged migration_guide=unchanged'

      - name: Run source-only contract
        run: make static-check

      - name: Run release and package contracts
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs
            make release-check
            python3 tools/fetch-abntexto.py --output /tmp/abntexto.cls
            python3 tests/checks/public_bundles.py --abntexto /tmp/abntexto.cls
            python3 tests/checks/distribution_bundles.py --abntexto /tmp/abntexto.cls
            echo 'R5-PACKAGE-EVIDENCE release_check=PASS public_bundles=PASS distribution_bundles=PASS checksums=PASS asset_exclusions=PASS'

      - name: Verify no tracked audit side effects
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --check
          test -z "$(git ls-files '.github/workflows/*' | grep -E '(temporary|executor|audit)' | grep -v '^.github/workflows/r5-foundation-freeze-audit.yml$' || true)"
          echo 'R5-HYGIENE-EVIDENCE tracked_side_effects=0 stale_temporary_executors=0'
