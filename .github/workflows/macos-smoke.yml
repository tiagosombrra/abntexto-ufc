name: macOS portability smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/macos-smoke.yml
      - Makefile
      - abntexto-ufc.cls
      - template/**
      - tools/fetch-abntexto.py
      - tests/checks/repository/macos_portability_contract.py
      - tests/integration/layout/font-embedding.sh
      - tests/integration/layout/pdfa.sh
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/macos-smoke.yml
      - Makefile
      - abntexto-ufc.cls
      - template/**
      - tools/fetch-abntexto.py
      - tests/checks/repository/macos_portability_contract.py
      - tests/integration/layout/font-embedding.sh
      - tests/integration/layout/pdfa.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: macOS ARM64 public-template build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned TeX Live 2026
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037 # v4.4.0
        with:
          texlive_version: '2026'
          cache_version: macos-portability-v1
          accept-stale: false
          packages: >
            scheme-basic
            algpseudocodex
            babel
            babel-portuges
            biber
            biblatex
            biblatex-abnt
            csquotes
            enumitem
            etoolbox
            fontaxes
            fontspec
            geometry
            glossaries
            graphics
            iftex
            imakeidx
            listings
            lm
            luaotfload
            microtype
            minted
            newtx
            pdfpages
            ragged2e
            tabularray
            tabularray-abnt
            tex-gyre
            unicode-math
            xcolor
            xpatch
            xstring

      - name: Compile public tutorial on Darwin ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = 'Darwin'
          test "$(uname -m)" = 'arm64'
          sw_vers -productVersion

          for command in kpsewhich pdflatex lualatex biber makeglossaries makeindex; do
            command -v "$command" >/dev/null 2>&1 || {
              echo "Required TeX Live command not found: $command" >&2
              exit 1
            }
          done

          python3 tools/fetch-abntexto.py --output abntexto.cls
          test -s abntexto.cls

          output="$RUNNER_TEMP/macos-template-pdfs"
          mkdir -p "$output"
          trap 'rm -f abntexto.cls; make clean DOCUMENT=main >/dev/null 2>&1 || true' EXIT

          make clean DOCUMENT=main
          make DOCUMENT=main ENGINE=pdflatex compile
          test -s template/main.pdf
          cp template/main.pdf "$output/abntexto-ufc-macos-pdflatex.pdf"

          make clean DOCUMENT=main
          make DOCUMENT=main ENGINE=lualatex compile
          test -s template/main.pdf
          cp template/main.pdf "$output/abntexto-ufc-macos-lualatex.pdf"

          test "$(find "$output" -maxdepth 1 -type f -name '*.pdf' | wc -l | tr -d ' ')" = '2'
          echo 'MACOS-BUILD-EVIDENCE status=PASS runner=macos-26 arch=arm64 texlive=2026 template=main engines=2'

      - name: Upload macOS template PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-template-pdfs-${{ github.run_id }}
          path: ${{ runner.temp }}/macos-template-pdfs/*.pdf
          retention-days: 14
          if-no-files-found: error

  linux-certify:
    name: Certify macOS PDFs
    needs: macos-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS template PDFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-template-pdfs-${{ github.run_id }}
          path: macos-template-pdfs

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends poppler-utils
          pdffonts -v 2>&1 | head -n 1
          docker --version

      - name: Certify macOS-produced PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/validation
          for engine in pdflatex lualatex; do
            pdf="macos-template-pdfs/abntexto-ufc-macos-$engine.pdf"
            test -s "$pdf"
            sh tests/integration/layout/font-embedding.sh "$pdf"
            UFC_PDFA_NEGATIVE_VALIDATION=0 sh tests/integration/layout/pdfa.sh "$pdf"
          done
          printf '%s\n' \
            'MACOS-PORTABILITY-EVIDENCE status=PASS runner=macos-26 arch=arm64 texlive=2026 template=main engines=2 font_embedding=PASS pdfa_2b=PASS' \
            | tee artifacts/validation/macos-portability.txt

      - name: Upload macOS portability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-portability-certification-${{ github.run_id }}
          path: artifacts/validation/macos-portability.txt
          retention-days: 14
          if-no-files-found: error
