name: B4-C2b language inventory

on:
  push:
    branches:
      - refactor/v3-r1-b4c2b-diagnostics-ui

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory remaining project-owned human-facing text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          targets = [
              Path('tools/validate-ufc-pdf.py'),
              Path('validator/app.js'),
              Path('validator/index.html'),
          ]
          marker = re.compile(r'[áàâãéêíóôõúçÁÀÂÃÉÊÍÓÔÕÚÇ]|\b(?:arquivo|página|páginas|fonte|fontes|repositório|preservação|evidência|correção|relatório|veredito|perfil|validação|validar|metadados|privacidade|revisão|não|ausente|detectado|detectados|conforme|reprovado|obrigatória|obrigatório|inclua|defina|execute|remova|gere|revise|falha|ferramenta|processado|processadas|estrutura|criptografia|depósito|acessibilidade)\b', re.I)
          for path in targets:
              print(f'=== {path} ===')
              for no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if marker.search(line):
                      print(f'{no}: {line}')

          print('=== tests literal consumers ===')
          PY
          git grep -n -i -E 'Arquivo|Páginas|Fontes|Relatório|Veredito|Perfil|Validação|Validar|Privacidade|Revisão|Ausente|Detectad|Conforme|Reprovado|Inclua|Defina|Execute|Remova|Gere|Revise|Falha|Ferramenta|processad|criptografia|Depósito|Acessibilidade' -- tests validator tools || true

          echo '=== entry gates ==='
          python3 tests/checks/normative_cross_surface.py
          python3 tests/checks/normative_validator_contract.py
          python3 tests/checks/validator_source.py
          python3 tests/checks/canonical_identity.py
          python3 tests/checks/repository_contract.py
          node --check validator/app.js
          python3 -m py_compile tools/validate-ufc-pdf.py
          git diff --check
          echo 'B4-C2B-INVENTORY status=PASS'
