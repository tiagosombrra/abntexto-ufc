name: Temporary Overleaf diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/overleaf-diagnostic.yml'
      - '3-pos-textuais/referencias.bib'

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose LuaLaTeX 2025 overflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pin abntexto 1.1 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request
          from pathlib import Path

          expected = 'f9cc40c65fbf6c2f9520b4ca4f312440e8d0ee6a'
          commit = '4c03fd7b5a7af089627dedb547c53cad4eed2a2a'
          url = f'https://raw.githubusercontent.com/ElaysonAbreu/abntexto/{commit}/abntexto.cls'
          content = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'abntexto-ufc-overleaf-diagnostic'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(5 * attempt)
          digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          if digest != expected:
              raise SystemExit(f'abntexto blob mismatch: {digest}')
          Path('abntexto.cls').write_bytes(content)
          PY

      - name: Reproduce and print LuaLaTeX 2025 context
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            cp tests/fixtures/overleaf-latexmkrc latexmkrc
            latexmk -C documento.tex >/dev/null 2>&1 || true
            latexmk -lualatex -interaction=nonstopmode -halt-on-error documento.tex > /tmp/lualatex-2025.out 2>&1 || {
              cat /tmp/lualatex-2025.out
              exit 1
            }
            echo '--- diagnostic context ---'
            grep -n -B 4 -A 8 -E 'Overfull \\hbox|Underfull \\hbox|Overfull \\vbox|LaTeX Warning:|Package [^ ]+ Warning:|Class [^ ]+ Warning:' documento.log || true
            echo '--- end diagnostic context ---'
