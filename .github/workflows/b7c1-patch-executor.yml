name: B7-C1 patch executor

on:
  push:
    branches:
      - 'fix/v3-r1-b7c1-clean-runner-contract'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[b7c1-executor]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/v3-r1-b7c1-clean-runner-contract
      - name: Patch stale evidence metadata consumer
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/checks/normative_appendix_annex.py')
          source = path.read_text(encoding='utf-8')
          old = '        "engine_matrix_deferred_to": scenario["engine_matrix_deferred_to"],\n'
          new = '        "engine_matrix_deferred": scenario["engine_matrix_deferred"],\n'
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one stale metadata consumer, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')
      - name: Validate patch
        run: |
          python3 -m py_compile tests/checks/normative_appendix_annex.py
          git diff --check
          grep -F '"engine_matrix_deferred": scenario["engine_matrix_deferred"]' tests/checks/normative_appendix_annex.py
          ! grep -F 'engine_matrix_deferred_to' tests/checks/normative_appendix_annex.py
      - name: Commit patch and remove executor
        run: |
          git rm .github/workflows/b7c1-patch-executor.yml
          git add tests/checks/normative_appendix_annex.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[b7c1-executor] test: align appendix annex evidence metadata'
          git push origin HEAD:fix/v3-r1-b7c1-clean-runner-contract
