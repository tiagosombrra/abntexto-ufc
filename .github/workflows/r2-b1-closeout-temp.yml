name: R2-B1 closeout temporary

on:
  push:
    branches:
      - docs/v3-r2-b1-closeout-b2-entry

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: docs/v3-r2-b1-closeout-b2-entry
          fetch-depth: 0

      - name: Reconcile B1 closeout and B2 entry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/r2_b1_closeout_temp.py
          git rm tools/r2_b1_closeout_temp.py .github/workflows/r2-b1-closeout-temp.yml
          make static-check
          git diff --check

      - name: Commit reconciled control plane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close R2-B1 and activate R2-B2'
          git push origin HEAD:docs/v3-r2-b1-closeout-b2-entry
