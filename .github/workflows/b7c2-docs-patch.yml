name: B7-C2 documentation patcher

on:
  push:
    branches:
      - 'ci/v3-r1-b7c2-linux-pr-integration'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ci/v3-r1-b7c2-linux-pr-integration
          fetch-depth: 0
      - name: Patch B7-C2 workflow documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "README.md",
              "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. B7-C1 certified `make check` on a clean TeX Live 2026 Linux runner (`PASS=30 FAIL=0 SKIP=0`); B7-C2 now owns bounded permanent PR integration orchestration, while B7-C3 owns later release orchestration. Final Windows/font/PDF-A certification remains B8-owned.",
              "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. B7-C1 certified `make check` on a clean TeX Live 2026 Linux runner (`PASS=30 FAIL=0 SKIP=0`). The permanent `.github/workflows/linux-integration.yml` workflow exposes the stable `Linux integration` status: it always evaluates PR scope, skips the expensive TeX step for drafts and a narrow documentation/control-plane-only allowlist, runs full integration for every other or unknown path, cancels superseded PR runs, and delegates the heavy gate to `make check`. `workflow_dispatch` always forces a full integration run. B7-C3 owns later release orchestration; final Windows/font/PDF-A certification remains B8-owned."
          )

          replace_once(
              "AGENTS.md",
              "- B7-C1 certified the repository-owned `make check` contract on a clean TeX Live 2026 runner. B7-C2 may now add bounded permanent Linux PR integration orchestration as a thin consumer of that entry point; B7-C3 owns release orchestration. Final Windows/font/PDF-A certification remains B8-owned.",
              "- B7-C1 certified the repository-owned `make check` contract on a clean TeX Live 2026 runner. B7-C2 provides permanent `.github/workflows/linux-integration.yml` orchestration with stable `Linux integration` status: draft and narrowly allowlisted documentation/control-plane-only PRs skip the expensive TeX step, every other or unknown path runs `make check`, superseded PR runs are cancelled, and manual dispatch forces full integration. B7-C3 owns release orchestration. Final Windows/font/PDF-A certification remains B8-owned."
          )

          replace_once(
              "docs/ARCHITECTURE.md",
              ".github/\n  workflows/static-contract.yml",
              ".github/\n  workflows/static-contract.yml\n  workflows/linux-integration.yml"
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "- `.github/workflows/static-contract.yml`: permanent fast remote orchestration. It exposes the stable workflow/job name `Static contract` and delegates validation to `make static-check`; workflow YAML does not own or duplicate the gate internals.",
              "- `.github/workflows/static-contract.yml`: permanent fast remote orchestration. It exposes the stable workflow/job name `Static contract` and delegates validation to `make static-check`; workflow YAML does not own or duplicate the gate internals;\n- `.github/workflows/linux-integration.yml`: permanent bounded PR integration orchestration. It exposes the stable workflow/job name `Linux integration`, keeps a status on relevant PR lifecycle events, suppresses the expensive TeX step for drafts and a narrow documentation/control-plane-only allowlist, treats unknown paths fail-closed as integration-relevant, cancels superseded PR runs, forces full execution on manual dispatch, and delegates heavy validation to `make check`."
          )
          replace_once(
              "docs/ARCHITECTURE.md",
              "R1-BLOCK-7 restores permanent orchestration incrementally. B7-B established the `Static contract` workflow. B7-C1 certified the repository-owned `make check` integration contract on a clean TeX Live 2026 runner. B7-C2 now owns bounded permanent PR integration orchestration over that entry point; B7-C3 owns later release orchestration. B8 remains the owner of final Windows/font/PDF-A certification.",
              "R1-BLOCK-7 restores permanent orchestration incrementally. B7-B established the `Static contract` workflow. B7-C1 certified the repository-owned `make check` integration contract on a clean TeX Live 2026 runner. B7-C2 implements bounded permanent PR orchestration through `Linux integration`: orchestration owns only scope/cadence/concurrency, while the repository-owned `make check` entry point owns the integration gate itself. B7-C3 owns later release orchestration. B8 remains the owner of final Windows/font/PDF-A certification."
          )
          PY

          grep -Fq 'name: Linux integration' .github/workflows/linux-integration.yml
          grep -Fq 'make check' .github/workflows/linux-integration.yml
          ! grep -Fq '{% raw %}' .github/workflows/linux-integration.yml
          git diff --check
          make static-check

          rm .github/workflows/b7c2-docs-patch.yml
          git add README.md AGENTS.md docs/ARCHITECTURE.md .github/workflows/b7c2-docs-patch.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: document bounded Linux PR integration'
          git push origin HEAD:ci/v3-r1-b7c2-linux-pr-integration
