name: R2 contract format temporary

on:
  push:
    branches:
      - docs/v3-r2-a-inventory-closeout

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r2-a-inventory-closeout
          fetch-depth: 0

      - name: Restore compact migration-contract formatting
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 .tmp/r2-contract-format.py
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          python3 -m json.tool release/v3-path-migration.json >/dev/null
          python3 -m json.tool release/v3-test-migration.json >/dev/null
          git diff --check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r2-contract-format-temp.yml .tmp/r2-contract-format.py
          rmdir .tmp 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: preserve compact R2 migration contracts'
          git push origin HEAD:docs/v3-r2-a-inventory-closeout
