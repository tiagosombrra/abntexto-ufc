name: R2 contract format temporary

on:
  push:
    branches:
      - docs/v3-r1-b8-closeout-r2-entry

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closeout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b8-closeout-r2-entry
          fetch-depth: 0

      - name: Restore compact migration-contract formatting
        shell: bash
        run: |
          set -euo pipefail
          git show 9b1752565ac217c04ffa22a9ef272cdf078af380:release/v3-api-migration.json > release/v3-api-migration.json
          python3 -c "from pathlib import Path; p=Path('release/v3-api-migration.json'); s=p.read_text(); s=s.replace('\"phase\": \"V3-R0\"','\"phase\": \"V3-R2\"',1); s=s.replace('\"status\": \"FROZEN_FOR_V3_R2\"','\"status\": \"ACTIVE_R2_A_INVENTORY\",\n  \"activated_at\": \"2026-09-02\",\n  \"operational_issue\": 232,\n  \"entry_certified_r1_candidate_sha\": \"9b1752565ac217c04ffa22a9ef272cdf078af380\",\n  \"current_stage\": \"R2-A\",\n  \"current_stage_goal\": \"inventory runtime/API ownership and define bounded migration lots before behavioral changes\"',1); p.write_text(s)"
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          git diff --check

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/r2-contract-format-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: preserve compact R2 migration contract'
          git push origin HEAD:docs/v3-r1-b8-closeout-r2-entry
