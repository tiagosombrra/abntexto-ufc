name: Temporary V3 scientific article PDF

on:
  push:
    branches:
      - feat/v3-scientific-article

permissions:
  contents: read

jobs:
  build-scientific-article-pdf:
    name: Build canonical V3 scientific article PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build canonical scientific article with TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make DOCUMENT=scientific-article clean
            make DOCUMENT=scientific-article compile
            mkdir -p artifacts/scientific-article-pdf
            cp template/scientific-article.pdf artifacts/scientific-article-pdf/abntexto-ufc-v3-scientific-article.pdf
            pdfinfo artifacts/scientific-article-pdf/abntexto-ufc-v3-scientific-article.pdf > artifacts/scientific-article-pdf/pdfinfo.txt
            pdffonts artifacts/scientific-article-pdf/abntexto-ufc-v3-scientific-article.pdf > artifacts/scientific-article-pdf/pdffonts.txt
            pdftotext -layout artifacts/scientific-article-pdf/abntexto-ufc-v3-scientific-article.pdf artifacts/scientific-article-pdf/extracted.txt
            sha256sum artifacts/scientific-article-pdf/abntexto-ufc-v3-scientific-article.pdf > artifacts/scientific-article-pdf/sha256.txt
            wc -c artifacts/scientific-article-pdf/abntexto-ufc-v3-scientific-article.pdf > artifacts/scientific-article-pdf/size.txt
            {
              echo "git_sha=$GITHUB_SHA"
              echo "workflow_run=$GITHUB_RUN_ID"
              echo "texlive=2026"
              echo "engine=pdflatex"
              echo "source=template/scientific-article.tex"
            } > artifacts/scientific-article-pdf/provenance.txt

      - name: Upload canonical scientific article artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-scientific-article-pdf-${{ github.sha }}
          path: artifacts/scientific-article-pdf/
          if-no-files-found: error
          retention-days: 7
