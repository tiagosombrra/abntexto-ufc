name: B8 font POC root patcher

on:
  push:
    branches:
      - fix/v3-r1-b8-windows-certification-wiring

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/v3-r1-b8-windows-certification-wiring

      - name: Repair repository root resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/integration/font-poc.sh')
          text = p.read_text(encoding='utf-8')
          old = 'root=$(CDPATH= cd -- "$(dirname "$0")/.." && pwd)'
          new = 'root=$(CDPATH= cd -- "$(dirname "$0")/../.." && pwd)'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'font-poc.sh: expected one root resolver, found {count}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm -f .github/workflows/b8-font-poc-root-patch.yml
          sh -n tests/integration/font-poc.sh
          git diff --check
          make static-check

          git config user.name "Tiago Sombra"
          git config user.email "tiagosombrra@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: repair B8 font POC root resolution"
          git push origin HEAD:fix/v3-r1-b8-windows-certification-wiring
