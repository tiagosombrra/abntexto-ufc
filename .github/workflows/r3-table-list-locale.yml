name: R3 mixed short and long table-list regression
on:
  push:
    branches: [main]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/table-list-locale-regression.py
      - tests/integration/frontmatter/comprehensive-pdf-gate.py
      - .github/workflows/r3-table-list-locale.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/table-list-locale-regression.py
      - tests/integration/frontmatter/comprehensive-pdf-gate.py
      - .github/workflows/r3-table-list-locale.yml
permissions:
  contents: read
concurrency:
  group: r3-table-list-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mutation-preflight:
    name: Reject mixed and omitted table-list entries
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run original failure mutants
        run: python3 tests/integration/objects/table-list-locale-regression.py --selftest
  real-pdfs:
    name: Short + multipage table List of Tables / ${{ matrix.locale }}
    runs-on: ubuntu-24.04
    needs: mutation-preflight
    timeout-minutes: 38
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile and inspect original PDF and LOT under TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            git config --global --add safe.directory "$PWD"
            python3 tests/integration/objects/table-list-locale-regression.py --locale ${{ matrix.locale }}
      - name: Preserve the original failing or passing PDF, LOT and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r3-tables-${{ matrix.locale }}-${{ github.run_id }}
          path: artifacts/table-list-r3/${{ matrix.locale }}/**
          retention-days: 21
          if-no-files-found: warn
