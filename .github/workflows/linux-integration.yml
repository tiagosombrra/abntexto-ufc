name: Linux integration

on:
  push:
    branches:
      - main
    paths:
      - release/v3-release-candidate.json
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      scope:
        description: Linux integration scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - complete
          - article
          - reference-document
          - reference-pdf
          - frontmatter
          - layout
          - objects
          - bibliography
          - backmatter
          - research-project
          - profiles
          - distribution
          - web-lite
          - smoke

permissions:
  contents: read

concurrency:
  group: linux-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-integration:
    name: Linux integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine integration scope
        id: scope
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_ACTION: ${{ github.event.action || '' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          INPUT_SCOPE: ${{ inputs.scope || 'auto' }}
        run: |
          set -euo pipefail

          run_integration=true
          selected_scope=complete
          reason=manual-auto-fail-closed
          release_candidate_marker=release/v3-release-candidate.json

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            if [[ "$PR_DRAFT" == "true" ]]; then
              run_integration=false
              selected_scope=none
              reason=draft-pr
            elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Fxq "$release_candidate_marker"; then
              # A release-candidate marker anywhere in the full PR must dominate
              # incremental synchronize windows so a later docs-only commit cannot
              # cancel a complete run and replace it with a superficial green skip.
              selected_scope=complete
              reason=release-candidate-full-pr
            else
              # Always classify the complete PR diff. A later documentation-only
              # synchronize event must never replace a failing technical run with
              # a superficial green skip.
              selected_scope=$(python3 tests/integration_suites.py --base "$BASE_SHA" --head "$HEAD_SHA")
              if [[ "$selected_scope" == "none" ]]; then
                run_integration=false
                reason=documentation-only-full-pr
              else
                reason="auto-full-pr:$selected_scope"
              fi
            fi
          elif [[ "$INPUT_SCOPE" != "auto" ]]; then
            selected_scope="$INPUT_SCOPE"
            reason="manual:$selected_scope"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            selected_scope=complete
            reason=release-marker-main-push
          fi

          echo "run_integration=$run_integration" >> "$GITHUB_OUTPUT"
          echo "scope=$selected_scope" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Linux integration scope"
            echo
            echo "- run integration: \`$run_integration\`"
            echo "- scope: \`$selected_scope\`"
            echo "- reason: \`$reason\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report scoped skip
        if: steps.scope.outputs.run_integration != 'true'
        env:
          SKIP_REASON: ${{ steps.scope.outputs.reason }}
        run: echo "Heavy Linux integration skipped ($SKIP_REASON)."

      - name: Run repository integration contract
        if: steps.scope.outputs.run_integration == 'true'
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs unzip
            node --version
            # The TeX Live action runs in a container over the runner checkout.
            # Git-backed distribution builders may inspect only this mounted checkout.
            git config --global --add safe.directory "$PWD"
            scope="${{ steps.scope.outputs.scope }}"
            echo "Running Linux integration scope: $scope"
            python3 tests/run.py --mode pr --suite "$scope"

      - name: Run Web/Lite browser E2E
        id: web_lite_e2e
        if: steps.scope.outputs.run_integration == 'true' && success() && (steps.scope.outputs.scope == 'complete' || contains(steps.scope.outputs.scope, 'web-lite'))
        shell: bash
        env:
          WEB_LITE_EVIDENCE_DIR: ${{ runner.temp }}/abntexto-ufc-web-lite
        run: |
          set -euo pipefail
          test -s artifacts/validation/web-lite-positive.pdf
          mkdir -p "$WEB_LITE_EVIDENCE_DIR"
          command -v chromedriver
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo 'Web/Lite E2E failed: Chrome/Chromium is not installed on the GitHub runner.'
            exit 1
          fi
          chromedriver --version
          python3 tests/integration/web-lite-e2e.py \
            --pdf artifacts/validation/web-lite-positive.pdf \
            --profile portable \
            --evidence "$WEB_LITE_EVIDENCE_DIR/web-lite-e2e.json"

      - name: Upload Web/Lite browser evidence
        if: always() && steps.web_lite_e2e.outcome != 'skipped' && steps.web_lite_e2e.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-lite-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/abntexto-ufc-web-lite/web-lite-e2e.json
            ${{ runner.temp }}/abntexto-ufc-web-lite/web-lite-chromedriver.log
          retention-days: 14
          if-no-files-found: warn
