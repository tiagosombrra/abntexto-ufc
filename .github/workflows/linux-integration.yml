name: Linux integration

on:
  push:
    branches:
      - main
    paths:
      - release/v3-release-candidate.json
      - .github/workflows/linux-integration.yml
      - tools/ci/select-integration-scope.py
      - tools/ci/run-web-lite-e2e.sh
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:
    inputs:
      scope:
        description: Linux integration scope
        required: true
        default: auto
        type: choice
        options:
          - auto
          - complete
          - article
          - reference-document
          - reference-pdf
          - frontmatter
          - layout
          - objects
          - bibliography
          - backmatter
          - research-project
          - profiles
          - distribution
          - web-lite
          - smoke

permissions:
  contents: read

concurrency:
  group: linux-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-integration:
    name: Linux integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine integration scope
        id: scope
        shell: bash
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          INPUT_SCOPE: ${{ inputs.scope || 'auto' }}
        run: |
          python3 tools/ci/select-integration-scope.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --pr-draft "$PR_DRAFT" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --input-scope "$INPUT_SCOPE" \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Report scoped skip
        if: steps.scope.outputs.run_integration != 'true'
        env:
          SKIP_REASON: ${{ steps.scope.outputs.reason }}
        run: echo "Heavy Linux integration skipped ($SKIP_REASON)."

      - name: Run repository integration contract
        if: steps.scope.outputs.run_integration == 'true'
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs unzip
            node --version
            # The TeX Live action runs in a container over the runner checkout.
            # Git-backed distribution builders may inspect only this mounted checkout.
            git config --global --add safe.directory "$PWD"
            scope="${{ steps.scope.outputs.scope }}"
            echo "Running Linux integration scope: $scope"
            python3 tests/run.py --mode pr --suite "$scope"

      - name: Run Web/Lite browser E2E
        id: web_lite_e2e
        if: steps.scope.outputs.run_integration == 'true' && success() && (steps.scope.outputs.scope == 'complete' || contains(steps.scope.outputs.scope, 'web-lite'))
        shell: bash
        env:
          WEB_LITE_EVIDENCE_DIR: ${{ runner.temp }}/abntexto-ufc-web-lite
        run: sh tools/ci/run-web-lite-e2e.sh

      - name: Upload Web/Lite browser evidence
        if: always() && steps.web_lite_e2e.outcome != 'skipped' && steps.web_lite_e2e.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-lite-e2e-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/abntexto-ufc-web-lite/web-lite-e2e.json
            ${{ runner.temp }}/abntexto-ufc-web-lite/web-lite-chromedriver.log
          retention-days: 14
          if-no-files-found: warn
