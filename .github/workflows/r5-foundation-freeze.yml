name: Temporary R5 foundation freeze validation

on:
  push:
    branches:
      - r5-foundation-freeze

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact R5 entry and frozen product
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ff833d814133d33887df8971f6a0af702d6c2143"
          test "$(git merge-base HEAD origin/main)" = "ff833d814133d33887df8971f6a0af702d6c2143"
          cat > /tmp/r5-allowed.txt <<'EOF'
          AGENTS.md
          README.md
          docs/ARCHITECTURE.md
          docs/CTAN-RELEASE.md
          docs/ENGINEERING-LANGUAGE.md
          docs/HANDOFF-V3.0.0.md
          docs/R3-HARDENING-INVENTORY.md
          docs/ROADMAP-V3.0.0.md
          release/v3-r3-inventory.json
          release/v3-roadmap.json
          EOF
          git diff --name-only c79f3c73f1d51a30175e8259269504d029442a1c origin/main | sort > /tmp/r5-actual.txt
          diff -u /tmp/r5-allowed.txt /tmp/r5-actual.txt
          git diff --exit-code c79f3c73f1d51a30175e8259269504d029442a1c origin/main -- \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md
          echo "R5-FREEZE-EVIDENCE status=PASS product=c79f3c73f1d51a30175e8259269504d029442a1c entry=0b0f5d989163dc6b1429feeb2d8a7c66988647bb current_main=ff833d814133d33887df8971f6a0af702d6c2143 product_changes=control-plane-only normative_docs=unchanged"

      - name: Run source-only contract
        run: make static-check

      - name: Run package and release validation
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli
            python3 tools/fetch-abntexto.py --output /tmp/abntexto.cls
            python3 tests/checks/public_bundles.py --abntexto /tmp/abntexto.cls
            python3 tests/checks/distribution_bundles.py --abntexto /tmp/abntexto.cls
            make release-check
            rm -f /tmp/abntexto.cls

      - name: Verify validation did not modify tracked product
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD
          echo 'Tracked tree unchanged by R5 validation.'
          git status --short

      - name: Remove generated residue
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fdx
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Remove temporary executor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/r5-foundation-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove temporary R5 freeze executor'
          git push origin HEAD:r5-foundation-freeze
