name: Temporary R2-B4 closeout

on:
  push:
    branches:
      - docs/v3-r2-b4-closeout-b5-entry

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reconcile, remove temporary tooling, validate, and push
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/tmp_r2_b4_closeout.py
          git diff --check
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          python3 -m json.tool release/v3-api-migration.json >/dev/null
          python3 -m json.tool release/v3-test-migration.json >/dev/null
          python3 -m json.tool release/v3-path-migration.json >/dev/null

          git rm .github/workflows/tmp-r2-b4-closeout.yml tools/tmp_r2_b4_closeout.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close R2-B4 and activate R2-B5'

          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 3
          test ! -e .github/workflows/tmp-r2-b4-closeout.yml
          test ! -e tools/tmp_r2_b4_closeout.py
          make static-check
          git diff --check
          git status --short | test ! -s /dev/stdin

          git push origin HEAD:docs/v3-r2-b4-closeout-b5-entry
