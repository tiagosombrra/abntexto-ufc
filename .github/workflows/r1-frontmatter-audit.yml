name: R1 front matter contract reconciliation

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-frontmatter-audit.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Reconcile front matter producers and consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path
          from typing import Any

          ROOT = Path('.')

          PATH_MAP = {
              'tests/normativa/pretextual-oracle-acknowledgements.tex': 'tests/documents/frontmatter-acknowledgments-test.tex',
              'tests/normativa/pretextual-oracle-dedication-epigraph-alignment.tex': 'tests/documents/frontmatter-dedication-epigraph-alignment-test.tex',
              'tests/normativa/pretextual-oracle-approval.tex': 'tests/documents/frontmatter-approval-test.tex',
              'tests/normativa/pretextual-oracle-cover-academic.tex': 'tests/documents/frontmatter-cover-academic-test.tex',
              'tests/normativa/pretextual-oracle-cover-project-optional.tex': 'tests/documents/frontmatter-cover-project-optional-test.tex',
              'tests/normativa/pretextual-oracle-cover-project-anonymized-optional.tex': 'tests/documents/frontmatter-cover-project-anonymized-optional-test.tex',
              'tests/normativa/pretextual-oracle-errata-present.tex': 'tests/documents/frontmatter-errata-present-test.tex',
              'tests/normativa/pretextual-oracle-errata-absent.tex': 'tests/documents/frontmatter-errata-absent-test.tex',
              'tests/normativa/pretextual-oracle-list-illustrations-present.tex': 'tests/documents/frontmatter-list-illustrations-present-test.tex',
              'tests/normativa/pretextual-oracle-list-tables-present.tex': 'tests/documents/frontmatter-list-tables-present-test.tex',
              'tests/normativa/pretextual-oracle-list-abbreviations-present.tex': 'tests/documents/frontmatter-list-abbreviations-present-test.tex',
              'tests/normativa/pretextual-oracle-list-symbols-present.tex': 'tests/documents/frontmatter-list-symbols-present-test.tex',
              'tests/normativa/pretextual-oracle-lists-absent.tex': 'tests/documents/frontmatter-lists-absent-test.tex',
              'tests/normativa/pretextual-oracle-summary-abstract.tex': 'tests/documents/frontmatter-summary-abstract-test.tex',
              'tests/normativa/pretextual-oracle-title-page-academic.tex': 'tests/documents/frontmatter-title-page-academic-test.tex',
              'tests/normativa/pretextual-oracle-title-page-project.tex': 'tests/documents/frontmatter-title-page-project-test.tex',
              'tests/normativa/pretextual-oracle-title-page-project-anonymized.tex': 'tests/documents/frontmatter-title-page-project-anonymized-test.tex',
              'tests/normativa/pretextual-oracle-toc.tex': 'tests/documents/frontmatter-toc-test.tex',
              'tests/fixtures/pretextuais/errata-oracle.tex': 'tests/fixtures/frontmatter/errata-validation-fixture.tex',
              'tests/fixtures/pretextuais/abreviaturas.tex': 'tests/fixtures/frontmatter/abbreviations.tex',
              'tests/fixtures/pretextuais/abstract.tex': 'tests/fixtures/frontmatter/abstract.tex',
              'tests/fixtures/pretextuais/agradecimentos.tex': 'tests/fixtures/frontmatter/acknowledgments.tex',
              'tests/fixtures/pretextuais/dedicatoria.tex': 'tests/fixtures/frontmatter/dedication.tex',
              'tests/fixtures/pretextuais/epigrafe.tex': 'tests/fixtures/frontmatter/epigraph.tex',
              'tests/fixtures/pretextuais/errata.tex': 'tests/fixtures/frontmatter/errata.tex',
              'tests/fixtures/pretextuais/resumo.tex': 'tests/fixtures/frontmatter/summary.tex',
              'tests/fixtures/pretextuais/simbolos.tex': 'tests/fixtures/frontmatter/symbols.tex',
              'tests/fixtures/pretextuais/n6-abstract.tex': 'tests/fixtures/frontmatter/abstract-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-acknowledgements.tex': 'tests/fixtures/frontmatter/acknowledgments-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-dedication-alignment.tex': 'tests/fixtures/frontmatter/dedication-alignment-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-dedication.tex': 'tests/fixtures/frontmatter/dedication-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-epigraph-long-alignment.tex': 'tests/fixtures/frontmatter/epigraph-long-alignment-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-epigraph-long.tex': 'tests/fixtures/frontmatter/epigraph-long-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-epigraph-short-alignment.tex': 'tests/fixtures/frontmatter/epigraph-short-alignment-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-epigraph-short.tex': 'tests/fixtures/frontmatter/epigraph-short-validation-fixture.tex',
              'tests/fixtures/pretextuais/n6-summary.tex': 'tests/fixtures/frontmatter/summary-validation-fixture.tex',
              'normativa/oracle-policy.json': 'standards/validation-reference-policy.json',
              'standards/validation-policy.json': 'standards/validation-reference-policy.json',
              'frontmatter-acknowledgements-scenario.json': 'frontmatter-acknowledgments-scenario.json',
              'pretextual-oracle-pagination-card-source': 'frontmatter-validation-pagination-card-source',
          }

          def replace_project_tokens(text: str, *, replace_phase_marker: bool = False) -> str:
              for old, new in PATH_MAP.items():
                  text = text.replace(old, new)
              text = text.replace('duplex-pretextual', 'duplex-frontmatter')
              text = text.replace('pretextual', 'frontmatter')
              if replace_phase_marker:
                  text = text.replace('N6', 'FRONTMATTER')
              return text

          def transform_json(value: Any, *, replace_phase_marker: bool = False) -> Any:
              if isinstance(value, dict):
                  return {
                      replace_project_tokens(str(key), replace_phase_marker=replace_phase_marker): transform_json(
                          item, replace_phase_marker=replace_phase_marker
                      )
                      for key, item in value.items()
                  }
              if isinstance(value, list):
                  return [transform_json(item, replace_phase_marker=replace_phase_marker) for item in value]
              if isinstance(value, str):
                  return replace_project_tokens(value, replace_phase_marker=replace_phase_marker)
              return value

          changed: set[str] = set()

          # Project-owned front matter terminology is canonicalized in all active standard contracts
          # so rule IDs, categories, validation gates and locator records stay mutually consistent.
          for path in sorted(Path('standards').glob('*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              transformed = transform_json(data)
              if path.name.startswith('frontmatter-'):
                  transformed = transform_json(transformed, replace_phase_marker=True)
                  transformed['schema_version'] = 2
                  transformed.pop('phase', None)
              if path.name == 'coverage-rules-frontmatter.json':
                  transformed['purpose'] = 'Front matter coverage rules for active normative validation.'
              rendered = json.dumps(transformed, ensure_ascii=False, indent=2) + '\n'
              if rendered != path.read_text(encoding='utf-8'):
                  path.write_text(rendered, encoding='utf-8')
                  changed.add(path.as_posix())

          # Python consumers share the same project-owned identifiers as the standards contracts.
          for path in sorted(Path('tests/checks').glob('*.py')) + sorted(Path('tools').glob('*.py')):
              text = path.read_text(encoding='utf-8')
              updated = replace_project_tokens(text)
              updated = updated.replace('standards" / "validation-policy.json', 'standards" / "validation-reference-policy.json')
              updated = updated.replace("standards' / 'validation-policy.json", "standards' / 'validation-reference-policy.json")
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.add(path.as_posix())

          # The front matter integration family must use the same current identity.
          integration_targets = set(Path('tests/integration').glob('frontmatter*.sh')) | {
              Path('tests/integration/duplex-frontmatter.sh'),
              Path('tests/integration/capes-guidance.sh'),
          }
          for path in sorted(integration_targets):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              updated = replace_project_tokens(text, replace_phase_marker=True)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.add(path.as_posix())

          # Test documents may legitimately call the upstream abntexto \pretextual command.
          # Preserve that integration boundary while removing project-owned paths and phase markers.
          tex_targets = set(Path('tests/documents').glob('frontmatter*.tex')) | set(Path('tests/fixtures/frontmatter').glob('*.tex'))
          for path in sorted(tex_targets):
              text = path.read_text(encoding='utf-8')
              sentinel = '__ABNTEXTO_PRETEXTUAL_COMMAND__'
              updated = text.replace('\\pretextual', sentinel)
              updated = replace_project_tokens(updated, replace_phase_marker=True)
              updated = updated.replace(sentinel, '\\pretextual')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.add(path.as_posix())

          # Normalize whitespace on touched text files.
          for item in sorted(changed):
              path = Path(item)
              if path.suffix in {'.py', '.sh', '.tex', '.json'}:
                  lines = path.read_text(encoding='utf-8').splitlines()
                  path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')

          print('Changed files:')
          for item in sorted(changed):
              print(f'  {item}')
          PY

          python3 - <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          failures = []
          for path in sorted(Path('standards').glob('frontmatter-*.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('schema_version') != 2:
                  failures.append(f'{path}: schema_version is not 2')
              if 'phase' in data:
                  failures.append(f'{path}: phase field remains')
              text = path.read_text(encoding='utf-8')
              for token in ('tests/normativa/', 'tests/fixtures/pretextuais/', 'pretextual', 'N6', 'oracle'):
                  if token.lower() in text.lower():
                      failures.append(f'{path}: forbidden project-owned token {token}')

          scope = (
              set(Path('tests/checks').glob('normative_frontmatter_*.py'))
              | set(Path('tests/checks').glob('frontmatter_*.py'))
              | set(Path('tests/integration').glob('frontmatter*.sh'))
              | {Path('tests/integration/duplex-frontmatter.sh')}
              | set(Path('tests/documents').glob('frontmatter*.tex'))
              | set(Path('tests/fixtures/frontmatter').glob('*.tex'))
          )
          for path in sorted(scope):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              check_text = text.replace('\\pretextual', '') if path.suffix == '.tex' else text
              for token in ('tests/normativa/', 'tests/fixtures/pretextuais/', 'N6', 'oracle'):
                  if token.lower() in check_text.lower():
                      failures.append(f'{path}: forbidden project-owned token {token}')
              if re.search(r'(?<!\\)pretextual', check_text, re.IGNORECASE):
                  failures.append(f'{path}: project-owned pretextual identity remains')

          literal_path = re.compile(r'(?P<path>(?:tests|standards)/[A-Za-z0-9_./-]+(?:\.py|\.sh|\.tex|\.json|\.bib))')
          for path in sorted(scope | set(Path('standards').glob('frontmatter-*.json'))):
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              for match in literal_path.finditer(text):
                  candidate = Path(match.group('path'))
                  if not candidate.exists():
                      failures.append(f'{path}: missing literal path {candidate}')

          if failures:
              raise SystemExit('Front matter reconciliation failed:\n' + '\n'.join(sorted(set(failures))))
          PY

          python3 -m py_compile \
            tests/checks/frontmatter_evidence.py \
            tests/checks/frontmatter_definition_alignment.py \
            tests/checks/frontmatter_definition_list_alignment.py \
            tests/checks/frontmatter_validation.py \
            tests/checks/normative_frontmatter_*.py \
            tools/normative_atomic.py \
            tools/normative_catalog.py \
            tools/normative_full.py

          python3 tests/checks/normative_full_contract.py
          git diff --check
          git status --short

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standards tests tools
          if git diff --cached --quiet; then
            echo 'No front matter reconciliation changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: rebaseline front matter contracts'
          git push origin HEAD:refactor/v3-r1-rebaseline
