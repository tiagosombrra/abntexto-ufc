name: R1 path-consumer repair

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-semantic-identity-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Repair path consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/r1_path_consumers_repair.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    "tests/normativa/index-glossary-final-pdf.tex": "tests/documents/index-glossary-present-final-pdf.tex",\n'
          extra = '    "tests/normativa/index-glossary-present-final-pdf.tex": "tests/documents/index-glossary-present-final-pdf.tex",\n'
          if extra not in text:
              if anchor not in text:
                  raise SystemExit('index/glossary mapping anchor not found')
              text = text.replace(anchor, anchor + extra, 1)
          old = '    allowed_negative = EXCLUDED_NEGATIVE_GUARDS | {"tests/checks/overleaf_bundle.py"}\n'
          new = '    allowed_negative = EXCLUDED_NEGATIVE_GUARDS | {"tests/checks/overleaf_bundle.py", "tools/r1_path_consumers_repair.py"}\n'
          if old not in text and new not in text:
              raise SystemExit('stale-path audit exclusion anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          # Run the bounded, fail-closed R1 path-consumer migration.
          python3 tools/r1_path_consumers_repair.py
          git rm -f tools/r1_path_consumers_repair.py

          python3 -m py_compile $(git ls-files 'tests/checks/*.py')
          for script in $(git ls-files 'tests/integration/*.sh'); do sh -n "$script"; done
          sh tests/integration/distribution.sh
          python3 tests/checks/normative_full_contract.py
          python3 tests/checks/normative_objects_scope.py
          python3 tests/checks/normative_currency.py
          python3 tests/checks/validator_source.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standards tests tools validator
          git commit -m 'refactor: reconcile remaining R1 path consumers'
          git push origin HEAD:refactor/v3-r1-rebaseline
