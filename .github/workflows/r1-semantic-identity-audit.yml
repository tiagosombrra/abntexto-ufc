name: R1 integration root audit

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-semantic-identity-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Audit integration root resolution
        shell: bash
        run: |
          set -euo pipefail
          echo '--- ROOT EXPRESSIONS ---'
          git grep -nE 'dirname[[:space:]]+"?\$0|dirname[[:space:]]+\$0|BASH_SOURCE' -- tests/integration || true
          echo '--- ROOT VARIABLES ---'
          git grep -nE '^(root|ROOT|repo_root|REPO_ROOT)=' -- tests/integration || true
          echo '--- CURRENT DIRECTORY ASSUMPTIONS ---'
          git grep -nE 'cd[[:space:]]+"?\$root|cd[[:space:]]+"?\$ROOT|Path\('\''main\.tex'\''\)|tests/documents/' -- tests/integration/distribution.sh tests/integration/font-poc.sh tests/integration/overleaf-stable.sh tests/integration/windows-font-pdfa.sh || true
