name: Optional modules four-language PDF certification
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/optional-locale-evidence.py
      - tests/integration/objects/i18n-optional-api-output-evidence.py
      - tests/integration/objects/i18n-b1-optional-config-evidence.py
      - tests/integration/objects/i18n-b3-optional-list-evidence.py
      - tests/integration/objects/i18n-inputlisting-container-repro.py
      - tests/integration/frontmatter/run-integrated-locale.py
      - standards/evidence/test-surface-policy.json
      - .github/workflows/i18n-optional-modules-matrix.yml
  push:
    branches: [main]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/optional-locale-evidence.py
      - tests/integration/objects/i18n-optional-api-output-evidence.py
      - tests/integration/objects/i18n-b1-optional-config-evidence.py
      - tests/integration/objects/i18n-b3-optional-list-evidence.py
      - tests/integration/objects/i18n-inputlisting-container-repro.py
      - tests/integration/frontmatter/run-integrated-locale.py
      - .github/workflows/i18n-optional-modules-matrix.yml
permissions:
  contents: read
concurrency:
  group: i18n-optional-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check three module fixtures across four locales and negative mutations
        run: |
          for locale in pt en es fr; do
            python3 tests/integration/objects/optional-locale-evidence.py --locale "$locale" --preflight
          done
          python3 tests/integration/objects/i18n-optional-api-output-evidence.py --self-test
          python3 tests/integration/objects/i18n-b1-optional-config-evidence.py --self-test
          python3 tests/integration/objects/i18n-b3-optional-list-evidence.py --preflight
          python3 tests/integration/objects/i18n-inputlisting-container-repro.py --preflight
  optional-locales:
    name: Code + minted + algorithm comments + long tables / ${{ matrix.locale }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile three real PDFs, fail if latexminted absent
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils qpdf
            command -v latexminted >/dev/null || { echo 'minted processor missing'; exit 1; }
            git config --global --add safe.directory "$PWD"
            python3 tests/integration/objects/optional-locale-evidence.py --locale ${{ matrix.locale }}
            python3 tests/integration/objects/i18n-b1-optional-config-evidence.py --locale ${{ matrix.locale }}
            python3 tests/integration/objects/i18n-b3-optional-list-evidence.py --locale ${{ matrix.locale }}
            if [ "${{ matrix.locale }}" = "pt" ]; then
              python3 tests/integration/objects/i18n-inputlisting-container-repro.py --locale pt
              python3 tests/integration/objects/i18n-inputlisting-container-repro.py --isolation
              python3 tests/integration/objects/i18n-inputlisting-container-repro.py --candidate
            fi
            # Run the unpatched-source regression against the actual class in each locale.
            python3 tests/integration/objects/i18n-inputlisting-container-repro.py --runtime --locale ${{ matrix.locale }}
      - name: Upload source-bound PDFs and hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-i18n-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            artifacts/optional-i18n/${{ matrix.locale }}/**
            artifacts/inputlisting-container-repro/${{ matrix.locale }}/**
            artifacts/inputlisting-container-repro/isolation-pt/**
            artifacts/inputlisting-container-repro/candidate-pt/**
            artifacts/inputlisting-container-repro/runtime-${{ matrix.locale }}/**
          retention-days: 21
          if-no-files-found: warn
