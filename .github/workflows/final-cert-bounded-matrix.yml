name: Final certification bounded matrix transport

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: final-cert-bounded-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-matrix:
    name: Final certification bounded matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run permanent repository release contract
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            export SOURCE_COMMIT_SHA="${SOURCE_COMMIT_SHA}"
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs docker-cli unzip
            node --version
            docker --version
            make release-check

      - name: Publish validation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Final Certification bounded matrix'
            echo
            echo '> Temporary PR transport for the permanent `make release-check` contract after adding the bounded article-PDF/A and distribution-integrity gates. This workflow must be removed before bounded acceptance.'
            echo
            if [[ -f artifacts/validation/validation-report.md ]]; then
              cat artifacts/validation/validation-report.md
            else
              echo 'No repository validation report was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload certification evidence
        if: always() && hashFiles('artifacts/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-cert-bounded-matrix-${{ github.run_id }}
          path: artifacts/**
          retention-days: 14
          if-no-files-found: error
