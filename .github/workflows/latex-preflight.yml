name: LaTeX preflight

on:
  pull_request:
    branches:
      - main
      - 1.x
  push:
    branches:
      - main
      - 1.x
      - 'maintenance/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  v2-reference:
    name: V2 reference document
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate reference document
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            sh tests/v2-reference-check.sh
      - name: Validate reference PDF/A-2b
        run: sh tests/v2-pdfa-check.sh

  v2-structure:
    name: V2 layout, fonts, pre-textuals and projects
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate structure
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make \
              v2-distribution-check \
              v2-layout-check \
              v2-font-config-check \
              v2-pdf-geometry-check \
              v2-normative-complement-check \
              v2-pretextual-check \
              v2-duplex-pretextual-check \
              v2-project-check \
              v2-build-check \
              v2-multivolume-check \
              v2-catalog-card-check

  v2-objects-bibliography:
    name: V2 objects and bibliography
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate objects and bibliography
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-object-check v2-minted-check v2-bib-check

  v2-profiles:
    name: V2 profile matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and validate twelve profile PDFs
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-profile-check
      - name: Validate twelve profile PDFs as PDF/A-2b
        run: sh tests/v2-profile-pdfa-check.sh

  v2-posttextual-compat:
    name: V2 post-textuals and v1 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate post-textuals and legacy API
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-posttextual-compat-check v2-duplex-posttextual-check

  v2-overleaf-stable-poc:
    name: V2 Overleaf stable proxy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/maintenance/v2.')
      ))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pin abntexto 1.1 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request
          from pathlib import Path

          expected = 'f9cc40c65fbf6c2f9520b4ca4f312440e8d0ee6a'
          commit = '4c03fd7b5a7af089627dedb547c53cad4eed2a2a'
          url = f'https://raw.githubusercontent.com/ElaysonAbreu/abntexto/{commit}/abntexto.cls'
          content = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'ufctex-overleaf-smoke'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(5 * attempt)

          digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          if digest != expected:
              raise SystemExit(f'abntexto blob mismatch: {digest}')
          if b'[2026-05-08 1.1 Preparation of works in ABNT standards]' not in content:
              raise SystemExit('abntexto 1.1 identity marker missing')
          Path('abntexto.cls').write_bytes(content)
          PY

      - name: Validate public TeX Live 2025 proxy
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-overleaf-stable-check

      - name: Publish Overleaf proxy status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/overleaf-proxy',
              'description': 'Public TeX Live 2025 Overleaf compatibility proxy',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-ci-status',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY

  v2-font-windows-poc:
    name: V2 Windows literal font build
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/heads/maintenance/v2.')
      ))
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      build_outcome: ${{ steps.windows-font-build.outcome }}
      artifact_outcome: ${{ steps.upload-font-pdfs.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Microsoft fonts
        shell: pwsh
        run: |
          $required = @(
            'times.ttf', 'timesbd.ttf', 'timesi.ttf', 'timesbi.ttf',
            'arial.ttf', 'arialbd.ttf', 'ariali.ttf', 'arialbi.ttf'
          )
          foreach ($font in $required) {
            $path = Join-Path $env:WINDIR "Fonts\$font"
            if (-not (Test-Path $path)) {
              throw "Required Microsoft font file not found: $path"
            }
            Write-Host "Found $path"
          }

      - name: Install TeX Live 2026 and prepare font metrics
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'texlive-2026'
          $profile = Join-Path $env:RUNNER_TEMP 'texlive.profile'
          @"
          selected_scheme scheme-small
          TEXDIR $root
          TEXMFCONFIG $root/texmf-config
          TEXMFVAR $root/texmf-var
          TEXMFHOME $root/texmf-home
          option_doc 0
          option_src 0
          option_autobackup 0
          option_path 0
          "@ | Set-Content -Path $profile -Encoding ascii

          Set-Location $env:RUNNER_TEMP
          $installerZip = Join-Path $env:RUNNER_TEMP 'install-tl.zip'
          $installerSources = @(
            'https://mirrors.mit.edu/CTAN/systems/texlive/tlnet/install-tl.zip',
            'https://mirror.ctan.org/systems/texlive/tlnet/install-tl.zip'
          )
          $installerDownloaded = $false
          foreach ($source in $installerSources) {
            try {
              Write-Host "Downloading TeX Live installer from $source"
              Invoke-WebRequest $source -OutFile $installerZip -TimeoutSec 60
              $installerDownloaded = $true
              break
            }
            catch {
              Write-Warning "TeX Live installer download failed from $source"
            }
          }
          if (-not $installerDownloaded) {
            throw 'TeX Live installer could not be downloaded from any configured source.'
          }

          Expand-Archive -Path $installerZip -DestinationPath 'install-tl' -Force
          $installer = Get-ChildItem -Path 'install-tl' -Filter 'install-tl-windows.bat' -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw 'TeX Live Windows installer was not found after extraction.'
          }

          $repositories = @(
            'https://mirrors.mit.edu/CTAN/systems/texlive/tlnet',
            'https://mirror.ctan.org/systems/texlive/tlnet'
          )
          $texliveRepo = $null
          foreach ($repository in $repositories) {
            if (Test-Path $root) {
              Remove-Item $root -Recurse -Force
            }
            Write-Host "Trying TeX Live repository: $repository"
            & $installer.FullName --profile=$profile --repository=$repository
            $candidateBin = Join-Path $root 'bin\windows'
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $candidateBin 'tlmgr.bat'))) {
              $texliveRepo = $repository
              break
            }
            Write-Warning "TeX Live installation failed from $repository"
          }
          if (-not $texliveRepo) {
            throw 'TeX Live installation failed for all configured repositories.'
          }

          $bin = Join-Path $root 'bin\windows'
          $env:PATH = "$bin;$env:PATH"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          & (Join-Path $bin 'tlmgr.bat') --repository $texliveRepo install abntexto biblatex-abnt biber csquotes fontaxes newtx fontspec unicode-math xpatch etoolbox ttfutils fontware
          if ($LASTEXITCODE -ne 0) {
            throw "tlmgr package installation failed with exit code $LASTEXITCODE"
          }

          $winfontsZip = Join-Path $env:RUNNER_TEMP 'winfonts.zip'
          $winfontsSources = @(
            'https://mirrors.mit.edu/CTAN/fonts/winfonts/winfonts.zip',
            'https://mirror.ctan.org/fonts/winfonts/winfonts.zip'
          )
          $winfontsDownloaded = $false
          foreach ($source in $winfontsSources) {
            try {
              Write-Host "Downloading winfonts support from $source"
              Invoke-WebRequest $source -OutFile $winfontsZip -TimeoutSec 60
              $winfontsDownloaded = $true
              break
            }
            catch {
              Write-Warning "winfonts download failed from $source"
            }
          }
          if (-not $winfontsDownloaded) {
            throw 'winfonts support could not be downloaded from any configured source.'
          }

          Expand-Archive -Path $winfontsZip -DestinationPath (Join-Path $root 'texmf-dist') -Force

          & (Join-Path $bin 'mktexlsr.exe') (Join-Path $root 'texmf-dist')
          if ($LASTEXITCODE -ne 0) {
            throw "mktexlsr failed with exit code $LASTEXITCODE"
          }

          foreach ($support in 'tex256.enc', 'ts1-winfonts.enc') {
            $resolved = & (Join-Path $bin 'kpsewhich.exe') $support
            if (-not $resolved) {
              throw "Winfonts encoding file not found: $support"
            }
            Write-Host "Winfonts encoding: $resolved"
          }

          $texmfHome = Join-Path $root 'texmf-home'
          $env:TEXMFHOME = $texmfHome
          "TEXMFHOME=$texmfHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$env:GITHUB_WORKSPACE\tools\prepare-windows-fonts.ps1" -TexmfRoot $texmfHome -FontsDir (Join-Path $env:WINDIR 'Fonts')
          if ($LASTEXITCODE -ne 0) {
            throw "ufctex Windows font preparation failed with exit code $LASTEXITCODE"
          }

          foreach ($support in 'ufctex-winfonts-ready.tex', 'ufctex-windows.map', 't1times-ttf.fd', 'ts1times-ttf.fd', 't1arial.fd', 'ts1arial.fd') {
            $resolved = & (Join-Path $bin 'kpsewhich.exe') $support
            if (-not $resolved) {
              throw "Generated ufctex font support file not found: $support"
            }
            Write-Host "Generated support: $resolved"
          }

          $version = & (Join-Path $bin 'tlmgr.bat') version | Out-String
          Write-Host $version
          if ($version -notmatch '2026') {
            throw 'The Windows POC did not install TeX Live 2026.'
          }

      - name: Build literal Times New Roman and Arial through ufctex
        id: windows-font-build
        shell: bash
        env:
          UFC_WINDOWS_FONTS_DIR: C:/Windows/Fonts
          UFC_FONT_POC_COMPILE_ONLY: '1'
        run: |
          mkdir -p artifacts/windows-font-diagnostics
          set +e
          sh tests/v2-font-poc.sh 2>&1 | tee artifacts/windows-font-diagnostics/build.log
          code=${PIPESTATUS[0]}
          set -e

          case "$code" in
            0)  failure='' ;;
            11) failure='pdfLaTeX / Times New Roman / infrastructure POC' ;;
            12) failure='pdfLaTeX / Arial / infrastructure POC' ;;
            13) failure='pdfLaTeX / Times New Roman / ufctex strict POC' ;;
            14) failure='pdfLaTeX / Arial / ufctex strict POC' ;;
            21) failure='LuaLaTeX / Times New Roman / infrastructure POC' ;;
            22) failure='LuaLaTeX / Arial / infrastructure POC' ;;
            23) failure='LuaLaTeX / Times New Roman / ufctex strict POC' ;;
            24) failure='LuaLaTeX / Arial / ufctex strict POC' ;;
            *)  failure="unclassified font POC exit $code" ;;
          esac

          printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
          printf 'font_failure=%s\n' "$failure" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload Windows font diagnostics
        if: ${{ always() && steps.windows-font-build.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v2-windows-literal-font-diagnostics
          path: artifacts/windows-font-diagnostics
          if-no-files-found: error
          retention-days: 7

      - name: Upload literal font PDFs
        id: upload-font-pdfs
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v2-windows-literal-font-pdfs
          path: |
            ufctex-times-pdflatex-strict-poc.pdf
            ufctex-arial-pdflatex-strict-poc.pdf
            ufctex-times-lualatex-strict-poc.pdf
            ufctex-arial-lualatex-strict-poc.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Publish Windows font build status
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          BUILD_OUTCOME: ${{ steps.windows-font-build.outcome }}
          BUILD_EXIT_CODE: ${{ steps.windows-font-build.outputs.exit_code }}
          FONT_FAILURE: ${{ steps.windows-font-build.outputs.font_failure }}
          ARTIFACT_OUTCOME: ${{ steps.upload-font-pdfs.outcome }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          if ($env:BUILD_OUTCOME -ne 'success' -and $env:FONT_FAILURE) {
            $description = "Failed ($env:BUILD_EXIT_CODE): $env:FONT_FAILURE"
          }
          elseif ($env:BUILD_OUTCOME -eq 'success' -and $env:ARTIFACT_OUTCOME -ne 'success') {
            $description = 'Windows font PDFs built; artifact upload failed'
          }
          else {
            $description = 'Windows literal font PDF generation'
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = $state
            context = 'ufctex/windows-font-build'
            description = $description
            target_url = $env:RUN_URL
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body | Out-Null

          if ($env:BUILD_OUTCOME -ne 'success' -and $env:BUILD_EXIT_CODE) {
            $diagnosticBody = @{
              state = 'failure'
              context = "ufctex/windows-font-failure/$env:BUILD_EXIT_CODE"
              description = $env:FONT_FAILURE
              target_url = $env:RUN_URL
            } | ConvertTo-Json
            Invoke-RestMethod `
              -Method Post `
              -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" `
              -Headers $headers `
              -ContentType 'application/json' `
              -Body $diagnosticBody | Out-Null
          }

  v2-font-windows-pdfa:
    name: V2 Windows literal font certification
    if: >-
      always() &&
      needs.v2-font-windows-poc.outputs.build_outcome == 'success' &&
      needs.v2-font-windows-poc.outputs.artifact_outcome == 'success'
    needs:
      - v2-font-windows-poc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download literal font PDFs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile
          from pathlib import Path

          name = 'v2-windows-literal-font-pdfs'
          repo = os.environ['REPO']
          run_id = os.environ['RUN_ID']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ufctex-artifact-download',
          }
          list_url = (
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts'
              f'?name={name}&per_page=100'
          )
          with urllib.request.urlopen(
              urllib.request.Request(list_url, headers=headers), timeout=30
          ) as response:
              payload = json.load(response)

          artifacts = [
              item for item in payload.get('artifacts', [])
              if item.get('name') == name and not item.get('expired')
          ]
          if len(artifacts) != 1:
              raise SystemExit(f'Expected one active artifact named {name}; found {len(artifacts)}.')

          artifact = artifacts[0]
          download_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact['id']}/zip"

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, response_headers, newurl):
                  return None

          request = urllib.request.Request(download_url, headers=headers)
          opener = urllib.request.build_opener(NoRedirect())
          try:
              with opener.open(request, timeout=30) as response:
                  archive = response.read()
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 307, 308):
                  raise
              location = error.headers.get('Location')
              if not location:
                  raise SystemExit('Artifact download redirect did not include Location.')
              blob_request = urllib.request.Request(
                  location,
                  headers={'User-Agent': 'ufctex-artifact-download'},
              )
              with urllib.request.urlopen(blob_request, timeout=60) as response:
                  archive = response.read()

          expected_digest = artifact.get('digest')
          if expected_digest and expected_digest.startswith('sha256:'):
              actual_digest = hashlib.sha256(archive).hexdigest()
              if actual_digest != expected_digest.split(':', 1)[1]:
                  raise SystemExit(
                      f'Artifact SHA-256 mismatch: expected {expected_digest}, got sha256:{actual_digest}.'
                  )

          archive_path = Path('windows-font-pdfs.zip')
          destination = Path('windows-font-pdfs')
          archive_path.write_bytes(archive)
          destination.mkdir(parents=True, exist_ok=True)
          root = destination.resolve()
          with zipfile.ZipFile(archive_path) as zip_file:
              for member in zip_file.infolist():
                  target = (destination / member.filename).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f'Unsafe artifact path: {member.filename}')
              zip_file.extractall(destination)
          archive_path.unlink()

          expected_files = {
              'ufctex-times-pdflatex-strict-poc.pdf',
              'ufctex-arial-pdflatex-strict-poc.pdf',
              'ufctex-times-lualatex-strict-poc.pdf',
              'ufctex-arial-lualatex-strict-poc.pdf',
          }
          missing = sorted(
              filename for filename in expected_files
              if not (destination / filename).is_file()
          )
          if missing:
              raise SystemExit(f'Missing expected artifact files: {", ".join(missing)}')

          print(f'Downloaded and verified artifact {name} ({artifact["id"]}).')
          PY

      - name: Certify literal fonts, Unicode, embedding and PDF/A-2b
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v docker >/dev/null 2>&1
          sh tests/v2-windows-font-pdfa-check.sh windows-font-pdfs

      - name: Publish Windows literal font certification status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/windows-font-poc',
              'description': 'Windows fonts: literal identity, embedding and PDF/A-2b',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-ci-status',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY

  latex-preflight:
    name: latex-preflight
    if: ${{ always() }}
    needs:
      - v2-reference
      - v2-structure
      - v2-objects-bibliography
      - v2-profiles
      - v2-posttextual-compat
      - v2-overleaf-stable-poc
      - v2-font-windows-poc
      - v2-font-windows-pdfa
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required gate
        env:
          REFERENCE: ${{ needs.v2-reference.result }}
          STRUCTURE: ${{ needs.v2-structure.result }}
          OBJECTS_BIB: ${{ needs.v2-objects-bibliography.result }}
          PROFILES: ${{ needs.v2-profiles.result }}
          POSTTEXTUAL: ${{ needs.v2-posttextual-compat.result }}
          OVERLEAF: ${{ needs.v2-overleaf-stable-poc.result }}
          WINDOWS_BUILD: ${{ needs.v2-font-windows-poc.result }}
          WINDOWS_PDFA: ${{ needs.v2-font-windows-pdfa.result }}
          GATE_T_REQUIRED: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/maintenance/v2.'))) }}
        run: |
          test "$REFERENCE" = success
          test "$STRUCTURE" = success
          test "$OBJECTS_BIB" = success
          test "$PROFILES" = success
          test "$POSTTEXTUAL" = success

          if [ "$GATE_T_REQUIRED" = true ]; then
            test "$OVERLEAF" = success
            test "$WINDOWS_BUILD" = success
            test "$WINDOWS_PDFA" = success
          fi

      - name: Publish required gate status
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/latex-preflight',
              'description': 'Required V2 TeX Live, Overleaf and Windows gate',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-ci-status',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY
