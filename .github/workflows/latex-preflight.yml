name: LaTeX preflight

on:
  pull_request:
    branches:
      - main
      - 1.x
  push:
    branches:
      - main
      - 1.x
      - 'maintenance/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  v2-reference:
    name: V2 reference document
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate reference document
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            sh tests/v2-reference-check.sh
      - name: Validate reference PDF/A-2b
        run: sh tests/v2-pdfa-check.sh

  v2-structure:
    name: V2 layout, fonts, pre-textuals and projects
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate structure
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make \
              v2-distribution-check \
              v2-layout-check \
              v2-font-config-check \
              v2-pdf-geometry-check \
              v2-normative-complement-check \
              v2-pretextual-check \
              v2-duplex-pretextual-check \
              v2-project-check \
              v2-build-check \
              v2-multivolume-check \
              v2-catalog-card-check

  v2-objects-bibliography:
    name: V2 objects and bibliography
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate objects and bibliography
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-object-check v2-minted-check v2-bib-check

  v2-profiles:
    name: V2 profile matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and validate twelve profile PDFs
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-profile-check
      - name: Validate twelve profile PDFs as PDF/A-2b
        run: sh tests/v2-profile-pdfa-check.sh

  v2-posttextual-compat:
    name: V2 post-textuals and v1 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate post-textuals and legacy API
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-posttextual-compat-check v2-duplex-posttextual-check

  v2-overleaf-stable-poc:
    name: V2 Overleaf stable proxy
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/maintenance/v2.0.1-typography') ||
      github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pin abntexto 1.1 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          expected = 'f9cc40c65fbf6c2f9520b4ca4f312440e8d0ee6a'
          url = f'https://api.github.com/repos/ElaysonAbreu/abntexto/git/blobs/{expected}'
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'ufctex-overleaf-smoke',
              },
          )
          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          content = base64.b64decode(data['content'])
          digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          if digest != expected:
              raise SystemExit(f'abntexto blob mismatch: {digest}')
          if b'[2026-05-08 1.1 Preparation of works in ABNT standards]' not in content:
              raise SystemExit('abntexto 1.1 identity marker missing')
          Path('abntexto.cls').write_bytes(content)
          PY

      - name: Validate TeX Live 2025 proxy
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-overleaf-stable-check

      - name: Publish Overleaf proxy status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/overleaf-proxy',
              'description': 'TeX Live 2025 Overleaf proxy',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-ci-status',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY

  v2-font-windows-poc:
    name: V2 Windows literal font POC
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/maintenance/v2.0.1-typography') ||
      github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Microsoft fonts
        shell: pwsh
        run: |
          $required = @(
            'times.ttf', 'timesbd.ttf', 'timesi.ttf', 'timesbi.ttf',
            'arial.ttf', 'arialbd.ttf', 'ariali.ttf', 'arialbi.ttf'
          )
          foreach ($font in $required) {
            $path = Join-Path $env:WINDIR "Fonts\$font"
            if (-not (Test-Path $path)) {
              throw "Required Microsoft font file not found: $path"
            }
            Write-Host "Found $path"
          }

      - name: Install Poppler
        shell: pwsh
        run: choco install poppler --yes --no-progress

      - name: Install TeX Live 2026 and font dependencies
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'texlive-2026'
          $profile = Join-Path $env:RUNNER_TEMP 'texlive.profile'
          @"
          selected_scheme scheme-small
          TEXDIR $root
          TEXMFCONFIG $root/texmf-config
          TEXMFVAR $root/texmf-var
          TEXMFHOME $root/texmf-home
          option_doc 0
          option_src 0
          option_autobackup 0
          option_path 0
          "@ | Set-Content -Path $profile -Encoding ascii

          Set-Location $env:RUNNER_TEMP
          Invoke-WebRequest 'https://mirror.ctan.org/systems/texlive/tlnet/install-tl.zip' -OutFile 'install-tl.zip'
          Expand-Archive -Path 'install-tl.zip' -DestinationPath 'install-tl' -Force
          $installer = Get-ChildItem -Path 'install-tl' -Filter 'install-tl-windows.bat' -Recurse | Select-Object -First 1
          if (-not $installer) {
            throw 'TeX Live Windows installer was not found after extraction.'
          }
          & $installer.FullName --profile=$profile
          if ($LASTEXITCODE -ne 0) {
            throw "TeX Live installer failed with exit code $LASTEXITCODE"
          }

          $bin = Join-Path $root 'bin\windows'
          if (-not (Test-Path (Join-Path $bin 'tlmgr.bat'))) {
            throw "TeX Live binary directory not found: $bin"
          }
          & (Join-Path $bin 'tlmgr.bat') install abntexto biblatex-abnt biber newtx fontspec unicode-math winfonts xpatch etoolbox
          if ($LASTEXITCODE -ne 0) {
            throw "tlmgr package installation failed with exit code $LASTEXITCODE"
          }
          & (Join-Path $bin 'updmap-sys.exe') --enable Map=winfonts.map
          if ($LASTEXITCODE -ne 0) {
            throw "updmap-sys failed with exit code $LASTEXITCODE"
          }

          $version = & (Join-Path $bin 'tlmgr.bat') version | Out-String
          Write-Host $version
          if ($version -notmatch '2026') {
            throw 'The Windows POC did not install TeX Live 2026.'
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Prove literal Times New Roman and Arial through ufctex
        shell: bash
        env:
          UFC_WINDOWS_FONTS_DIR: C:/Windows/Fonts
        run: sh tests/v2-font-poc.sh

      - name: Publish Windows font POC status
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $state = if ($env:JOB_STATUS -eq 'success') { 'success' } else { 'failure' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $body = @{
            state = $state
            context = 'ufctex/windows-font-poc'
            description = 'Windows literal Times New Roman and Arial proof'
            target_url = $env:RUN_URL
          } | ConvertTo-Json
          Invoke-RestMethod `
            -Method Post `
            -Uri "https://api.github.com/repos/$env:REPO/statuses/$env:SHA" `
            -Headers $headers `
            -ContentType 'application/json' `
            -Body $body | Out-Null

  latex-preflight:
    name: latex-preflight
    if: ${{ always() }}
    needs:
      - v2-reference
      - v2-structure
      - v2-objects-bibliography
      - v2-profiles
      - v2-posttextual-compat
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate required gate
        env:
          REFERENCE: ${{ needs.v2-reference.result }}
          STRUCTURE: ${{ needs.v2-structure.result }}
          OBJECTS_BIB: ${{ needs.v2-objects-bibliography.result }}
          PROFILES: ${{ needs.v2-profiles.result }}
          POSTTEXTUAL: ${{ needs.v2-posttextual-compat.result }}
        run: |
          test "$REFERENCE" = success
          test "$STRUCTURE" = success
          test "$OBJECTS_BIB" = success
          test "$PROFILES" = success
          test "$POSTTEXTUAL" = success

      - name: Publish required gate status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          state = 'success' if os.environ['JOB_STATUS'] == 'success' else 'failure'
          payload = json.dumps({
              'state': state,
              'context': 'ufctex/latex-preflight',
              'description': 'Required V2 TeX Live 2026 gate',
              'target_url': os.environ['RUN_URL'],
          }).encode()
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'ufctex-ci-status',
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'commit status HTTP {response.status}')
          PY
