name: R5 human-readable complete 28 PDF editorial review
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - tools/review/generate_readable_28.py
      - tools/review/build_readable_28.py
      - tools/review/verify_final_pdfa_28.py
      - .github/workflows/r5-human-readable-28.yml
      - abntexto-ufc.cls
      - tests/integration/frontmatter/generate-comprehensive-corpus.py
      - tests/integration/frontmatter/generate-integrated-locale.py
      - examples/canonical-mesh-study/**
permissions:
  contents: read
  actions: read
concurrency:
  group: r5-readable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-pdfs:
    name: Human-readable complete PDF / ${{ matrix.locale }} (7 document types)
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Checkout exactly the pull-request SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile seven full, readable editorial PDFs in real TeX Live
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils mupdf-tools
            git config --global --add safe.directory "$PWD"
            python3 tools/review/build_readable_28.py --locale ${{ matrix.locale }}
      - name: Retain editorial PDFs, rendered cover previews and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readable-complete-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            artifacts/human-readable-28/${{ matrix.locale }}/*.pdf
            artifacts/human-readable-28/${{ matrix.locale }}/*-cover.png
            artifacts/human-readable-28/${{ matrix.locale }}/review-pdfs.json
            artifacts/human-readable-28/${{ matrix.locale }}/review-sources.json
            artifacts/human-readable-28/${{ matrix.locale }}/*-receipt.json
            artifacts/human-readable-28/${{ matrix.locale }}/*.log
            artifacts/human-readable-28/${{ matrix.locale }}/*.tex
            artifacts/comprehensive-7x4/${{ matrix.locale }}/texts/*.tex
          if-no-files-found: warn
          retention-days: 21

  verify-final-pdfa:
    # Historical acceptance is source-bound; changed-class PRs use the separate development gate.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: veraPDF 2b / 28 final readable PDFs from this SHA
    needs: [real-pdfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retrieve the four language artifacts from this same workflow run
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          if [ "$actual" != "$SOURCE_COMMIT_SHA" ]; then
            echo "R81-FINAL-PDFA-BLOCKED: wrong source commit $actual"
            exit 1
          fi
          mkdir -p artifacts/r5-final-pdfa/source
          for loc in pt en es fr; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "readable-complete-$loc-$GITHUB_RUN_ID" \
              --dir "artifacts/r5-final-pdfa/source/$loc"
          done
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 tools/review/verify_final_pdfa_28.py prepare
      - name: Run independent veraPDF CLI on the unchanged 28 PDF bytes
        shell: bash
        run: |
          set -euo pipefail
          docker pull verapdf/cli:latest
          docker image inspect verapdf/cli:latest --format '{{json .RepoDigests}}' \
            > artifacts/r5-final-pdfa/validator-image-digests.json
          docker run --rm -v "$PWD/artifacts/r5-final-pdfa/pdfs:/data:ro" \
            verapdf/cli:latest --flavour 2b --format raw --recurse /data \
            > artifacts/r5-final-pdfa/verapdf-raw.xml \
            2> artifacts/r5-final-pdfa/verapdf-stderr.log || {
              echo "Validator returned nonzero; retaining raw report"
              test -s artifacts/r5-final-pdfa/verapdf-raw.xml
            }
          test -s artifacts/r5-final-pdfa/verapdf-raw.xml
      - name: Validate the 28 independent PDF/A reports and preserve violations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/review/verify_final_pdfa_28.py verify
      - name: Preserve SHA-bound PDF/A receipt, rules, raw XML and validator digest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r81-final-pdfa28-${{ github.run_id }}
          path: |
            artifacts/r5-final-pdfa/input-manifest.json
            artifacts/r5-final-pdfa/validator-image-digests.json
            artifacts/r5-final-pdfa/verapdf-raw.xml
            artifacts/r5-final-pdfa/verapdf-stderr.log
            artifacts/r5-final-pdfa/results.json
          if-no-files-found: warn
          retention-days: 21

  verify-development-pdfa:
    # Every PR validates its actual candidate PDFs; no historic approval is inherited.
    if: ${{ github.event_name == 'pull_request' && needs.real-pdfs.result == 'success' }}
    name: Development PDF/A-2b / 28 PDFs (human review pending)
    needs: [real-pdfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      R81_PDFA_SCOPE: development
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retrieve the four language artifacts from this same workflow run
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          if [ "$actual" != "$SOURCE_COMMIT_SHA" ]; then
            echo "R81-FINAL-PDFA-BLOCKED: wrong source commit $actual"
            exit 1
          fi
          mkdir -p artifacts/r5-development-pdfa/source
          for loc in pt en es fr; do
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "readable-complete-$loc-$GITHUB_RUN_ID" \
              --dir "artifacts/r5-development-pdfa/source/$loc"
          done
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends poppler-utils
          python3 tools/review/verify_final_pdfa_28.py prepare
      - name: Run independent veraPDF CLI on the unchanged 28 PDF bytes
        shell: bash
        run: |
          set -euo pipefail
          docker pull verapdf/cli:latest
          docker image inspect verapdf/cli:latest --format '{{json .RepoDigests}}' \
            > artifacts/r5-development-pdfa/validator-image-digests.json
          docker run --rm -v "$PWD/artifacts/r5-development-pdfa/pdfs:/data:ro" \
            verapdf/cli:latest --flavour 2b --format raw --recurse /data \
            > artifacts/r5-development-pdfa/verapdf-raw.xml \
            2> artifacts/r5-development-pdfa/verapdf-stderr.log || {
              echo "Validator returned nonzero; retaining raw report"
              test -s artifacts/r5-development-pdfa/verapdf-raw.xml
            }
          test -s artifacts/r5-development-pdfa/verapdf-raw.xml
      - name: Validate the 28 independent PDF/A reports and preserve violations
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/review/verify_final_pdfa_28.py verify
      - name: Preserve SHA-bound PDF/A receipt, rules, raw XML and validator digest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r81-development-pdfa28-${{ github.run_id }}
          path: |
            artifacts/r5-development-pdfa/input-manifest.json
            artifacts/r5-development-pdfa/validator-image-digests.json
            artifacts/r5-development-pdfa/verapdf-raw.xml
            artifacts/r5-development-pdfa/verapdf-stderr.log
            artifacts/r5-development-pdfa/results.json
          if-no-files-found: warn
          retention-days: 21
