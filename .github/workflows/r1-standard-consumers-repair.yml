name: R1 standards consumer repair

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-standard-consumers-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Reconcile active standards consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          CHECKS = Path('tests/checks')

          # Current validation policy and vector extension names.
          for path in sorted(CHECKS.glob('*.py')):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  'ROOT / "standards" / "oracle-policy.json"',
                  'ROOT / "standards" / "validation-reference-policy.json"',
              )
              text = text.replace(
                  'ROOT / "standards" / "vector-rule-oracle-extension.json"',
                  'ROOT / "standards" / "vector-rule-validation-extension.json"',
              )
              text = text.replace(
                  'ROOT / "standards" / "n11-project-structure-final-pdf-scenario.json"',
                  'ROOT / "standards" / "research-project-structure-final-pdf-scenario.json"',
              )
              if 'validation-reference-policy.json' in text:
                  text = text.replace('ORACLE_POLICY', 'VALIDATION_POLICY')
                  text = re.sub(r'\boracle\b', 'validation', text)
                  text = re.sub(r'\bOracle\b', 'Validation', text)
                  text = text.replace('oracle policy', 'validation reference policy')
                  text = text.replace('oracle-policy', 'validation-reference-policy')
                  text = text.replace('oracle extension', 'validation extension')
                  text = text.replace('oracle-extension', 'validation-extension')
                  text = text.replace('oracle configuration', 'validation configuration')
                  text = text.replace('oracle failed', 'validation failed')
                  text = text.replace('N5 oracle policy', 'validation reference policy')
                  text = text.replace('N5 tolerances', 'validation tolerances')
                  text = text.replace('N5 font-size tolerance', 'validation font-size tolerance')
                  text = text.replace('N5 vertical tolerance', 'validation vertical tolerance')
                  text = text.replace('N5 vector-rule-geometry capability', 'vector-rule-geometry capability')
                  text = text.replace('existing-N5', 'existing bounded')
                  text = text.replace('existing_n5_rule_ids', 'bounded_rule_ids')
                  text = text.replace('existing-n5-capability', 'bounded-capability')
                  text = text.replace('n5_vertical_tolerance', 'validation_vertical_tolerance')
                  text = text.replace('validation.get("schema_version") != 1', 'validation.get("schema_version") != 2')
                  text = re.sub(
                      r'\s*or\s+validation\.get\("phase"\)\s*!=\s*"N5"',
                      '',
                      text,
                  )
                  text = re.sub(
                      r'validation\.get\("phase"\)\s*!=\s*"N5"\s*or\s*',
                      '',
                      text,
                  )
              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Completed campaign/scope ledgers were deleted in R1 Block 2. Current checkers
          # must derive their scope from semantic scenario + full contract + locator data.
          campaign_files = {
              'normative_equation_display.py': ('presentation_rules',),
              'normative_illustration.py': ('reduced',),
              'normative_table_typography.py': ('reduced',),
              'normative_table_ibge_vector.py': ('located',),
          }
          for name, (next_statement,) in campaign_files.items():
              path = CHECKS / name
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'^CAMPAIGN_PLAN = .*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'^\s*plan = load_json\(CAMPAIGN_PLAN\)\n', '', text, flags=re.MULTILINE)
              pattern = rf'\n    campaigns = .*?(?=\n    {re.escape(next_statement)} = )'
              text, count = re.subn(pattern, '\n', text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{name}: could not remove deleted campaign-plan dependency')
              path.write_text(text, encoding='utf-8')

          # Appendix/annex and index/glossary scenarios are self-contained current evidence
          # contracts; compare them directly with the supported full-contract rule set.
          for name, expected_count in (
              ('normative_appendix_annex.py', 13),
              ('normative_index_glossary.py', 5),
          ):
              path = CHECKS / name
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'^N10_SCOPE = .*\n', '', text, flags=re.MULTILINE)
              text = re.sub(r'^\s*scope = load_json\(N10_SCOPE, .*?\)\n', '', text, flags=re.MULTILINE)
              pattern = (
                  r'\n    campaign = next\(.*?'
                  r'    if .*?campaign.*?\n'
                  r'        fail\(.*?\)\n'
                  r'    scenario_rules = scenario\.get\("rules"\)\n'
                  r'    campaign_rules = .*?\n'
                  r'    if scenario_rules != campaign_rules or len\(scenario_rules\) != \d+:\n'
                  r'        fail\(.*?\)\n'
              )
              replacement = (
                  '\n    scenario_rules = scenario.get("rules")\n'
                  f'    if not isinstance(scenario_rules, list) or len(scenario_rules) != {expected_count}:\n'
                  '        fail("scenario rule scope is invalid")\n'
              )
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f'{name}: could not remove deleted N10 scope dependency')
              marker = '    for rule_id, '
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f'{name}: supported-rule loop not found')
              text = text[:index] + (
                  '    if set(scenario_rules) != set(supported):\n'
                  '        fail("scenario rules drifted from the supported full-contract scope")\n\n'
              ) + text[index:]
              path.write_text(text, encoding='utf-8')

          # Research-project evidence no longer depends on the deleted N11 scope ledger.
          path = CHECKS / 'normative_research_project_structure.py'
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^SCOPE = .*\n', '', text, flags=re.MULTILINE)
          text = re.sub(r'^\s*scope = load_json\(SCOPE\)\n', '', text, flags=re.MULTILINE)
          text = text.replace('    support_ids = set(scope.get("support_only_rule_ids", []))\n', '')
          text = text.replace(
              '    if rule_ids != expected_rule_ids or support_ids != expected_rule_ids:\n'
              '        fail(\n'
              '            "campaign/scope mismatch: "\n'
              '            f"scenario={sorted(rule_ids)} support={sorted(support_ids)}"\n'
              '        )\n',
              '    if rule_ids != expected_rule_ids:\n'
              '        fail(f"scenario rule scope drifted: {sorted(rule_ids)}")\n',
          )
          text, count = re.subn(
              r'\n    expected_progress = scenario\.get\("expected_progress", \{\}\).*?(?=\n    payload = \{)',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('normative_research_project_structure.py: progress ledger block not found')
          text = text.replace('        "bounded_progress": progress,\n', '')
          text = text.replace('        "bounded_progress_mismatches": progress_mismatches,\n', '')
          text, _ = re.subn(
              r'\n    print\(\n        "N11-EVIDENCE bounded-progress ".*?\n    \)\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          text, _ = re.subn(
              r'\n    if progress_mismatches:\n        fail\(.*?\n        \)\n',
              '\n',
              text,
              count=1,
              flags=re.DOTALL,
          )
          path.write_text(text, encoding='utf-8')

          # A deleted campaign audit is not an active normative source.
          path = CHECKS / 'normative_currency.py'
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^\s*ROOT / "standards" / "coverage-audit\.json",\n', '', text, flags=re.MULTILINE)
          path.write_text(text, encoding='utf-8')

          # Replace the deleted N9 scope ledger with a semantic current-contract integrity check.
          (CHECKS / 'normative_objects_scope.py').write_text('''#!/usr/bin/env python3
from __future__ import annotations

import ast
import sys
from pathlib import Path

ROOT = Path(__file__).resolve().parents[2]
sys.path.insert(0, str(ROOT / "tools"))

from normative_full import load_full_contract

TARGET_CATEGORIES = {"objects", "equations", "code-algorithms"}
CROSS_CUTTING_RULE_IDS = {
    "font.size.reduced.illustration-caption",
    "font.size.reduced.illustration-source",
    "font.size.reduced.table-caption",
    "font.size.reduced.table-source",
}
EXPECTED_PROJECT_POLICY = {
    "code.listing.project-policy",
    "algorithm.project-policy",
}


def fail(message: str) -> None:
    raise SystemExit(f"Objects scope integrity failed: {message}")


def runner_ids() -> set[str]:
    source = (ROOT / "tests" / "run.py").read_text(encoding="utf-8")
    module = ast.parse(source)
    result: set[str] = set()
    for node in ast.walk(module):
        if not isinstance(node, ast.Call):
            continue
        if not isinstance(node.func, ast.Name) or node.func.id != "Check":
            continue
        if not node.args or not isinstance(node.args[0], ast.Constant):
            continue
        if isinstance(node.args[0].value, str):
            result.add(node.args[0].value)
    return result


def main() -> None:
    contract = load_full_contract()
    rules = {rule["id"]: rule for rule in contract["rules"]}
    scoped = {
        rule_id
        for rule_id, rule in rules.items()
        if rule.get("category") in TARGET_CATEGORIES
    } | CROSS_CUTTING_RULE_IDS

    if len(scoped) != 23:
        fail(f"expected 23 current scoped rules, got {len(scoped)}")
    missing_cross = sorted(CROSS_CUTTING_RULE_IDS - set(rules))
    if missing_cross:
        fail("missing cross-cutting rules: " + ", ".join(missing_cross))

    for rule_id in CROSS_CUTTING_RULE_IDS:
        if rules[rule_id].get("values") != {"pt": 10}:
            fail(f"{rule_id}: expected 10 pt current contract")

    observed_project_policy = {
        rule_id for rule_id in scoped if rules[rule_id].get("authority") == "project-policy"
    }
    if observed_project_policy != EXPECTED_PROJECT_POLICY:
        fail(
            "project-policy boundary drifted: "
            f"{sorted(observed_project_policy)}"
        )
    for rule_id in EXPECTED_PROJECT_POLICY:
        if rules[rule_id].get("values") != {"supported": True, "normative_claim": False}:
            fail(f"{rule_id}: project-policy values drifted")
    for rule_id in sorted(scoped - EXPECTED_PROJECT_POLICY):
        if rules[rule_id].get("authority") != "normative":
            fail(f"{rule_id}: unexpected non-normative authority")

    gates = runner_ids()
    uncovered = sorted(
        rule_id
        for rule_id in scoped
        if not (set(rules[rule_id]["validation"]["checks"]) & gates)
    )
    if uncovered:
        fail("current scoped rules without unified validation gate: " + ", ".join(uncovered))

    print(
        "OBJECTS-SCOPE-EVIDENCE "
        f"rules={len(scoped)} project_policy={len(EXPECTED_PROJECT_POLICY)} "
        f"cross_cutting={len(CROSS_CUTTING_RULE_IDS)} uncovered=0"
    )


if __name__ == "__main__":
    main()
''', encoding='utf-8')

          # Validation-reference policy is current schema 2 and has no campaign phase.
          residual_policy_phase: list[str] = []
          for path in sorted(CHECKS.glob('*.py')):
              text = path.read_text(encoding='utf-8')
              if 'validation-reference-policy.json' in text and 'validation.get("phase")' in text:
                  residual_policy_phase.append(path.as_posix())
          if residual_policy_phase:
              raise SystemExit(
                  'Validation policy consumers still require a deleted phase:\n'
                  + '\n'.join(residual_policy_phase)
              )
          PY

          # Remove generated Python bytecode from the tracked source tree and prevent recurrence.
          git rm -r --ignore-unmatch tests/checks/__pycache__ tools/__pycache__
          if ! grep -qxF '__pycache__/' .gitignore; then
            printf '\n# Python generated files\n__pycache__/\n*.py[cod]\n' >> .gitignore
          fi

          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          constructed = re.compile(
              r'(?:ROOT\s*/\s*["\']standards["\']\s*/\s*["\'](?P<root_name>[^"\']+\.json)["\']'
              r'|Path\(["\'](?P<path_name>standards/[^"\']+\.json)["\']\)'
              r'|(?P<literal>standards/[A-Za-z0-9_.-]+\.json))'
          )
          missing: list[str] = []
          for item in sorted(tracked):
              if not item.startswith(('tests/', 'tools/', 'validator/')):
                  continue
              path = Path(item)
              if not path.is_file() or path.suffix not in {'.py', '.sh', '.tex', '.js', '.html', '.css'}:
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')
              for match in constructed.finditer(text):
                  if match.group('root_name'):
                      candidate = f"standards/{match.group('root_name')}"
                  elif match.group('path_name'):
                      candidate = match.group('path_name')
                  else:
                      candidate = match.group('literal')
                  if candidate not in tracked and not Path(candidate).is_file():
                      missing.append(f'{item}: {candidate}')
          if missing:
              raise SystemExit('Missing active standards references:\n' + '\n'.join(sorted(set(missing))))

          generated = [
              item for item in tracked
              if '/__pycache__/' in item or item.endswith(('.pyc', '.pyo'))
          ]
          if generated:
              raise SystemExit('Tracked Python generated files remain:\n' + '\n'.join(generated))
          PY

          python3 -m py_compile $(git ls-files 'tests/checks/*.py')
          for script in $(git ls-files 'tests/integration/*.sh'); do sh -n "$script"; done
          python3 tests/checks/normative_full_contract.py
          python3 tests/checks/normative_objects_scope.py
          python3 tests/checks/normative_currency.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore tests tools
          if git diff --cached --quiet; then
            echo 'No standards consumer changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: reconcile standards consumers'
          git push origin HEAD:refactor/v3-r1-rebaseline
