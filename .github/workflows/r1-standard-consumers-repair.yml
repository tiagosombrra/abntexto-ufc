name: R1 semantic rebaseline executor

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-standard-consumers-repair.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Rebaseline validation consumers and owners
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/r1_semantic_rebaseline.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PREFLIGHT = ROOT / ".github" / "workflows" / "latex-preflight.yml"\n', '')
          block = '''\n    preflight = PREFLIGHT.read_text(encoding="utf-8")\n    if "tests/integration/windows-font-pdfa.sh" not in preflight:\n        fail("external check windows-font-pdfa has no workflow owner")\n'''
          if block not in text:
              raise SystemExit('expected external-owner block not found')
          path.write_text(text.replace(block, '\n'), encoding='utf-8')
          PY
          python3 tools/r1_semantic_rebaseline.py
          git rm tools/r1_semantic_rebaseline.py

          python3 -m py_compile $(git ls-files 'tests/checks/*.py')
          for script in $(git ls-files 'tests/integration/*.sh'); do sh -n "$script"; done
          python3 tests/checks/normative_full_contract.py
          python3 tests/checks/normative_objects_scope.py
          python3 tests/checks/normative_currency.py
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add standards tests tools
          git commit -m 'refactor: normalize validation owners and policy consumers'
          git push origin HEAD:refactor/v3-r1-rebaseline
