name: Temporary A1 state reconciliation

on:
  push:
    branches:
      - docs/v3-a1-state-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact A1 canonical base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "e40a56deeca8c22797398b0c95835964aefd2b15"
          test "$(git rev-parse origin/main)" = "e40a56deeca8c22797398b0c95835964aefd2b15"

      - name: Reconcile stale state
        run: python .github/scripts/a1-state-reconcile.py

      - name: Verify normative/API authority documents unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code e40a56deeca8c22797398b0c95835964aefd2b15 -- \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md

      - name: Run repository static contract
        run: make static-check

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/a1-state-reconcile.py
          rm -f .github/workflows/a1-state-reconcile.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check e40a56deeca8c22797398b0c95835964aefd2b15
          mapfile -t changed < <(git diff --name-only e40a56deeca8c22797398b0c95835964aefd2b15)
          expected=(
            README.md
            docs/ARCHITECTURE.md
            docs/CTAN-RELEASE.md
            docs/R3-HARDENING-INVENTORY.md
            docs/ROADMAP-V3.0.0.md
            release/v3-r3-inventory.json
            release/v3-roadmap.json
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: reconcile canonical V3-A1 state'
          git push origin HEAD:docs/v3-a1-state-reconcile
