name: B7-C1 residual patch executor

on:
  push:
    branches:
      - 'fix/v3-r1-b7c1-clean-runner-contract'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[b7c1-residual]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/v3-r1-b7c1-clean-runner-contract
      - name: Repair residual clean-runner contracts
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('tests/integration/capes-guidance.sh'): [
                  ('template/frontmatter/agradecimentos.tex', 'template/frontmatter/acknowledgments.tex'),
              ],
              Path('tests/integration/references-6023.sh'): [
                  ('"$engine" -interaction=nonstopmode -halt-on-error -file-line-error "$fixture"',
                   '"$engine" -jobname="$job" -interaction=nonstopmode -halt-on-error -file-line-error "$fixture"'),
              ],
              Path('tests/smoke/base-profile.tex'): [
                  ('frontmatter/resumo', 'frontmatter/summary'),
              ],
              Path('tests/integration/reference-corpus.sh'): [
                  ('import re\nimport xml.etree.ElementTree as ET',
                   'import os\nimport re\nimport xml.etree.ElementTree as ET'),
                  ("if 'Execute make reference-assets' in text:\n    raise SystemExit('Corpus falhou: fallback de fotografia apareceu no PDF de CI.')",
                   "require_reference_images = os.environ.get('UFC_REQUIRE_REFERENCE_IMAGES', '0') == '1'\nif require_reference_images and 'Execute make reference-assets' in text:\n    raise SystemExit('Corpus falhou: fallback de fotografia apareceu quando fotografias de referência eram obrigatórias.')"),
              ],
          }

          for path, edits in replacements.items():
              source = path.read_text(encoding='utf-8')
              for old, new in edits:
                  count = source.count(old)
                  expected = 3 if path.name == 'references-6023.sh' else 1
                  if count != expected:
                      raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
                  source = source.replace(old, new)
              path.write_text(source, encoding='utf-8')
      - name: Validate residual patch
        run: |
          sh -n tests/integration/capes-guidance.sh
          sh -n tests/integration/references-6023.sh
          sh -n tests/integration/reference-corpus.sh
          grep -F 'template/frontmatter/acknowledgments.tex' tests/integration/capes-guidance.sh
          test "$(grep -Fc -- '-jobname="$job"' tests/integration/references-6023.sh)" -eq 3
          grep -F 'frontmatter/summary' tests/smoke/base-profile.tex
          ! grep -F 'frontmatter/resumo' tests/smoke/base-profile.tex
          grep -F 'require_reference_images' tests/integration/reference-corpus.sh
          git diff --check
      - name: Commit patch and remove executor
        run: |
          git rm .github/workflows/b7c1-residual-patch.yml
          git add tests/integration/capes-guidance.sh tests/integration/references-6023.sh tests/integration/reference-corpus.sh tests/smoke/base-profile.tex
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[b7c1-residual] test: repair remaining clean-runner contracts'
          git push origin HEAD:fix/v3-r1-b7c1-clean-runner-contract
