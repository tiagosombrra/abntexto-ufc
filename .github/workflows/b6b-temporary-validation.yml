name: B6-B temporary static gate validation

on:
  push:
    branches:
      - feat/v3-r1-b6b-static-gate

permissions:
  contents: write

jobs:
  validate:
    if: "github.event.head_commit.message == 'chore: add temporary B6-B validation'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate canonical static gate
        shell: bash
        run: |
          set -euo pipefail

          t0=$(date +%s%N)
          make static-check | tee /tmp/b6b-static.log
          t1=$(date +%s%N)
          python3 - "$t0" "$t1" <<'PY'
          import sys
          seconds = (int(sys.argv[2]) - int(sys.argv[1])) / 1e9
          print(f'B6-B-RUNTIME seconds={seconds:.3f}')
          if seconds > 15:
              raise SystemExit('static gate exceeded the bounded 15-second certification ceiling')
          PY
          grep -Fq 'STATIC-GATE-EVIDENCE status=PASS' /tmp/b6b-static.log
          grep -Fq 'side_effects=0 tex_pdf=0 network=0' /tmp/b6b-static.log

          touch .b6b-preexisting-dirty
          before=$(git status --porcelain=v1 --untracked-files=all)
          make static-check >/tmp/b6b-dirty.log
          after=$(git status --porcelain=v1 --untracked-files=all)
          test "$before" = "$after"
          grep -Fq 'STATIC-GATE-EVIDENCE status=PASS' /tmp/b6b-dirty.log
          rm .b6b-preexisting-dirty

          cp validator/validation-vectors.json /tmp/b6b-validation-vectors.json
          printf '\n{' >> validator/validation-vectors.json
          if make static-check >/tmp/b6b-negative.log 2>&1; then
            echo 'Static gate unexpectedly accepted malformed tracked JSON.' >&2
            exit 1
          fi
          cp /tmp/b6b-validation-vectors.json validator/validation-vectors.json
          git diff --exit-code -- validator/validation-vectors.json
          grep -Fq 'Static gate failed: JSON parse error' /tmp/b6b-negative.log

          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'B6-B-VALIDATION status=PASS normal=PASS dirty_preservation=PASS malformed_json_rejection=PASS committed_diff=PASS permanent_workflows=0'

      - name: Self-remove temporary validation
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b6b-temporary-validation.yml
          git commit -m 'chore: remove temporary B6-B validation'
          git push origin HEAD:feat/v3-r1-b6b-static-gate
