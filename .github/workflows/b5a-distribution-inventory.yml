name: B5-A distribution inventory

on:
  push:
    branches:
      - audit/v3-r1-b5a-inventory

permissions:
  contents: write

jobs:
  inventory:
    if: "github.event.head_commit.message == 'chore: add temporary B5-A distribution inventory'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory distribution and public bundle surfaces
        shell: bash
        run: |
          set -euo pipefail
          echo '=== repository root ==='
          find . -maxdepth 1 -mindepth 1 -printf '%f\n' | sort

          echo '=== tracked distribution/public/release candidates ==='
          git ls-files | grep -Ei '(^|/)(dist|distribution|bundle|public|release|overleaf|ctan|package|manifest|archive)(/|[-_.]|$)|fetch-abntexto|build-path' || true

          echo '=== Makefile targets and distribution-related lines ==='
          grep -nE '^[A-Za-z0-9_.-]+:|bundle|public|dist|distribution|release|overleaf|ctan|package|manifest|archive|zip|tar|fetch-abntexto|build-path|abntexto' Makefile || true

          echo '=== fetch-abntexto helper ==='
          sed -n '1,260p' tools/fetch-abntexto.py

          echo '=== fetch-abntexto textual consumers ==='
          git grep -n -F 'fetch-abntexto.py' -- . ':!.github/workflows/*' || true
          git grep -n -F 'fetch_abntexto' -- . ':!.github/workflows/*' || true

          echo '=== distribution/build-path policy and evidence references ==='
          git grep -n -i -E 'distribution|public bundle|bundle|build-path|overleaf|ctan|manifest|archive|package|flatten|copy rule|reproduc' -- standards release tests Makefile README.md docs tools ':!.github/workflows/*' || true

          echo '=== integration/check candidates ==='
          git ls-files tests | grep -Ei 'build|bundle|dist|distribution|overleaf|release|package|manifest|archive|public' || true

          echo '=== current runtime/support tree ==='
          echo '-- root class --'
          git ls-files abntexto-ufc.cls
          echo '-- package modules --'
          git ls-files 'abntexto-ufc/*' | sort
          echo '-- template tree --'
          git ls-files 'template/*' | sort
          echo '-- assets tree --'
          git ls-files 'assets/*' | sort

          echo '=== references to root class/modules/templates/assets ==='
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          needles = ['abntexto-ufc.cls', 'abntexto-ufc/', 'template/', 'assets/']
          for needle in needles:
              cp = subprocess.run(['git','grep','-n','-F',needle,'--','.'], text=True, capture_output=True)
              lines=[x for x in cp.stdout.splitlines() if '.github/workflows/' not in x]
              print(f'NEEDLE {needle} refs={len(lines)}')
              for line in lines[:80]: print(line)

          tracked = subprocess.run(['git','ls-files'], text=True, capture_output=True, check=True).stdout.splitlines()
          suspicious=[]
          terms=('dist','distribution','bundle','public','release','overleaf','ctan','package','manifest','archive')
          for p in tracked:
              low=p.lower()
              if any(term in low for term in terms):
                  suspicious.append(p)
          print(f'DISTRIBUTION_PATH_CANDIDATES={len(suspicious)}')
          for p in suspicious: print('PATH',p)
          PY

          echo '=== generated/artifact directories tracked? ==='
          git ls-files | grep -E '(^|/)(build|dist|artifacts?|out|output|tmp|temp)(/|$)' || true

          echo '=== current branch-only workflows ==='
          git ls-files '.github/workflows/*'

          echo '=== proportional B5-A gates ==='
          python3 -m py_compile tools/fetch-abntexto.py
          python3 tests/checks/repository_contract.py
          python3 tests/checks/canonical_identity.py
          git diff --check
          echo 'B5-A-DISTRIBUTION-INVENTORY status=PASS'

      - name: Remove temporary inventory workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b5a-distribution-inventory.yml
          git commit -m 'chore: remove temporary B5-A distribution inventory'
          git push origin HEAD:audit/v3-r1-b5a-inventory
