name: B8 Windows runner probe

on:
  push:
    branches:
      - fix/v3-r1-b8-windows-certification-wiring

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Inventory Windows certification toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Windows runner: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "Image OS: $env:ImageOS"
          Write-Host "Image version: $env:ImageVersion"

          $commands = @(
            'bash', 'python', 'pdflatex', 'lualatex', 'kpsewhich',
            'ttf2tfm', 'vptovf', 'mktexlsr', 'biber',
            'pdffonts', 'pdftotext', 'choco'
          )
          foreach ($name in $commands) {
            $command = Get-Command $name -ErrorAction SilentlyContinue
            if ($command) {
              Write-Host "COMMAND $name = $($command.Source)"
            } else {
              Write-Host "COMMAND $name = MISSING"
            }
          }

          $fontFiles = @(
            'times.ttf', 'timesi.ttf', 'timesbd.ttf', 'timesbi.ttf',
            'arial.ttf', 'ariali.ttf', 'arialbd.ttf', 'arialbi.ttf'
          )
          foreach ($file in $fontFiles) {
            $path = Join-Path $env:WINDIR "Fonts\$file"
            Write-Host "FONT $file = $(Test-Path $path)"
          }

          foreach ($root in @('C:\texlive', 'C:\Program Files\MiKTeX', 'C:\ProgramData\chocolatey\lib')) {
            if (Test-Path $root) {
              Write-Host "ROOT $root = PRESENT"
              Get-ChildItem -Path $root -Depth 2 -ErrorAction SilentlyContinue |
                Select-Object -First 40 -ExpandProperty FullName
            } else {
              Write-Host "ROOT $root = ABSENT"
            }
          }

          if (Get-Command choco -ErrorAction SilentlyContinue) {
            choco list --limit-output | Select-String -Pattern 'miktex|texlive|poppler|ghostscript|java'
          }

  cleanup:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/v3-r1-b8-windows-certification-wiring

      - name: Remove temporary probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tiago Sombra"
          git config user.email "tiagosombrra@users.noreply.github.com"
          git rm -f .github/workflows/b8-windows-probe.yml
          git commit -m "ci: remove temporary B8 Windows runner probe"
          git push origin HEAD:fix/v3-r1-b8-windows-certification-wiring
