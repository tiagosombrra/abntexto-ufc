name: PDF validator

# External actions are pinned to immutable commit SHAs.
on:
  push:
    branches:
      - main
      - 'release/v2.*'
    paths:
      - 'validator/**'
      - 'normativa/**'
      - 'tools/validate-ufc-pdf.py'
      - 'tools/normative_catalog.py'
      - 'tests/checks/validator_source.py'
      - 'tests/checks/normative_n14_validator_contract.py'
      - '.github/workflows/validator-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-validator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate sources
        run: python3 tests/checks/validator_source.py

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build normative catalog
        run: python3 tools/normative_catalog.py --emit-web validator/normative-catalog.js
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: validator
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
