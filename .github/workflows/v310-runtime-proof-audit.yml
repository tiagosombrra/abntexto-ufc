name: v3.1.0 corrected-runtime 72-ID original archive byte audit (ARCHIVE ONLY)
on:
  # Archived evidence is not a current-source certification gate.
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: v310-runtime-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-proof-archives:
    name: SHA-bound 72-ID corrected-runtime archive audit (candidate only)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT_SHA: f0e3617783e6d7bf072d846a0e28b62d7f79b232
    steps:
      - name: Checkout immutable historical verifier source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f0e3617783e6d7bf072d846a0e28b62d7f79b232
          fetch-depth: 0
          persist-credentials: false
      - name: Restore immutable original proof history
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/pull/592/head
          test "$(git rev-parse FETCH_HEAD)" = "af313c17aafe6b1c8cabc97917f40d5c9afa5dcc"
          git merge-base --is-ancestor "9ab436da5027c4e20c305398bf89356b70bb17ad" FETCH_HEAD
      - name: Verify exact source, class, 72 identifiers and mutation controls
        run: |
          set -euo pipefail
          python3 tools/ci/audit-v310-runtime-candidate.py --self-test \
            --report artifacts/v310-runtime-audit/preflight.json
      - name: Fetch original ten GitHub ZIPs and independently audit their bytes
        run: |
          set -euo pipefail
          python3 tools/ci/audit-v310-runtime-candidate.py \
            --archives artifacts/v310-runtime-audit/archives \
            --download \
            --report artifacts/v310-runtime-audit/original-archive-audit.json
      - name: Preserve source-bound proof report without republishing old ZIPs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v310-runtime-72-candidate-byte-audit-${{ github.run_id }}
          path: |
            artifacts/v310-runtime-audit/preflight.json
            artifacts/v310-runtime-audit/original-archive-audit.json
          retention-days: 30
          if-no-files-found: warn
