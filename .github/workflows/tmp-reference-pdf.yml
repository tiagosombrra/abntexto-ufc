name: Temporary V3 reference PDF

on:
  push:
    branches:
      - plan/v3-regression-reset

permissions:
  contents: read

jobs:
  build-reference-pdf:
    name: Build canonical V3 reference PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build canonical reference with TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make clean
            make compile
            mkdir -p artifacts/reference-pdf
            cp template/main.pdf artifacts/reference-pdf/abntexto-ufc-v3-canonical.pdf
            pdfinfo artifacts/reference-pdf/abntexto-ufc-v3-canonical.pdf > artifacts/reference-pdf/pdfinfo.txt
            sha256sum artifacts/reference-pdf/abntexto-ufc-v3-canonical.pdf > artifacts/reference-pdf/sha256.txt
            {
              echo "git_sha=$GITHUB_SHA"
              echo "workflow_run=$GITHUB_RUN_ID"
              echo "texlive=2026"
              echo "engine=pdflatex"
              echo "source=template/main.tex"
            } > artifacts/reference-pdf/provenance.txt

      - name: Upload canonical reference artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v3-reference-pdf-${{ github.sha }}
          path: artifacts/reference-pdf/
          if-no-files-found: error
          retention-days: 7
