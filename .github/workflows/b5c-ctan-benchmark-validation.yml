name: B5-C CTAN benchmark validation

on:
  push:
    branches:
      - feat/v3-r1-b5c-package-ctan

permissions:
  contents: write

jobs:
  validate:
    if: "github.event.head_commit.message == 'chore: add temporary B5-C CTAN benchmark validation'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate CTAN submission and deterministic distribution contract
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends git
            git config --global --add safe.directory "$GITHUB_WORKSPACE"

            python3 -m py_compile \
              tools/build-public-bundles.py \
              tools/build-distribution-bundles.py \
              tests/checks/public_bundles.py \
              tests/checks/distribution_bundles.py

            make distribution-bundles
            test ! -e .abntexto-ufc-upstream.cls

            python3 tools/fetch-abntexto.py --output /tmp/abntexto-ufc-validation.cls
            python3 tests/checks/distribution_bundles.py --abntexto /tmp/abntexto-ufc-validation.cls
            python3 tests/checks/public_bundles.py --abntexto /tmp/abntexto-ufc-validation.cls
            python3 tests/checks/canonical_identity.py
            python3 tests/checks/repository_contract.py
            git diff --check

            rm -rf /tmp/abntexto-ufc-ctan-stage /tmp/abntexto-ufc-ctan-work /tmp/abntexto-ufc-ctan-dep
            mkdir -p /tmp/abntexto-ufc-ctan-stage /tmp/abntexto-ufc-ctan-work /tmp/abntexto-ufc-ctan-dep
            cp /tmp/abntexto-ufc-validation.cls /tmp/abntexto-ufc-ctan-dep/abntexto.cls
            python3 - <<'PY'
            import zipfile
            from pathlib import Path
            archive = Path('dist/abntexto-ufc-ctan-3.0.0.zip')
            target = Path('/tmp/abntexto-ufc-ctan-stage')
            with zipfile.ZipFile(archive) as zf:
                zf.extractall(target)
            PY

            test -f /tmp/abntexto-ufc-ctan-stage/abntexto-ufc/README.md
            test -s /tmp/abntexto-ufc-ctan-stage/abntexto-ufc/abntexto-ufc.pdf
            test -f /tmp/abntexto-ufc-ctan-stage/abntexto-ufc/abntexto-ufc.tex
            cp /tmp/abntexto-ufc-ctan-stage/abntexto-ufc/abntexto-ufc-example.tex /tmp/abntexto-ufc-ctan-work/example.tex
            export TEXINPUTS="/tmp/abntexto-ufc-ctan-stage/abntexto-ufc//:/tmp/abntexto-ufc-ctan-dep//:"
            test "$(kpsewhich abntexto-ufc.cls)" = "/tmp/abntexto-ufc-ctan-stage/abntexto-ufc/abntexto-ufc.cls"
            test "$(kpsewhich abntexto.cls)" = "/tmp/abntexto-ufc-ctan-dep/abntexto.cls"
            cd /tmp/abntexto-ufc-ctan-work
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error example.tex >/tmp/abntexto-ufc-ctan-pass1.log 2>&1 || { cat /tmp/abntexto-ufc-ctan-pass1.log; exit 1; }
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error example.tex >/tmp/abntexto-ufc-ctan-pass2.log 2>&1 || { cat /tmp/abntexto-ufc-ctan-pass2.log; exit 1; }
            test -s example.pdf
            echo 'B5-C-CTAN-BENCHMARK status=PASS browsing_layout=PASS readme=PASS documentation_pdf=PASS external_abntexto=PASS'

      - name: Self-remove temporary workflow
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b5c-ctan-benchmark-validation.yml
          git commit -m 'chore: remove temporary B5-C CTAN benchmark validation'
          git push origin HEAD:feat/v3-r1-b5c-package-ctan
