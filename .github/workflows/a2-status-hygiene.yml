name: Temporary A2 status hygiene

on:
  push:
    branches:
      - docs/v3-a2-status-hygiene

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact A2 activation main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "1b6d4e2a5857541047955014b73ad76739e78eb4"
          test "$(git rev-parse origin/main)" = "1b6d4e2a5857541047955014b73ad76739e78eb4"

      - name: Reconcile stale status wording
        run: python .github/scripts/a2-status-hygiene.py

      - name: Verify authorities and machine state unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 1b6d4e2a5857541047955014b73ad76739e78eb4 -- \
            release/v3-roadmap.json \
            docs/HANDOFF-V3.0.0.md \
            AGENTS.md \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md \
            standards/catalog.json \
            standards/coverage-rules-article.json \
            standards/precedence.json

      - name: Run repository static contract
        run: make static-check

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/a2-status-hygiene.py
          rm -f .github/workflows/a2-status-hygiene.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check 1b6d4e2a5857541047955014b73ad76739e78eb4
          mapfile -t changed < <(git diff --name-only 1b6d4e2a5857541047955014b73ad76739e78eb4)
          expected=(
            README.md
            docs/ARCHITECTURE.md
            docs/ENGINEERING-LANGUAGE.md
            docs/ROADMAP-V3.0.0.md
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent status hygiene
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remove stale pre-A2 status wording'
          git push origin HEAD:docs/v3-a2-status-hygiene
