name: B4-C technical language inventory

on:
  push:
    branches:
      - refactor/v3-r1-b4c-technical-language

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inventory validator and CLI language boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          targets = [
              Path('tools/validate-ufc-pdf.py'),
              Path('validator/app.js'),
              Path('validator/index.html'),
              Path('validator/validation-contract.json'),
              Path('validator/validation-vectors.json'),
          ]
          portuguese_markers = re.compile(
              r'[áàâãéêíóôõúçÁÀÂÃÉÊÍÓÔÕÚÇ]|'
              r'\b(?:arquivo|autor|aviso|catálogo|conforme|correção|depósito|defina|evidência|'
              r'fonte|fontes|idioma|integridade|metadados|obrigatório|página|páginas|regras|'
              r'relatório|repositório|título|validação|veredito|ausente|aprovado|reprovado|'
              r'alerta|revisão|manual|não|aplicável|preservação|legível|estrutura|margens|'
              r'impressão|instituição|biblioteca)\b',
              re.IGNORECASE,
          )

          print('=== CANDIDATE PROJECT-OWNED / PORTUGUESE LINES ===')
          for path in targets:
              print(f'--- {path.as_posix()} ---')
              text = path.read_text(encoding='utf-8')
              count = 0
              for number, line in enumerate(text.splitlines(), 1):
                  if portuguese_markers.search(line):
                      count += 1
                      print(f'{number}: {line}')
              print(f'CANDIDATE_LINE_COUNT={count}')

          print('=== VALIDATOR CONTRACT TOP-LEVEL / CHECK FIELDS ===')
          contract = json.loads(Path('validator/validation-contract.json').read_text(encoding='utf-8'))
          print('TOP_LEVEL_KEYS=' + ','.join(contract.keys()))
          for key, value in contract.items():
              if isinstance(value, list):
                  print(f'{key}: list[{len(value)}]')
                  for index, item in enumerate(value):
                      if isinstance(item, dict):
                          print(f'  {key}[{index}] keys={list(item.keys())} id={item.get("canonical_id") or item.get("id")}')
              elif isinstance(value, dict):
                  print(f'{key}: keys={list(value.keys())}')
              else:
                  print(f'{key}: {value!r}')

          print('=== VALIDATION VECTOR STRUCTURE ===')
          vectors = json.loads(Path('validator/validation-vectors.json').read_text(encoding='utf-8'))
          print('TOP_LEVEL_KEYS=' + ','.join(vectors.keys()))
          for key, value in vectors.items():
              if isinstance(value, list):
                  print(f'{key}: list[{len(value)}]')
                  for index, item in enumerate(value):
                      if isinstance(item, dict):
                          print(f'  {key}[{index}] keys={list(item.keys())} id={item.get("id") or item.get("name")}')
              elif isinstance(value, dict):
                  print(f'{key}: keys={list(value.keys())}')
              else:
                  print(f'{key}: {value!r}')
          PY

          echo '=== TEST / CONSUMER REFERENCES TO VALIDATOR SURFACES ==='
          git grep -n -E 'validate-ufc-pdf\.py|validator/app\.js|validator/index\.html|validation-contract\.json|validation-vectors\.json' -- tests standards Makefile docs release || true

          echo '=== TEST REFERENCES TO HUMAN LABELS / LOCALIZED OUTPUT ==='
          git grep -n -i -E 'Metadados|Integridade|Depósito UFC|APROVADO|REPROVADO|ALERTA|REVISÃO MANUAL|NÃO APLICÁVEL|Validador de PDF|Catálogo revisado|Cobertura cadastrada|Exportar JSON|Exportar CSV|Imprimir relatório|PDF legível|Idioma principal|Título do PDF|Autor do PDF' -- tests validator tools standards || true

          echo '=== CLI/WEB STABLE IDS AND OUTPUT SCHEMA REFERENCES ==='
          git grep -n -E 'schema_version|generated_at|normative_catalog|web-lite-local|cli-deep-local|meta\.lang|meta\.title|meta\.author|pdf\.open|pdfa\.deep|catalog\.optional|approval\.signatures' -- tests validator tools standards || true

          echo '=== B4-C ENTRY CHECKS ==='
          python3 tests/checks/validator_source.py
          node --check validator/app.js
          python3 -m json.tool validator/validation-contract.json >/dev/null
          python3 -m json.tool validator/validation-vectors.json >/dev/null
          git diff --check
          echo 'B4-C-LANGUAGE-INVENTORY status=PASS'
