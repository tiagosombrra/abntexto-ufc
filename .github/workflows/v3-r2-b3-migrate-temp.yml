name: V3 R2 B3 migrate temp

on:
  push:
    branches:
      - refactor/v3-r2-b3-structural-object-api

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Migrate B3 owners and consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "ufcalineas": "ufclettereditems",
              "ufcsubalineas": "ufcdashedsubitems",
              "ufclistadefinicoes": "ufcdefinitionlist",
              "ufcobjeto": "ufcobject",
              "ufcalgoritmo": "ufcalgorithm",
              "ufcfonte": "ufcSource",
              "ufcnota": "ufcNote",
              "ufcinputlisting": "ufcInputListing",
              "ufcinputminted": "ufcInputMinted",
              "ufcsectionhook": "ufcSectionHook",
              "ufcobjectlegendhook": "ufcObjectLegendHook",
              "imprimirlistadegraficos": "ufcPrintListOfCharts",
              "imprimirlistadecodigos": "ufcPrintListOfCodeListings",
              "imprimirlistadealgoritmos": "ufcPrintListOfAlgorithms",
              "IDcodigo": "IDcode",
              "IDalgoritmo": "IDalgorithm",
              "definelegendplace{codigo}": "definelegendplace{code}",
              "definelegendplace{algoritmo}": "definelegendplace{algorithm}",
              "legend{codigo}": "legend{code}",
              "legend{algoritmo}": "legend{algorithm}",
          }

          owner_paths = [
              Path("abntexto-ufc/layout.def"),
              Path("abntexto-ufc/frontmatter.def"),
              Path("abntexto-ufc/integrations/abntexto.def"),
              Path("abntexto-ufc/objects.def"),
          ]
          consumer_paths = sorted(Path("template").rglob("*.tex")) + sorted(Path("tests").rglob("*.tex"))

          changed = set()
          hit_counts = {key: 0 for key in replacements}
          for path in owner_paths + consumer_paths:
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in replacements.items():
                  count = text.count(old)
                  if count:
                      hit_counts[old] += count
                      text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  changed.add(str(path))

          required_hits = [
              "ufcalineas", "ufcsubalineas", "ufclistadefinicoes", "ufcobjeto",
              "ufcalgoritmo", "ufcfonte", "ufcnota", "ufcinputlisting",
              "ufcinputminted", "ufcsectionhook", "ufcobjectlegendhook",
              "imprimirlistadegraficos", "imprimirlistadecodigos",
              "imprimirlistadealgoritmos", "IDcodigo", "IDalgoritmo",
              "definelegendplace{codigo}", "definelegendplace{algoritmo}",
              "legend{codigo}", "legend{algoritmo}",
          ]
          missing = [item for item in required_hits if hit_counts[item] == 0]
          if missing:
              raise SystemExit(f"expected B3 migration hits missing: {missing}")

          public_api = Path("abntexto-ufc/public-api.def")
          public_api.write_text(r'''\ProvidesFile{abntexto-ufc/public-api.def}[2026/09/03 UFC transitional public API]

% R2-B1 through R2-B3 forwarding has been absorbed by direct behavior owners.
% Only R2-B4 bibliography and back-matter forwarding remains here.
\ExplSyntaxOn

\NewDocumentCommand \ufcAddBibliographyResource { m }
  { \ufcbibliografia{#1} }

\NewDocumentCommand \ufcPrintReferences { }
  { \imprimirreferencias }

\NewDocumentCommand \ufcPrintGlossary { }
  { \imprimirglossario }

\NewDocumentCommand \ufcPrintIndex { }
  { \imprimirindice }

\ExplSyntaxOff

\endinput
''', encoding="utf-8")
          changed.add(str(public_api))

          print("changed files:")
          for path in sorted(changed):
              print(path)
          print("replacement counts:")
          for key, count in hit_counts.items():
              print(f"{key}={count}")
          PY

          legacy_pattern='ufcalineas|ufcsubalineas|ufclistadefinicoes|ufcobjeto|ufcalgoritmo|ufcfonte|ufcnota|ufcinputlisting|ufcinputminted|ufcsectionhook|ufcobjectlegendhook|imprimirlistadegraficos|imprimirlistadecodigos|imprimirlistadealgoritmos|legend\{codigo\}|legend\{algoritmo\}|IDcodigo|IDalgoritmo|definelegendplace\{codigo\}|definelegendplace\{algoritmo\}'
          if git grep -n -E "$legacy_pattern" -- 'abntexto-ufc/**' 'abntexto-ufc.cls' 'template/**' 'tests/**' 'tools/**' 'docs/ctan-example.tex' 'release/ctan/**' 'Makefile'; then
            echo 'B3 legacy project API remains in active sources.' >&2
            exit 1
          fi

          grep -Fq '\NewDocumentEnvironment{ufclettereditems}' abntexto-ufc/layout.def
          grep -Fq '\NewDocumentEnvironment{ufcdashedsubitems}' abntexto-ufc/layout.def
          grep -Fq '\providecommand{\ufcSectionHook}' abntexto-ufc/layout.def
          grep -Fq '\RenewDocumentEnvironment{ufcdefinitionlist}' abntexto-ufc/integrations/abntexto.def
          grep -Fq '\NewDocumentEnvironment { ufcdefinitionlist }' abntexto-ufc/frontmatter.def
          grep -Fq '\providecommand{\ufcObjectLegendHook}' abntexto-ufc/objects.def
          grep -Fq '\definelegendplace{code}{Código}{loc}' abntexto-ufc/objects.def
          grep -Fq '\definelegendplace{algorithm}{Algoritmo}{loa}' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcSource' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcNote' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentEnvironment { ufcobject }' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcPrintListOfCharts' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcPrintListOfCodeListings' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcPrintListOfAlgorithms' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcInputListing' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentCommand \ufcInputMinted' abntexto-ufc/objects.def
          grep -Fq '\NewDocumentEnvironment { ufcalgorithm }' abntexto-ufc/objects.def

          grep -Fq '\NewDocumentCommand \ufcAddBibliographyResource' abntexto-ufc/public-api.def
          grep -Fq '\NewDocumentCommand \ufcPrintReferences' abntexto-ufc/public-api.def
          grep -Fq '\NewDocumentCommand \ufcPrintGlossary' abntexto-ufc/public-api.def
          grep -Fq '\NewDocumentCommand \ufcPrintIndex' abntexto-ufc/public-api.def
          test "$(grep -c '\\NewDocumentCommand' abntexto-ufc/public-api.def)" -eq 4
          ! grep -Fq '\NewDocumentEnvironment' abntexto-ufc/public-api.def

          # Genuine dependency-facing non-English identifiers remain bounded.
          grep -Fq '\definelegendplace{grafico}{Gráfico}{logr}' abntexto-ufc/objects.def
          grep -Fq '\definelegendplace{quadro}{Quadro}{loq}' abntexto-ufc/objects.def
          grep -Fq '\ufc_table_patch_theme:n { quadro }' abntexto-ufc/modules.def

          git diff --check
          make static-check

      - name: Run focused TeX integration checks
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs
            bash tests/integration/normative-complement.sh
            bash tests/integration/object-geometry.sh
            bash tests/integration/code-typography.sh
            bash tests/integration/object.sh
            bash tests/integration/minted.sh
            bash tests/integration/algorithm-numbering.sh
            bash tests/integration/documentary-sources.sh
            bash tests/integration/frontmatter.sh

      - name: Publish clean B3 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v3-r2-b3-migrate-temp.yml
          git diff --check
          make static-check
          legacy_pattern='ufcalineas|ufcsubalineas|ufclistadefinicoes|ufcobjeto|ufcalgoritmo|ufcfonte|ufcnota|ufcinputlisting|ufcinputminted|ufcsectionhook|ufcobjectlegendhook|imprimirlistadegraficos|imprimirlistadecodigos|imprimirlistadealgoritmos|legend\{codigo\}|legend\{algoritmo\}|IDcodigo|IDalgoritmo|definelegendplace\{codigo\}|definelegendplace\{algoritmo\}'
          if git grep -n -E "$legacy_pattern" -- 'abntexto-ufc/**' 'abntexto-ufc.cls' 'template/**' 'tests/**' 'tools/**' 'docs/ctan-example.tex' 'release/ctan/**' 'Makefile'; then
            echo 'B3 legacy project API remains after cleanup.' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add abntexto-ufc template tests
          git diff --cached --check
          git commit -m "refactor: own structural and object API directly"
          git push origin HEAD:refactor/v3-r2-b3-structural-object-api
