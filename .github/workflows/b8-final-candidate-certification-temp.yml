name: B8 final candidate certification temporary

on:
  push:
    branches:
      - cert/v3-r1-b8-final-candidate-fast

permissions:
  contents: write

jobs:
  windows:
    name: Windows full candidate matrix
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout canonical B8 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9b1752565ac217c04ffa22a9ef272cdf078af380
          persist-credentials: false

      - name: Install bounded TeX Live 2026 set
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60
        with:
          texlive_version: 2026
          repository: http://ctan.mirrors.hoobly.com/systems/texlive/tlnet/
          cache: false
          packages: |
            scheme-basic
            abntexto
            collection-langportuguese
            microtype
            etoolbox
            newtx
            fontspec
            unicode-math
            pdfpages
            ragged2e
            biblatex
            biblatex-abnt
            biber
            ttfutils
            fontware
            csquotes
            enumitem
            xpatch
            xcolor
            xkeyval
            xstring
            carlisle
            mweights
            fontaxes
            tabularray
            tabularray-abnt
            varwidth
            booktabs
            listings
            algorithmicx
            algpseudocodex
            glossaries
            imakeidx

      - name: Ensure repository build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          make --version
          biber --version
          makeglossaries --version

      - name: Prepare literal Windows fonts for pdfLaTeX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tools/prepare-windows-fonts.ps1
          foreach ($file in @('t1times-ttf.fd','ts1times-ttf.fd','t1arial.fd','ts1arial.fd','abntexto-ufc-windows.map','abntexto-ufc-ts1-metric.enc')) {
            $resolved = (& kpsewhich $file).Trim()
            if (-not $resolved) { throw "Prepared support file not found: $file" }
            Write-Host "PREPARED $file = $resolved"
          }

      - name: Verify Windows candidate dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s template/main.tex
          resolved=$(cd template && TEXINPUTS=".;..//;" kpsewhich main.tex)
          printf 'KPATHSEA_MAIN=%s\n' "$resolved"
          test -n "$resolved"
          case "$resolved" in
            *main.tex) ;;
            *) echo "Unexpected main.tex resolution: $resolved"; exit 1 ;;
          esac
          for dependency in tabularray.sty tabularray-abnt.sty varwidth.sty booktabs.sty listings.sty algorithmicx.sty algpseudocodex.sty glossaries.sty imakeidx.sty; do
            dep=$(kpsewhich "$dependency")
            printf 'KPATHSEA_DEP=%s=%s\n' "$dependency" "$dep"
            test -n "$dep"
          done

      - name: Compile complete strict candidate matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p b8-final-pdfs
          cp template/main.tex template/main.tex.b8-original
          restore_main() {
            if [ -f template/main.tex.b8-original ]; then
              cp template/main.tex.b8-original template/main.tex
              rm -f template/main.tex.b8-original
            fi
          }
          trap restore_main EXIT INT TERM

          make_shell='C:/Program Files/Git/bin/bash.exe'
          test -x "$make_shell"

          for engine in pdflatex lualatex; do
            for family in times arial; do
              cp template/main.tex.b8-original template/main.tex
              python - template/main.tex "$family" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          family = sys.argv[2]
          text = path.read_text(encoding='utf-8')
          text, n_family = re.subn(r'(?m)^\s*fonte\s*=\s*times\s*,', f'  fonte = {family},', text, count=1)
          text, n_strict = re.subn(r'(?m)^\s*fonte-estrita\s*=\s*nao\s*,', '  fonte-estrita = sim,', text, count=1)
          if n_family != 1 or n_strict != 1:
              raise SystemExit(f'candidate patch cardinality failed: family={n_family} strict={n_strict}')
          path.write_text(text, encoding='utf-8')
          PY

              echo "B8 final candidate: $family / $engine"
              make SHELL="$make_shell" 'TEX_ENV=TEXINPUTS=".;..//;"' DOCUMENT=main ENGINE="$engine" compile
              test -s template/main.pdf
              cp template/main.pdf "b8-final-pdfs/abntexto-ufc-main-${family}-${engine}-strict.pdf"
              make SHELL="$make_shell" DOCUMENT=main clean
            done
          done

          restore_main
          trap - EXIT INT TERM
          git diff --exit-code -- template/main.tex
          test "$(find b8-final-pdfs -maxdepth 1 -name '*.pdf' | wc -l)" -eq 4

      - name: Upload complete Windows candidate PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b8-final-windows-candidate-pdfs
          if-no-files-found: error
          retention-days: 14
          path: b8-final-pdfs/*.pdf

  linux:
    name: Linux final font and PDF-A certification
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout canonical B8 candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 9b1752565ac217c04ffa22a9ef272cdf078af380
          persist-credentials: false

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          docker --version

      - name: Download complete Windows candidate PDFs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: b8-final-windows-candidate-pdfs
          path: b8-final-pdfs

      - name: Certify complete candidate artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/b8-final

          for engine in pdflatex lualatex; do
            for family in times arial; do
              pdf="b8-final-pdfs/abntexto-ufc-main-${family}-${engine}-strict.pdf"
              test -s "$pdf"
              echo "B8 final certification: $family / $engine"

              pdffonts "$pdf" | tee "artifacts/b8-final/${family}-${engine}-pdffonts.txt"
              names=$(pdffonts "$pdf" | tail -n +3 | awk 'NF {print $1}')
              case "$family" in
                times)
                  printf '%s\n' "$names" | grep -Fq 'TimesNewRomanPSMT'
                  ;;
                arial)
                  printf '%s\n' "$names" | grep -Fq 'ArialMT'
                  ;;
                *) exit 2 ;;
              esac

              if printf '%s\n' "$names" | grep -Eiq 'TeXGyreTermesX|TeXGyreHeros|NimbusSans'; then
                echo "Unexpected text-font fallback in $pdf"
                exit 1
              fi

              pdftotext "$pdf" "artifacts/b8-final/${family}-${engine}-text.txt"
              for marker in 'Universidade Federal do Ceará' 'Modelo comentado de trabalho acadêmico da UFC' 'Fortaleza' 'AGRADECIMENTOS' 'RESUMO'; do
                grep -Fq "$marker" "artifacts/b8-final/${family}-${engine}-text.txt" || {
                  echo "Unicode/text extraction marker missing in $pdf: $marker"
                  exit 1
                }
              done

              sh tests/integration/font-embedding.sh "$pdf"
              sh tests/integration/pdfa.sh "$pdf"
              cp /tmp/abntexto-ufc-verapdf.xml "artifacts/b8-final/${family}-${engine}-verapdf.xml"
              sha256sum "$pdf" > "artifacts/b8-final/${family}-${engine}.sha256"
            done
          done

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('b8-final-pdfs')
          cases = []
          for engine in ('pdflatex', 'lualatex'):
              for family in ('times', 'arial'):
                  pdf = root / f'abntexto-ufc-main-{family}-{engine}-strict.pdf'
                  cases.append({
                      'engine': engine,
                      'family': family,
                      'pdf': pdf.name,
                      'sha256': hashlib.sha256(pdf.read_bytes()).hexdigest(),
                      'literal_family': 'PASS',
                      'unexpected_text_fallback': 'ABSENT',
                      'unicode_extraction': 'PASS',
                      'font_embedding': 'PASS',
                      'pdfa_2b': 'PASS',
                  })
          receipt = {
              'stage': 'R1-BLOCK-8',
              'candidate_sha': '9b1752565ac217c04ffa22a9ef272cdf078af380',
              'template': 'template/main.tex',
              'result': 'PASS',
              'cases': cases,
              'runtime_api_changed': False,
              'normative_semantics_changed': False,
              'proof_state_changed': False,
              'proprietary_fonts_redistributed': False,
          }
          Path('artifacts/b8-final/certification-receipt.json').write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps(receipt, indent=2, ensure_ascii=False))
          PY

      - name: Upload final B8 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b8-final-certification-evidence
          if-no-files-found: error
          retention-days: 14
          path: artifacts/b8-final/**

  cleanup:
    name: Remove temporary final certification workflow
    if: always()
    needs:
      - windows
      - linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: cert/v3-r1-b8-final-candidate-fast
          fetch-depth: 0

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          path=.github/workflows/b8-final-candidate-certification-temp.yml
          if [ ! -e "$path" ]; then
            echo 'Temporary final certification workflow already absent.'
            exit 0
          fi
          rm -f "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- "$path"
          if git diff --cached --quiet; then
            echo 'Temporary final certification workflow already absent from index.'
            exit 0
          fi
          git commit -m 'ci: remove temporary B8 final certification'
          git push origin HEAD:cert/v3-r1-b8-final-candidate-fast
