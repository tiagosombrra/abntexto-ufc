name: IBGE long-table footer smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/table-ibge-multipage-evidence.sh
      - tests/documents/table-ibge-*.tex
      - .github/workflows/ibge-terminal-smoke.yml

permissions:
  contents: read

concurrency:
  group: ibge-terminal-pdf-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ibge-terminal-pdf:
    name: Real multipage default IBGE footer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render seven-page PDF and strict negative
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            # texlive-action runs as root over a runner-owned mounted checkout.
            git config --global --add safe.directory "$PWD"
            sh tests/integration/objects/table-ibge-multipage-evidence.sh
      - name: Upload source-bound PDF/vector diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibge-terminal-${{ github.run_id }}
          path: |
            artifacts/normative-layout/ibge-multipage/*.pdf
            artifacts/normative-layout/ibge-multipage/*.json
          retention-days: 14
          if-no-files-found: warn
