name: B8 TS1 metric probe

on:
  push:
    branches:
      - probe/v3-r1-b8-minimal-texlive

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install bounded TeX Live 2026 set
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          texlive_version: 2026
          cache: false
          packages: |
            scheme-basic
            abntexto
            collection-langportuguese
            microtype
            etoolbox
            newtx
            fontspec
            unicode-math
            pdfpages
            ragged2e
            biblatex
            biblatex-abnt
            biber
            ttfutils
            fontware

      - name: Derive a TS1 metric vector from current TeX Live inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Resolve-KpseFile([string]$Name) {
            $path = (& kpsewhich $Name).Trim()
            if (-not $path -or -not (Test-Path $path)) {
              throw "Required TeX input missing: $Name"
            }
            return $path
          }

          function Add-ReverseGlyphList(
            [System.Collections.Generic.Dictionary[string,string]]$Reverse,
            [string]$Path
          ) {
            foreach ($line in Get-Content $Path) {
              if (-not $line -or $line.StartsWith('#') -or -not $line.Contains(';')) {
                continue
              }
              $parts = $line.Split(';', 2)
              $name = $parts[0].Trim()
              $code = $parts[1].Trim()
              if (-not $name -or $code -notmatch '^[0-9A-Fa-f]{4,6}$') {
                continue
              }
              $key = $code.ToUpperInvariant()
              if (-not $Reverse.ContainsKey($key)) {
                $Reverse[$key] = $name
              }
            }
          }

          $source = Resolve-KpseFile 'q-ts1-uni.enc'
          $reverse = [System.Collections.Generic.Dictionary[string,string]]::new(
            [System.StringComparer]::OrdinalIgnoreCase
          )
          # Prefer Adobe glyph names, then TeX-specific names as a fallback.
          Add-ReverseGlyphList $reverse (Resolve-KpseFile 'glyphlist.txt')
          Add-ReverseGlyphList $reverse (Resolve-KpseFile 'texglyphlist.txt')

          foreach ($requiredCode in @('00A2','00A3','00A9','00AE','00B0','00B1','00B5','00D7','00F7','20AC')) {
            if (-not $reverse.ContainsKey($requiredCode)) {
              throw "No canonical glyph name found for U+$requiredCode"
            }
            Write-Host "REVERSE U+$requiredCode = $($reverse[$requiredCode])"
          }

          $lines = @(Get-Content $source)
          $vectorStart = -1
          $vectorEnd = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($vectorStart -lt 0 -and $lines[$i] -match '^\s*/[^\s]+\s*\[\s*$') {
              $vectorStart = $i
              continue
            }
            if ($vectorStart -ge 0 -and $lines[$i] -match '^\s*\]\s*def\s*$') {
              $vectorEnd = $i
              break
            }
          }
          if ($vectorStart -lt 0 -or $vectorEnd -le $vectorStart) {
            throw "Encoding vector not found in $source"
          }

          $lines[$vectorStart] = '/abntextoUfcTS1MetricEncoding ['
          $mapped = 0
          $unmapped = 0
          for ($i = $vectorStart + 1; $i -lt $vectorEnd; $i++) {
            if ($lines[$i] -notmatch '^(\s*)/([^\s%]+)') {
              continue
            }
            $prefix = $Matches[1]
            $name = $Matches[2]
            if ($name -eq '.notdef') {
              continue
            }
            if ($name -match '^uni([0-9A-Fa-f]{4,6})$') {
              $code = $Matches[1].ToUpperInvariant()
              if ($reverse.ContainsKey($code)) {
                $lines[$i] = $lines[$i] -replace '^\s*/[^\s%]+', "$prefix/$($reverse[$code])"
                $mapped++
              }
              else {
                $lines[$i] = $lines[$i] -replace '^\s*/[^\s%]+', "$prefix/.notdef"
                $unmapped++
              }
            }
            else {
              # Preserve any already-canonical glyph name.
              $mapped++
            }
          }

          $output = Join-Path $env:RUNNER_TEMP 'abntexto-ufc-ts1-metric.enc'
          $lines | Set-Content -Path $output -Encoding ascii
          Write-Host "TS1 metric vector: mapped=$mapped unmapped=$unmapped output=$output"
          if ($mapped -eq 0) {
            throw 'TS1 metric conversion produced no mapped glyphs.'
          }

          $font = Join-Path $env:WINDIR 'Fonts\times.ttf'
          Push-Location $env:RUNNER_TEMP
          try {
            & ttf2tfm $font '-q' '-T' $output '-v' 'b8-ts1.vpl' 'b8-ts1-raw.tfm'
            if ($LASTEXITCODE -ne 0) { throw "ttf2tfm TS1 metric conversion failed: $LASTEXITCODE" }
            & vptovf 'b8-ts1.vpl' 'b8-ts1.vf' 'b8-ts1.tfm'
            if ($LASTEXITCODE -ne 0) { throw "vptovf TS1 metric conversion failed: $LASTEXITCODE" }
            foreach ($file in @('b8-ts1-raw.tfm','b8-ts1.vf','b8-ts1.tfm')) {
              if (-not (Test-Path $file)) {
                throw "Expected generated font-support file missing: $file"
              }
            }
          }
          finally {
            Pop-Location
          }

          Write-Host 'TS1 metric vector derivation and TrueType conversion passed.'

  cleanup:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: probe/v3-r1-b8-minimal-texlive

      - name: Remove temporary probe workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm -f .github/workflows/b8-ts1-metric-probe.yml
          git commit -m 'ci: remove temporary B8 TS1 metric probe'
          git push origin HEAD:probe/v3-r1-b8-minimal-texlive
