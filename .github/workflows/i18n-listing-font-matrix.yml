name: Public listing and font policy four-language PDF evidence
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/i18n-listing-font-evidence.py
      - .github/workflows/i18n-listing-font-matrix.yml
  push:
    branches: [main]
    paths:
      - abntexto-ufc.cls
      - tests/integration/objects/i18n-listing-font-evidence.py
      - .github/workflows/i18n-listing-font-matrix.yml
permissions:
  contents: read
concurrency:
  group: i18n-listing-font-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    name: Exact-word/log negative mutation controls
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Reject malformed log, wrong locale, and missing output
        run: python3 tests/integration/objects/i18n-listing-font-evidence.py --self-test
  locale:
    name: Listing + math-font + strict-font / ${{ matrix.locale }} (1 real PDF)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile PDF and verify strict-font rejection or prepared-font acceptance
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils qpdf
            git config --global --add safe.directory "$PWD"
            python3 tests/integration/objects/i18n-listing-font-evidence.py --locale ${{ matrix.locale }}
      - name: Preserve source-bound PDF, TeX, C++, logs and receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i18n-listing-font-${{ matrix.locale }}-${{ github.run_id }}
          path: artifacts/i18n-listing-font/${{ matrix.locale }}/**
          retention-days: 21
          if-no-files-found: warn
