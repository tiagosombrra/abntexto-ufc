name: Current identity cleanup helper

on:
  push:
    branches:
      - fix/v2.2.0-project-identity-runtime

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Migrate remaining current identity references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = (
              '1-pre-textuais/abstract.tex',
              '1-pre-textuais/resumo.tex',
              '2-textuais/1-introducao.tex',
              'docs/VIGENCIA-NORMATIVA.md',
              'normativa/atomic-rules.json',
              'normativa/coverage-rules-closure.json',
              'normativa/coverage-rules-documentary.json',
              'normativa/coverage-rules-project.json',
              'normativa/evidence-registry.json',
              'normativa/precedence.json',
              'normativa/version-policy.json',
              'tests/checks/normative_atomic_contract.py',
              'tests/checks/normative_traceability.py',
          )
          changed = []
          for relative in files:
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              updated = text.replace('UFCtex', 'abntexto-ufc').replace('ufctex', 'abntexto-ufc')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(relative)
          print(f'Migrated {len(changed)} files.')
          for relative in changed:
              print(relative)
          PY
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1-pre-textuais 2-textuais docs/VIGENCIA-NORMATIVA.md normativa tests/checks
          git commit -m 'refactor: finish current identity cleanup'
          git push origin HEAD:fix/v2.2.0-project-identity-runtime
