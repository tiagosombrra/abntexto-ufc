name: Temporary exact R4 entry activation

on:
  push:
    branches:
      - docs/v3-r3-closeout-r4-entry

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact R3 closeout predecessor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "d90a675a844724c33a5727d8d980027c46291eb0"
          test "$(git rev-parse origin/main)" = "d90a675a844724c33a5727d8d980027c46291eb0"

      - name: Reconcile exact R4 entry state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/r3-r4-entry-activate.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'r"R3-B5/#256 is ACTIVE from canonical control-plane checkpoint `e5d6ab1962ee04935ee68a6ae36f268350d59a3b` and owns R3 closeout/R4 entry; it must not broaden this policy or change the public runtime API\\."':
                  'r"R3-B5/#256 is technically validated on `c79f3c73f1d51a30175e8259269504d029442a1c`; only exact-entry activation remains\\. R4/#267 is prepared but not started, and neither stage may broaden this policy or change the public runtime API without separately justified evidence\\."',
              '"R3-B5/#256 is active from canonical control-plane checkpoint `e5d6ab1962ee04935ee68a6ae36f268350d59a3b` and remains required before R4."':
                  '"R3-B5/#256 is technically validated on `c79f3c73f1d51a30175e8259269504d029442a1c`; exact-entry activation remains required before R4/#267 certification can start."',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one transformer pattern, found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python .github/scripts/r3-r4-entry-activate.py

      - name: Verify authority documents unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code d90a675a844724c33a5727d8d980027c46291eb0 -- \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md

      - name: Run repository static contract
        run: make static-check

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/r3-r4-entry-activate.py
          rm -f .github/workflows/r3-r4-entry-activate.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check d90a675a844724c33a5727d8d980027c46291eb0
          mapfile -t changed < <(git diff --name-only d90a675a844724c33a5727d8d980027c46291eb0)
          expected=(
            AGENTS.md
            README.md
            docs/ARCHITECTURE.md
            docs/CTAN-RELEASE.md
            docs/ENGINEERING-LANGUAGE.md
            docs/HANDOFF-V3.0.0.md
            docs/R3-HARDENING-INVENTORY.md
            docs/ROADMAP-V3.0.0.md
            release/v3-r3-inventory.json
            release/v3-roadmap.json
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent exact-entry activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: close R3 and activate R4 entry'
          git push origin HEAD:docs/v3-r3-closeout-r4-entry
