name: R4 twenty-eight comprehensive real PDF candidates
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/frontmatter/generate-integrated-locale.py
      - tests/integration/frontmatter/generate-comprehensive-corpus.py
      - tests/integration/frontmatter/run-comprehensive-corpus.py
      - tests/fixtures/references.bib
      - tests/fixtures/example.cpp
      - .github/workflows/r4-comprehensive-corpus.yml
  push:
    branches: [main]
    paths:
      - abntexto-ufc.cls
      - tests/integration/frontmatter/generate-integrated-locale.py
      - tests/integration/frontmatter/generate-comprehensive-corpus.py
      - tests/integration/frontmatter/run-comprehensive-corpus.py
      - .github/workflows/r4-comprehensive-corpus.yml
permissions:
  contents: read
concurrency:
  group: r4-comprehensive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-preflight:
    name: Build and audit 28 independent full-length TeX source candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate all 7 profiles x 4 locales, without pretending PDFs exist
        run: python3 tests/integration/frontmatter/generate-comprehensive-corpus.py
      - name: Inspect 28 source files, manifest hashes, declared features
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          root = Path('artifacts/comprehensive-7x4')
          count = 0
          for locale in ('pt','en','es','fr'):
              m = json.loads((root / locale / 'source-index.json').read_text())
              assert m['source_count'] == 7
              assert not m['complete_pdf_certification']
              for entry in m['entries']:
                  source = Path(entry['source'])
                  assert source.is_file()
                  assert hashlib.sha256(source.read_bytes()).hexdigest() == entry['source_sha256']
                  for key in ('multi_section','subsection','subsubsection','equations',
                              'aligned_equations','footnotes','short_table',
                              'tabularray_multipage','native_longtable','algorithm',
                              'inline_code','external_code','bibliography','figure'):
                      assert entry['features'][key] is True, (locale,entry['profile'],key)
                  count += 1
          assert count == 28, count
          print('R4-COMPREHENSIVE-PREFLIGHT status=PASS independent_sources=28 pdf_acceptance=NO')
          PY
  real-pdfs:
    name: R4 full documents / ${{ matrix.locale }} (7 PDFs)
    runs-on: ubuntu-24.04
    needs: source-preflight
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile complete source documents with TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        env:
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            git config --global --add safe.directory "$PWD"
            python3 tests/integration/frontmatter/run-comprehensive-corpus.py --locale ${{ matrix.locale }}
      - name: Preserve sources, binaries, PDF/LOT evidence and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r4-full-corpus-${{ matrix.locale }}-${{ github.run_id }}
          path: artifacts/comprehensive-7x4/${{ matrix.locale }}/**
          retention-days: 21
          if-no-files-found: warn
