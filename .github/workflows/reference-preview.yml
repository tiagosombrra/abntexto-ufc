name: Reference PDF preview

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/*.cls'
      - '**/*.sty'
      - 'figuras/**'
      - 'Makefile'
      - '.latexmkrc'
      - 'tools/fetch-reference-images.py'
      - 'tests/v2-font-embedding-check.sh'
      - 'tests/v2-pdfa-check.sh'
      - '.github/workflows/reference-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build reference PDF preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build reference PDF
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make clean
            make reference-assets
            test -s figuras/ufc-campus-pici.jpg
            test -s figuras/ufc-reitoria.jpg
            make compile
            sh tests/v2-font-embedding-check.sh documento.pdf
      - name: Validate reference PDF/A-2b
        run: sh tests/v2-pdfa-check.sh documento.pdf
      - name: Upload reference PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-reference-pdf
          path: documento.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
