name: Reference PDF preview

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tex'
      - '**/*.bib'
      - '**/*.cls'
      - '**/*.sty'
      - 'figures/**'
      - 'Makefile'
      - '.latexmkrc'
      - 'tools/fetch-reference-images.py'
      - 'tests/v2-font-embedding-check.sh'
      - 'tests/v2-pdfa-check.sh'
      - 'tests/v2-overleaf-stable-check.sh'
      - '.github/workflows/reference-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Build reference PDF preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build reference PDF
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make clean
            make reference-assets
            test -s figures/ufc-campus-pici.jpg
            test -s figures/ufc-reitoria.jpg
            make compile
            sh tests/v2-font-embedding-check.sh main.pdf
      - name: Validate reference PDF/A-2b
        run: sh tests/v2-pdfa-check.sh main.pdf
      - name: Upload reference PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abntexto-ufc-reference-pdf
          path: main.pdf
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  overleaf-compatibility:
    name: Validate TeX Live 2025 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Pin abntexto 1.1 runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import time
          import urllib.request
          from pathlib import Path

          expected = 'f9cc40c65fbf6c2f9520b4ca4f312440e8d0ee6a'
          commit = '4c03fd7b5a7af089627dedb547c53cad4eed2a2a'
          url = f'https://raw.githubusercontent.com/ElaysonAbreu/abntexto/{commit}/abntexto.cls'
          content = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'abntexto-ufc-overleaf-pr-check'},
                  )
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read()
                  break
              except Exception:
                  if attempt == 3:
                      raise
                  time.sleep(5 * attempt)

          digest = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          if digest != expected:
              raise SystemExit(f'abntexto blob mismatch: {digest}')
          if b'[2026-05-08 1.1 Preparation of works in ABNT standards]' not in content:
              raise SystemExit('abntexto 1.1 identity marker missing')
          Path('abntexto.cls').write_bytes(content)
          PY
      - name: Validate public TeX Live 2025 proxy
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2025
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            make v2-overleaf-stable-check
