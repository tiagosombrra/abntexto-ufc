| R1-B8 | DONE | candidate `9b1752565ac217c04ffa22a9ef272cdf078af380` | Windows/font/Unicode/embedding/PDF-A-2b certification | None |
| V3-R1 closeout | DONE | PR #233 → `0a2c2c3879986ca27b731f54b974db12524258df` | R1 closed | None |
| R2-A | DONE | issue #232 | Direct owners/upstream boundaries/lots classified | None |
| R2-B1 | DONE | PR #236 → `ded5e77733795aa2958606e899d4e27f12f64df4` | Setup/state direct ownership; `30/0/0` | None |
| R2-B2 | DONE | PR #242 → `8e3e0f2a165e488a00f08a0031ba6fb4a01f9949`; closeout #243 → `0650845b922271fc134d20ef2a8c36ebb999ef91` | Academic/front-matter direct ownership; final `30/0/0`; merged-main release `32/0/0` | None |
| R2-B3 | DONE | issue #238; PR #245 → `{B3_MERGE}` | Structural/object API direct ownership; Static `{STATIC_RUN}` PASS; Linux `{LINUX_RUN}` `{RESULT}` | None |
| R2-B4 | ACTIVE | issue #239; entry `{B3_MERGE}` | Bibliography/references/glossary/index direct ownership | Implement and validate B4 |
| R2-B5 | PENDING | issue #240 | Final residual migration, remove `public-api.def`, create `docs/MIGRATING-TO-V3.md` | After B4 |
| V3-R3 | BLOCKED | — | Standards/tests/language semantic hardening | After R2 |
| V3-R4 | BLOCKED | — | Final certification | After R3 |
| V3-R5 | BLOCKED | — | Foundation freeze and final docs | After R4 |
| V3-A1/A2 | BLOCKED | — | Scientific-article work | After certified foundation |
| CTAN submission | FUTURE | explicit release action | No upload during R2 | Release-ready stage only |

## R1 certification record

R1-B8 certified the complete `template/main.tex` matrix on Windows run `33649620219` and final Linux inspection run `33655108349`. Literal institutional text-family identity, engine-appropriate math-font policy, Unicode extraction, embedding and PDF/A-2b passed. PR #233 closed R1 with Static `33656361564` and Linux integration `33656361474`, `PASS=30 FAIL=0 SKIP=0`.

## R2 progress record

R2-A established direct behavior ownership and the B1–B5 sequence. `public-api.def` is transitional forwarding debt, not a behavior owner.

R2-B1 moved canonical setup/state into direct owners. Its first full integration failed closed at `24/6/0`, exposing six stale dynamic consumers; final run `33668283890` passed `30/0/0`, and PR #236 merged at `ded5e77733795aa2958606e899d4e27f12f64df4`.

R2-B2 moved academic/front-matter rendering into direct ownership, rebound hooks and migrated live consumers. PR #242 merged at `8e3e0f2a165e488a00f08a0031ba6fb4a01f9949`; closeout #243 established the B3 entry at `0650845b922271fc134d20ef2a8c36ebb999ef91`. Release-source audit `33696155771` also reconciled CTAN/example/public-bundle consumers. No runtime aliases or normative/proof-state changes were introduced.

R2-B3 started from reconciled `main` `{B3_ENTRY}`. The bounded migration made structural/object environments, source/note/list APIs, optional listing/minted APIs, extension hooks and project-owned object IDs direct owners. A temporary executor typo failed closed in run `33702528022`; corrected run `{EXEC_RUN}` / job `{EXEC_JOB}` passed focused integration and static validation. Final head `{B3_HEAD}` passed Static `{STATIC_RUN}` and full Linux integration `{LINUX_RUN}` / job `{LINUX_JOB}` at `{RESULT}`. PR #245 squash-merged to `main` at `{B3_MERGE}`; issue #238 is completed. `public-api.def` now contains only the four B4 bibliography/back-matter forwards.

The pre-existing observational `FRONTMATTER-EVIDENCE` FAIL records remain baseline observations inside passing aggregate gates and were not changed by the API migration.

## Immediate action

Execute **R2-B4 issue #239** from `{B3_MERGE}`. Move `\\ufcAddBibliographyResource` and `\\ufcPrintReferences` into direct ownership in `bibliography.def`; move `\\ufcPrintGlossary` and `\\ufcPrintIndex` into direct ownership in `backmatter.def`; internalize non-semantic plumbing; migrate active consumers atomically; remove only B4 forwarding debt. Preserve rendered Portuguese headings and genuine upstream behavior. Do not remove `public-api.def` entirely until B5, add runtime aliases, alter normative proof state, redistribute proprietary fonts, or submit to CTAN.
'''
          Path("docs/ROADMAP-V3.0.0.md").write_text(roadmap, encoding="utf-8")

          handoff = f'''# abntexto-ufc v3.0.0 — Canonical Handoff

Updated: {DATE}

