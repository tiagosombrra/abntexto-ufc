          t = re.sub(r"The canonical R2-B3 entry checkpoint is `[^`]+` after green closeout PR #243\.", f"The canonical R2-B4 product entry checkpoint is `{B3_MERGE}` after B3 PR #245 passed Static `{STATIC_RUN}` and Linux `{LINUX_RUN}` at `{RESULT}`.", t, count=1)
          t = t.replace("R2-B3 now moves structural/object environments, object APIs, hooks and project-owned object identifiers directly into responsibility-owning modules.", "R2-B3 completed structural/object direct ownership. R2-B4 now moves bibliography/reference/glossary/index commands directly into responsibility-owning modules.")
          t = re.sub(r"R2-A ownership inventory, R2-B1 setup/state migration and R2-B2 academic/front-matter migration are complete; V3-R2/R2-B3 is active through issue #238\..*?`0650845b922271fc134d20ef2a8c36ebb999ef91`\.", f"R2-A, R2-B1, R2-B2 and R2-B3 are complete. B3 PR #245 merged at `{B3_MERGE}` after full Linux integration `{LINUX_RUN}` passed `{RESULT}`. V3-R2/R2-B4 is active through issue #239.", t, count=1, flags=re.S)
          p.write_text(t, encoding="utf-8")

