name: V3 R2 B3 closeout temp

on:
  push:
    branches:
      - docs/v3-r2-b3-closeout-b4-entry

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reconcile control plane
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/v3-r2-b3-closeout.py
          git diff --check
          make static-check

      - name: Publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v3-r2-b3-closeout-temp.yml .github/v3-r2-b3-closeout.py
          git diff --check
          make static-check
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/v3-roadmap.json release/v3-api-migration.json release/v3-test-migration.json release/v3-path-migration.json docs/ROADMAP-V3.0.0.md docs/HANDOFF-V3.0.0.md docs/R2-API-OWNERSHIP.md docs/ARCHITECTURE.md docs/CTAN-RELEASE.md AGENTS.md README.md
          git diff --cached --check
          git commit -m "docs: close R2-B3 and activate R2-B4"
          git push origin HEAD:docs/v3-r2-b3-closeout-b4-entry
