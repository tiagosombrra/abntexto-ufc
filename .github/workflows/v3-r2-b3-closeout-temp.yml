'''
          Path("docs/HANDOFF-V3.0.0.md").write_text(handoff, encoding="utf-8")

          ownership = f'''# V3-R2 API Ownership Inventory

Updated: {DATE}

## Purpose

This document records the R2 owner map and the bounded B1–B5 migration sequence. It is engineering control-plane documentation, not a normative formatting source.

R2-A entry: `0a2c2c3879986ca27b731f54b974db12524258df`. B1 merge: `ded5e77733795aa2958606e899d4e27f12f64df4`. B2 implementation merge: `8e3e0f2a165e488a00f08a0031ba6fb4a01f9949`. B3 reconciled entry: `{B3_ENTRY}`. B3 merge / B4 product entry: `{B3_MERGE}`. Authoritative contract: `release/v3-api-migration.json`.

## Current-state finding

`public-api.def` remains transitional forwarding debt loaded last by the class, but B1, B2 and B3 forwarding has been fully absorbed by direct owners. Exactly four B4 forwards remain: `\\ufcAddBibliographyResource`, `\\ufcPrintReferences`, `\\ufcPrintGlossary`, and `\\ufcPrintIndex`. B4 absorbs them; B5 removes the forwarding file itself and performs the final repository-wide residual migration.

## Responsibility ownership

| Runtime surface | Direct owner | R2 status |
|---|---|---|
| setup, document/profile state, metadata | `core.def` | B1 DONE |
| fonts/strict-font | `fonts.def` | B1 DONE |
| optional module state | `modules.def` | B1 DONE |
| layout, structural lists, section hook | `layout.def` | B1/B2/B3 DONE |
| approval/dedication/summary/lists/TOC + definition list | `frontmatter.def` | B2/B3 DONE |
| institutional asset | `institutional.def` | B1 DONE |
| academic cover/title/catalog card | `academic-works.def` | B1/B2 DONE |
| research-project specialization | `research-projects.def` | B1/B2 DONE |
| objects, source/note, chart/code/algorithm lists, listing/minted/algorithm APIs, object hook | `objects.def` | B3 DONE |
| ABNTexto definition-list integration and genuine upstream boundaries | `integrations/abntexto.def` | B3 DONE; retain upstream boundary only |
| bibliography resource registration/reference section | `bibliography.def` | B4 ACTIVE |
| glossary/index presentation | `backmatter.def` | B4 ACTIVE |
| forwarding-only layer | `public-api.def` | only four B4 forwards remain; remove in B5 |

## Upstream boundary classification

Dependency-owned non-English identifiers remain only where required by the dependency contract. Current explicit examples include `grafico` / `quadro` and upstream commands such as `\\legend`, `\\keywords`, `\\appendix`, `\\annex`, `\\pretextual`, and `\\textual`. They are not canonical project-owned v3 API. Rendered Portuguese labels remain protected document content.

## Migration lots

### R2-B1 — DONE

Issue #234 / PR #236. Setup and internal state moved to direct owners. Final Linux integration `33668283890` passed `30/0/0`.

### R2-B2 — DONE

Issue #237 / PR #242; closeout PR #243. Academic/front-matter rendering moved to direct owners, hooks/consumers migrated, B2 forwards removed. Final implementation Linux `33680378846` passed `30/0/0`; merged-main release check `33687588772` passed `32/0/0`; release-source audit `33696155771` reconciled CTAN/public-bundle live consumers.

### R2-B3 — DONE

Issue #238 / PR #245. Entry `{B3_ENTRY}`; implementation head `{B3_HEAD}`; merge `{B3_MERGE}`. Structural/object environments, source/note/list APIs, optional listing/minted APIs, hooks and project-owned object IDs are directly owned. Corrected bounded executor `{EXEC_RUN}` passed; Static `{STATIC_RUN}` passed; Linux `{LINUX_RUN}` / job `{LINUX_JOB}` closed `{RESULT}`. No runtime aliases, normative semantic changes or proof-state changes.

### R2-B4 — ACTIVE

Issue #239. Entry `{B3_MERGE}`. Move `\\ufcAddBibliographyResource` / `\\ufcPrintReferences` to `bibliography.def` and `\\ufcPrintGlossary` / `\\ufcPrintIndex` to `backmatter.def`; internalize non-semantic plumbing; migrate consumers atomically; remove only B4 forwarding definitions.

### R2-B5 — PENDING

Issue #240. Perform the final consumer/internal-identifier residual sweep, remove `public-api.def` and its class load, reconcile consumed contracts, and create `docs/MIGRATING-TO-V3.md`. Migration support is documentation-only; no runtime aliases.

## Cross-lot invariants

Project-owned engineering identifiers are English; rendered Brazilian academic content remains as required. Producer/owner and live consumers move together. No normative rule/value/tolerance/locator/proof-state change without evidence. Proprietary Microsoft fonts remain external. Actual CTAN submission remains a later explicit release action.
'''
          Path("docs/R2-API-OWNERSHIP.md").write_text(ownership, encoding="utf-8")

          # Narrow current-state edits in durable overview documents.
