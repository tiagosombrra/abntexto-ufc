          t = re.sub(r"- R2-B3 owns structural/object environments, source/note and object-list APIs, optional listing/minted APIs, extension hooks, project-owned `codigo` / `algoritmo` IDs, and their atomic template/test consumers\..*?blind global replacement\.", f"- R2-B3 is DONE through PR #245 at `{B3_MERGE}`; Static `{STATIC_RUN}` and Linux `{LINUX_RUN}` passed `{RESULT}`. Structural/object APIs and project-owned object IDs are directly owned; genuine upstream `grafico` / `quadro` remain only at integration boundaries.\n- R2-B4/#239 owns bibliography/reference/glossary/index public commands and non-semantic plumbing internalization. Migrate owners and consumers atomically; do not perform a blind global replacement.", t, count=1, flags=re.S)
          p.write_text(t, encoding="utf-8")

          changed = [
