name: V3 R2 B3 closeout temp

on:
  push:
    branches:
      - docs/v3-r2-b3-closeout-b4-entry

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Reconcile B3 closeout and B4 entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          B3_ENTRY = "ca1b789d44343f202f23dd193a391ef85d57986e"
          B3_HEAD = "e08592e90072cc6b42b1e7c61163003dc0bf7e28"
          B3_MERGE = "fb71eb0cb50f065d75aec6bbc704dcaf9091d1df"
          STATIC_RUN = 33704346418
          STATIC_JOB = 100490158634
          LINUX_RUN = 33704346429
          LINUX_JOB = 100490158816
          EXEC_RUN = 33703865896
          EXEC_JOB = 100488717954
          RESULT = "PASS=30 FAIL=0 SKIP=0"
          DATE = "2026-09-02"

          closeout = {
              "status": "DONE",
              "issue": 238,
              "pr": 245,
              "entry_main_sha": B3_ENTRY,
              "implementation_head_sha": B3_HEAD,
              "merge_main_sha": B3_MERGE,
              "bounded_executor_run_id": EXEC_RUN,
              "bounded_executor_job_id": EXEC_JOB,
              "static_run_id": STATIC_RUN,
              "static_job_id": STATIC_JOB,
              "linux_integration_run_id": LINUX_RUN,
              "linux_integration_job_id": LINUX_JOB,
              "linux_integration_result": RESULT,
              "runtime_alias_layer_added": False,
              "normative_semantics_changed": False,
              "proof_state_changed": False,
          }

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          def save(path, data):
              Path(path).write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def issue_of(d):
              return d.get("issue", d.get("operational_issue"))

          def patch_stage_nodes(node):
              if isinstance(node, dict):
                  issue = issue_of(node)
                  if issue == 238:
                      node["status"] = "DONE"
                      node.setdefault("pr", 245)
                      node.setdefault("merge_main_sha", B3_MERGE)
                      node.setdefault("linux_integration_result", RESULT)
                  elif issue == 239:
                      node["status"] = "ACTIVE"
                      node.setdefault("entry_main_sha", B3_MERGE)
                  for key, value in list(node.items()):
                      if key == "R2-B3" and isinstance(value, dict):
                          value["status"] = "DONE"
                          value["issue"] = 238
                          value["pr"] = 245
                          value["closure_sha"] = B3_MERGE
                          value["linux_integration_run_id"] = LINUX_RUN
                          value["linux_integration_result"] = RESULT
                      elif key == "R2-B4" and isinstance(value, dict):
                          value["status"] = "ACTIVE"
                          value["issue"] = 239
                          value["entry_main_sha"] = B3_MERGE
                      patch_stage_nodes(value)
              elif isinstance(node, list):
                  for item in node:
                      patch_stage_nodes(item)

          # Machine authority.
          p = "release/v3-roadmap.json"
          d = load(p)
          d["updated_at"] = DATE
          d["phase"] = "V3-R2"
          d["stage"] = "R2-B4"
          d["stage_name"] = "bibliography and back-matter API ownership"
          d["active_branch"] = "main"
          d["r2_b3_closeout"] = closeout
          d["active_implementation_lot"] = {"stage": "R2-B4", "issue": 239, "entry_main_sha": B3_MERGE}
          d["next_action"] = "Execute R2-B4 issue #239: move bibliography/reference/glossary/index public commands to direct owners, internalize non-semantic plumbing, migrate live consumers atomically, and leave final public-api.def removal to R2-B5."
          patch_stage_nodes(d)
          save(p, d)

          p = "release/v3-api-migration.json"
          d = load(p)
          d["status"] = "R2_B3_DONE_R2_B4_ACTIVE"
          d["current_stage"] = "R2-B4"
          d["current_stage_goal"] = "bibliography and back-matter API ownership"
          d["current_main_sha"] = B3_MERGE
          d["r2_b3_closeout"] = closeout
          d["active_implementation_lot"] = {"stage": "R2-B4", "issue": 239, "entry_main_sha": B3_MERGE}
          patch_stage_nodes(d)
          save(p, d)

          p = "release/v3-test-migration.json"
          d = load(p)
          d["current_stage"] = "R2-B4"
          d["r2_b3_closeout"] = {**closeout, "consumer_migration": "structural/object owners, hooks, object IDs, template/tests/fixtures migrated atomically"}
          d["active_implementation_lot"] = {"stage": "R2-B4", "issue": 239, "entry_main_sha": B3_MERGE}
          if isinstance(d.get("r2_api_consumer_policy"), dict):
              d["r2_api_consumer_policy"]["active_lot"] = "R2-B4"
          save(p, d)

          p = "release/v3-path-migration.json"
          d = load(p)
          d["current_stage"] = "R2-B4"
          d["r2_b3_closeout"] = {**closeout, "next_lot": "R2-B4", "next_issue": 239, "public_api_absorption": "B1 setup, B2 academic/front-matter and B3 structural/object forwarding removed; only B4 bibliography/back-matter forwarding remains"}
          d["active_implementation_lot"] = {"stage": "R2-B4", "issue": 239, "entry_main_sha": B3_MERGE}
          save(p, d)

          roadmap = f'''# abntexto-ufc v3.0.0 — Engineering Roadmap

Updated: {DATE}

## Status

**V3-R1 DONE. V3-R2 ACTIVE — R2-B4 bibliography and back-matter API ownership.**

Canonical R2-B4 product entry on `main`: `{B3_MERGE}`. Certified R1 product candidate: `9b1752565ac217c04ffa22a9ef272cdf078af380`. Active implementation issue: #239. Machine authority: `release/v3-roadmap.json`.

## Roadmap summary

| Stage | Status | Checkpoint / issue | Result | Remaining work |
|---|---|---|---|---|
| R1-S0 | DONE | repository sanitation | History governance rebaselined | None |
| R1-S1 | DONE | `1c7291592689f10a0e6fb043d404597ae8e53c02` | Control plane repaired | None |
