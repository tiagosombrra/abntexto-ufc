name: B7-C1 final clean-runner certification

on:
  push:
    branches:
      - 'fix/v3-r1-b7c1-clean-runner-contract'

permissions:
  contents: read

jobs:
  integration:
    name: B7-C1 final clean-runner integration
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run repository integration contract
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs
            node --version
            make check
