name: R3-B3 closeout baseline repair

on:
  push:
    branches:
      - docs/v3-r3-b3-closeout-b4-entry
    paths:
      - .github/scripts/r3-b3-closeout-baseline-fix.py
      - .github/workflows/r3-b3-closeout-baseline-fix.yml

permissions:
  contents: write

concurrency:
  group: r3-b3-closeout-baseline-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Align permanent residual baseline
        run: python3 .github/scripts/r3-b3-closeout-baseline-fix.py
