name: B7-C3 control-plane sync v2

on:
  push:
    branches:
      - docs/v3-r1-b7c3-close-b7d-open

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b7c3-close-b7d-open

      - name: Reconcile certified B7-C3 state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          CLOSURE_SHA = "d7327db7efd5cc1e0ff9255195bcb9767d853d3e"
          RELEASE_RUN = 33566835570

          def replace_line(path, needle, replacement):
              p = Path(path)
              lines = p.read_text(encoding="utf-8").splitlines()
              matches = [i for i, line in enumerate(lines) if needle in line]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: expected one line containing {needle!r}, found {len(matches)}")
              lines[matches[0]] = replacement
              p.write_text("\n".join(lines) + "\n", encoding="utf-8")

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {n}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Machine authority.
          p = Path("release/v3-roadmap.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["last_certified_clean_checkpoint_sha"] = CLOSURE_SHA
          b7 = data["blocks"]["R1-BLOCK-7"]
          b7["active_work_item"] = "B7-D"
          b7["active_sub_item"] = "B7-D"
          b7["planned_lots"]["B7-C"] = "DONE - C1 clean-runner integration contract, C2 permanent Linux PR integration orchestration, and C3 permanent Linux release orchestration certified"
          b7["planned_lots"]["B7-D"] = "ACTIVE - residual workflow audit, branch-protection recommendation, and B8 handoff"
          b7["b7_c_status"] = "DONE"
          b7["b7_c3_status"] = "DONE"
          b7["b7_d_status"] = "ACTIVE"
          b7["b7_c3_pr"] = 225
          b7["b7_c3_closure_sha"] = CLOSURE_SHA
          b7["b7_c3_validation_runs"] = [
              {"run_id": 33563893128, "scope": "targeted profile PDF/A dependency-chain proof", "conclusion": "success"},
              {"run_id": 33564594657, "workflow": "Static contract", "scope": "PR #225", "conclusion": "success"},
              {"run_id": 33564594625, "workflow": "Linux integration", "scope": "PR #225", "conclusion": "success", "pass": 30, "fail": 0, "skip": 0},
              {"run_id": 33566835558, "workflow": "Static contract", "scope": "merged main", "conclusion": "success"},
              {"run_id": RELEASE_RUN, "workflow": "Linux release check", "scope": "first permanent merged-main release run", "conclusion": "success", "pass": 32, "fail": 0, "skip": 0}
          ]
          b7["b7_c3_results"] = {
              "permanent_workflow": ".github/workflows/linux-release-check.yml",
              "stable_workflow_job_name": "Linux release check",
              "delegates_to": "make release-check",
              "technical_main_push_trigger": True,
              "documentation_control_plane_main_push_ignored": True,
              "manual_dispatch_enabled": True,
              "superseded_release_runs_cancelled": True,
              "contents_permission": "read",
              "validation_evidence_retention_days": 14,
              "validation_artifact_id": 9823866898,
              "validation_artifact_digest": "0b39350f7fcd69c35fe9a0290342df3612feecf63f17a5d93a4595de71f17375",
              "validation_artifact_files": 35,
              "release_checks": 32,
              "full_permanent_run_pass": 32,
              "full_permanent_run_fail": 0,
              "full_permanent_run_skip": 0,
              "reference_pdfa_release_only_passed": True,
              "profile_pdfa_release_only_passed": True,
              "final_windows_literal_font_pdfa_certification_owned_by": "R1-BLOCK-8",
              "runtime_api_changed": False,
              "normative_semantics_changed": False,
              "proof_state_changed": False
          }
          data["next_action"] = "Execute R1-BLOCK-7 B7-D. Audit the three permanent workflows, stable status semantics, permissions, pinned actions, concurrency, temporary-workflow absence, and the current main ruleset; record the branch-protection/status-check recommendation and hand final Windows/literal-font/PDF-A certification to R1-BLOCK-8. Do not rerun completed heavy product checks without current-state need, perform V3-R2 runtime/API migration, or perform an actual CTAN submission."
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          replace_line("README.md", "B7-C3 is active and adds the permanent", "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. B7-C1 certified `make check` on a clean TeX Live 2026 Linux runner (`PASS=30 FAIL=0 SKIP=0`). B7-C2 then certified the permanent `.github/workflows/linux-integration.yml` workflow through PR #222: its stable `Linux integration` status always evaluates PR scope, skips the expensive TeX step for drafts and a narrow documentation/control-plane-only allowlist, runs full integration for every other or unknown path, cancels superseded PR runs, delegates the heavy gate to `make check`, and forces full integration on `workflow_dispatch`; its first full permanent run also closed `PASS=30 FAIL=0 SKIP=0`. B7-C3 is DONE and permanently provides `.github/workflows/linux-release-check.yml` with stable workflow/job name `Linux release check`; PR #225 merged at `d7327db7efd5cc1e0ff9255195bcb9767d853d3e`, and the first permanent merged-main run `33566835570` closed `PASS=32 FAIL=0 SKIP=0`, including release-only `pdfa` and `profile-pdfa`, while retaining validation evidence for 14 days. B7-D is now active for residual workflow/status/ruleset audit and B8 handoff. Final Windows/literal-font/PDF-A certification remains B8-owned.")

          replace_line("AGENTS.md", "B7-C3 is ACTIVE and adds", "- B7-C1 certified the repository-owned `make check` contract on a clean TeX Live 2026 runner. B7-C2 is DONE and permanently provides `.github/workflows/linux-integration.yml` with stable `Linux integration` status. B7-C3 is DONE and permanently provides `.github/workflows/linux-release-check.yml`; PR #225 merged at `d7327db7efd5cc1e0ff9255195bcb9767d853d3e`, and permanent main run `33566835570` passed all 32 release checks (`PASS=32 FAIL=0 SKIP=0`). B7-D is ACTIVE for residual workflow/status/ruleset audit and B8 handoff. Final Windows/literal-font/PDF-A certification remains B8-owned.")

          replace_line("docs/ARCHITECTURE.md", "B7-C3 is active and adds bounded", "R1-BLOCK-7 restores permanent orchestration incrementally. B7-B established `Static contract`; B7-C1 certified the clean-runner `make check` contract; B7-C2 established bounded permanent PR orchestration through `Linux integration`; and B7-C3 is DONE with bounded `Linux release check` orchestration as a thin consumer of `make release-check`. PR #225 merged at `d7327db7efd5cc1e0ff9255195bcb9767d853d3e`, and permanent main run `33566835570` passed all 32 release checks (`PASS=32 FAIL=0 SKIP=0`). B7-D is active for residual workflow/status/ruleset audit and B8 handoff; B8 remains the owner of final Windows/literal-font/PDF-A certification.")

          replace_line("docs/CTAN-RELEASE.md", "B7-C3 adds the permanent", "B7-C3 established and certified the permanent `.github/workflows/linux-release-check.yml` workflow, named `Linux release check`. It runs the repository-owned `make release-check` entry point after technical changes land on `main` and on manual dispatch, publishes `artifacts/validation/validation-report.md` in the Actions job summary, and retains `artifacts/validation/**` as short-lived engineering evidence for 14 days. PR #225 merged at `d7327db7efd5cc1e0ff9255195bcb9767d853d3e`; the first permanent merged-main release run `33566835570` passed all 32 checks (`PASS=32 FAIL=0 SKIP=0`), including release-only `pdfa` and `profile-pdfa`. This Linux evidence is not final B8 Windows/literal-font/PDF-A certification and is not CTAN acceptance.")

          replace_line("docs/HANDOFF-V3.0.0.md", "- Active B7 work item:", "- Active B7 work item: **B7-D — residual workflow audit and B8 handoff**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- Active B7 sub-item:", "- Active B7 sub-item: **B7-D — permanent workflow/status/ruleset residual audit and B8 handoff**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- Active B7 focus:", "- Active B7 focus: **audit the three permanent workflow surfaces and stable status semantics, record the current branch-protection recommendation, prove zero temporary workflow residue, and hand final Windows/literal-font/PDF-A certification to B8**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- Latest certified clean implementation checkpoint:", f"- Latest certified clean implementation checkpoint: **`{CLOSURE_SHA}`**.")
          replace_once("docs/HANDOFF-V3.0.0.md", "latest certified implementation checkpoint: **`ced68313ed2c362a6617d7df6ef9adfd2df6c0b5`**.", f"latest certified implementation checkpoint: **`{CLOSURE_SHA}`**.")
          replace_line("docs/HANDOFF-V3.0.0.md", "**ACTIVE.** B7-C starts with", "**DONE.** B7-C established and certified the repository-owned clean-runner contract plus bounded permanent Linux PR and release orchestration without absorbing B8 certification responsibilities.")
          replace_line("docs/HANDOFF-V3.0.0.md", "- **B7-C3 ACTIVE", f"- **B7-C3 DONE — permanent Linux release orchestration:** PR #225 squash-merged at `{CLOSURE_SHA}`. Targeted run `33563893128` proved the repaired profile PDF/A dependency chain; PR runs `33564594657` (`Static contract`) and `33564594625` (`Linux integration`, `PASS=30 FAIL=0 SKIP=0`) passed; post-merge `Static contract` run `33566835558` passed; and the first permanent `Linux release check` on merged `main`, run `{RELEASE_RUN}`, closed `PASS=32 FAIL=0 SKIP=0`, including release-only `pdfa` and `profile-pdfa`. The workflow retains validation evidence for 14 days and remains engineering evidence rather than B8 final certification.")
          replace_line("docs/HANDOFF-V3.0.0.md", "**PENDING.** Audit workflow ownership/status semantics", "**ACTIVE.** Audit workflow ownership/status semantics, confirm pinned actions/read-only permissions/bounded concurrency, prove zero temporary workflow residue, record the stable required-check/branch-protection recommendation, and hand final Windows/literal-font/PDF-A certification to B8. Heavy TeX/PDF product gates already certified by B7-C are not rerun without a current-state need.")

          replace_line("docs/ROADMAP-V3.0.0.md", "**V3-R1 ACTIVE — R1-BLOCK-6 done;", "**V3-R1 ACTIVE — R1-BLOCK-6 done; R1-BLOCK-7 active; B7-A/B/C done; B7-D active.**")
          replace_line("docs/ROADMAP-V3.0.0.md", "**B7-A DONE →", "**B7-A DONE → B7-B DONE → B7-C DONE [C1 DONE → C2 DONE → C3 DONE] → B7-D ACTIVE**")
          replace_line("docs/ROADMAP-V3.0.0.md", "- Latest certified implementation checkpoint:", f"- Latest certified implementation checkpoint: **`{CLOSURE_SHA}`**.")
          replace_line("docs/ROADMAP-V3.0.0.md", "**ACTIVE.** Operational issue #213.", f"**ACTIVE.** Operational issue #213. Entry checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: **`{CLOSURE_SHA}`**.")
          replace_line("docs/ROADMAP-V3.0.0.md", "**ACTIVE.** Permanent heavy YAML remains blocked", "**DONE.** The repository-owned clean-runner contract and bounded permanent Linux PR/release orchestration are certified; B7-D now owns the residual orchestration/status/ruleset audit and B8 handoff.")
          replace_line("docs/ROADMAP-V3.0.0.md", "**ACTIVE.** Define and prove bounded permanent Linux release orchestration", f"**DONE** via PR #225 at **`{CLOSURE_SHA}`**. `Linux release check` delegates to `make release-check`, runs after technical merges to `main` and on manual dispatch, ignores documentation/control-plane-only main pushes, cancels superseded runs, and retains validation evidence for 14 days. Targeted run `33563893128` proved the repaired profile PDF/A chain; PR runs `33564594657` and `33564594625` passed; post-merge `Static contract` run `33566835558` passed; and first permanent merged-main release run **`{RELEASE_RUN}`** closed **`PASS=32 FAIL=0 SKIP=0`**, including release-only `pdfa` and `profile-pdfa`. Final Windows/literal-font/PDF-A certification remains B8-owned.")
          replace_line("docs/ROADMAP-V3.0.0.md", "**PENDING.** Audit permanent workflow ownership", "**ACTIVE.** Audit the three permanent workflow owners and stable check names, permissions/action pins/concurrency, status semantics, zero temporary workflow residue and the current `main` ruleset. Record the required-status recommendation, then activate B8 without rerunning already-certified heavy product gates unless current state requires it.")
          replace_line("docs/ROADMAP-V3.0.0.md", "- **R1-B7 ACTIVE**", "- **R1-B7 ACTIVE** — optimized remote workflow restoration; B7-C is complete and B7-D residual audit/B8 handoff is active.")
          replace_line("docs/ROADMAP-V3.0.0.md", "Execute **B7-C2** from canonical remote", "Execute **B7-D** from canonical remote `main`. Audit the three permanent workflows (`Static contract`, `Linux integration`, `Linux release check`), their stable status semantics, pinned actions, read-only permissions, bounded concurrency and temporary-workflow absence; inspect the current `main` ruleset and record the required-status recommendation. Do not rerun completed heavy product checks without current-state need. Hand final Windows/literal-font/PDF-A certification to B8; keep V3-R2 runtime/API migration and actual CTAN submission out of scope.")
          PY

          rm -f .github/workflows/b7c3-control-plane-sync-v2.yml
          python3 -m json.tool release/v3-roadmap.json >/dev/null
          git diff --check
          make static-check

          python3 - <<'PY'
          from pathlib import Path
          expected = {"static-contract.yml", "linux-integration.yml", "linux-release-check.yml"}
          actual = {p.name for p in Path('.github/workflows').glob('*.yml')}
          if actual != expected:
              raise SystemExit(f"workflow inventory mismatch: expected={sorted(expected)} actual={sorted(actual)}")
          print("Permanent workflow inventory PASS")
          PY

          git config user.name "Tiago Sombra"
          git config user.email "tiagosombrra@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: close B7-C3 and activate B7-D"
          git push origin HEAD:docs/v3-r1-b7c3-close-b7d-open
