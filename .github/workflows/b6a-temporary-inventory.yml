name: B6-A validation inventory

on:
  push:
    branches:
      - audit/v3-r1-b6a-inventory

permissions:
  contents: write

jobs:
  inventory:
    if: "github.event.head_commit.message == 'chore: add temporary B6-A validation inventory'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inventory and measure validation surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json
          import re
          import subprocess
          import time
          from pathlib import Path

          root = Path('.')
          checks = sorted(Path('tests/checks').glob('*.py'))
          integrations = sorted(Path('tests/integration').glob('*.sh'))
          validators = sorted(p for p in Path('validator').rglob('*') if p.is_file())

          signal_patterns = {
              'network': re.compile(r'https?://|urlopen|requests\.|urllib\.|curl\b|wget\b', re.I),
              'tex_pdf': re.compile(r'pdflatex|lualatex|xelatex|latexmk|biber\b|kpsewhich|pdfinfo|pdftotext|pdftocairo|pdffonts|\.pdf\b', re.I),
              'subprocess': re.compile(r'\bsubprocess\b|os\.system|Popen\b|check_(?:call|output)\b', re.I),
              'artifact': re.compile(r'artifacts/|artifacts\\|validation-report|evidence.*\.json', re.I),
              'platform': re.compile(r'powershell|pwsh|windows|sys\.platform|os\.name|cmd\.exe', re.I),
              'generated_source': re.compile(r'template/main\.(?:aux|bcf|log|pdf)|dist/|_minted-|\.aux\b|\.bcf\b', re.I),
          }

          def signals(path: Path) -> list[str]:
              text = path.read_text(encoding='utf-8', errors='replace')
              return [name for name, pattern in signal_patterns.items() if pattern.search(text)]

          check_rows = [(p.as_posix(), signals(p)) for p in checks]
          integration_rows = [(p.as_posix(), signals(p)) for p in integrations]

          def heuristic(sig: list[str]) -> str:
              s = set(sig)
              if s & {'tex_pdf', 'network', 'platform', 'generated_source'}:
                  return 'heavy/runtime-or-platform'
              if s & {'subprocess', 'artifact'}:
                  return 'bounded-review-required'
              return 'source-only-candidate'

          groups: dict[str, list[str]] = {
              'source-only-candidate': [],
              'bounded-review-required': [],
              'heavy/runtime-or-platform': [],
          }
          for path, sig in check_rows:
              groups[heuristic(sig)].append(path)

          integration_groups: dict[str, list[str]] = {
              'source-only-candidate': [],
              'bounded-review-required': [],
              'heavy/runtime-or-platform': [],
          }
          for path, sig in integration_rows:
              integration_groups[heuristic(sig)].append(path)

          # Current broad runner graph.
          runner = Path('tests/run.py').read_text(encoding='utf-8')
          registered = re.findall(r'Check\("([^"]+)"', runner)
          release_only = re.findall(r'Check\(\s*"([^"]+)"[\s\S]{0,260}?modes=\("release",\)', runner)

          # Makefile validation entry points.
          makefile = Path('Makefile').read_text(encoding='utf-8')
          make_targets = re.findall(r'^([A-Za-z0-9_.-]+):(?:\s|$)', makefile, re.M)
          validation_targets = [t for t in make_targets if t in {'check','release-check','preflight','release-preflight'}]

          # Cheap universal syntax/data gates and timings.
          timings = []
          commands = [
              ('python-syntax-all', ['bash','-lc', "git ls-files '*.py' -z | xargs -0 -r -n 40 python3 -m py_compile"]),
              ('json-parse-all', ['bash','-lc', "git ls-files '*.json' -z | xargs -0 -r python3 -c 'import json,sys; [json.load(open(p, encoding=\"utf-8\")) for p in sys.argv[1:]]'"]),
              ('shell-syntax-all', ['bash','-lc', "git ls-files '*.sh' -z | xargs -0 -r -n 1 sh -n"]),
              ('js-syntax-all', ['bash','-lc', "set -e; for f in $(git ls-files '*.js'); do node --check \"$f\" >/dev/null; done"]),
          ]
          static_named = [
              'canonical_identity.py',
              'repository_contract.py',
              'normative_atomic_contract.py',
              'normative_full_contract.py',
              'normative_validator_contract.py',
              'validator_source.py',
          ]
          for name in static_named:
              p = Path('tests/checks') / name
              if p.is_file():
                  commands.append((name[:-3], ['python3', p.as_posix()]))

          for label, cmd in commands:
              start = time.perf_counter()
              cp = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace')
              elapsed = time.perf_counter() - start
              timings.append({'name': label, 'seconds': round(elapsed, 3), 'exit_code': cp.returncode, 'tail': cp.stdout.splitlines()[-4:]})

          payload = {
              'check_files': len(checks),
              'integration_shell_files': len(integrations),
              'validator_files': len(validators),
              'tests_run_registered_checks': len(registered),
              'tests_run_release_only_checks': release_only,
              'make_validation_targets': validation_targets,
              'check_groups': {k: {'count': len(v), 'files': v} for k,v in groups.items()},
              'integration_groups': {k: {'count': len(v), 'files': v} for k,v in integration_groups.items()},
              'timings': timings,
          }
          Path('/tmp/b6a-inventory.json').write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

          print('B6-A-INVENTORY-SUMMARY ' + json.dumps({
              'check_files': payload['check_files'],
              'integration_shell_files': payload['integration_shell_files'],
              'validator_files': payload['validator_files'],
              'tests_run_registered_checks': payload['tests_run_registered_checks'],
              'check_source_candidates': payload['check_groups']['source-only-candidate']['count'],
              'check_bounded_review': payload['check_groups']['bounded-review-required']['count'],
              'check_heavy': payload['check_groups']['heavy/runtime-or-platform']['count'],
              'integration_source_candidates': payload['integration_groups']['source-only-candidate']['count'],
              'integration_bounded_review': payload['integration_groups']['bounded-review-required']['count'],
              'integration_heavy': payload['integration_groups']['heavy/runtime-or-platform']['count'],
          }, sort_keys=True))
          print('B6-A-TIMINGS ' + json.dumps(timings, ensure_ascii=False))
          print('B6-A-SOURCE-CHECK-CANDIDATES ' + json.dumps(groups['source-only-candidate']))
          print('B6-A-BOUNDED-CHECK-CANDIDATES ' + json.dumps(groups['bounded-review-required']))
          print('B6-A-HEAVY-CHECKS ' + json.dumps(groups['heavy/runtime-or-platform']))
          print('B6-A-RUNNER-CHECKS ' + json.dumps(registered))

          failed = [item for item in timings if item['exit_code'] != 0]
          if failed:
              print('B6-A-MEASUREMENT-NONPASS ' + json.dumps(failed, ensure_ascii=False))
          else:
              print('B6-A-MEASUREMENT status=PASS all_measured_candidates_passed=true')
          PY

          python3 -m json.tool /tmp/b6a-inventory.json >/dev/null
          git diff --check

      - name: Self-remove temporary inventory
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm .github/workflows/b6a-temporary-inventory.yml
          git commit -m 'chore: remove temporary B6-A inventory'
          git push origin HEAD:audit/v3-r1-b6a-inventory
