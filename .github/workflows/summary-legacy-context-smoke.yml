name: Summary legacy keyword locale smoke
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - abntexto-ufc.cls
      - tests/integration/frontmatter/summary-legacy-context.sh
      - .github/workflows/summary-legacy-context-smoke.yml
permissions:
  contents: read
concurrency:
  group: i18n-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  summary-legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Compile legacy keyword contexts in four languages
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            git config --global --add safe.directory "$PWD"
            sh tests/integration/frontmatter/summary-legacy-context.sh
      - name: Upload lexical evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-legacy-i18n-${{ github.run_id }}
          path: artifacts/frontmatter/summary-legacy-context.json
          if-no-files-found: warn
          retention-days: 14
