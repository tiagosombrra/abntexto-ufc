name: Temporary A1 closeout A2 prepare

on:
  push:
    branches:
      - docs/v3-a1-closeout-a2-prepare

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require exact A1 contract merge base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "4d018a92697e8f39e3a53b034c451e55996c84fb"
          test "$(git rev-parse origin/main)" = "4d018a92697e8f39e3a53b034c451e55996c84fb"

      - name: Reconcile A1 validated closeout state
        run: python .github/scripts/a1-closeout-a2-prepare.py

      - name: Verify source and migration authorities unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 4d018a92697e8f39e3a53b034c451e55996c84fb -- \
            docs/NORMATIVE-BASE.md \
            docs/NORMATIVE-CURRENCY.md \
            docs/MIGRATING-TO-V3.md \
            standards/catalog.json \
            standards/coverage-rules-article.json \
            standards/locator-audit-article.json \
            standards/precedence.json

      - name: Run repository static contract
        run: make static-check

      - name: Remove temporary executor and validate permanent diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/a1-closeout-a2-prepare.py
          rm -f .github/workflows/a1-closeout-a2-prepare.yml
          rmdir .github/scripts 2>/dev/null || true
          git diff --check 4d018a92697e8f39e3a53b034c451e55996c84fb
          mapfile -t changed < <(git diff --name-only 4d018a92697e8f39e3a53b034c451e55996c84fb)
          expected=(
            AGENTS.md
            README.md
            docs/ARCHITECTURE.md
            docs/ARTICLE-NORMATIVE-CONTRACT.md
            docs/CTAN-RELEASE.md
            docs/ENGINEERING-LANGUAGE.md
            docs/HANDOFF-V3.0.0.md
            docs/ROADMAP-V3.0.0.md
            release/v3-roadmap.json
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/actual
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit permanent A1 closeout preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record validated A1 source contract'
          git push origin HEAD:docs/v3-a1-closeout-a2-prepare
