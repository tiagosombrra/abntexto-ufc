name: Temporary A2 runtime implementation

on:
  push:
    branches:
      - feat/v3-a2-scientific-article-runtime

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Require current A2 control-plane main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "c4bf51b574647226ee488440579ec2a204c16c79"
          test "$(git merge-base HEAD origin/main)" = "c4bf51b574647226ee488440579ec2a204c16c79"

      - name: Repair and preflight temporary mutator syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/a2-runtime-implement.py')
          text = path.read_text(encoding='utf-8')
          old = '    print-mode .choice:,\n",'
          new = '    print-mode .choice:,\\n",'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two malformed temporary string endings; found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile .github/scripts/a2-runtime-implement.py

      - name: Apply bounded A2 runtime lot
        run: python .github/scripts/a2-runtime-implement.py

      - name: Verify article authority and proof files unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c4bf51b574647226ee488440579ec2a204c16c79 -- \
            standards/catalog.json \
            standards/precedence.json \
            standards/coverage-rules-article.json \
            standards/locator-audit-article.json \
            standards/normative-proof-state.json \
            standards/evidence-contribution-policy.json \
            standards/evidence-registry.json

      - name: Stage bounded workspace for tracked-file contracts
        shell: bash
        run: |
          set -euo pipefail
          git add -A

      - name: Run source-only contract
        run: make static-check

      - name: Run focused profile matrix on TeX Live 2026
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs
            python3 tests/run.py --mode pr --only profiles --report-dir /tmp/a2-profile-validation

      - name: Remove generated artifacts and temporary executor
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdx template
          rm -f .github/scripts/a2-runtime-implement.py
          rm -f .github/workflows/a2-runtime-inventory.yml
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git diff --cached --check c4bf51b574647226ee488440579ec2a204c16c79
          if git diff --cached --name-only c4bf51b574647226ee488440579ec2a204c16c79 | grep -E '^\.github/(scripts|workflows)/a2-' ; then
            echo 'Temporary A2 executor residue remains.'
            exit 1
          fi
          allowed='^(AGENTS\.md|README\.md|abntexto-ufc\.cls|abntexto-ufc/(articles|core|layout)\.def|docs/(ARCHITECTURE|ARTICLE-NORMATIVE-CONTRACT|HANDOFF-V3\.0\.0|NORMATIVE-BASE|NORMATIVE-CURRENCY|ROADMAP-V3\.0\.0)\.md|release/v3-api-migration\.json|release/v3-roadmap\.json|standards/(source-audit|version-policy)\.json|tests/checks/(normative_currency|profile_matrix_contract)\.py|tests/integration/profile-(matrix|pdfa)\.sh|tests/smoke/scientific-article-profile\.tex)$'
          bad=$(git diff --cached --name-only c4bf51b574647226ee488440579ec2a204c16c79 | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            printf 'Unexpected permanent paths:\n%s\n' "$bad"
            exit 1
          fi

      - name: Commit validated runtime lot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add canonical scientific-article runtime'
          git push origin HEAD:feat/v3-a2-scientific-article-runtime
