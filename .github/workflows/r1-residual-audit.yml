name: R1 exact active-consumer path repair

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-residual-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Repair exact active consumer paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          excluded = {
              'tests/checks/canonical_identity.py',
              'tests/checks/repository_contract.py',
              'tests/checks/release_package.py',
              'tests/checks/overleaf_bundle.py',
              'tests/checks/ctan_archive.py',
              'tests/integration/distribution.sh',
              'tests/integration/overleaf-stable.sh',
              'tests/integration/windows-font-pdfa.sh',
          }

          checker_map = {
              'normative_n10_appendix_annex.py': 'normative_appendix_annex.py',
              'normative_n10_index_glossary.py': 'normative_index_glossary.py',
              'normative_n10_scope.py': 'normative_backmatter_scope.py',
              'normative_n11_project_structure.py': 'normative_research_project_structure.py',
              'normative_n11_scope.py': 'normative_research_project_scope.py',
              'normative_n12_matrix.py': 'normative_certification_matrix.py',
              'normative_n13_campaign.py': 'normative_negative_campaign.py',
              'normative_n13_configuration.py': 'normative_configuration.py',
              'normative_n13_negative_paths.py': 'normative_negative_paths.py',
              'normative_n13_pdfa.py': 'normative_pdfa.py',
              'normative_n14_cross_surface.py': 'normative_cross_surface.py',
              'normative_n14_validator_contract.py': 'normative_validator_contract.py',
              'normative_n9_campaigns.py': 'normative_coverage_campaigns.py',
              'normative_n9_equation_display.py': 'normative_equation_display.py',
              'normative_n9_illustration.py': 'normative_illustration.py',
              'normative_n9_progress.py': 'normative_coverage_progress.py',
              'normative_n9_scope.py': 'normative_objects_scope.py',
              'normative_n9_table_ibge_vector.py': 'normative_table_ibge_vector.py',
              'normative_n9_table_typography.py': 'normative_table_typography.py',
              'normative_vector_rule_oracle.py': 'normative_vector_rule_validation.py',
          }
          document_map = {
              'algoritmos-linhas.tex': 'algorithm-line-numbering.tex',
              'build-minimo.tex': 'minimal-build.tex',
              'citacoes-referencias.tex': 'citations-references.tex',
              'ficha-catalografica.tex': 'catalog-card.tex',
              'fontes-arial-poc.tex': 'arial-font-poc.tex',
              'fontes-classe-poc.tex': 'class-font-poc.tex',
              'fontes-config.tex': 'font-configuration.tex',
              'fontes-documentais.tex': 'documentary-sources.tex',
              'fontes-times-poc.tex': 'times-font-poc.tex',
              'geometria-pdf.tex': 'pdf-geometry.tex',
              'layout-anverso.tex': 'layout-single-sided.tex',
              'layout-frente-verso.tex': 'layout-double-sided.tex',
              'matematica.tex': 'mathematics.tex',
              'normativa-complementar.tex': 'normative-complement.tex',
              'objeto-geometria.tex': 'object-geometry.tex',
              'objetos-avancados.tex': 'advanced-objects.tex',
              'objetos-minted.tex': 'minted-objects.tex',
              'postextuais.tex': 'backmatter.tex',
              'pretextuais-frente-verso.tex': 'frontmatter-double-sided.tex',
              'pretextuais-projeto-anonimo.tex': 'frontmatter-anonymized-project.tex',
              'pretextuais-trabalho.tex': 'frontmatter-academic-work.tex',
              'projeto-15287.tex': 'research-project-15287.tex',
              'projeto-sem-capa.tex': 'research-project-without-cover.tex',
              'referencias-6023-2025.tex': 'references-6023-2025.tex',
              'tabela-ibge.tex': 'ibge-table.tex',
              'tipografia-codigo.tex': 'code-typography.tex',
              'reference-layout-oracle.tex': 'reference-layout-test.tex',
              'vector-rule-oracle-calibration.tex': 'vector-rule-calibration-test.tex',
          }
          fixture_map = {
              'tests/fixtures/exemplo.cpp': 'tests/fixtures/example.cpp',
              'tests/fixtures/exemplo.py': 'tests/fixtures/example.py',
              'tests/fixtures/fontes-documentais.bib': 'tests/fixtures/documentary-sources.bib',
              'tests/fixtures/referencias-6023-2025.bib': 'tests/fixtures/references-6023-2025.bib',
              'tests/fixtures/referencias-v2.bib': 'tests/fixtures/references.bib',
              'tests/fixtures/n8-reference-layout.bib': 'tests/fixtures/reference-layout.bib',
              'tests/fixtures/pretextuais/abreviaturas.tex': 'tests/fixtures/frontmatter/abbreviations.tex',
              'tests/fixtures/pretextuais/abstract.tex': 'tests/fixtures/frontmatter/abstract.tex',
              'tests/fixtures/pretextuais/agradecimentos.tex': 'tests/fixtures/frontmatter/acknowledgments.tex',
              'tests/fixtures/pretextuais/dedicatoria.tex': 'tests/fixtures/frontmatter/dedication.tex',
              'tests/fixtures/pretextuais/epigrafe.tex': 'tests/fixtures/frontmatter/epigraph.tex',
              'tests/fixtures/pretextuais/errata.tex': 'tests/fixtures/frontmatter/errata.tex',
              'tests/fixtures/pretextuais/resumo.tex': 'tests/fixtures/frontmatter/summary.tex',
              'tests/fixtures/pretextuais/simbolos.tex': 'tests/fixtures/frontmatter/symbols.tex',
              'tests/smoke/perfil-base.tex': 'tests/smoke/base-profile.tex',
          }

          old_checker_re = re.compile(
              r'tests/checks/(?P<name>normative_(?:n[0-9]+_[A-Za-z0-9_]+|vector_rule_oracle)\.py)'
          )
          old_wrapper_re = re.compile(r'tests/v2-(?P<name>[A-Za-z0-9_.-]+)-check\.sh')
          old_document_re = re.compile(r'tests/normativa/(?P<name>[A-Za-z0-9_.-]+\.tex)')
          old_fixture_re = re.compile(
              r'tests/fixtures/(?:pretextuais/[A-Za-z0-9_.-]+\.tex|(?:exemplo\.(?:py|cpp)|fontes-documentais\.bib|referencias-6023-2025\.bib|referencias-v2\.bib|n8-reference-layout\.bib))'
          )
          old_smoke = 'tests/smoke/perfil-base.tex'
          old_standards_re = re.compile(r'(?<!tests/)normativa/(?P<name>[A-Za-z0-9_.-]+\.json)')

          def target_for(old: str) -> str | None:
              match = old_checker_re.fullmatch(old)
              if match:
                  new_name = checker_map.get(match.group('name'))
                  if not new_name:
                      return None
                  candidate = f'tests/checks/{new_name}'
                  return candidate if candidate in tracked else None
              match = old_wrapper_re.fullmatch(old)
              if match:
                  candidate = f"tests/integration/{match.group('name')}.sh"
                  return candidate if candidate in tracked else None
              match = old_document_re.fullmatch(old)
              if match:
                  name = match.group('name')
                  mapped = document_map.get(name)
                  if mapped:
                      candidate = f'tests/documents/{mapped}'
                      return candidate if candidate in tracked else None
                  if name.startswith('textual-oracle-'):
                      stem = name[len('textual-oracle-'):-4]
                      candidate = f'tests/documents/mainmatter-{stem}-test.tex'
                      return candidate if candidate in tracked else None
                  candidate = f'tests/documents/{name}'
                  return candidate if candidate in tracked else None
              if old in fixture_map:
                  return fixture_map[old] if fixture_map[old] in tracked else None
              if old == old_smoke:
                  return 'tests/smoke/base-profile.tex' if 'tests/smoke/base-profile.tex' in tracked else None
              return None

          def legacy_occurrences(text: str) -> list[str]:
              values: set[str] = set()
              values.update(match.group(0) for match in old_checker_re.finditer(text))
              values.update(match.group(0) for match in old_wrapper_re.finditer(text))
              values.update(match.group(0) for match in old_document_re.finditer(text))
              values.update(match.group(0) for match in old_fixture_re.finditer(text))
              if old_smoke in text:
                  values.add(old_smoke)
              return sorted(values)

          paths = [
              item for item in sorted(tracked)
              if item.startswith(('tests/integration/', 'tests/checks/', 'tests/documents/', 'tests/smoke/'))
              and item not in excluded
              and Path(item).suffix in {'.sh', '.py', '.tex'}
          ]

          changed: set[str] = set()
          migrations: list[str] = []
          dead_calls: list[str] = []
          unresolved: list[str] = []

          for item in paths:
              path = Path(item)
              lines = path.read_text(encoding='utf-8').splitlines()
              output: list[str] = []
              touched = False

              for original_line in lines:
                  line = original_line
                  remove_line = False
                  for old in legacy_occurrences(line):
                      new = target_for(old)
                      if new:
                          line = line.replace(old, new)
                          migrations.append(f'{item}: {old} -> {new}')
                          touched = True
                          continue

                      stripped = line.strip().rstrip('\\').strip()
                      standalone = (
                          stripped == old
                          or re.fullmatch(rf'(?:python3|sh)\s+{re.escape(old)}(?:\s+.*)?', stripped)
                      )
                      if standalone and old not in tracked:
                          dead_calls.append(f'{item}: {old}')
                          remove_line = True
                          touched = True
                          break
                      unresolved.append(f'{item}: {old}')

                  if remove_line:
                      if output and output[-1].rstrip().endswith('\\'):
                          output[-1] = output[-1].rstrip()[:-1].rstrip()
                      continue

                  line = line.replace('ROOT / "normativa"', 'ROOT / "standards"')
                  line = line.replace("ROOT / 'normativa'", "ROOT / 'standards'")
                  line = line.replace('Path("normativa")', 'Path("standards")')
                  line = line.replace("Path('normativa')", "Path('standards')")

                  for match in list(old_standards_re.finditer(line)):
                      old = match.group(0)
                      candidate = f"standards/{match.group('name')}"
                      if candidate in tracked:
                          line = line.replace(old, candidate)
                          migrations.append(f'{item}: {old} -> {candidate}')
                          touched = True
                      else:
                          unresolved.append(f'{item}: {old}')

                  if line != original_line:
                      touched = True
                  output.append(line)

              if touched:
                  path.write_text('\n'.join(output) + '\n', encoding='utf-8')
                  changed.add(item)

          if unresolved:
              raise SystemExit('Unresolved active path consumers:\n' + '\n'.join(sorted(set(unresolved))))

          stale: list[str] = []
          for item in paths:
              text = Path(item).read_text(encoding='utf-8')
              stale.extend(f'{item}: {old}' for old in legacy_occurrences(text))
              stale.extend(f'{item}: {match.group(0)}' for match in old_standards_re.finditer(text))
          if stale:
              raise SystemExit('Stale active consumer paths remain:\n' + '\n'.join(sorted(set(stale))))

          print(f'Changed files: {len(changed)}')
          print(f'Exact migrations: {len(migrations)}')
          print(f'Removed dead direct calls: {len(dead_calls)}')
          for item in sorted(changed):
              print(f'  {item}')
          if dead_calls:
              print('Removed dead calls:')
              for item in sorted(set(dead_calls)):
                  print(f'  {item}')
          PY

          python3 -m py_compile $(git ls-files 'tests/checks/*.py')
          for script in $(git ls-files 'tests/integration/*.sh'); do sh -n "$script"; done
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          if git diff --cached --quiet; then
            echo 'No active path-consumer changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: reconnect active test consumers'
          git push origin HEAD:refactor/v3-r1-rebaseline
