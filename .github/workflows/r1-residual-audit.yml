name: R1 exact active-consumer path repair

on:
  push:
    branches:
      - refactor/v3-r1-rebaseline
    paths:
      - .github/workflows/r1-residual-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: refactor/v3-r1-rebaseline

      - name: Repair exact active consumer paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import subprocess
          from pathlib import Path

          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())

          excluded = {
              'tests/checks/canonical_identity.py',
              'tests/checks/repository_contract.py',
              'tests/checks/release_package.py',
              'tests/checks/overleaf_bundle.py',
              'tests/checks/ctan_archive.py',
              'tests/integration/distribution.sh',
              'tests/integration/overleaf-stable.sh',
              'tests/integration/windows-font-pdfa.sh',
          }

          checker_map = {
              'tests/checks/normative_n10_appendix_annex.py': 'tests/checks/normative_appendix_annex.py',
              'tests/checks/normative_n10_index_glossary.py': 'tests/checks/normative_index_glossary.py',
              'tests/checks/normative_n10_scope.py': 'tests/checks/normative_backmatter_scope.py',
              'tests/checks/normative_n11_project_structure.py': 'tests/checks/normative_research_project_structure.py',
              'tests/checks/normative_n11_scope.py': 'tests/checks/normative_research_project_scope.py',
              'tests/checks/normative_n12_matrix.py': 'tests/checks/normative_certification_matrix.py',
              'tests/checks/normative_n13_campaign.py': 'tests/checks/normative_negative_campaign.py',
              'tests/checks/normative_n13_configuration.py': 'tests/checks/normative_configuration.py',
              'tests/checks/normative_n13_negative_paths.py': 'tests/checks/normative_negative_paths.py',
              'tests/checks/normative_n13_pdfa.py': 'tests/checks/normative_pdfa.py',
              'tests/checks/normative_n14_cross_surface.py': 'tests/checks/normative_cross_surface.py',
              'tests/checks/normative_n14_validator_contract.py': 'tests/checks/normative_validator_contract.py',
              'tests/checks/normative_n9_campaigns.py': 'tests/checks/normative_coverage_campaigns.py',
              'tests/checks/normative_n9_equation_display.py': 'tests/checks/normative_equation_display.py',
              'tests/checks/normative_n9_illustration.py': 'tests/checks/normative_illustration.py',
              'tests/checks/normative_n9_progress.py': 'tests/checks/normative_coverage_progress.py',
              'tests/checks/normative_n9_scope.py': 'tests/checks/normative_objects_scope.py',
              'tests/checks/normative_n9_table_ibge_vector.py': 'tests/checks/normative_table_ibge_vector.py',
              'tests/checks/normative_n9_table_typography.py': 'tests/checks/normative_table_typography.py',
              'tests/checks/normative_vector_rule_oracle.py': 'tests/checks/normative_vector_rule_validation.py',
          }

          document_map = {
              'algoritmos-linhas.tex': 'algorithm-line-numbering.tex',
              'build-minimo.tex': 'minimal-build.tex',
              'citacoes-referencias.tex': 'citations-references.tex',
              'ficha-catalografica.tex': 'catalog-card.tex',
              'fontes-arial-poc.tex': 'arial-font-poc.tex',
              'fontes-classe-poc.tex': 'class-font-poc.tex',
              'fontes-config.tex': 'font-configuration.tex',
              'fontes-documentais.tex': 'documentary-sources.tex',
              'fontes-times-poc.tex': 'times-font-poc.tex',
              'geometria-pdf.tex': 'pdf-geometry.tex',
              'layout-anverso.tex': 'layout-single-sided.tex',
              'layout-frente-verso.tex': 'layout-double-sided.tex',
              'matematica.tex': 'mathematics.tex',
              'normativa-complementar.tex': 'normative-complement.tex',
              'objeto-geometria.tex': 'object-geometry.tex',
              'objetos-avancados.tex': 'advanced-objects.tex',
              'objetos-minted.tex': 'minted-objects.tex',
              'postextuais.tex': 'backmatter.tex',
              'pretextuais-frente-verso.tex': 'frontmatter-double-sided.tex',
              'pretextuais-projeto-anonimo.tex': 'frontmatter-anonymized-project.tex',
              'pretextuais-trabalho.tex': 'frontmatter-academic-work.tex',
              'projeto-15287.tex': 'research-project-15287.tex',
              'projeto-sem-capa.tex': 'research-project-without-cover.tex',
              'referencias-6023-2025.tex': 'references-6023-2025.tex',
              'tabela-ibge.tex': 'ibge-table.tex',
              'tipografia-codigo.tex': 'code-typography.tex',
              'reference-layout-oracle.tex': 'reference-layout-test.tex',
              'vector-rule-oracle-calibration.tex': 'vector-rule-calibration-test.tex',
          }

          fixture_map = {
              'tests/fixtures/exemplo.cpp': 'tests/fixtures/example.cpp',
              'tests/fixtures/exemplo.py': 'tests/fixtures/example.py',
              'tests/fixtures/fontes-documentais.bib': 'tests/fixtures/documentary-sources.bib',
              'tests/fixtures/referencias-6023-2025.bib': 'tests/fixtures/references-6023-2025.bib',
              'tests/fixtures/referencias-v2.bib': 'tests/fixtures/references.bib',
              'tests/fixtures/n8-reference-layout.bib': 'tests/fixtures/reference-layout.bib',
              'tests/fixtures/pretextuais/abreviaturas.tex': 'tests/fixtures/frontmatter/abbreviations.tex',
              'tests/fixtures/pretextuais/abstract.tex': 'tests/fixtures/frontmatter/abstract.tex',
              'tests/fixtures/pretextuais/agradecimentos.tex': 'tests/fixtures/frontmatter/acknowledgments.tex',
              'tests/fixtures/pretextuais/dedicatoria.tex': 'tests/fixtures/frontmatter/dedication.tex',
              'tests/fixtures/pretextuais/epigrafe.tex': 'tests/fixtures/frontmatter/epigraph.tex',
              'tests/fixtures/pretextuais/errata.tex': 'tests/fixtures/frontmatter/errata.tex',
              'tests/fixtures/pretextuais/resumo.tex': 'tests/fixtures/frontmatter/summary.tex',
              'tests/fixtures/pretextuais/simbolos.tex': 'tests/fixtures/frontmatter/symbols.tex',
              'tests/smoke/perfil-base.tex': 'tests/smoke/base-profile.tex',
          }

          def document_target(old: str) -> str | None:
              basename = old.rsplit('/', 1)[-1]
              if basename in document_map:
                  candidate = f'tests/documents/{document_map[basename]}'
                  return candidate if candidate in tracked else None
              if basename.startswith('textual-oracle-'):
                  stem = basename[len('textual-oracle-'):-4]
                  candidate = f'tests/documents/mainmatter-{stem}-test.tex'
                  return candidate if candidate in tracked else None
              candidate = f'tests/documents/{basename}'
              return candidate if candidate in tracked else None

          legacy_path = re.compile(
              r'tests/(?:v2-[A-Za-z0-9_.-]+-check\.sh|normativa/[A-Za-z0-9_.-]+\.tex|checks/normative_(?:n[0-9]+_[A-Za-z0-9_]+|vector_rule_oracle)\.py|fixtures/(?:pretextuais/)?[A-Za-z0-9_.-]+\.(?:tex|bib|py|cpp)|smoke/perfil-base\.tex)'
          )
          direct_command = re.compile(r'^\s*(?:python3|sh)\s+(?P<path>tests/[^\s]+)(?:\s+.*)?$')

          paths = [
              item for item in sorted(tracked)
              if item.startswith(('tests/integration/', 'tests/checks/', 'tests/documents/', 'tests/smoke/'))
              and item not in excluded
              and Path(item).suffix in {'.sh', '.py', '.tex'}
          ]

          changed: set[str] = set()
          unresolved: list[str] = []
          removed_dead_calls: list[str] = []
          applied: list[str] = []

          for item in paths:
              path = Path(item)
              lines = path.read_text(encoding='utf-8').splitlines()
              out: list[str] = []
              file_changed = False

              for line in lines:
                  current = line

                  for old, new in fixture_map.items():
                      if old in current:
                          if new not in tracked:
                              unresolved.append(f'{item}: missing fixture target {old} -> {new}')
                          else:
                              current = current.replace(old, new)
                              applied.append(f'{item}: {old} -> {new}')

                  for old, new in checker_map.items():
                      if old not in current:
                          continue
                      if new in tracked:
                          current = current.replace(old, new)
                          applied.append(f'{item}: {old} -> {new}')
                      else:
                          command_match = direct_command.match(current)
                          if command_match and command_match.group('path') == old:
                              removed_dead_calls.append(f'{item}: {old}')
                              current = ''
                          else:
                              unresolved.append(
                                  f'{item}: historical checker has no current owner in non-command context: {old}'
                              )

                  for old in sorted(set(legacy_path.findall(current))):
                      if old.startswith('tests/v2-') and old.endswith('-check.sh'):
                          semantic = old[len('tests/v2-'):-len('-check.sh')]
                          target = f'tests/integration/{semantic}.sh'
                      elif old.startswith('tests/normativa/'):
                          target = document_target(old)
                      elif old in fixture_map:
                          target = fixture_map[old]
                      elif old in checker_map:
                          target = checker_map[old] if checker_map[old] in tracked else None
                      elif old == 'tests/smoke/perfil-base.tex':
                          target = 'tests/smoke/base-profile.tex'
                      else:
                          target = None

                      if target and target in tracked:
                          current = current.replace(old, target)
                          applied.append(f'{item}: {old} -> {target}')
                      else:
                          command_match = direct_command.match(current)
                          if command_match and command_match.group('path') == old and old not in tracked:
                              removed_dead_calls.append(f'{item}: {old}')
                              current = ''
                          else:
                              unresolved.append(f'{item}: unresolved active path {old}')

                  current = current.replace('ROOT / "normativa"', 'ROOT / "standards"')
                  current = current.replace("ROOT / 'normativa'", "ROOT / 'standards'")
                  current = current.replace('Path("normativa")', 'Path("standards")')
                  current = current.replace("Path('normativa')", "Path('standards')")

                  if current != line:
                      file_changed = True
                  if current:
                      out.append(current)

              if file_changed:
                  path.write_text('\n'.join(out) + '\n', encoding='utf-8')
                  changed.add(item)

          if unresolved:
              raise SystemExit('Unresolved active path consumers:\n' + '\n'.join(sorted(set(unresolved))))

          stale: list[str] = []
          for item in paths:
              text = Path(item).read_text(encoding='utf-8')
              for old in sorted(set(legacy_path.findall(text))):
                  stale.append(f'{item}: {old}')
              if 'ROOT / "normativa"' in text or "ROOT / 'normativa'" in text:
                  stale.append(f'{item}: constructed normativa root')
          if stale:
              raise SystemExit('Stale active consumer paths remain:\n' + '\n'.join(sorted(set(stale))))

          print(f'Changed files: {len(changed)}')
          print(f'Applied exact path migrations: {len(applied)}')
          print(f'Removed dead direct checker/wrapper calls: {len(removed_dead_calls)}')
          for item in sorted(changed):
              print(f'  {item}')
          if removed_dead_calls:
              print('Removed dead calls:')
              for item in sorted(set(removed_dead_calls)):
                  print(f'  {item}')
          PY

          python3 -m py_compile $(git ls-files 'tests/checks/*.py')
          for script in $(git ls-files 'tests/integration/*.sh'); do sh -n "$script"; done
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests
          if git diff --cached --quiet; then
            echo 'No active path-consumer changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: reconnect active test consumers'
          git push origin HEAD:refactor/v3-r1-rebaseline
