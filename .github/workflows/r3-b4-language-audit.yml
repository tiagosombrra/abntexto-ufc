name: R3-B4 language audit

on:
  push:
    branches:
      - r3-b4-engineering-language

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Run checker self-tests
        run: python3 tests/checks/engineering_language.py --self-test
      - name: Audit engineering language
        run: python3 tests/checks/engineering_language.py
