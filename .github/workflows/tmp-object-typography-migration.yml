name: Temporary object typography migration

on:
  push:
    branches:
      - plan/v3-regression-reset
    paths:
      - tools/tmp-object-typography-migration.py
      - .github/workflows/tmp-object-typography-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: plan/v3-regression-reset
          fetch-depth: 0

      - name: Apply atomic object typography migration
        run: python3 tools/tmp-object-typography-migration.py

      - name: Run static contract before checkpoint
        run: python3 tests/static.py

      - name: Commit generated migration and remove temporary executor
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: correct object title typography contract'
          git push origin HEAD:plan/v3-regression-reset
