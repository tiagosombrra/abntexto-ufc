name: Public academic mesh examples
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - examples/public-mesh-documents/**
      - tools/examples/generate_public_mesh_documents.py
      - tests/checks/examples/public_mesh_documents.py
      - .github/workflows/public-mesh-examples.yml
      - tools/examples/run_public_mesh_pdf_matrix.py
      - abntexto-ufc.cls
  push:
    branches: [main]
    paths:
      - examples/public-mesh-documents/**
      - tools/examples/generate_public_mesh_documents.py
      - tests/checks/examples/public_mesh_documents.py
      - .github/workflows/public-mesh-examples.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: public-mesh-examples-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Verify 28 editable scholarly sources and negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Generate and inspect all 28 sources
        run: |
          python3 tools/examples/generate_public_mesh_documents.py
          python3 tools/examples/generate_mesh_study.py --check --output artifacts/canonical-mesh-study
          python3 tests/checks/examples/mesh_study.py --artifacts artifacts/canonical-mesh-study
          python3 tests/checks/examples/public_mesh_documents.py
          python3 tools/examples/run_public_mesh_pdf_matrix.py --selftest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-mesh-28-sources-${{ github.run_id }}
          path: |
            artifacts/public-mesh-documents/**
            artifacts/canonical-mesh-study/**
          retention-days: 21
          if-no-files-found: warn


  full-pdf-matrix:
    name: Full 7 academic PDFs / ${{ matrix.locale }} (source-bound)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        locale: [pt, en, es, fr]
    steps:
      - name: Check out immutable integration candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile and audit all seven profile PDFs in this locale
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            MATRIX_LOCALE="${{ matrix.locale }}"
            SOURCE_COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
            export SOURCE_COMMIT_SHA
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils mupdf-tools
            git config --global --add safe.directory "$PWD"
            python3 tools/examples/generate_public_mesh_documents.py
            python3 tools/examples/generate_public_mesh_documents.py --check
            python3 tools/examples/run_public_mesh_pdf_matrix.py --locale "$MATRIX_LOCALE"
      - name: Preserve 7 real PDFs, original TeX, XMP, outlines, logs, and failed receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-full7-${{ matrix.locale }}-${{ github.run_id }}
          path: |
            artifacts/public-mesh-documents/matrix/${{ matrix.locale }}/**
            artifacts/public-mesh-documents/${{ matrix.locale }}/**
            artifacts/public-mesh-documents/manifest.json
            artifacts/canonical-mesh-study/**
          retention-days: 21
          if-no-files-found: warn
