name: Canonical identity migration helper

on:
  push:
    branches:
      - fix/v2.2.0-project-identity-runtime

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Migrate active legacy identity residues
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()
          exempt = {
              'tests/v2-build-path-check.sh',
              'tests/v2-canonical-identity-check.py',
              'tests/v2-ctan-archive-check.py',
              'tests/v2-ctan-policy-check.py',
              'tests/v2-distribution-check.sh',
              'tests/v2-overleaf-bundle-check.py',
              'tests/v2-release-metadata-check.py',
              'tests/v2-release-package-check.py',
              'tests/v2-repository-audit.py',
              'tools/build-release-bundles.py',
          }
          suffixes = {'.tex', '.sh', '.py', '.ps1', '.json', '.md', '.txt', '.yaml', '.yml'}
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          changed = []

          for raw in tracked:
              if not raw:
                  continue
              relative = raw.decode('utf-8')
              if relative in exempt:
                  continue
              if not (relative.startswith('tests/') or relative.startswith('tools/')):
                  continue
              path = root / relative
              if path.suffix.lower() not in suffixes:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text.replace('ufctex', 'abntexto-ufc')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(relative)

          print(f'Migrated {len(changed)} active files.')
          for relative in changed:
              print(relative)
          PY

          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests tools
          git commit -m 'refactor: migrate active legacy identity residues'
          git push origin HEAD:fix/v2.2.0-project-identity-runtime
