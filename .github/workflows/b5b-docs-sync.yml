name: B5-B canonical docs sync

on:
  push:
    branches:
      - docs/v3-r1-b5b-checkpoint

permissions:
  contents: write

jobs:
  sync:
    if: "github.event.head_commit.message == 'chore: add temporary B5-B docs sync'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record B5-B and activate B5-C
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          checkpoint = '426b506da9f6bf6255263efdb4caad19d4bcd16d'
          run_id = 33514846706
          pr_number = 202

          # Canonical handoff.
          p = Path('docs/HANDOFF-V3.0.0.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              '- Active B5 work item: **B5-B — deterministic v3 staging and public/Overleaf bundles**.\n- Active B5 focus: **canonical source set, flattened template staging, pinned upstream `abntexto.cls`, deterministic archives, and structure/reproducibility validation**.',
              '- Active B5 work item: **B5-C — class/CTAN candidate and distribution metadata**.\n- Active B5 focus: **current class/runtime archive, CTAN-candidate layout, checksum manifest, package metadata, and install/compile smoke validation**.',
              1,
          )
          t = t.replace(
              '- Latest certified clean implementation checkpoint: **`1a126c37653728941ce1ada762376c5fec69cb02`**.',
              f'- Latest certified clean implementation checkpoint: **`{checkpoint}`**.',
              1,
          )
          old = ('### B5-B — Deterministic v3 staging and public/Overleaf bundles\n\n'
                 '**ACTIVE / NEXT.** Implement one current v3 staging/archive producer for the class/runtime plus flattened template and Overleaf import bundle. Wire `fetch-abntexto.py` only for the Overleaf upstream pin; add structure/reproducibility checks; repair the Overleaf staging consumer path/engineering language as required by this contract. Deep Windows font/PDF-A certification remains B8-owned.\n\n'
                 '### B5-C — Class/CTAN candidate and distribution metadata\n\n'
                 '**PENDING.** Define the current class/CTAN-candidate archive and remaining distribution metadata/checksum validation using only current files and current `abntexto-ufc` identity; do not resurrect deleted CTAN documentation blindly.')
          new = ('### B5-B — Deterministic v3 staging and public/Overleaf bundles\n\n'
                 f'**DONE** through PR #{pr_number}, squash-merged at **`{checkpoint}`**. The lot introduced `tools/build-public-bundles.py`, the `make public-bundles` producer entry point, `tests/checks/public_bundles.py`, an explicit flattened-staging Overleaf consumer, and the v3 public-template header. It now emits deterministic `abntexto-ufc-template-3.0.0.zip` and `abntexto-ufc-overleaf-3.0.0.zip`; the template bundle is version-rooted and the Overleaf bundle is import-root-flat. Only the Overleaf archive vendors the pinned upstream `abntexto.cls`. Public archives disable and exclude the UFC institutional mark and reject proprietary Microsoft font files and development-only paths.\n\n'
                 f'Remote validation was fail-closed. Run `33514329081` exposed an executor misuse of a correctly cleaned temporary upstream file; run `33514454139` proved structure/reproducibility and exposed that the TeX container itself lacked Git; final run **`{run_id}` PASS** reported `PUBLIC-BUNDLE-EVIDENCE status=PASS artifacts=2 reproducible=2 safe_paths=PASS institutional_assets=excluded`, canonical identity PASS, repository contract PASS, and successfully compiled the extracted Overleaf bundle with both `pdflatex` and `lualatex` on TeX Live 2025. Existing font-embedding and PDF/A proxy assertions also passed. The temporary workflow self-removed before merge. No runtime/API or normative semantic/proof/tolerance/locator change occurred.\n\n'
                 '### B5-C — Class/CTAN candidate and distribution metadata\n\n'
                 '**ACTIVE / NEXT.** Extend the current distribution producer with a current-identity class/runtime archive and CTAN candidate plus checksum metadata. Use only live v3 files, current README/LICENSE/example material, and external `abntexto` dependency semantics. Do not recreate deleted historical CTAN documents by assumption. Validate exact archive structure, institutional/proprietary asset exclusion, determinism/checksums, and a CTAN-style install/compile smoke. Permanent distribution CI remains B7-owned and final Windows/font/PDF-A certification remains B8-owned.')
          if old not in t:
              raise SystemExit('HANDOFF B5-B/C block drift')
          t = t.replace(old, new, 1)
          old_action = ('Start B5-B from canonical remote `main` using `1a126c37653728941ce1ada762376c5fec69cb02` as the latest certified implementation checkpoint and issue #199 as the operational log. Implement the bounded deterministic v3 staging/archive producer for class/runtime, flattened template, and Overleaf import bundle; wire the pinned upstream fetcher only where required; add current structure/reproducibility checks and repair the current Overleaf staging consumer. Keep CTAN/class-package completion in B5-C and B6/B7/B8/V3-R2 out of scope.')
          new_action = (f'Start B5-C from canonical remote `main` using `{checkpoint}` as the latest certified implementation checkpoint and issue #199 as the operational log. Extend the current distribution producer with the class/runtime and CTAN-candidate archives plus deterministic checksum metadata; validate exact archive layout and CTAN install/compile behavior. Keep permanent gates/workflows, final Windows/font/PDF-A certification, and V3-R2 runtime/API work out of scope.')
          if old_action not in t:
              raise SystemExit('HANDOFF immediate action drift')
          t = t.replace(old_action, new_action, 1)
          p.write_text(t, encoding='utf-8')

          # Human roadmap.
          p = Path('docs/ROADMAP-V3.0.0.md')
          t = p.read_text(encoding='utf-8')
          t = t.replace(
              '**V3-R1 ACTIVE — R1-BLOCK-4 done; R1-BLOCK-5 active; B5-A done; B5-B active.**',
              '**V3-R1 ACTIVE — R1-BLOCK-4 done; R1-BLOCK-5 active; B5-A done; B5-B done; B5-C active.**',
              1,
          )
          t = t.replace(
              '- Latest certified implementation checkpoint: **`1a126c37653728941ce1ada762376c5fec69cb02`**.',
              f'- Latest certified implementation checkpoint: **`{checkpoint}`**.',
              1,
          )
          old = ('### B5-B — Deterministic v3 staging and public/Overleaf bundles\n\n'
                 '**ACTIVE.** Add the current deterministic staging/archive producer for class/runtime, flattened template, and Overleaf bundle; wire the pinned upstream class for Overleaf; add structure/reproducibility validation; repair only distribution-owned Overleaf consumer drift. B8 retains deep font/PDF-A certification.\n\n'
                 '### B5-C — Class/CTAN candidate and distribution metadata\n\n'
                 '**PENDING.** Reconstruct current class/CTAN candidate packaging and metadata/checksum validation without restoring retired identities or deleted CTAN documentation by assumption.')
          new = ('### B5-B — Deterministic v3 staging and public/Overleaf bundles\n\n'
                 f'**DONE** via PR #{pr_number} at **`{checkpoint}`**. Current v3 distribution now has deterministic template and Overleaf ZIP producers, a public-bundle structure/reproducibility checker, a `make public-bundles` entry point, explicit flattened staging, pinned upstream `abntexto.cls` only for Overleaf, and fail-closed institutional/proprietary asset exclusion. Final run **`{run_id}` PASS** validated reproducible archives, safe paths, canonical identity/repository contract, and `pdflatex` + `lualatex` compilation of the extracted Overleaf bundle on TeX Live 2025. Temporary validation workflow removed.\n\n'
                 '### B5-C — Class/CTAN candidate and distribution metadata\n\n'
                 '**ACTIVE.** Add the current-identity class/runtime archive and CTAN candidate plus deterministic checksum metadata using only live v3 files. Validate exact layout, external dependency semantics, institutional/proprietary asset exclusion and CTAN-style compile smoke. Do not reconstruct deleted historical CTAN documentation without a current need.')
          if old not in t:
              raise SystemExit('ROADMAP B5-B/C block drift')
          t = t.replace(old, new, 1)
          old_action = ('Start **B5-B** from canonical `main` with implementation checkpoint `1a126c37653728941ce1ada762376c5fec69cb02` and issue #199. Implement the bounded deterministic v3 staging/archive producer for class/runtime, flattened template, and Overleaf import; wire the pinned upstream fetcher only for the bundle contract; add structure/reproducibility checks and repair the current Overleaf staging consumer. Keep B5-C, B6, B7, B8 and V3-R2 boundaries explicit.')
          new_action = (f'Start **B5-C** from canonical `main` with implementation checkpoint `{checkpoint}` and issue #199. Extend the current distribution producer with a class/runtime archive, CTAN candidate and deterministic checksum metadata; validate archive structure and CTAN install/compile behavior. Keep B6/B7/B8 and V3-R2 boundaries explicit.')
          if old_action not in t:
              raise SystemExit('ROADMAP immediate action drift')
          t = t.replace(old_action, new_action, 1)
          p.write_text(t, encoding='utf-8')

          # Machine state.
          p = Path('release/v3-roadmap.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data['last_certified_clean_checkpoint_sha'] = checkpoint
          b5 = data['blocks']['R1-BLOCK-5']
          b5['active_work_item'] = 'B5-C'
          b5['active_sub_item'] = 'B5-C'
          b5['planned_lots']['B5-B'] = 'DONE - deterministic v3 staging and public/Overleaf bundles'
          b5['planned_lots']['B5-C'] = 'ACTIVE - class/CTAN candidate and distribution metadata'
          b5['b5_b_status'] = 'DONE'
          b5['b5_b_closure_sha'] = checkpoint
          b5['b5_b_pr'] = pr_number
          b5['b5_b_validation_runs'] = [
              {'run_id': 33514329081, 'conclusion': 'failure', 'finding': 'temporary executor reused upstream temp file after the Makefile target correctly cleaned it; no product defect'},
              {'run_id': 33514454139, 'conclusion': 'failure', 'finding': 'bundle structure/reproducibility passed; TeX container lacked Git and could not rebuild; no product defect'},
              {'run_id': run_id, 'conclusion': 'success', 'finding': 'deterministic public bundles and extracted Overleaf staging passed structural and TeX Live 2025 compilation validation'},
          ]
          b5['b5_b_results'] = {
              'template_bundle': 'abntexto-ufc-template-3.0.0.zip',
              'overleaf_bundle': 'abntexto-ufc-overleaf-3.0.0.zip',
              'template_layout_version_rooted': True,
              'overleaf_layout_import_root_flat': True,
              'overleaf_vendors_pinned_abntexto': True,
              'standard_template_vendors_abntexto': False,
              'institutional_mark_disabled_in_distributed_main': True,
              'institutional_asset_redistributed': False,
              'proprietary_microsoft_fonts_rejected': True,
              'safe_archive_paths_passed': True,
              'reproducibility_passed': True,
              'pdflatex_overleaf_smoke_passed': True,
              'lualatex_overleaf_smoke_passed': True,
              'temporary_workflow_removed_before_merge': True,
              'runtime_api_changed': False,
              'normative_semantics_changed': False,
              'proof_state_changed': False,
          }
          b5['b5_c_status'] = 'ACTIVE'
          b5['b5_c_scope'] = [
              'current class and runtime archive',
              'current CTAN-candidate archive layout',
              'deterministic SHA256 checksum manifest',
              'current README LICENSE and CTAN example metadata only',
              'institutional and proprietary asset exclusion',
              'CTAN-style install and compile smoke validation',
          ]
          data['next_action'] = (f'Start R1-BLOCK-5 B5-C from canonical remote main using {checkpoint} as the latest certified implementation checkpoint and issue #199 as the operational log. Extend the current distribution producer with the class/runtime and CTAN-candidate archives plus deterministic checksum metadata; validate exact archive structure and CTAN install/compile behavior. Keep B6 permanent gates, B7 permanent workflows, B8 final Windows/font/PDF-A certification and V3-R2 runtime/API work out of scope.')
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # User-facing README.
          p = Path('README.md')
          t = p.read_text(encoding='utf-8')
          old = ('```bash\nmake compile\n```\n\nAdditional validation and distribution targets are being rebaselined during V3-R1. The roadmap is authoritative while this branch is under reconstruction.')
          new = ('```bash\nmake compile\n```\n\nPublic template and Overleaf bundles can be built from the canonical checkout after fetching the licensed reference images:\n\n```bash\nmake reference-assets\nmake public-bundles\n```\n\nThe current B5 producer writes `dist/abntexto-ufc-template-3.0.0.zip` and `dist/abntexto-ufc-overleaf-3.0.0.zip`. The standard template archive has a versioned root; the Overleaf archive places `main.tex` at the ZIP root and vendors the project-pinned `abntexto.cls`. Both bundles flatten `template/`, disable the undistributed institutional mark by default, and exclude the UFC coat-of-arms file and proprietary Microsoft fonts. Class/CTAN-candidate packaging is still being completed in B5-C; the roadmap remains authoritative during reconstruction.')
          if old not in t:
              raise SystemExit('README build section drift')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')

          # Architecture contract.
          p = Path('docs/ARCHITECTURE.md')
          t = p.read_text(encoding='utf-8')
          old = 'Flattening is a distribution staging responsibility; it must not distort the repository architecture.'
          new = ('Flattening is a distribution staging responsibility; it must not distort the repository architecture. `tools/build-public-bundles.py`, exposed through `make public-bundles`, currently produces a version-rooted template archive and a root-flat Overleaf import archive. The latter alone vendors the pinned upstream `abntexto.cls`. Public staging excludes the UFC institutional asset and proprietary Microsoft fonts, and `tests/checks/public_bundles.py` proves archive structure, safe paths and reproducibility. Class/CTAN-candidate packaging is a separate B5-C responsibility.')
          if old not in t:
              raise SystemExit('ARCHITECTURE bundle section drift')
          t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8')
          PY

          python3 -m json.tool release/v3-roadmap.json >/dev/null
          grep -F 'B5-C — class/CTAN candidate and distribution metadata' docs/HANDOFF-V3.0.0.md >/dev/null
          grep -F 'B5-B done; B5-C active' docs/ROADMAP-V3.0.0.md >/dev/null
          grep -F 'make public-bundles' README.md >/dev/null
          grep -F 'tools/build-public-bundles.py' docs/ARCHITECTURE.md >/dev/null
          python3 tests/checks/canonical_identity.py
          python3 tests/checks/repository_contract.py
          git diff --check
          echo 'B5-B-DOCS status=PASS'

      - name: Commit sync and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git add README.md docs/ARCHITECTURE.md docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md release/v3-roadmap.json
          git commit -m 'docs: record B5-B and activate B5-C'
          git rm .github/workflows/b5b-docs-sync.yml
          git commit -m 'chore: remove temporary B5-B docs sync'
          git push origin HEAD:docs/v3-r1-b5b-checkpoint
