name: Windows portability smoke

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/windows-smoke.yml
      - abntexto-ufc.cls
      - tools/prepare-windows-fonts.ps1
      - tools/convert-encoding-to-unicode.ps1
      - tools/convert-unicode-encoding-to-glyphs.ps1
      - tests/checks/repository/windows_portability_contract.py
      - tests/documents/class-font-poc.tex
      - tests/documents/times-font-poc.tex
      - tests/documents/arial-font-poc.tex
      - tests/integration/layout/font-poc.sh
      - tests/integration/layout/windows-font-pdfa.sh
      - tests/integration/layout/font-embedding.sh
      - tests/integration/layout/pdfa.sh
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - .github/workflows/windows-smoke.yml
      - abntexto-ufc.cls
      - tools/prepare-windows-fonts.ps1
      - tools/convert-encoding-to-unicode.ps1
      - tools/convert-unicode-encoding-to-glyphs.ps1
      - tests/checks/repository/windows_portability_contract.py
      - tests/documents/class-font-poc.tex
      - tests/documents/times-font-poc.tex
      - tests/documents/arial-font-poc.tex
      - tests/integration/layout/font-poc.sh
      - tests/integration/layout/windows-font-pdfa.sh
      - tests/integration/layout/font-embedding.sh
      - tests/integration/layout/pdfa.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows literal-font build
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 407f279a78df3824b27585d0e86d688c19cd90ee
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '407f279a78df3824b27585d0e86d688c19cd90ee'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) {
            throw "Candidate checkout mismatch: expected $expected, got $actual"
          }
          "PORTABILITY-CANDIDATE-EVIDENCE status=PASS platform=windows-build source_sha=$actual"

      - name: Install pinned TeX Live 2026
        uses: zauguin/install-texlive@6671d0c62046c7e349fe154d5208fe746b07e037 # v4.4.0
        with:
          texlive_version: '2026'
          cache_version: windows-portability-v1
          accept-stale: false
          packages: >
            scheme-basic
            algpseudocodex
            babel
            babel-portuges
            biblatex
            biblatex-abnt
            csquotes
            enumitem
            etoolbox
            fontaxes
            fontspec
            fontware
            geometry
            glossaries
            graphics
            iftex
            imakeidx
            listings
            lmodern
            luaotfload
            microtype
            minted
            newtx
            pdfpages
            ragged2e
            tabularray-abnt
            tex-gyre
            ttfutils
            unicode-math
            xcolor
            xpatch
            xstring

      - name: Verify TeX Live and fetch pinned abntexto
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($command in @('kpsewhich', 'pdflatex', 'lualatex', 'ttf2tfm', 'vptovf', 'mktexlsr')) {
            if (-not (Get-Command $command -ErrorAction SilentlyContinue)) {
              throw "Required TeX Live command not found: $command"
            }
          }

          python tools/fetch-abntexto.py --output abntexto.cls
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned abntexto fetch failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path 'abntexto.cls')) {
            throw 'Pinned abntexto.cls was not materialized.'
          }
      - name: Prepare literal Windows fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredFonts = @(
            'times.ttf', 'timesbd.ttf', 'timesi.ttf', 'timesbi.ttf',
            'arial.ttf', 'arialbd.ttf', 'ariali.ttf', 'arialbi.ttf'
          )
          foreach ($font in $requiredFonts) {
            $fontPath = Join-Path "$env:WINDIR\Fonts" $font
            if (-not (Test-Path $fontPath)) {
              throw "Required Windows font is not present on the runner: $fontPath"
            }
          }

          $texmfRoot = Join-Path $env:RUNNER_TEMP 'abntexto-ufc-texmf'
          "TEXMFHOME=$texmfRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & ./tools/prepare-windows-fonts.ps1 -TexmfRoot $texmfRoot
          if ($LASTEXITCODE -ne 0) {
            throw "Windows font preparation failed with exit code $LASTEXITCODE"
          }

          $env:TEXMFHOME = $texmfRoot
          foreach ($file in @('t1times-ttf.fd', 't1arial.fd', 'abntexto-ufc-windows.map')) {
            $resolved = (& kpsewhich $file).Trim()
            if (-not $resolved -or -not (Test-Path $resolved)) {
              throw "Prepared TeX support file is not discoverable: $file"
            }
          }

      - name: Compile strict Windows font proofs
        shell: bash
        env:
          UFC_FONT_POC_COMPILE_ONLY: '1'
          UFC_WINDOWS_FONTS_DIR: 'C:/Windows/Fonts'
        run: |
          set -euo pipefail
          sh tests/integration/layout/font-poc.sh
          for pdf in \
            abntexto-ufc-times-pdflatex-strict-poc.pdf \
            abntexto-ufc-arial-pdflatex-strict-poc.pdf \
            abntexto-ufc-times-lualatex-strict-poc.pdf \
            abntexto-ufc-arial-lualatex-strict-poc.pdf; do
            test -s "$pdf"
          done

      - name: Upload Windows strict PDFs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-font-pdfs-${{ github.run_id }}
          path: |
            abntexto-ufc-times-pdflatex-strict-poc.pdf
            abntexto-ufc-arial-pdflatex-strict-poc.pdf
            abntexto-ufc-times-lualatex-strict-poc.pdf
            abntexto-ufc-arial-lualatex-strict-poc.pdf
          retention-days: 14
          if-no-files-found: error

  linux-certify:
    name: Certify Windows PDFs
    needs: windows-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 407f279a78df3824b27585d0e86d688c19cd90ee
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate source
        shell: bash
        run: |
          set -euo pipefail
          expected='407f279a78df3824b27585d0e86d688c19cd90ee'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "PORTABILITY-CANDIDATE-EVIDENCE status=PASS platform=windows-certify source_sha=$actual"

      - name: Download Windows strict PDFs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-font-pdfs-${{ github.run_id }}
          path: windows-font-pdfs

      - name: Install PDF inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends poppler-utils
          docker --version
          pdffonts -v 2>&1 | head -n 1

      - name: Certify Windows-produced PDFs
        shell: bash
        run: |
          set -euo pipefail
          sh tests/integration/layout/windows-font-pdfa.sh windows-font-pdfs
          mkdir -p artifacts/validation
          printf '%s\n' \
            'WINDOWS-PORTABILITY-EVIDENCE status=PASS source_sha=407f279a78df3824b27585d0e86d688c19cd90ee runner=windows-2025 texlive=2026 strict_pdfs=4 literal_fonts=PASS unicode_extraction=PASS embedding=PASS pdfa_2b=PASS' \
            | tee artifacts/validation/windows-portability.txt

      - name: Upload Windows portability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-portability-certification-${{ github.run_id }}
          path: artifacts/validation/windows-portability.txt
          retention-days: 14
          if-no-files-found: error
