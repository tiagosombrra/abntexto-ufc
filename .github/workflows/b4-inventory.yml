name: B4 tools validator inventory

on:
  push:
    branches:
      - refactor/v3-r1-b4-tools-validator

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Classify not-applicable full-contract rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          root = Path('.')
          sys.path.insert(0, str(root / 'tools'))
          from normative_catalog import load_catalog
          from normative_full import full_rule_map, load_full_contract

          rules = full_rule_map(load_full_contract(load_catalog()))
          runner = (root / 'tests' / 'run.py').read_text(encoding='utf-8')
          gates = set(re.findall(r'Check\(\s*"([^"]+)"', runner))

          found = 0
          for rule_id, rule in sorted(rules.items()):
              validation = rule.get('validation', {})
              if validation.get('mode') != 'not-applicable':
                  continue
              found += 1
              checks = validation.get('checks', [])
              print(
                  f'{rule_id}\tchecks={checks}\t'
                  f'live_gate_intersection={sorted(set(checks) & gates)}\t'
                  f'applicability={rule.get("applicability")}\tvalues={rule.get("values")}'
              )
          print(f'NOT-APPLICABLE-RULE-COUNT={found}')
          PY

      - name: Static syntax only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py tests/checks/normative_full_contract.py
          git diff --check
          echo 'B4-NOT-APPLICABLE-CLASSIFICATION status=PASS'
