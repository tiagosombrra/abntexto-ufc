name: B4 tools validator inventory

on:
  push:
    branches:
      - refactor/v3-r1-b4-tools-validator

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate spine conditional contract and consumers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          needles = ('spine.conditional', 'spine', 'unified evidence', 'unified_evidence')
          suffixes = {'.py', '.json', '.sh', '.md', '.tex', '.cls', '.def', '.js', '.html'}
          for path in sorted(Path('.').rglob('*')):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in suffixes and path.name != 'Makefile':
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except UnicodeDecodeError:
                  continue
              matches = [i for i, line in enumerate(lines) if any(n.lower() in line.lower() for n in needles)]
              if not matches:
                  continue
              print(f'=== {path.as_posix()} ===')
              shown = set()
              for i in matches:
                  for j in range(max(0, i - 4), min(len(lines), i + 5)):
                      if j not in shown:
                          print(f'{j + 1}: {lines[j]}')
                          shown.add(j)
          PY

      - name: Classify fetch-abntexto role
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FETCH ABNTEXTO REFERENCES ==='
          git grep -n -E 'fetch-abntexto\.py|abntexto 1\.1|ElaysonAbreu/abntexto|4c03fd7b5a7af089627dedb547c53cad4eed2a2a' -- ':!.github/workflows/b4-inventory.yml' || true
          echo '=== ABNTEXTO CLASS INVENTORY ==='
          git ls-files | grep -E '(^|/)abntexto(\.cls|/|$)' || true

      - name: Static syntax only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/*.py
          node --check validator/app.js
          git diff --check
          echo 'B4-CLASSIFICATION-EVIDENCE status=PASS'
