name: B7-C2 complete closeout reconciler

on:
  push:
    branches:
      - docs/v3-r1-b7c2-close-b7c3-open

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout task branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: docs/v3-r1-b7c2-close-b7c3-open
          fetch-depth: 0

      - name: Reconcile complete B7-C2 closeout state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          CLOSURE = "cea59bcf4927da9a9c4a48268dca67cc9535854e"

          def sub_once(path, pattern, replacement, flags=re.MULTILINE):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match for {pattern!r}, found {count}")
              p.write_text(updated, encoding="utf-8")

          handoff = "docs/HANDOFF-V3.0.0.md"
          sub_once(handoff, r"^- Active B7 sub-item: \*\*B7-C2 .*?$", "- Active B7 sub-item: **B7-C3 — permanent Linux release orchestration consuming the repository-owned `make release-check` contract**.")
          sub_once(handoff, r"^- Active B7 focus: \*\*introduce a bounded permanent Linux PR integration workflow.*?$", "- Active B7 focus: **introduce bounded permanent Linux release orchestration that delegates to `make release-check`, preserves repository-owned gate logic, and does not claim B8 Windows/font/final PDF/A certification**.")
          sub_once(handoff, r"^- Latest certified clean implementation checkpoint: \*\*`ced68313ed2c362a6617d7df6ef9adfd2df6c0b5`\*\*\.$", f"- Latest certified clean implementation checkpoint: **`{CLOSURE}`**.")
          sub_once(handoff, r"^- \*\*B7-C2 ACTIVE — permanent Linux PR integration orchestration:\*\*.*?$", f"- **B7-C2 DONE — permanent Linux PR integration orchestration:** PR #222 squash-merged at `{CLOSURE}`. Permanent `Linux integration` delegates to `make check`, keeps a stable PR status, skips heavy TeX only for drafts and a narrow documentation/control-plane allowlist, fails closed to full integration for every other or unknown path, cancels superseded PR runs, and forces full execution on manual dispatch. PR validation runs `33548124803` (`Static contract`) and `33548124851` (`Linux integration`) passed; the integration run ended `PASS=30 FAIL=0 SKIP=0`.")
          sub_once(handoff, r"^- \*\*B7-C3 PENDING — release orchestration:\*\*.*?$", "- **B7-C3 ACTIVE — release orchestration:** define and prove bounded permanent Linux `make release-check` trigger/cadence and evidence handling without claiming B8 Windows/font/final PDF-A certification.")

          roadmap = "docs/ROADMAP-V3.0.0.md"
          sub_once(roadmap, r"^\*\*V3-R1 ACTIVE — R1-BLOCK-6 done; R1-BLOCK-7 active; B7-A/B/C1 done; B7-C2 active\.\*\*$", "**V3-R1 ACTIVE — R1-BLOCK-6 done; R1-BLOCK-7 active; B7-A/B/C1/C2 done; B7-C3 active.**")
          sub_once(roadmap, r"^\*\*B7-A DONE → B7-B DONE → B7-C ACTIVE \[C1 DONE → C2 ACTIVE → C3 PENDING\] → B7-D PENDING\*\*$", "**B7-A DONE → B7-B DONE → B7-C ACTIVE [C1 DONE → C2 DONE → C3 ACTIVE] → B7-D PENDING**")
          sub_once(roadmap, r"^- Latest certified implementation checkpoint: \*\*`ced68313ed2c362a6617d7df6ef9adfd2df6c0b5`\*\*\.$", f"- Latest certified implementation checkpoint: **`{CLOSURE}`**.")
          sub_once(roadmap, r"^\*\*ACTIVE\.\*\* Operational issue #213\. Entry checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: \*\*`ced68313ed2c362a6617d7df6ef9adfd2df6c0b5`\*\*\.$", f"**ACTIVE.** Operational issue #213. Entry checkpoint: `4c25c27b758e4b99db11187b34b9043776566871`; latest certified implementation checkpoint: **`{CLOSURE}`**.")
          sub_once(roadmap, r"(?ms)(#### B7-C2 — Permanent Linux PR integration orchestration\n\n)\*\*ACTIVE\.\*\*.*?(?=\n\n#### B7-C3)", rf"\1**DONE** via PR #222 at **`{CLOSURE}`**. Permanent `Linux integration` uses the proven Linux/TeX runner environment, delegates the heavy gate to `make check`, exposes a stable PR status, skips heavy execution only for drafts and a narrow documentation/control-plane allowlist, fails closed for every other or unknown path, cancels superseded runs, and forces full validation on manual dispatch. PR runs `33548124803` (`Static contract`) and `33548124851` (`Linux integration`) passed; the integration contract closed `PASS=30 FAIL=0 SKIP=0`.", flags=0)
          sub_once(roadmap, r"(?ms)(#### B7-C3 — Release orchestration\n\n)\*\*PENDING\.\*\*.*?(?=\n\n### B7-D)", r"\1**ACTIVE.** Define and prove bounded permanent Linux release orchestration over `make release-check`, including trigger/cadence and artifact/evidence handling, without treating Linux release validation as final B8 Windows/font/PDF-A certification.", flags=0)
          sub_once(roadmap, r"^- \*\*R1-B7 ACTIVE\*\* — optimized remote workflow restoration; B7-C2 active after B7-C1 clean-runner certification\.$", "- **R1-B7 ACTIVE** — optimized remote workflow restoration; B7-C2 is complete and B7-C3 release orchestration is active.")

          sub_once("README.md", r"^`check` runs the PR-oriented integration suite.*?B7-C3 owns later release orchestration; final Windows/font/PDF-A certification remains B8-owned\.$", "`check` runs the PR-oriented integration suite and may compile or inspect generated documents. `release-check` includes the release-only integration checks. B7-C1 certified `make check` on a clean TeX Live 2026 Linux runner (`PASS=30 FAIL=0 SKIP=0`). B7-C2 then certified the permanent `.github/workflows/linux-integration.yml` workflow through PR #222: its stable `Linux integration` status always evaluates PR scope, skips the expensive TeX step for drafts and a narrow documentation/control-plane-only allowlist, runs full integration for every other or unknown path, cancels superseded PR runs, delegates the heavy gate to `make check`, and forces full integration on `workflow_dispatch`; its first full permanent run also closed `PASS=30 FAIL=0 SKIP=0`. B7-C3 is active and owns Linux release orchestration over `make release-check`; final Windows/font/PDF-A certification remains B8-owned.")
          sub_once("AGENTS.md", r"^- B7-C1 certified the repository-owned `make check` contract.*?B7-C3 owns release orchestration\. Final Windows/font/PDF-A certification remains B8-owned\.$", "- B7-C1 certified the repository-owned `make check` contract on a clean TeX Live 2026 runner. B7-C2 is DONE and permanently provides `.github/workflows/linux-integration.yml` with stable `Linux integration` status: draft and narrowly allowlisted documentation/control-plane-only PRs skip the expensive TeX step, every other or unknown path runs `make check`, superseded PR runs are cancelled, and manual dispatch forces full integration. B7-C3 is ACTIVE and may add only bounded release orchestration as a thin consumer of `make release-check`. Final Windows/font/PDF-A certification remains B8-owned.")
          sub_once("docs/ARCHITECTURE.md", r"^R1-BLOCK-7 restores permanent orchestration incrementally\..*?B7-C3 owns later release orchestration\. B8 remains the owner of final Windows/font/PDF-A certification\.$", "R1-BLOCK-7 restores permanent orchestration incrementally. B7-B established the `Static contract` workflow. B7-C1 certified the repository-owned `make check` integration contract on a clean TeX Live 2026 runner. B7-C2 certified bounded permanent PR orchestration through `Linux integration`: orchestration owns only scope/cadence/concurrency, while the repository-owned `make check` entry point owns the integration gate itself. B7-C3 is now active and owns bounded Linux release orchestration as a thin consumer of `make release-check`; B8 remains the owner of final Windows/font/PDF-A certification.")

          state_path = Path("release/v3-roadmap.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          block = state["blocks"]["R1-BLOCK-7"]
          expected = (state.get("stage"), block.get("active_sub_item"), block.get("b7_c2_status"), block.get("b7_c3_status"))
          if expected != ("R1-BLOCK-7", "B7-C2", "ACTIVE", "PENDING"):
              raise SystemExit(f"unexpected machine checkpoint: {expected}")
          state["last_certified_clean_checkpoint_sha"] = CLOSURE
          block["active_sub_item"] = "B7-C3"
          block["b7_c2_status"] = "DONE"
          block["b7_c3_status"] = "ACTIVE"
          block["b7_c2_pr"] = 222
          block["b7_c2_closure_sha"] = CLOSURE
          block["b7_c2_validation_runs"] = [
              {"run_id": 33548124803, "workflow": "Static contract", "conclusion": "success"},
              {"run_id": 33548124851, "workflow": "Linux integration", "conclusion": "success", "pass": 30, "fail": 0, "skip": 0}
          ]
          block["b7_c2_results"] = {
              "permanent_workflow": ".github/workflows/linux-integration.yml",
              "stable_workflow_job_name": "Linux integration",
              "delegates_to": "make check",
              "draft_pr_heavy_step_skipped": True,
              "documentation_control_plane_allowlist_skips_heavy_step": True,
              "unknown_path_fails_closed_to_full_integration": True,
              "superseded_pr_runs_cancelled": True,
              "manual_dispatch_forces_full_integration": True,
              "full_permanent_run_pass": 30,
              "full_permanent_run_fail": 0,
              "full_permanent_run_skip": 0,
              "runtime_api_changed": False,
              "normative_semantics_changed": False,
              "proof_state_changed": False
          }
          state["next_action"] = "Execute R1-BLOCK-7 B7-C3. Define and prove bounded permanent Linux release orchestration that delegates to make release-check, with explicit trigger/cadence and artifact/evidence handling. Do not claim Linux release validation as final B8 Windows/font/PDF-A certification, and keep V3-R2 runtime/API work out of scope."
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          python3 -m json.tool release/v3-roadmap.json >/dev/null
          make static-check
          git diff --check

          if git grep -n -E 'B7-C2 (ACTIVE|active)|C2 ACTIVE.*C3 PENDING|B7-C2 active after' -- docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md AGENTS.md README.md docs/ARCHITECTURE.md release/v3-roadmap.json; then
            echo "Stale B7-C2 active-state residue remains" >&2
            exit 1
          fi

          rm -f .github/workflows/b7c2-close-b7c3-open.yml .github/workflows/b7c2-close-b7c3-open-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/HANDOFF-V3.0.0.md docs/ROADMAP-V3.0.0.md release/v3-roadmap.json README.md AGENTS.md docs/ARCHITECTURE.md .github/workflows/b7c2-close-b7c3-open.yml .github/workflows/b7c2-close-b7c3-open-v3.yml
          git commit -m 'docs: close B7-C2 and activate B7-C3'
          git push origin HEAD:docs/v3-r1-b7c2-close-b7c3-open
