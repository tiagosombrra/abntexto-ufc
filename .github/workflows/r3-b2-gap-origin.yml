name: Temporary R3-B2 gap origin

on:
  push:
    branches:
      - audit/v3-r3-b2-proof-inventory

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Locate promoted gaps
        shell: bash
        run: |
          set -euo pipefail
          for rule in \
            equation.display \
            equation.numbering.format \
            frontmatter.start.recto \
            heading.unnumbered.centered \
            project.cover.optional \
            references.nbr6023-2025.test-profile; do
            grep -R -n -F "\"id\": \"$rule\"" standards | sed "s#^#R3-B2-RULE-PATH id=$rule #"
          done
