name: Temporary R3-B2 implementation

on:
  push:
    branches:
      - audit/v3-r3-b2-proof-inventory

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: r3-b2-proof-semantics
          fetch-depth: 0
          persist-credentials: true
      - name: Apply proof contribution model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
