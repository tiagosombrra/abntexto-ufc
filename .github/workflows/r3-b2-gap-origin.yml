name: Temporary R3-B2 full validation

on:
  push:
    branches:
      - audit/v3-r3-b2-proof-inventory

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: r3-b2-proof-semantics
          fetch-depth: 0
          persist-credentials: false
      - name: Run full PR integration contract
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2026
          os: debian
          run: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils nodejs
            node --version
            make check
