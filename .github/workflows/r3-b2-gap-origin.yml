                  raise SystemExit('References evidence insertion point not found')
              references_text = references_text.replace(marker, addition, 1)
              references_path.write_text(references_text, encoding='utf-8')

          math_path = Path('tests/integration/math.sh')
          math_text = math_path.read_text(encoding='utf-8')
          math_text = math_text.replace(
              '    pdftotext -bbox-layout "$job.pdf" "$bbox"\n    python3 - "$bbox" <<\'PY\'\nimport sys\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n',
              '    plain="/tmp/$job.txt"\n    pdftotext "$job.pdf" "$plain"\n    pdftotext -bbox-layout "$job.pdf" "$bbox"\n    python3 - "$bbox" "$plain" <<\'PY\'\nimport re\nimport sys\nimport xml.etree.ElementTree as ET\nfrom pathlib import Path\n',
              1,
          )
          old = "path = Path(sys.argv[1])\nroot = ET.parse(path).getroot()\n"
          new = "path = Path(sys.argv[1])\nplain_path = Path(sys.argv[2])\nplain_text = plain_path.read_text(encoding='utf-8', errors='replace')\nif not re.search(r'\\(\\s*1\\s*\\)', plain_text):\n    raise SystemExit('número da equação não usa algarismo arábico entre parênteses.')\nroot = ET.parse(path).getroot()\n"
          if old not in math_text:
              raise SystemExit('Math plain-text assertion insertion point not found')
          math_text = math_text.replace(old, new, 1)
          old = "if not any(text == '1' or '(1)' in text for text, _, _ in words):\n    raise SystemExit('número da equação não identificado no bbox.')\n"
          new = "if not any('1' in text for text, _, _ in words):\n    raise SystemExit('número da equação não identificado no bbox.')\n"
          if old not in math_text:
              raise SystemExit('Math bbox assertion insertion point not found')
          math_text = math_text.replace(old, new, 1)
          old = "    raise SystemExit(\n        f'número da equação não está alinhado à direita: '\n        f'esperado xMax≈{expected_right:.2f}, obtido {rightmost[2]:.2f} ({rightmost[0]!r})'\n    )\nPY\n"
          new = "    raise SystemExit(\n        f'número da equação não está alinhado à direita: '\n        f'esperado xMax≈{expected_right:.2f}, obtido {rightmost[2]:.2f} ({rightmost[0]!r})'\n    )\nprint('VALIDATION-EVIDENCE rule=equation.numbering.format status=PASS expected=arabic-parenthesized measured=(1)')\nprint('VALIDATION-EVIDENCE rule=equation.numbering.right status=PASS expected=right-aligned measured=right-margin-aligned')\nPY\n"
          if 'rule=equation.numbering.format status=PASS' not in math_text:
