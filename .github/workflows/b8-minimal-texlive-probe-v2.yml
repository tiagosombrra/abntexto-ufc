name: B8 minimal TeX Live probe v2

on:
  push:
    branches:
      - probe/v3-r1-b8-minimal-texlive

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install bounded TeX Live 2026 set
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          texlive_version: 2026
          cache: false
          packages: |
            scheme-basic
            abntexto
            collection-langportuguese
            microtype
            etoolbox
            newtx
            fontspec
            unicode-math
            pdfpages
            ragged2e
            biblatex
            biblatex-abnt
            biber
            ttfutils
            fontware

      - name: Verify current TeX font support inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('pdflatex','lualatex','kpsewhich','ttf2tfm','vptovf','mktexlsr','biber')) {
            $command = Get-Command $name -ErrorAction Stop
            Write-Host "COMMAND $name = $($command.Source)"
          }

          $required = @(
            'abntexto.cls','iftex.sty','babel.sty','microtype.sty','etoolbox.sty',
            'fontenc.sty','newtxtext.sty','newtxmath.sty','fontspec.sty','unicode-math.sty',
            'pdfpages.sty','ragged2e.sty','biblatex.sty','abnt.bbx',
            'tex256.enc','q-ts1-uni.enc','texglyphlist.txt','glyphlist.txt'
          )
          foreach ($file in $required) {
            $resolved = (& kpsewhich $file).Trim()
            if (-not $resolved) { throw "Required TeX input missing: $file" }
            Write-Host "TEXINPUT $file = $resolved"
          }

          foreach ($file in @('times.ttf','timesi.ttf','timesbd.ttf','timesbi.ttf','arial.ttf','ariali.ttf','arialbd.ttf','arialbi.ttf')) {
            $path = Join-Path $env:WINDIR "Fonts\$file"
            if (-not (Test-Path $path)) { throw "Required Windows font is missing: $path" }
          }

      - name: Prove ttf2tfm and vptovf accept current T1 and TS1 vectors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $font = Join-Path $env:WINDIR 'Fonts\times.ttf'
          $encT1 = (& kpsewhich 'tex256.enc').Trim()
          $encTs1 = (& kpsewhich 'q-ts1-uni.enc').Trim()
          Push-Location $env:RUNNER_TEMP
          try {
            & ttf2tfm $font '-q' '-T' $encT1 '-v' 'b8-t1.vpl' 'b8-t1-raw.tfm'
            if ($LASTEXITCODE -ne 0) { throw "ttf2tfm T1 failed: $LASTEXITCODE" }
            & vptovf 'b8-t1.vpl' 'b8-t1.vf' 'b8-t1.tfm'
            if ($LASTEXITCODE -ne 0) { throw "vptovf T1 failed: $LASTEXITCODE" }

            & ttf2tfm $font '-q' '-T' $encTs1 '-v' 'b8-ts1.vpl' 'b8-ts1-raw.tfm'
            if ($LASTEXITCODE -ne 0) { throw "ttf2tfm TS1 failed: $LASTEXITCODE" }
            & vptovf 'b8-ts1.vpl' 'b8-ts1.vf' 'b8-ts1.tfm'
            if ($LASTEXITCODE -ne 0) { throw "vptovf TS1 failed: $LASTEXITCODE" }

            foreach ($file in @('b8-t1-raw.tfm','b8-t1.vf','b8-t1.tfm','b8-ts1-raw.tfm','b8-ts1.vf','b8-ts1.tfm')) {
              if (-not (Test-Path $file)) { throw "Expected generated font-support file missing: $file" }
            }
          }
          finally {
            Pop-Location
          }

  cleanup:
    needs: probe
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: probe/v3-r1-b8-minimal-texlive

      - name: Remove temporary probe workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tiago Sombra'
          git config user.email 'tiagosombrra@users.noreply.github.com'
          git rm -f .github/workflows/b8-minimal-texlive-probe-v2.yml
          git commit -m 'ci: remove second B8 minimal TeX Live probe'
          git push origin HEAD:probe/v3-r1-b8-minimal-texlive
