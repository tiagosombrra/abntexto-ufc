name: B3-C1 temporary remote validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-functional:
    if: github.event.pull_request.number == 164
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run targeted TeX Live 2026 validation
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            export SOURCE_COMMIT_SHA="${GITHUB_SHA}"

            for script in \
              tests/integration/catalog-card.sh \
              tests/integration/long-quotation-evidence.sh \
              tests/integration/research-project.sh \
              tests/integration/short-direct-citation-evidence.sh \
              tests/integration/vector-rule-validation.sh \
              tests/integration/table-ibge-vector-evidence.sh
            do
              sh -n "$script"
              sh "$script"
            done

            # Static portability assertions: verify the repaired code no longer
            # depends on the assumptions that exposed the Windows-only failures.
            grep -Fq 'pdftotext -layout "$job.pdf" "$job.txt"' tests/integration/catalog-card.sh
            grep -Fq "raw = Path(f'{job}.txt').read_text(encoding='utf-8')" tests/integration/catalog-card.sh
            if grep -Fq "Path(f'/tmp/{job}.txt')" tests/integration/catalog-card.sh; then
              echo 'catalog-card still reconstructs a shell /tmp path in Python'
              exit 1
            fi

            grep -Fq 'PYTHONIOENCODING=UTF-8 python3 tests/checks/normative_short_direct_citation.py' \
              tests/integration/short-direct-citation-evidence.sh
            grep -Fq -- '-jobname="$job"' tests/integration/research-project.sh
            grep -Fq 'artifacts/normative/mainmatter/long-quotation.json' standards/long-quote-reduced-size-scenario.json
            grep -Fq 'validation-policy.tolerances.horizontal_position_pt' standards/vector-rule-validation-extension.json
            grep -Fq 'validation-policy.tolerances.vertical_position_pt' standards/vector-rule-validation-extension.json
            grep -Fq 'vector-rule-validation-calibration.json' tests/integration/vector-rule-validation.sh
            grep -Fq 'sh tests/integration/vector-rule-validation.sh' tests/integration/table-ibge-vector-evidence.sh
