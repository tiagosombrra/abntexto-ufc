name: B3-C1 temporary remote validation
# PR #164 trigger marker; temporary workflow will be removed after certification.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  linux-functional:
    if: github.event.pull_request.number == 164
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run targeted TeX Live 2026 validation
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80 # v3
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends poppler-utils
            export SOURCE_COMMIT_SHA="${GITHUB_SHA}"

            for script in \
              tests/integration/catalog-card.sh \
              tests/integration/long-quotation-evidence.sh \
              tests/integration/research-project.sh \
              tests/integration/short-direct-citation-evidence.sh \
              tests/integration/vector-rule-validation.sh \
              tests/integration/table-ibge-vector-evidence.sh
            do
              echo "B3-C1 SYNTAX $script"
              sh -n "$script"
              echo "B3-C1 FUNCTIONAL $script"
              sh "$script"
            done

  windows-portability:
    if: github.event.pull_request.number == 164
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate bounded Windows portability contracts
        shell: bash
        run: |
          set -euo pipefail

          check() {
            label="$1"
            shift
            echo "B3-C1 WINDOWS CHECK: $label"
            "$@"
          }

          for script in \
            tests/integration/catalog-card.sh \
            tests/integration/long-quotation-evidence.sh \
            tests/integration/research-project.sh \
            tests/integration/short-direct-citation-evidence.sh \
            tests/integration/vector-rule-validation.sh \
            tests/integration/table-ibge-vector-evidence.sh
          do
            check "syntax $script" sh -n "$script"
          done

          check "catalog-card runner-local pdftotext output" \
            grep -Fq 'pdftotext -layout "$job.pdf" "$job.txt"' tests/integration/catalog-card.sh
          check "catalog-card native Python reads runner-local output" \
            grep -Fq "raw = Path(f'{job}.txt').read_text(encoding='utf-8')" tests/integration/catalog-card.sh
          if grep -Fq "Path(f'/tmp/{job}.txt')" tests/integration/catalog-card.sh; then
            echo 'catalog-card still reconstructs a Git-Bash /tmp path in native Python'
            exit 1
          fi

          check "short citation forces UTF-8 checker process" \
            grep -Fq 'PYTHONIOENCODING=UTF-8 python3 tests/checks/normative_short_direct_citation.py' \
            tests/integration/short-direct-citation-evidence.sh
          echo 'B3-C1 WINDOWS CHECK: UTF-8 Unicode diagnostic smoke'
          PYTHONIOENCODING=UTF-8 python -c "import json; print(json.dumps({'quotes':'“”'}, ensure_ascii=False))"

          check "research project jobname binding" grep -Fq -- '-jobname="$job"' tests/integration/research-project.sh
          check "long quotation canonical evidence path" grep -Fq 'artifacts/normative/mainmatter/long-quotation.json' standards/long-quote-reduced-size-scenario.json
          check "horizontal validation tolerance binding" grep -Fq 'validation-policy.tolerances.horizontal_position_pt' standards/vector-rule-validation-extension.json
          check "vertical validation tolerance binding" grep -Fq 'validation-policy.tolerances.vertical_position_pt' standards/vector-rule-validation-extension.json
          check "vector calibration artifact producer" grep -Fq 'vector-rule-validation-calibration.json' tests/integration/vector-rule-validation.sh
          check "IBGE runner invokes same-run calibration" grep -Fq 'sh tests/integration/vector-rule-validation.sh' tests/integration/table-ibge-vector-evidence.sh
