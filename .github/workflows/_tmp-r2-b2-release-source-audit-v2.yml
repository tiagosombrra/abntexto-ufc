name: Temporary R2-B2 release-source audit v2

on:
  push:
    branches:
      - docs/v3-r2-b2-closeout-b3-entry

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Validate active CTAN release sources
        uses: xu-cheng/texlive-action@22c04326a5d855880f9d39bb955138bf11c6df80
        with:
          texlive_version: 2026
          os: debian
          run: |
            set -eu
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y --no-install-recommends make poppler-utils
            git config --global --add safe.directory "$GITHUB_WORKSPACE"

            work="$(mktemp -d)"
            trap 'rm -rf "$work"' EXIT INT TERM
            python3 tools/fetch-abntexto.py --output "$work/abntexto.cls"

            mkdir -p "$work/example"
            cd "$work/example"
            TEXINPUTS="$GITHUB_WORKSPACE//:$work//:" pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$GITHUB_WORKSPACE/docs/ctan-example.tex"
            TEXINPUTS="$GITHUB_WORKSPACE//:$work//:" pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "$GITHUB_WORKSPACE/docs/ctan-example.tex"
            test -s ctan-example.pdf

            mkdir -p "$work/manual"
            cp "$GITHUB_WORKSPACE/release/ctan/abntexto-ufc.tex" "$work/manual/"
            cd "$work/manual"
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error abntexto-ufc.tex
            pdflatex -interaction=nonstopmode -halt-on-error -file-line-error abntexto-ufc.tex
            test -s abntexto-ufc.pdf
            if grep -E 'Package babel Warning: Name .brazil. is deprecated|Overfull \\hbox|Overfull \\vbox' abntexto-ufc.log; then
              echo 'Unexpected CTAN manual warning/overflow.' >&2
              exit 1
            fi

            cd "$GITHUB_WORKSPACE"
            python3 tests/checks/distribution_bundles.py --abntexto "$work/abntexto.cls"

            python3 - <<'PY'
            from pathlib import Path

            active_sources = [Path('docs/ctan-example.tex'), Path('release/ctan/abntexto-ufc.tex')]
            forbidden = [
                'tipo =', 'impressao =', 'capa =', 'ficha-catalografica', 'brasao =',
                'fonte =', 'fonte-estrita', 'programa-doutorado', 'titulo-doutor',
                'autor =', 'titulo =', 'local =', 'ano =', 'orientador =',
                'tabelas =', 'codigo =', 'algoritmos =', 'glossario =', 'indice =',
                'Portuguese public API during the R1 reconstruction', '\\chapter{',
            ]
            failures = []
            for source in active_sources:
                text = source.read_text(encoding='utf-8')
                for token in forbidden:
                    if token in text:
                        failures.append(f'{source}: stale token {token!r}')
            if failures:
                raise SystemExit('\n'.join(failures))
            print('R2-B2 release-source reconciliation: PASS')
            PY

      - name: Remove temporary audit and publish clean checkpoint
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-r2-b2-release-source-audit-v2.yml
          git diff --check
          make static-check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: finalize CTAN source reconciliation"
          test -z "$(git status --porcelain)"
          git push origin HEAD:docs/v3-r2-b2-closeout-b3-entry
